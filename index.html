/* ============================================================
   PAINEL GERENCIAL (só Administrador, vendo a equipe inteira)
   ============================================================ */
const sprintAtualDe=(db)=>(db.sprints||[]).find(x=>x.id===db.currentSprint)||sprintDaData(TODAY);
const tarefaAberta=(t)=>t.column!=='concluido'&&t.column!=='cancelado';

function KpisGerenciais({janela,reunioes,entregas}){
  const {db}=useDB();
  const projs=ativos(db);
  const todas=allTasks(db);
  const abertas=todas.filter(tarefaAberta);
  const atras=abertas.filter(taskAtrasada);
  const sp=sprintAtualDe(db);
  const doSprint=todas.filter(t=>t.column!=='cancelado'&&taskEmSprint(t,sp));
  const feitas=doSprint.filter(t=>t.column==='concluido').length;
  const pct=doSprint.length? Math.round(feitas/doSprint.length*100) : 0;
  const linhas=horasDoSprint(db,sp.start,sp.end);
  const minAloc=somaMin(linhas);
  const dias=Math.round((dLocal(sp.end)-dLocal(sp.start))/86400000)+1;
  const capMin=(db.team||[]).reduce((a,m)=>a+(+m.cap||+m.capacity||40)*dias/7*60,0);
  const usoPct=capMin? Math.round(minAloc/capMin*100) : 0;
  const verm=projs.filter(p=>SINAL_CATS.some(([k])=>(sinaisDe(p)[k]||{}).cor==='vermelho')).length;
  const semResp=abertas.filter(t=>!respsDe(t).length).length;
  const Kpi=({lab,val,sub,color})=>(<div className="kpi"><div className="bar" style={{background:color}}></div>
    <div className="lab">{lab}</div><div className="val" style={{color}}>{val}</div><div className="sub">{sub}</div></div>);
  return (<div className="kpi-grid" style={{marginBottom:18}}>
    <Kpi lab="Clientes ativos" val={projs.length} sub={verm+' com algum vermelho'} color={verm?'#B33A3A':'var(--brand)'}/>
    <Kpi lab="Tarefas em aberto" val={abertas.length} sub={semResp?semResp+' sem responsável':'todas com responsável'} color="var(--purple)"/>
    <Kpi lab="Atrasadas · equipe" val={atras.length} sub={atras.length?Math.round(atras.length/Math.max(1,abertas.length)*100)+'% do que está em aberto':'nada atrasado'} color={atras.length?'#B33A3A':'#2F8F6E'}/>
    <Kpi lab="Horas do sprint" val={fmtHoras(emHoras(minAloc))+'h'} sub={usoPct+'% da capacidade da equipe'} color={usoPct>100?'#B33A3A':usoPct>85?'#C58B2A':'#2F8F6E'}/>
    <Kpi lab="Sprint concluído" val={pct+'%'} sub={feitas+' de '+doSprint.length+' tarefas · '+rotuloSprint(sp)} color={pct>=70?'#2F8F6E':pct>=40?'#C58B2A':'#B33A3A'}/>
    <Kpi lab={'Próximos '+janela+' dias'} val={reunioes+' · '+entregas} sub="reuniões · entregas" color="#3F598C"/>
  </div>);
}

    if(per==='prox') return {ini:isoDate(new Date(y,m+1,1)),fim:isoDate(new Date(y,m+2,0)),rot:MES[(m+1)%12]};
    return {ini:sp.start,fim:sp.end,rot:'sprint '+rotuloSprint(sp)};
  },[per,db.currentSprint]);
  const dias=Math.round((dLocal(faixa.fim)-dLocal(faixa.ini))/86400000)+1;
  const linhas=useMemo(()=>horasDoSprint(db,faixa.ini,faixa.fim),[db,faixa]);
  const abertas=allTasks(db).filter(tarefaAberta);

      return {m,min:somaMin(l),feito:somaMin(l.filter(x=>x.feito)),
        cap:(+m.cap||+m.capacity||40)*dias/7*60,
        ab:abertas.filter(t=>temResp(t,m.id)).length, at:abertas.filter(t=>temResp(t,m.id)&&taskAtrasada(t)).length,

                <Barra v={min} max={cap} cor={m.color}/></td>
              <td className="mono" style={{fontSize:'.78rem'}}>{fmtHoras(emHoras(feito))}h</td>

        : <div className="muted" style={{fontSize:'.8rem'}}>Cadastre a equipe para ver as horas por pessoa.</div>}

        <div className="card-h"><h3>Horas por cliente</h3><span className="sub">alocado × contratado no período</span></div>
        {clientes.length? <div style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) minmax(0,1fr)',alignItems:'start',gap:22}}>
          {[clientes.slice(0,meio),clientes.slice(meio)].map((fatia,ix)=>fatia.length? <TabelaCli key={ix} fatia={fatia} fim={ix===1||meio===clientes.length}/> : null)}
        </div>
        : <div className="muted" style={{fontSize:'.8rem'}}>Nenhuma hora alocada no período.</div>}
      </div>
    </div>
    <div className="muted" style={{fontSize:'.72rem',marginTop:-10,marginBottom:18}}>
      Horas = estimativa de cada tarefa, contada no período do seu prazo; tarefa de duas pessoas conta para as duas. O contratado vem das horas/mês do contrato de cada cliente, proporcional ao período. A leitura completa, com ticket e R$/hora, está em Análise de Carteira.
    </div>
  </>);
}

function Dashboard(){
  const {db,go,filtered,update,flash,auth,eu}=useDB();
  /* O dashboard é de quem está usando: o Editor vê só o que é dele;
     o Administrador vê tudo e pode olhar pelos olhos de qualquer pessoa. */
  const souAdmin=isAdmin(auth);
  const euValido=!!eu&&(db.team||[]).some(m=>m.id===eu);
  const [quemSel,setQuem]=useState('Todos');
  const quem=souAdmin? quemSel : (euValido? eu : 'Todos');
  /* Administrador olhando a equipe inteira: o dashboard vira painel gerencial */
  const gerencial=souAdmin&&quem==='Todos';
  const projsTodos=filtered.filter(p=>!p.archived);
  const projs= quem==='Todos'? projsTodos : projsTodos.filter(p=>p.coordinator===quem
    ||(p.consultants||[]).indexOf(quem)>=0
    ||(p.activities||[]).some(a=>a.column!=='concluido'&&a.column!=='cancelado'&&temResp(a,quem)));
  const [fil,setFil]=useState('todos');      // todos | vermelho | amarelo | sem
  const [janela,setJanela]=useState(7);      // dias à frente nas próximas reuniões e entregas
  const [modal,setModal]=useState(null);
  const salvarT=useSalvarTarefa(()=>setModal(null));

  const ids=new Set(projsTodos.map(p=>p.id));
  const daCarteira=(t)=>!t.projectId||ids.has(t.projectId);
  const daPessoa=(t)=>quem==='Todos'||temResp(t,quem);
  const abertas=allTasks(db).filter(t=>t.column!=='concluido'&&t.column!=='cancelado'&&daCarteira(t));

  /* ---- atrasadas ---- */
  const atrasadas=abertas.filter(t=>taskAtrasada(t)&&daPessoa(t)).sort((a,b)=>(a.date||'')<(b.date||'')?-1:1);
  const totalAtras=abertas.filter(t=>taskAtrasada(t)&&daPessoa(t)).length;
  const concluir=(t)=>{ update(d=>{ mutateTask(d,t.id,a=>{a.column='concluido';}); return d; }); flash('“'+t.name+'” finalizada'); };

  /* ---- próximas reuniões e entregas ---- */
  const hoje=hojeISO(), ate=isoDate(addDays(TODAY,janela));
  const noPeriodoAg=(t)=>t.date&&t.date>=hoje&&t.date<=ate&&daPessoa(t);
  const porDataHora=(a,b)=>(a.date+(a.hora||'99'))<(b.date+(b.hora||'99'))?-1:1;
  const reunioes=abertas.filter(t=>t.type==='Reunião'&&noPeriodoAg(t)).sort(porDataHora);
  const entregas=abertas.filter(t=>t.type!=='Reunião'&&noPeriodoAg(t)).sort(porDataHora);

  /* ---- sinaleiras ---- */
  const setSinal=(pid,cat,cor)=>update(d=>{ const p=d.projects.find(x=>x.id===pid); if(p) aplicaSinal(p,cat,cor); return d; });
  const coresDe=(p)=>SINAL_CATS.map(([k])=>(sinaisDe(p)[k]||{}).cor||'');
  const peso=(p)=>coresDe(p).reduce((a,c)=>a+(c==='vermelho'?100:c==='amarelo'?10:c===''?1:0),0);
  const comVermelho=projs.filter(p=>coresDe(p).indexOf('vermelho')>=0).length;
  const lista=projs.filter(p=>{ const cs=coresDe(p);
      if(fil==='vermelho') return cs.indexOf('vermelho')>=0;
      if(fil==='amarelo') return cs.indexOf('amarelo')>=0;
      if(fil==='sem') return cs.indexOf('')>=0;
      return true; })
    .sort((a,b)=>peso(b)-peso(a)||a.name.localeCompare(b.name));

  const Kpi=({lab,val,sub,color})=>(<div className="kpi"><div className="bar" style={{background:color}}></div>
    <div className="lab">{lab}</div><div className="val" style={{color}}>{val}</div><div className="sub">{sub}</div></div>);
  const Cliente=({t})=> t.proj
    ? <span className="click row" style={{gap:5,cursor:'pointer'}} onClick={()=>go('projects',t.proj.id)}>
        <span style={{width:8,height:8,borderRadius:'50%',background:corDoCliente(t.proj),flex:'none'}}></span>
        <span style={{fontSize:'.74rem',fontWeight:600}}>{t.proj.name}</span></span>
    : <span className="muted" style={{fontSize:'.72rem'}}>tarefa geral</span>;
  const Data=({iso})=>{ const d=dLocal(iso);
    return (<div className={"ag-data"+(iso===hoje?' hoje':'')}><b>{fmtBR(iso).slice(0,5)}</b>
      <span>{iso===hoje?'hoje':DIA_SEM[d.getDay()]}</span></div>); };
  const LinhaAgenda=({t,reuniao})=>{ const faltam=diffDias(hoje,t.date);
    return (<div className="ag-linha">
      <Data iso={t.date}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:'.83rem',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={t.name}>
          {reuniao&&t.hora&&<span className="mono" style={{color:'var(--brand)',fontWeight:800,marginRight:6}}>{rotuloHora(t)}</span>}{t.name}</div>
        <div className="row" style={{gap:8,marginTop:2}}><Cliente t={t}/>
          {!reuniao&&<span className="muted" style={{fontSize:'.7rem'}}>{faltam===0?'vence hoje':faltam===1?'vence amanhã':'em '+faltam+' dias'}</span>}
          {reuniao&&!t.hora&&<span className="muted" style={{fontSize:'.7rem'}}>sem horário</span>}</div>
      </div>
      <Avatares db={db} t={t}/>
      <button className="icon-btn" style={{width:24,height:24}} onClick={()=>setModal(paraEdicao(t))} title="Abrir">✎</button>
    </div>); };

  return (<><div className="dash-area">
    <div className="dash-visao">
      {quem!=='Todos'? <Avatar db={db} id={quem} size="sm"/> : <span className="eu-q" style={{background:'var(--brand)'}}>★</span>}
      <span>Visão de <b>{quem==='Todos'?'toda a equipe':member(db,quem).name}</b>
        {quem!=='Todos'&&<span className="muted"> · tarefas dele(a) e clientes em que participa</span>}</span>
      {souAdmin
        ? <select className="sel" style={{width:190,marginLeft:'auto'}} value={quemSel} onChange={e=>setQuem(e.target.value)}>
            <option value="Todos">Toda a equipe</option>
            {db.team.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>
        : (!euValido&&<span className="muted" style={{marginLeft:'auto',fontSize:'.76rem',color:'#C58B2A'}}>
            Escolha seu nome em “Quem é você?” para ver só o que é seu.</span>)}
    </div>
    {gerencial? <KpisGerenciais janela={janela} reunioes={reunioes.length} entregas={entregas.length}/> :
    <div className="kpi-grid" style={{marginBottom:18,gridTemplateColumns:'repeat(4,1fr)'}}>
      <Kpi lab="Tarefas atrasadas" val={totalAtras} sub="prazo vencido sem conclusão" color={totalAtras?'#B33A3A':'#2F8F6E'}/>
      <Kpi lab={'Reuniões · '+janela+' dias'} val={reunioes.length} sub="agendadas a partir de hoje" color="var(--brand)"/>
      <Kpi lab={'Entregas · '+janela+' dias'} val={entregas.length} sub="prazos de entrega que vencem" color="#3F598C"/>
      <Kpi lab="Clientes com vermelho" val={comVermelho} sub={'de '+projs.length+' cliente'+(projs.length===1?'':'s')+(quem==='Todos'?' ativos':' de '+member(db,quem).name.split(' ')[0])} color={comVermelho?'#B33A3A':'#2F8F6E'}/>
    </div>}

    <CaixaRecados/>


    {/* ---- 1. o que já passou do prazo ---- */}
    <div className="card card-pad" style={{marginBottom:18}}>
      <div className="card-h"><h3>Tarefas atrasadas</h3><span className="sub">prazo de entrega vencido, ainda sem conclusão</span>
      </div>
      {atrasadas.length? <div style={{overflowX:'auto'}}><table className="tbl">
        <thead><tr><th style={{width:30}}></th><th>Tarefa</th><th>Cliente</th><th>Quem faz</th><th>Prazo</th><th>Atraso</th><th>Situação</th><th style={{width:36}}></th></tr></thead>
        <tbody>{atrasadas.map(t=>{ const dd=diffDias(t.date,hoje);
          return (<tr key={t.id}>
            <td><button className="chk sm" onClick={()=>concluir(t)} title="Finalizar"></button></td>
            <td><span style={{fontSize:'.84rem',fontWeight:600}}>{t.name}</span>
              {t.obs&&<div className="muted" style={{fontSize:'.7rem'}}>{t.obs}</div>}</td>
            <td><Cliente t={t}/></td>
            <td><Avatares db={db} t={t}/></td>
            <td className="mono" style={{fontSize:'.78rem',color:'#B33A3A',fontWeight:700}}>{fmtBR(t.date)}</td>
            <td><span className="badge" style={{background:dd>7?'#f8ecec':'#fbf3e6',color:dd>7?'#B33A3A':'#C58B2A'}}>
              {dd} dia{dd===1?'':'s'}</span></td>
            <td><span className="badge" style={{background:COL_COLOR[t.column]+'1c',color:COL_COLOR[t.column]}}>{COL_LABEL[t.column]}</span></td>
            <td><button className="icon-btn" style={{width:24,height:24}} onClick={()=>setModal(paraEdicao(t))} title="Editar tarefa">✎</button></td>
          </tr>);})}</tbody>
      </table></div>
      : <div className="row" style={{gap:8,padding:'6px 0',color:'#2F8F6E',fontSize:'.84rem',fontWeight:600}}>{I.check} Nenhuma tarefa atrasada{quem!=='Todos'?' para '+member(db,quem).name:''}.</div>}
    </div>

    {gerencial&&<HorasGerenciais/>}

    {/* ---- 2. o que vem pela frente ---- */}
    <div className="between" style={{marginBottom:10,flexWrap:'wrap',gap:8}}>
      <b style={{fontSize:'.95rem',color:'var(--navy)'}}>Próximos dias</b>
      <div className="pills">{[[7,'7 dias'],[15,'15 dias'],[30,'30 dias']].map(([n,l])=>
        <button key={n} className={"fpill "+(janela===n?'on':'')} onClick={()=>setJanela(n)}>{l}</button>)}</div>
    </div>
    <div className="grid2" style={{marginBottom:18,gridTemplateColumns:'1fr 1fr'}}>
      <div className="card card-pad">
        <div className="card-h"><h3>Próximas reuniões</h3><span className="sub">{reunioes.length} até {fmtBR(ate).slice(0,5)}</span></div>
        {reunioes.length? reunioes.slice(0,12).map(t=><LinhaAgenda key={t.id} t={t} reuniao/>)
          : <div className="muted" style={{fontSize:'.82rem',padding:'10px 0'}}>Nenhuma reunião marcada no período.</div>}
        {reunioes.length>12&&<div className="muted" style={{fontSize:'.72rem',marginTop:6}}>e mais {reunioes.length-12} — veja no Calendário.</div>}
      </div>
      <div className="card card-pad">
        <div className="card-h"><h3>Próximas entregas</h3><span className="sub">{entregas.length} até {fmtBR(ate).slice(0,5)}</span></div>
        {entregas.length? entregas.slice(0,12).map(t=><LinhaAgenda key={t.id} t={t}/>)
          : <div className="muted" style={{fontSize:'.82rem',padding:'10px 0'}}>Nenhuma entrega vencendo no período.</div>}
        {entregas.length>12&&<div className="muted" style={{fontSize:'.72rem',marginTop:6}}>e mais {entregas.length-12} — veja na aba Tarefas.</div>}
      </div>
    </div>

    {/* ---- 3. sinaleiras, compactas ---- */}
    <div className="card card-pad">
      <div className="card-h"><h3>Sinaleiras dos clientes</h3>
        <span className="sub">relacionamento · financeiro · método</span>
        <div className="right pills">
          {[['todos','Todos'],['vermelho','Com vermelho'],['amarelo','Com amarelo'],['sem','Sem avaliação']].map(([k,l])=>
            <button key={k} className={"fpill "+(fil===k?'on':'')} onClick={()=>setFil(k)}>{l}</button>)}
        </div>
      </div>
      {lista.length? <div className="sin-tiles">
        {lista.map(p=>{ const s=sinaisDe(p), ruim=coresDe(p).indexOf('vermelho')>=0;
          return (<div key={p.id} className={"sin-tile"+(ruim?' ruim':'')}>
            <div className="sin-tile-h" onClick={()=>go('projects',p.id)} title={p.name}>
              <span style={{width:8,height:8,borderRadius:'50%',background:corDoCliente(p),flex:'none'}}></span>{p.name}</div>
            <div className="sin-linha">
              {SINAL_CATS.map(([k,l])=>{ const v=s[k]||{};
                return (<span key={k} className="sin-cat">{l.slice(0,3).toUpperCase()}
                  <GrupoSinal sm valor={v.cor||''} titulo={l+(v.nota?': '+v.nota:'')} onSet={(c)=>setSinal(p.id,k,c)}/></span>);})}
            </div>
          </div>);})}
      </div>
      : <div className="muted" style={{fontSize:'.82rem'}}>{projs.length?'Nenhum cliente com esse filtro.':'Nenhum cliente ativo na carteira.'}</div>}
    </div>

  </div>
    {modal&&<TaskModal db={db} init={modal} close={()=>setModal(null)} onSave={salvarT}/>}
  </>);
}

/* ============================================================
   ADIÇÃO RÁPIDA DE TAREFA
   Mesmo componente usado no painel do Sprint e no do Calendário.
   Já chega com as datas do contexto preenchidas (a semana do sprint,
   ou o dia selecionado no calendário), então basta escrever o nome.
   ============================================================ */
/* Célula de cliente no formato de etiqueta colorida com menu. */
function CelCliente({db,t,onChange}){
  const cor=t.proj?corDoCliente(t.proj):CINZA_GERAL;
  return (<span className="cel-cli" style={{background:cor}}>
    <span className="cel-cli-txt">{t.proj?t.proj.name:'Geral'}</span>
    <span className="cel-cli-seta">▾</span>
    <select value={t.projectId||''} onChange={e=>onChange(e.target.value||null)}
      title="Trocar o cliente desta tarefa">
      <option value="">Tarefa geral</option>
      {ativos(db).map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
    </select>
  </span>);
}

/* Toda tarefa guarda quando nasceu. É o que permite ler depois "isto
   entrou no meio do sprint" e ordenar por chegada. */
/* ------------------------------------------------------------
   SUBTAREFAS
   Lista de passos dentro de uma tarefa. Não são tarefas do sistema —
   não têm prazo, responsável nem horas próprias; são o checklist do
   que precisa acontecer para a tarefa ficar pronta.
   ------------------------------------------------------------ */
const subsDe=(t)=>Array.isArray(t&&t.subs)? t.subs : [];
const contaSubs=(t)=>{ const l=subsDe(t); return {n:l.length,feitas:l.filter(x=>x.feito).length}; };
/* Marcador compacto: 2/5, verde quando tudo está feito. */
function TagSubs({t,onClick}){
  const c=contaSubs(t);
  if(!c.n) return null;
  const pronto=c.feitas===c.n;
  return (<button className="tag-subs" onClick={onClick} title={c.feitas+' de '+c.n+' subtarefa(s) concluída(s)'}
    style={pronto?{color:'#2F8F6E',borderColor:'#bfe3d2',background:'#f1f9f5'}:null}>
    ☰ {c.feitas}/{c.n}</button>);
}
/* Editor usado no modal da tarefa. */
function EditorSubs({valor,onChange}){
  const subs=Array.isArray(valor)?valor:[];
  const [novo,setNovo]=useState('');
  const add=()=>{ const n=novo.trim(); if(!n) return;
    onChange([...subs,{id:uid(),nome:n,feito:false}]); setNovo(''); };
  const alterna=(id)=>onChange(subs.map(x=>x.id===id?{...x,feito:!x.feito}:x));
  const renomeia=(id,v)=>onChange(subs.map(x=>x.id===id?{...x,nome:v}:x));
  const tira=(id)=>onChange(subs.filter(x=>x.id!==id));
  const c={n:subs.length,feitas:subs.filter(x=>x.feito).length};
  return (<div>
    {subs.map(x=>(<div key={x.id} className="sub-linha">
      <button className={"chk sm "+(x.feito?'on':'')} onClick={()=>alterna(x.id)}>{x.feito&&I.check}</button>
      <LiveInput className="sub-inp" value={x.nome} onCommit={(v)=>renomeia(x.id,v)}
        style={x.feito?{textDecoration:'line-through',opacity:.6}:null}/>
      <button className="icon-btn" style={{width:22,height:22,color:'var(--text-3)'}} onClick={()=>tira(x.id)}>{I.x}</button>
    </div>))}
    <div className="row" style={{gap:6,marginTop:subs.length?6:0}}>
      <input className="inp" style={{flex:1,fontSize:'.82rem',padding:'7px 10px'}} value={novo}
        onChange={e=>setNovo(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } }}
        placeholder="Novo passo…"/>
      <button className="btn btn-ghost btn-sm" onClick={add}>{I.plus} passo</button>
    </div>
    {c.n>0&&<div className="muted" style={{fontSize:'.72rem',marginTop:6}}>
      {c.feitas} de {c.n} concluído(s){c.feitas===c.n&&' — tudo pronto'}</div>}
  </div>);
}

function nasceTarefa(t){
  if(t&&!t.criadaEm) t.criadaEm=hojeISO();
  return t;
}
function addTaskTo(d,nova){
  nasceTarefa(nova);
  if(nova.projectId){ const p=d.projects.find(x=>x.id===nova.projectId); if(p) p.activities.unshift({...nova,projectId:p.id}); }
  else { d.tasks=d.tasks||[]; d.tasks.unshift({...nova,projectId:null}); }
}
function QuickAddTask({titulo,dica,date,buildStart,buildEnd,compacto}){
  const {db,update,flash}=useDB();
  const [aberto,setAberto]=useState(false);
  const vazio=()=>({name:'',assignees:[(db.team[0]||{}).id||''],projectId:'',type:'Outro',prio:'Média',hora:'',durMin:60});
  const [f,setF]=useState(vazio);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const criar=()=>{
    if(!f.name.trim()){flash('Dê um nome à tarefa');return;}
    const nova={id:uid(),name:f.name.trim(),type:f.type,prio:f.prio,
      assignees:f.assignees||[], assignee:(f.assignees||[])[0]||'',
      hora:f.hora||'', durMin:+f.durMin||0,
      projectId:f.projectId||null,deliverableId:'',notes:'',
      date:date||'',buildStart:buildStart||'',buildEnd:buildEnd||buildStart||'',
      column:'backlog',sprintId:null};
    update(d=>{addTaskTo(d,nova);return d;});
    setF(vazio()); flash(f.projectId?'Tarefa criada no cliente':'Tarefa criada');
  };
  const enter=(e)=>{ if(e.key==='Enter') criar(); };

  if(!aberto) return (<button className="btn btn-ghost btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={()=>setAberto(true)}>{I.plus} {titulo}</button>);
  return (<div style={{background:'var(--lavender-soft)',borderRadius:10,padding:12}}>
    <div className="between" style={{marginBottom:8}}>
      <span style={{fontWeight:700,fontSize:'.82rem'}}>{titulo}</span>
      <button className="icon-btn" style={{width:22,height:22,color:'var(--text-3)'}} onClick={()=>setAberto(false)}>{I.x}</button></div>
    <input className="inp" style={{marginBottom:8}} value={f.name} onChange={e=>set('name',e.target.value)} onKeyDown={enter} placeholder="O que precisa ser feito?" autoFocus/>
    <div style={{display:'grid',gridTemplateColumns:compacto?'1fr 1fr':'1.6fr 1fr 1fr',gap:8}}>
      <select className="mini-sel" value={f.projectId} onChange={e=>set('projectId',e.target.value)}>
        <option value="">Sem cliente</option>
        {ativos(db).map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select>
      <select className="mini-sel" value={f.type} onChange={e=>set('type',e.target.value)}>{ACT_TYPES.map(x=><option key={x}>{x}</option>)}</select>
      <select className="mini-sel" value={f.prio} onChange={e=>set('prio',e.target.value)}>{PRIOS.map(x=><option key={x}>{x}</option>)}</select>
    </div>
    <div style={{marginTop:8}}>
      <div className="muted" style={{fontSize:'.69rem',letterSpacing:'.08em',fontWeight:800,
        textTransform:'uppercase',marginBottom:5}}>Quem trabalha nisto</div>
      <SelResps db={db} valor={f.assignees||[]} onChange={(l)=>set('assignees',l)}/>
    </div>
    <div className="row" style={{gap:8,marginTop:8}}>
      <input type="time" className="mini-sel" style={{flex:1}} value={f.hora} onChange={e=>set('hora',e.target.value)} title="Hora de início"/>
      <select className="mini-sel" style={{flex:1}} value={f.durMin} onChange={e=>set('durMin',+e.target.value)} title="Duração">
        {DURACOES.map(([m,l])=><option key={m} value={m}>{l}</option>)}</select>
    </div>
    <div className="muted" style={{fontSize:'.72rem',margin:'8px 0'}}>{f.hora&&+f.durMin>0? ('Das '+f.hora+' às '+fimDaTarefa(f)+'. '):''}{dica}</div>
    <button className="btn btn-primary btn-sm" style={{width:'100%',justifyContent:'center'}} onClick={criar}>{I.plus} Adicionar</button>
  </div>);
}

/* ============================================================
   MÓDULO 2B — TAREFAS (visão geral de tudo que há para fazer)
   Reúne num só lugar as ATIVIDADES DOS PROJETOS e as TAREFAS GERAIS.
   Tudo o que é feito aqui reflete no Sprint, na página do Projeto
   e no Calendário, porque todos leem do mesmo pool (allTasks).
   ============================================================ */
const PERIODOS=[
  ['todos','Qualquer data'],['sprint','Sprint atual'],['sprint_prox','Próximo sprint'],
  ['atrasadas','Atrasadas'],['hoje','Hoje'],
  ['semana','Esta semana'],['7d','Próximos 7 dias'],['mes','Este mês'],['sem','Sem data'],
];
/* O filtro por sprint olha a JANELA da tarefa, igual ao quadro do sprint —
   por isso recebe o banco, que é quem conhece as quinzenas. */
function noPeriodo(t,per,db){
  if(per==='todos') return true;
  if(per==='sprint'||per==='sprint_prox'){
    if(!db) return true;
    const atual=(db.sprints||[]).find(x=>x.id===db.currentSprint)||sprintDaData(TODAY);
    const alvo=(per==='sprint')? atual
      : ((db.sprints||[]).find(x=>x.start===isoDate(addDays(dLocal(atual.start),SPRINT_DIAS)))
         ||sprintDaData(addDays(dLocal(atual.start),SPRINT_DIAS)));
    return taskEmSprint(t,alvo);
  }
  if(per==='sem') return !t.date;
  if(!t.date) return false;
  const h=hojeISO();
  if(per==='atrasadas') return taskAtrasada(t);
  if(per==='hoje') return t.date===h;
  if(per==='7d') return t.date>=h && t.date<=isoDate(addDays(TODAY,7));
  if(per==='semana'){ const seg=mondayOf(TODAY); return t.date>=isoDate(seg) && t.date<=isoDate(addDays(seg,6)); }
  if(per==='mes') return t.date.slice(0,7)===h.slice(0,7);
  return true;
}

/* ============================================================
   HORÁRIOS DE TRABALHO NA JANELA DE CONSTRUÇÃO
   Um horário opcional por dia, dentro do prazo de construção.
   ============================================================ */
/* ============================================================
   AGENDA DO DIA + ESCOLHA DE HORÁRIO
   Ao definir o prazo de construção, cada dia da janela pode receber um
   horário de trabalho. Para escolher bem, a barra mostra o que JÁ está
   agendado naquele dia — reuniões, entregas e o trabalho de outras
   tarefas — para você encaixar num espaço livre.
   ============================================================ */
const H_INI=7, H_FIM=20;          // faixa útil mostrada na barra

/* Tudo o que já ocupa um dia, vindo de qualquer projeto ou tarefa geral. */
function compromissosDoDia(db,iso,excluirId){
  const out=[];
  allTasks(db).forEach(t=>{
    if(excluirId&&t.id===excluirId) return;
    /* O compromisso ocupa a agenda de cada um dos responsáveis. */
    const se=(t.sessoes||{})[iso];
    if(se&&se.hora) respsDe(t).forEach(w=>out.push({id:t.id+'@'+iso+'#'+w,tid:t.id,ini:minDaHora(se.hora),
      dur:+se.durMin||60,titulo:t.name,tipo:'trabalho',who:w}));
    if(t.date===iso&&t.hora) respsDe(t).forEach(w=>out.push({id:t.id+'#'+w,tid:t.id,ini:minDaHora(t.hora),
      dur:+t.durMin||60,titulo:t.name,tipo:t.type==='Reunião'?'reuniao':'entrega',who:w}));
  });
  return out.filter(x=>x.ini!==null).sort((a,b)=>a.ini-b.ini);
}

/* ------------------------------------------------------------
   AGENDA DE CADA PESSOA
   Ninguém constrói duas coisas ao mesmo tempo. Estas funções olham a
   agenda de quem é responsável antes de reservar um horário, e apontam
   quando dois compromissos da mesma pessoa se cruzam.
   ------------------------------------------------------------ */
const JOR_INI=8, JOR_FIM=18;          // jornada considerada para encaixar trabalho
const ocupacaoPessoa=(db,resp,iso,excluirId)=>
  compromissosDoDia(db,iso,excluirId).filter(c=>c.who===resp).sort((a,b)=>a.ini-b.ini);

/* Primeiro horário livre da pessoa naquele dia.
   Dentro da jornada (08–18) sempre que possível; com "forcar", devolve o
   primeiro horário livre mesmo que estenda o dia — assim nenhuma tarefa
   fica sem hora, e a sobrecarga aparece na agenda em vez de sumir. */
function primeiroLivre(db,resp,iso,dur,excluirId,forcar){
  const ocup=ocupacaoPessoa(db,resp,iso,excluirId);
  const d=Math.max(+dur||60,30);
  let t=JOR_INI*60;
  for(const c of ocup){
    if(t+d<=c.ini) return horaDeMin(t);
    t=Math.max(t,c.ini+(c.dur||60));
  }
  if(t+d<=JOR_FIM*60) return horaDeMin(t);
  return forcar? (t+d<=(H_FIM+1)*60? horaDeMin(t) : null) : null;
}
/* O primeiro horário livre na agenda de TODAS as pessoas da tarefa.
   Com duas pessoas, só serve o horário em que as duas estão livres. */
function primeiroLivreTodos(db,resps,iso,dur,excluirId,forcar){
  const quem=(resps||[]).filter(Boolean);
  if(quem.length<2) return primeiroLivre(db,quem[0]||'',iso,dur,excluirId,forcar);
  const ocup=[];
  quem.forEach(w=>ocupacaoPessoa(db,w,iso,excluirId).forEach(c=>ocup.push(c)));
  ocup.sort((a,b)=>a.ini-b.ini);
  const d=Math.max(+dur||60,30);
  let t=JOR_INI*60;
  for(const c of ocup){
    if(t+d<=c.ini) return horaDeMin(t);
    t=Math.max(t,c.ini+(c.dur||60));
  }
  if(t+d<=JOR_FIM*60) return horaDeMin(t);
  return forcar? (t+d<=(H_FIM+1)*60? horaDeMin(t) : null) : null;
}
/* Quem do grupo está mais carregado no dia — é esse que limita. */
const cargaMaxDia=(db,resps,iso,excluirId)=>
  ((resps||[]).filter(Boolean).length? resps.filter(Boolean) : ['']).reduce(
    (a,w)=>Math.max(a,cargaDoDia(db,w,iso,excluirId)),0);

/* Dia com mais horas do que cabe na jornada */
const diaSobrecarregado=(db,resp,iso)=>cargaDoDia(db,resp,iso)>(JOR_FIM-JOR_INI)*60;

/* ------------------------------------------------------------
   HORAS DO SPRINT
   A conta de esforço é a HORA ALOCADA NA TAREFA — a estimativa que a
   gestora usa para montar a semana de cada consultor. É ela que alimenta
   a Análise: por cliente, por pessoa e contra o contrato.

   Cada tarefa conta no período em que cai o seu prazo (e, sem prazo, no
   da sua janela de construção). Tarefa de duas pessoas ocupa as horas de
   cada uma, porque é o tempo que cada uma gasta. Sem estimativa, valem os
   horários já reservados na agenda — melhor que contar zero.
   ------------------------------------------------------------ */
const dataDeReferencia=(t)=>t.date||t.buildEnd||t.buildStart||'';
function horasDaTarefa(t){
  const est=Math.round((+t.estHoras||0)*60);
  if(est) return est;
  let min=0;
  Object.values(t.sessoes||{}).forEach(se=>{ if(se&&se.hora) min+=+se.durMin||0; });
  if(min) return min;
  return (t.date&&t.hora)? (+t.durMin||0) : 0;
}
function horasDoSprint(db,ini,fim){
  const out=[];
  allTasks(db).forEach(t=>{
    if(t.column==='cancelado') return;
    const iso=dataDeReferencia(t);
    if(!iso||iso<ini||iso>fim) return;
    const min=horasDaTarefa(t);
    if(!min) return;
    const tipo=t.type==='Reunião'?'reuniao':(t.type==='Entrega'?'entrega':'construcao');
    respsDe(t).forEach(w=>out.push({iso,pid:t.projectId||null,who:w,min,tipo,
      nome:t.name,tid:t.id,feito:t.column==='concluido'}));
  });
  return out;
}
const somaMin=(l)=>l.reduce((a,x)=>a+(x.min||0),0);
const emHoras=(min)=>Math.round((min/60)*10)/10;
const fmtRS=(v)=>'R$ '+(Math.round(v||0)).toLocaleString('pt-BR');
/* Quanto do ticket mensal corresponde ao período analisado */
const ticketDoPeriodo=(p,dias)=>((+p.ticket||0)*(dias/30.44));
/* Horas previstas no contrato, proporcionais ao período analisado */
const horasPlanPeriodo=(p,dias)=>((+p.horasPlan||0)*(dias/30.44));

/* ------------------------------------------------------------
   LEITURA COMERCIAL DA CARTEIRA
   Contrato, ticket e sua evolução. O ticket vigente num mês é o último
   valor registrado até aquele mês — contratos encerrados saem da conta.
   ------------------------------------------------------------ */
/* O contrato tem datas próprias, separadas do cronograma do projeto:
   ctInicio (entrada; sem ela vale a data de início do cliente), ctFim
   (fim da vigência) e ctEncerradoEm (quando o contrato foi encerrado). */
const ctIni=(p)=>(p&&(p.ctInicio||p.startDate))||'';
const ctFim=(p)=>(p&&p.ctFim)||'';
const mesesDeCasa=(p)=>{ const i=ctIni(p); if(!i) return 0;
  const ate=(p.ctEncerradoEm&&p.ctEncerradoEm<hojeISO())? p.ctEncerradoEm : hojeISO();
  return Math.max(0,Math.round((dLocal(ate)-dLocal(i))/86400000/30.44)); };
function ticketEm(p,isoFim){
  const h=(p.ticketHist||[]).filter(x=>x.data<=isoFim).sort((a,b)=>a.data<b.data?-1:1);
  if(!h.length) return 0;
  return +h[h.length-1].valor||0;
}
const contratoAtivo=(p,isoFim)=>{
  if(p.archived) return false;
  if(p.startDate&&p.startDate>isoFim) return false;
  if(p.realEnd&&p.realEnd<isoFim) return false;
  return true;
};
/* MRR mês a mês, nos últimos N meses */
function serieMRR(projs,n){
  const out=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i+1,0);   // último dia do mês
    const iso=isoDate(d);
    const v=projs.filter(p=>contratoAtivo(p,iso)).reduce((a,p)=>a+ticketEm(p,iso),0);
    out.push({iso,rot:MES[d.getMonth()].slice(0,3)+'/'+String(d.getFullYear()).slice(2),valor:v,
      n:projs.filter(p=>contratoAtivo(p,iso)&&ticketEm(p,iso)>0).length});
  }
  return out;
}
const variacao=(p)=>{ const h=(p.ticketHist||[]).slice().sort((a,b)=>a.data<b.data?-1:1);
  if(h.length<2) return null;
  const pri=+h[0].valor||0, ult=+h[h.length-1].valor||0;
  return pri? Math.round((ult-pri)/pri*100) : null; };

/* ------------------------------------------------------------
   PLANEJAR A CONSTRUÇÃO
   O ponto de partida é o esforço ("levo 8 horas") e o prazo de entrega.
   A partir daí o sistema conta para trás: quantos dias são precisos com
   X horas por dia, e reserva em cada um o primeiro horário livre de quem
   vai executar. Dias cheios são pulados; fins de semana também.
   ------------------------------------------------------------ */
function planejarConstrucao(db,tarefa,opc){
  const horas=Math.max(.5,+opc.horas||2), porDia=Math.max(.5,+opc.porDia||2);
  const dur=Math.round(porDia*60);
  const nDias=Math.max(1,Math.ceil(horas/porDia));
  const limite=opc.ate||tarefa.date||isoDate(addDays(TODAY,nDias+2));
  const piso=opc.naoAntesDe||hojeISO();
  const dias=[];
  // anda de trás para frente a partir do prazo, buscando dias com espaço
  let d=dLocal(limite), g=0;
  while(dias.length<nDias && g++<200 && isoDate(d)>=piso){
    const iso=isoDate(d);
    if(!ehFimDeSemana(iso)){
      const h=primeiroLivreTodos(db,respsDe(tarefa),iso,dur,tarefa.id);
      if(h) dias.unshift({iso,hora:h});
    }
    d=addDays(d,-1);
  }
  // não coube antes do prazo: continua depois dele, para não sumir trabalho
  if(dias.length<nDias){
    let d2=addDays(dLocal(limite),1), g2=0;
    while(dias.length<nDias && g2++<200){
      const iso=isoDate(d2);
      if(!ehFimDeSemana(iso)){
        const h=primeiroLivreTodos(db,respsDe(tarefa),iso,dur,tarefa.id,true);
        if(h) dias.push({iso,hora:h});
      }
      d2=addDays(d2,1);
    }
  }
  if(!dias.length) return null;
  const ses={}; dias.forEach(x=>{ ses[x.iso]={hora:x.hora,durMin:dur}; });
  return {sessoes:ses,buildStart:dias[0].iso,buildEnd:dias[dias.length-1].iso,
    dias:dias.length,horas:dias.length*porDia,
    estouro: dias[dias.length-1].iso>limite};
}
/* Horas já reservadas para a pessoa no dia */
const cargaDoDia=(db,resp,iso,excluirId)=>
  ocupacaoPessoa(db,resp,iso,excluirId).reduce((a,c)=>a+(c.dur||60),0);

/* Ids de compromissos que se sobrepõem na agenda de alguém, naquele dia. */
function conflitosDoDia(db,iso){
  const porPessoa={};
  compromissosDoDia(db,iso,null).forEach(c=>{ if(!c.who) return; (porPessoa[c.who]=porPessoa[c.who]||[]).push(c); });
  const ids=new Set();
  Object.values(porPessoa).forEach(l=>{
    l.sort((a,b)=>a.ini-b.ini);
    for(let i=1;i<l.length;i++){
      if(l[i].ini < l[i-1].ini+(l[i-1].dur||60)){ ids.add(l[i].id); ids.add(l[i-1].id); }
    }
  });
  return ids;
}

/* Preenche a janela respeitando a agenda de quem vai executar:
   cada dia útil recebe o primeiro horário livre daquela pessoa. */
function horariosSemConflito(db,tarefa,dur){
  const w=taskWindow(tarefa); const out={}; const uteis=[];
  if(!w.ini) return out;
  const d0=dLocal(w.ini), f=dLocal(w.fim||w.ini);
  let d=d0, g=0;
  while(d<=f && g++<200){
    const iso=isoDate(d);
    if(!ehFimDeSemana(iso)){
      const h=primeiroLivreTodos(db,respsDe(tarefa),iso,dur||120,tarefa.id);
      if(h) out[iso]={hora:h,durMin:+dur||120};
      else uteis.push(iso);        // dia cheio: fica para a segunda passada
    }
    d=addDays(d,1);
  }
  /* Se nenhum dia coube na jornada, a tarefa não pode ficar sem hora:
     entra no dia menos carregado, estendendo o expediente. */
  if(!Object.keys(out).length && uteis.length){
    const alvo=uteis.slice().sort((a,b)=>cargaMaxDia(db,respsDe(tarefa),a)-cargaMaxDia(db,respsDe(tarefa),b))[0];
    const h=primeiroLivreTodos(db,respsDe(tarefa),alvo,dur||120,tarefa.id,true);
    if(h) out[alvo]={hora:h,durMin:+dur||120};
  }
  return out;
}
const COMP_C={trabalho:'#3F598C',reuniao:'#0F4245',entrega:'#B33A3A'};

/* Distribui em colunas o que se sobrepõe no tempo, para nada ficar escondido.
   Serve tanto para a visão Dia quanto para cada coluna da Semana. */
function layoutBlocos(evs){
  const comHora=(evs||[]).filter(e=>e.hora&&minDaHora(e.hora)!==null)
    .map(e=>({e,ini:minDaHora(e.hora),fim:minDaHora(e.hora)+Math.max(+e.durMin||30,20)}))
    .sort((a,b)=>a.ini-b.ini||a.fim-b.fim);
  const grupos=[]; let atual=[];
  comHora.forEach(b=>{
    if(atual.length && b.ini < Math.max(...atual.map(x=>x.fim))) atual.push(b);
    else { if(atual.length) grupos.push(atual); atual=[b]; }
  });
  if(atual.length) grupos.push(atual);
  const out=[];
  grupos.forEach(g=>{
    const colFim=[];
    g.forEach(b=>{ let col=colFim.findIndex(f=>f<=b.ini); if(col<0) col=colFim.length; colFim[col]=b.fim; b.col=col; });
    g.forEach(b=>out.push({e:b.e,col:b.col,cols:colFim.length}));
  });
  return out;
}

/* Barra de 07h às 20h: cinza = livre, colorido = ocupado, roxo = esta tarefa.
   Clicar numa hora livre define o horário. */
/* Painel do dia: a agenda daquele dia em miniatura, para escolher o
   horário vendo o que já existe. Clicar numa faixa livre define a hora. */
function PainelDoDia({db,iso,excluirId,hora,durMin,onPick,fechar,resp}){
  /* `resp` aceita uma pessoa ou a lista de quem trabalha na tarefa. */
  const quem=Array.isArray(resp)? resp.filter(Boolean) : (resp?[resp]:[]);
  const meu=(c)=>quem.indexOf(c.who)>=0;
  const todos=compromissosDoDia(db,iso,excluirId);
  const ocup=quem.length? todos.filter(meu) : todos;      // a agenda de quem executa
  const outros=quem.length? todos.filter(c=>!meu(c)) : [];
  const carga=ocup.reduce((a,c)=>a+(c.dur||60),0);
  const livre=primeiroLivreTodos(db,quem,iso,durMin||120,excluirId);
  const horas=[]; for(let h=H_INI;h<=H_FIM;h++) horas.push(h);
  const PX=26;
  const meuIni=minDaHora(hora), meuDur=Math.max(+durMin||60,20);
  return (<div className="pdia">
    <div className="between" style={{marginBottom:8}}>
      <div>
        <b style={{fontSize:'.84rem'}}>{DIA_SEM[dLocal(iso).getDay()]}, {fmtBR(iso)}</b>
        <span className="muted" style={{fontSize:'.74rem',marginLeft:8}}>
          {quem.length? quem.map(w=>member(db,w).name).join(' + ')+' · ' : ''}
          {ocup.length? ocup.length+(ocup.length===1?' compromisso · ':' compromissos · ')+fmtDur(carga) : 'dia livre'}
          {livre? ' · livre a partir das '+livre : ' · dia cheio'}</span>
      </div>
      <button className="icon-btn" style={{width:22,height:22,color:'var(--text-3)'}} onClick={fechar}>{I.x}</button>
    </div>
    <div className="pdia-tl" style={{height:horas.length*PX}}>
      {horas.map(h=>(<div key={h} className="pdia-faixa" style={{top:(h-H_INI)*PX,height:PX}}
        title={'Encaixar às '+String(h).padStart(2,'0')+':00'} onClick={()=>onPick(String(h).padStart(2,'0')+':00')}>
        <span className="pdia-hora mono">{String(h).padStart(2,'0')}</span></div>))}
      {outros.map((c,i)=>{   /* agenda dos outros: fica de fundo, só como referência */
        const top=(c.ini-H_INI*60)/60*PX, alt=Math.max((c.dur||60)/60*PX-2,14);
        return (<div key={'o'+i} className="pdia-bloco outro" style={{top,height:alt}}
          title={member(db,c.who).name+' · '+c.titulo}> </div>);})}
      {ocup.map((c,i)=>{
        const top=(c.ini-H_INI*60)/60*PX, alt=Math.max((c.dur||60)/60*PX-2,14);
        return (<div key={i} className="pdia-bloco" style={{top,height:alt,background:COMP_C[c.tipo]+'26',borderLeftColor:COMP_C[c.tipo]}}
          title={c.titulo+' · '+horaDeMin(c.ini)+'–'+horaDeMin(c.ini+(c.dur||60))}>
          <span className="mono" style={{color:COMP_C[c.tipo],fontWeight:800}}>{horaDeMin(c.ini)}</span> {c.titulo}
        </div>);})}
      {meuIni!==null&&<div className="pdia-bloco meu" style={{top:(meuIni-H_INI*60)/60*PX,height:Math.max(meuDur/60*PX-2,14)}}>
        <span className="mono" style={{fontWeight:800}}>{hora}</span> este trabalho
      </div>}
    </div>
    <div className="muted" style={{fontSize:'.69rem',marginTop:6}}>
      Clique numa faixa para encaixar. Os blocos coloridos são {resp?'compromissos de '+member(db,resp).name:'compromissos do dia'};
      o cinza claro é o resto da equipe, só para referência.
    </div>
  </div>);
}

function BarraDoDia({db,iso,excluirId,hora,durMin,onPick,resp}){
  const quemB=Array.isArray(resp)? resp.filter(Boolean) : (resp?[resp]:[]);
  const ocup=compromissosDoDia(db,iso,excluirId).filter(c=>!quemB.length||quemB.indexOf(c.who)>=0);
  const horas=[]; for(let h=H_INI;h<=H_FIM;h++) horas.push(h);
  const cobre=(h,c)=>{const a=h*60,b=a+60; return c.ini<b && (c.ini+(c.dur||60))>a;};
  const meuIni=minDaHora(hora), meuFim=meuIni!==null? meuIni+(+durMin||60) : null;
  return (<div>
    <div className="hbar">
      {horas.map(h=>{
        const c=ocup.find(x=>cobre(h,x));
        const meu=meuIni!==null && (meuIni< (h+1)*60) && (meuFim> h*60);
        const cls=meu?'meu':(c?'ocup':'livre');
        const tit=meu? 'Seu horário' : (c? c.titulo+' · '+horaDeMin(c.ini) : 'Livre às '+String(h).padStart(2,'0')+':00');
        return (<button key={h} className={"hslot "+cls} title={tit}
          style={c&&!meu?{background:COMP_C[c.tipo]+'55',borderColor:COMP_C[c.tipo]}:null}
          onClick={(e)=>{e.preventDefault(); onPick(String(h).padStart(2,'0')+':00');}}>
          <span>{h}</span></button>);})}
    </div>
    {ocup.length>0&&<div className="muted" style={{fontSize:'.68rem',marginTop:3}}>
      já neste dia: {ocup.slice(0,3).map(c=>horaDeMin(c.ini)+' '+c.titulo.slice(0,22)).join(' · ')}{ocup.length>3?' · +'+(ocup.length-3):''}
    </div>}
    {!ocup.length&&<div className="muted" style={{fontSize:'.68rem',marginTop:3}}>dia livre</div>}
  </div>);
}

/* Editor de horários da janela — funciona com estado local, então serve
   tanto na criação da tarefa quanto na edição de uma já existente. */
function EditorSessoes({db,ini,fim,valor,onChange,excluirId,resp}){
  const dias=useMemo(()=>{
    if(!ini||!fim) return [];
    const out=[]; let d=dLocal(ini); const f=dLocal(fim); let g=0;
    while(d<=f&&g++<200){ out.push(isoDate(d)); d=addDays(d,1); }
    return out;
  },[ini,fim]);
  const [padrao,setPadrao]=useState({hora:'09:00',durMin:120});
  const [diaAberto,setDiaAberto]=useState(null);   // dia com o painel de agenda aberto
  const põe=(iso,k,v)=>onChange({...valor,[iso]:{hora:'',durMin:120,...(valor[iso]||{}),[k]:v}});
  const limpa=(iso)=>{const c={...valor}; delete c[iso]; onChange(c);};
  /* Aplica em bloco, mas respeitando a agenda: se a pessoa já tem algo no
     horário escolhido, o dia recebe o próximo espaço livre dela. */
  const quemE=Array.isArray(resp)? resp.filter(Boolean) : (resp?[resp]:[]);
  const aplicarUteis=()=>{
    const c={...valor};
    const ini=minDaHora(padrao.hora), dur=+padrao.durMin||60;
    dias.forEach(iso=>{ if(ehFimDeSemana(iso)) return;
      /* se o horário escolhido bate na agenda de alguém, o dia recebe o
         próximo espaço livre de todo mundo */
      const ocupado=(quemE.length?quemE:['']).some(w=>ocupacaoPessoa(db,w,iso,excluirId)
        .some(x=>ini<x.ini+(x.dur||60) && x.ini<ini+dur));
      const h=ocupado? primeiroLivreTodos(db,quemE,iso,padrao.durMin,excluirId) : padrao.hora;
      if(h) c[iso]={hora:h,durMin:padrao.durMin};
    });
    onChange(c);
  };
  const total=Object.values(valor).reduce((a,x)=>a+((x&&x.hora)?(+x.durMin||0):0),0);

  if(!dias.length) return (<div className="muted" style={{fontSize:'.76rem'}}>
    Defina o prazo de construção (início e fim) para poder reservar horários.</div>);

  return (<div>
    <div className="row" style={{gap:8,flexWrap:'wrap',marginBottom:10,alignItems:'center'}}>
      <span className="muted" style={{fontSize:'.73rem'}}>Preencher os dias úteis com</span>
      <input type="time" className="mini-sel" style={{width:86}} value={padrao.hora} onChange={e=>setPadrao(x=>({...x,hora:e.target.value}))}/>
      <select className="mini-sel" value={padrao.durMin} onChange={e=>setPadrao(x=>({...x,durMin:+e.target.value}))}>
        {DURACOES.filter(([m])=>m>0).map(([m,l])=><option key={m} value={m}>{l}</option>)}</select>
      <button className="btn btn-ghost btn-sm" onClick={aplicarUteis}>aplicar</button>
      {total>0&&<><button className="btn btn-ghost btn-sm" onClick={()=>onChange({})}>limpar</button>
        <span className="mono muted" style={{fontSize:'.72rem',marginLeft:'auto'}}>{fmtDur(total)} reservadas</span></>}
    </div>
    <div style={{maxHeight:300,overflowY:'auto'}}>
      {dias.map(iso=>{ const v=valor[iso]||null, fds=ehFimDeSemana(iso);
        return (<div key={iso} className="dia-linha" style={fds&&!v?{opacity:.6}:null}>
          <div style={{width:104,flex:'none'}}>
            <div style={{fontSize:'.79rem',fontWeight:700}}>{DIA_SEM[dLocal(iso).getDay()]} <span className="mono muted" style={{fontSize:'.72rem',fontWeight:500}}>{fmtBR(iso).slice(0,5)}</span></div>
            {fds&&<div className="muted" style={{fontSize:'.64rem'}}>fim de semana</div>}
          </div>
          <div style={{flex:1,minWidth:0,cursor:'pointer'}} onClick={()=>setDiaAberto(diaAberto===iso?null:iso)}
            title="Abrir a agenda deste dia">
            <BarraDoDia db={db} iso={iso} excluirId={excluirId} hora={v&&v.hora} durMin={v&&v.durMin}
              resp={resp} onPick={(h)=>põe(iso,'hora',h)}/>
          </div>
          <div className="row" style={{gap:4,flex:'none'}}>
            <input type="time" className="mini-sel" style={{width:80}} value={(v&&v.hora)||''}
              onChange={e=>e.target.value?põe(iso,'hora',e.target.value):limpa(iso)}/>
            <select className="mini-sel" style={{width:88}} value={(v&&v.durMin)||120} disabled={!v||!v.hora}
              onChange={e=>põe(iso,'durMin',+e.target.value)}>
              {DURACOES.filter(([m])=>m>0).map(([m,l])=><option key={m} value={m}>{l}</option>)}</select>
            <span className="mono muted" style={{fontSize:'.7rem',width:42,textAlign:'right'}}>
              {v&&v.hora? horaDeMin(minDaHora(v.hora)+(+v.durMin||0)) : '—'}</span>
            <button className="icon-btn" style={{width:20,height:20,color:'var(--text-3)',visibility:v&&v.hora?'visible':'hidden'}} onClick={()=>limpa(iso)}>{I.x}</button>
            <button className="icon-btn" style={{width:20,height:20,color:diaAberto===iso?'var(--brand)':'var(--text-3)'}}
              onClick={()=>setDiaAberto(diaAberto===iso?null:iso)} title="Ver a agenda do dia">{diaAberto===iso?'▾':'▸'}</button>
          </div>
          {diaAberto===iso&&<div style={{flex:'1 1 100%'}}>
            <PainelDoDia db={db} iso={iso} excluirId={excluirId} hora={v&&v.hora} durMin={(v&&v.durMin)||padrao.durMin}
              resp={resp} onPick={(h)=>põe(iso,'hora',h)} fechar={()=>setDiaAberto(null)}/>
          </div>}
        </div>);})}
    </div>
    <div className="muted" style={{fontSize:'.71rem',marginTop:8}}>
      Clique na barra de um dia para ver a agenda antes de escolher o horário.
      Estas horas são as que contam como realizadas na aba Análise.
    </div>
  </div>);
}

function SessoesModal({tarefa,close}){
  const {db,update,flash}=useDB();
  const w=taskWindow(tarefa);
  const [ses,setSes]=useState(()=>({...(tarefa.sessoes||{})}));
  const salvar=()=>{
    const limpo={}; Object.entries(ses).forEach(([iso,v])=>{ if(v&&v.hora) limpo[iso]={hora:v.hora,durMin:+v.durMin||0}; });
    update(d=>{ mutateTask(d,tarefa.id,t=>{t.sessoes=limpo;}); return d; });
    const n=Object.keys(limpo).length;
    flash(n? (n+(n===1?' dia com horário reservado':' dias com horário reservado')) : 'Horários removidos');
    close();
  };
  return (<div className="overlay" onClick={close}><div className="modal lg" onClick={e=>e.stopPropagation()}>
    <div className="modal-h"><h3>Horários de trabalho</h3><button className="x" onClick={close}>{I.x}</button></div>
    <div className="modal-b">
      <div style={{fontWeight:600,fontSize:'.88rem'}}>{tarefa.name}</div>
      <div className="muted" style={{fontSize:'.76rem',marginBottom:14}}>
        Prazo de construção: {w.ini?fmtBR(w.ini):'—'} → {w.fim?fmtBR(w.fim):'—'}
      </div>
      <EditorSessoes db={db} ini={w.ini} fim={w.fim} valor={ses} excluirId={tarefa.id} resp={respsDe(tarefa)} onChange={setSes}/>
    </div>
    <div className="modal-f"><span/><div className="row">
      <button className="btn btn-ghost" onClick={close}>Cancelar</button>
      <button className="btn btn-primary" onClick={salvar}>Salvar horários</button></div></div>
  </div></div>);
}
function TaskModal({db,init,close,onSave,fixo}){
  const [t,setT]=useState(init);
  const set=(k,v)=>setT(x=>({...x,[k]:v}));
  const proj=t.projectId?db.projects.find(p=>p.id===t.projectId):null;
  // Projetos estratégicos e fases do cliente escolhido (quando ele tem plano)
  const pes=proj?todosPEs(proj):[];
  const peSel=t.peId?pes.find(x=>x.id===t.peId):null;
  const [verHoras,setVerHoras]=useState(false);
  const [plan,setPlan]=useState({horas:init.estHoras||4,porDia:2,ate:init.date||'',aviso:''});
  /* Traduz "levo N horas e entrego dia X" em dias com hora marcada. */
  const planejar=()=>{
    const r=planejarConstrucao(db,{...t,id:init.id||null},
      {horas:plan.horas,porDia:plan.porDia,ate:plan.ate||t.date});
    if(!r){ setPlan(x=>({...x,aviso:'Não achei espaço na agenda — tente menos horas por dia ou outro responsável.'})); return; }
    setT(x=>({...x,buildStart:r.buildStart,buildEnd:r.buildEnd,sessoes:r.sessoes,
      estHoras:r.horas, date:x.date||plan.ate||r.buildEnd}));
    setVerHoras(true);
    setPlan(x=>({...x,aviso: r.estouro
      ? 'A agenda não comportou tudo antes do prazo: parte ficou depois de '+fmtBR(plan.ate||t.date||'')+'.'
      : r.dias+' dia(s) reservados, terminando em '+fmtBR(r.buildEnd)+'.'}));
  };
  /* Ao mexer nas datas da janela, os dias úteis já recebem um horário padrão
     (09:00 por 2h). É só ajustar — mas nada fica sem hora. */
  /* Trocou o responsável: os horários que colidem com a agenda da nova
     pessoa são reencaixados; os que cabem ficam como estavam. */
  /* Mudou quem trabalha: os horários que colidem com a agenda de alguém
     da nova lista são reencaixados num espaço livre de todos. */
  const trocaResps=(lista)=>setT(x=>{
    const y={...x}; setResps(y,lista);
    const quem=respsDe(y);
    if(!quem.length) return y;
    const ses={...(y.sessoes||{})};
    Object.entries(ses).forEach(([iso,v])=>{
      if(!v||!v.hora) return;
      const ini=minDaHora(v.hora), dur=+v.durMin||60;
      const bate=quem.some(w=>ocupacaoPessoa(db,w,iso,y.id||null)
        .some(c=>ini < c.ini+(c.dur||60) && c.ini < ini+dur));
      if(!bate) return;
      const h=primeiroLivreTodos(db,quem,iso,dur,y.id||null);
      if(h) ses[iso]={hora:h,durMin:dur}; else delete ses[iso];
    });
    return {...y,sessoes:ses};
  });
  const defJanela=(k,v)=>setT(x=>{
    const y={...x,[k]:v};
    if(!y.buildStart) return {...y,sessoes:{}};
    const antigas=y.sessoes||{};
    const base=Object.values(antigas).find(z=>z&&z.hora)||{durMin:120};
    // encaixa no primeiro horário livre de quem vai executar, dia a dia
    const novas=horariosSemConflito(db,y,base.durMin||120);
    Object.keys(novas).forEach(iso=>{ if(antigas[iso]&&antigas[iso].hora) novas[iso]=antigas[iso]; });
    return {...y,sessoes:novas};
  });
  // O sprint sai das DATAS, não de um botão: se a janela de construção cai
  // numa semana com sprint cadastrado, a tarefa aparece lá sozinha.
  const spDestino=useMemo(()=>{
    const sid=sprintDaTarefa({sprints:db.sprints},t); return sid?db.sprints.find(x=>x.id===sid):null;
  },[t.buildStart,t.buildEnd,t.date,db.sprints]);
  const salvar=()=>{
    if(!t.name.trim()) return;
    const ini=t.buildStart||'', fim=t.buildEnd||ini;
    onSave({...t,id:init.id||uid(),name:t.name.trim(),projectId:t.projectId||null,
      subs:Array.isArray(t.subs)?t.subs:[],
      assignees:respsDe(t), assignee:respsDe(t)[0]||'',
      deliverableId:t.projectId?(t.deliverableId||''):'',
      peId:t.peId||null, faseId:t.faseId||null,
      hora:t.hora||'', durMin:+t.durMin||0, sessoes:t.sessoes||{},
      buildStart:ini, buildEnd:(fim&&ini&&fim<ini)?ini:fim,
      sprintId:null, column:t.column||'backlog'});
  };
  return (<div className="overlay" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="modal-h"><h3>{init.id?'Editar tarefa':(fixo?'Nova ação':'Nova tarefa')}</h3><button className="x" onClick={close}>{I.x}</button></div>
    <div className="modal-b">
      {init.id&&<div className="reg-tarefa">
        <div><span className="reg-lab">Criada por</span>
          <b>{t.criadoPor? member(db,t.criadoPor).name : (t.importadoDe?'importação de planilha':'não registrado')}</b>
          <div className="muted" style={{fontSize:'.72rem'}}>{t.criadaEm? fmtBR(t.criadaEm) : '—'}</div></div>
        <div><span className="reg-lab">Concluída por</span>
          {t.column==='concluido'
            ? (init.column!=='concluido'
                ? <><b>{EU_ATUAL? member(db,EU_ATUAL).name : 'você'}</b><div className="muted" style={{fontSize:'.72rem'}}>ao salvar</div></>
                : <><b>{t.concluidoPor? member(db,t.concluidoPor).name : 'não registrado'}</b>
                    <div className="muted" style={{fontSize:'.72rem'}}>{t.concluidoEm? fmtBR(t.concluidoEm) : '—'}</div></>)
            : <span className="muted">ainda em aberto</span>}</div>
        <div><span className="reg-lab">Situação</span>
          <select className="mini-sel" style={{color:COL_COLOR[t.column||'backlog'],fontWeight:700,width:'100%'}}
            value={t.column||'backlog'} onChange={e=>set('column',e.target.value)}>
            {Object.entries(COL_LABEL).map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></div>
      </div>}
      <div className="fld"><label>O que precisa ser feito</label>
        <input className="inp" value={t.name} onChange={e=>set('name',e.target.value)} placeholder="Ex.: Revisar contrato do Redemac" autoFocus/></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <div className="fld"><label>Cliente</label>
          <select className="sel" value={t.projectId} disabled={!!fixo}
            onChange={e=>{set('projectId',e.target.value);set('deliverableId','');set('peId','');set('faseId','');}}>
            <option value="">Tarefa geral (sem cliente)</option>
            {ativos(db).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
        <div className="fld"><label>Quem trabalha nesta tarefa</label>
          <SelResps db={db} valor={respsDe(t)} onChange={(l)=>trocaResps(l)}/>
          {respsDe(t).length>1&&<div className="muted" style={{fontSize:'.72rem',marginTop:5}}>
            O horário reservado ocupa a agenda de cada um dos {respsDe(t).length}.
          </div>}</div>
        <div className="fld"><label>Prazo de entrega</label>
          <input type="date" className="inp" value={t.date} onChange={e=>set('date',e.target.value)}/></div>
        <div className="fld"><label>Tipo</label>
          <select className="sel" value={t.type} onChange={e=>set('type',e.target.value)}>{ACT_TYPES.map(x=><option key={x}>{x}</option>)}</select></div>
        <div className="fld"><label>Prioridade</label>
          <select className="sel" value={t.prio} onChange={e=>set('prio',e.target.value)}>{PRIOS.map(x=><option key={x}>{x}</option>)}</select></div>
        <div className="fld"><label>Começa às (opcional)</label>
          <input type="time" className="inp" value={t.hora||''} onChange={e=>set('hora',e.target.value)}/></div>
        <div className="fld"><label>Duração</label>
          <select className="sel" value={t.durMin||0} onChange={e=>set('durMin',+e.target.value)}>
            {DURACOES.map(([m,l])=><option key={m} value={m}>{l}</option>)}</select>
          {t.hora&&+t.durMin>0&&<div className="muted" style={{fontSize:'.73rem',marginTop:4}}>Das {t.hora} às {fimDaTarefa(t)}.</div>}</div>
        {pes.length>0&&<div className="fld"><label>Projeto estratégico (opcional)</label>
          <select className="sel" value={t.peId||''} disabled={!!fixo}
            onChange={e=>{set('peId',e.target.value);set('faseId','');}}>
            <option value="">— nenhum —</option>
            {pes.map(pe=><option key={pe.id} value={pe.id}>{pe.cod} · {pe.nome}</option>)}</select></div>}
        {peSel&&(peSel.fases||[]).length>0&&<div className="fld"><label>Fase</label>
          <select className="sel" value={t.faseId||''} disabled={!!fixo}
            onChange={e=>set('faseId',e.target.value)}>
            <option value="">— ainda a distribuir —</option>
            {(peSel.fases||[]).map((f,i)=><option key={f.id} value={f.id}>{String(i+1).padStart(2,'0')} · {f.nome}{f.dur?' ('+f.dur+')':''}</option>)}</select></div>}
        {proj&&<div className="fld"><label>Entregável vinculado (opcional)</label>
          <select className="sel" value={t.deliverableId} onChange={e=>set('deliverableId',e.target.value)}>
            <option value="">— nenhum —</option>
            {(proj.deliverables||[]).map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>}
      </div>
      <div style={{background:'var(--lavender-soft)',borderRadius:10,padding:12,marginBottom:14}}>
        <div style={{fontWeight:700,fontSize:'.82rem',marginBottom:8}}>Prazo de construção</div>
        <div className="muted" style={{fontSize:'.74rem',marginBottom:10}}>Quanto trabalho a entrega dá e em quantos dias você quer distribuí-lo.</div>

        {/* --- planejar a partir do esforço --- */}
        <div className="plan-box">
          <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
            <div className="fld" style={{marginBottom:0,width:104}}><label>Esforço total</label>
              <div className="row" style={{gap:4}}><input type="number" min="0.5" step="0.5" className="inp"
                value={plan.horas} onChange={e=>setPlan(x=>({...x,horas:e.target.value}))}/><span className="muted" style={{fontSize:'.8rem'}}>h</span></div></div>
            <div className="fld" style={{marginBottom:0,width:110}}><label>Por dia</label>
              <select className="sel" value={plan.porDia} onChange={e=>setPlan(x=>({...x,porDia:e.target.value}))}>
                {[0.5,1,1.5,2,3,4,6].map(x=><option key={x} value={x}>{x}h por dia</option>)}</select></div>
            <div className="fld" style={{marginBottom:0,flex:1,minWidth:150}}><label>Pronto até</label>
              <input type="date" className="inp" value={plan.ate||t.date||''} onChange={e=>setPlan(x=>({...x,ate:e.target.value}))}/></div>
            <button className="btn btn-primary btn-sm" onClick={planejar}>{I.clock} Planejar dias</button>
          </div>
          <div className="muted" style={{fontSize:'.73rem',marginTop:8}}>
            {(()=>{const n=Math.max(1,Math.ceil((+plan.horas||2)/(+plan.porDia||2)));
              return 'Dá '+n+' dia'+(n>1?'s':'')+' de trabalho. O sistema conta para trás a partir do prazo e encaixa no primeiro horário livre de '+
                (nomesResp(db,t)||'quem for responsável')+', pulando dias cheios e fins de semana.';})()}
          </div>
          {plan.aviso&&<div className="muted" style={{fontSize:'.74rem',marginTop:6,color:'#C58B2A'}}>{plan.aviso}</div>}
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginTop:12}}>
          <div className="fld" style={{marginBottom:0}}><label>Começa em</label>
            <input type="date" className="inp" value={t.buildStart||''} onChange={e=>defJanela('buildStart',e.target.value)}/></div>
          <div className="fld" style={{marginBottom:0}}><label>Termina em</label>
            <input type="date" className="inp" value={t.buildEnd||''} onChange={e=>defJanela('buildEnd',e.target.value)}/></div>
        </div>
        <div className="muted" style={{fontSize:'.76rem',marginTop:10}}>
          {spDestino
            ? <>Entra no sprint da <b>semana {spDestino.week}</b>{spDestino.id===db.currentSprint?' (a semana atual)':''}.</>
            : <>Sem semana de sprint correspondente — a tarefa fica no backlog até ganhar prazo.</>}
        </div>
        {t.buildStart&&t.buildEnd&&<div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setVerHoras(v=>!v)}>
            {I.clock} {verHoras?'ocultar horários':'ajustar os horários de cada dia'}
            {contaSessoes(t)>0&&<span className="badge" style={{marginLeft:6,background:'#0F424522',color:'var(--brand)'}}>{contaSessoes(t)} dia(s) · {fmtDur(totalSessoes(t))}</span>}
          </button>
          {janelaSemHorario(t)&&<div className="muted" style={{fontSize:'.73rem',marginTop:6,color:'#C58B2A'}}>
            Há dias úteis da janela sem horário — eles aparecem como “dia todo” no calendário.
          </div>}
          {verHoras&&<div style={{marginTop:10}}>
            <EditorSessoes db={db} ini={t.buildStart} fim={t.buildEnd} valor={t.sessoes||{}}
              excluirId={t.id||null} resp={respsDe(t)} onChange={(v)=>set('sessoes',v)}/>
          </div>}
        </div>}
      </div>
      <div className="fld"><label>Subtarefas{(()=>{const c=contaSubs(t); return c.n? ' · '+c.feitas+'/'+c.n : '';})()}</label>
        <EditorSubs valor={t.subs||[]} onChange={(l)=>set('subs',l)}/>
        <div className="muted" style={{fontSize:'.72rem',marginTop:6}}>
          Os passos de dentro da tarefa. Não têm prazo nem responsável próprios — quem tem é a tarefa.
        </div>
      </div>
      <div className="fld"><label>Observações</label>
        <textarea className="inp" rows={2} value={t.notes} onChange={e=>set('notes',e.target.value)} placeholder="detalhes, links, contexto…"/></div>
      <div className="muted" style={{fontSize:'.74rem',marginTop:10}}>
        {peSel
          ? <>Esta ação entra na fase escolhida de <b>{peSel.cod}</b> e conta no progresso do plano.</>
          : t.projectId? 'Esta tarefa vai aparecer também na aba Tarefas do cliente.'
                       : 'Tarefa geral: não pertence a nenhum cliente, mas entra no sprint e no calendário normalmente.'}
      </div>
    </div>
    <div className="modal-f">
      <span className="muted" style={{fontSize:'.74rem'}}>
        {init.id&&t.criadaEm? <>criada em <b>{fmtBR(t.criadaEm)}</b></> : (init.id? '' : 'criação registrada agora'+(EU_ATUAL?' em nome de '+member(db,EU_ATUAL).name:''))}
        {t.carriedFrom&&<> · repassada do sprint <b>{t.carriedFrom}</b>{(+t.carriedN||0)>1&&<> ({t.carriedN}×)</>}</>}
      </span>
      <div className="row">
        <button className="btn btn-ghost" onClick={close}>Cancelar</button>
        <button className="btn btn-primary" onClick={salvar}>{init.id?'Salvar':'Criar tarefa'}</button></div></div>
  </div></div>);
}

function PhaseSegments({phase}){
  const idx=PHASES.indexOf(phase);
  return <div className="seg">{PHASES.map((ph,i)=>{let cls=idx<0?'':(i<idx?'done':(i===idx?'cur':''));return <i key={i} className={cls}></i>;})}</div>;
}
/* Arquivar / desarquivar / excluir — usados na lista e dentro do projeto */
function useProjectActions(){
  const {update,flash,auth,go}=useDB();
  const arquivar=(p,val)=>{ update(d=>{const x=d.projects.find(y=>y.id===p.id); x.archived=!!val; x.archivedAt=val?hojeISO():''; if(val) feedLog(x,'Cliente arquivado'); else feedLog(x,'Cliente desarquivado'); return d;});
    flash(val?('“'+p.name+'” arquivado'):('“'+p.name+'” reativado')); };
  const excluir=(p,depois)=>{
    if(!isAdmin(auth)){ flash('Só administradores podem excluir clientes'); return; }
    if(!confirm('EXCLUIR definitivamente o cliente “'+p.name+'”?\n\nIsso apaga entregáveis, tarefas, feed e histórico — para todo mundo, no banco compartilhado.\nSe a ideia é só tirar da tela, use ARQUIVAR.'))return;
    update(d=>{ d.projects=d.projects.filter(x=>x.id!==p.id); return d; });
    flash('Cliente “'+p.name+'” excluído'); if(depois) depois();
  };
  return {arquivar,excluir};
}
function ProjectsList(){
  const {db,go,filtered,update,flash,filter,setFilter,auth}=useDB();
  const {arquivar,excluir}=useProjectActions();
  const [viewMode,setViewMode]=useState('cards');
  const [q,setQ]=useState(''); const [quick,setQuick]=useState('Todos'); const [sort,setSort]=useState('Semáforo'); const [modal,setModal]=useState(false);

  const setArq=(v)=>setFilter(f=>({...f,arquivo:v}));
  let list=filtered.filter(p=>{
    if(q){const s=q.toLowerCase(); if(!p.name.toLowerCase().includes(s)&&!member(db,p.coordinator).name.toLowerCase().includes(s)&&!(p.setor||'').toLowerCase().includes(s))return false;}
    if(quick==='Todos')return true;
    if(['green','yellow','red'].includes(quick))return sinaleira(p).k===quick;
    if(quick==='Pausados')return p.status==='Pausado';
    if(quick==='Finalizados')return p.status==='Finalizado';
    return true;
  });
  list=[...list].sort((a,b)=>{
    if(sort==='A-Z')return a.name.localeCompare(b.name);
    if(sort==='Fase')return PHASES.indexOf(a.phase)-PHASES.indexOf(b.phase);
    if(sort==='% Conclusão')return projProgress(b).pct-projProgress(a).pct;
    if(sort==='Semáforo')return ({red:0,yellow:1,gray:2,green:3})[sinaleira(a).k]-({red:0,yellow:1,gray:2,green:3})[sinaleira(b).k];
    return 0;
  });
  const nArq=db.projects.filter(p=>p.archived).length;
  const stop=(e)=>{e.stopPropagation();};
  return (<div>
    <div className="between" style={{marginBottom:16,flexWrap:'wrap',gap:12}}>
      <div className="row" style={{flexWrap:'wrap',gap:10}}>
        <input className="inp" style={{width:230}} placeholder="Buscar cliente, coordenador, setor..." value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="view-toggle"><button className={viewMode==='cards'?'on':''} onClick={()=>setViewMode('cards')}>Cards</button><button className={viewMode==='table'?'on':''} onClick={()=>setViewMode('table')}>Tabela</button></div>
        <select className="sel" style={{width:'auto'}} value={sort} onChange={e=>setSort(e.target.value)}>{['Semáforo','A-Z','Fase','% Conclusão'].map(o=><option key={o}>{o}</option>)}</select>
      </div>
      <button className="btn btn-primary" onClick={()=>setModal(true)}>{I.plus} Novo Cliente</button>
    </div>

    {/* ▼ filtro de arquivo: só ativos, só arquivados, ou tudo */}
    <div className="view-toggle" style={{marginBottom:14}}>
      {[['Ativos','Ativos ('+(db.projects.length-nArq)+')'],['Arquivados','Arquivados ('+nArq+')'],['Todos','Todos ('+db.projects.length+')']].map(([k,l])=>(
        <button key={k} className={arq===k?'on':''} onClick={()=>setArq(k)}>{l}</button>))}
    </div>

    <div className="pills" style={{marginBottom:18}}>
      {[['Todos','Todos'],['green','🟢 No prazo'],['yellow','🟡 Atenção'],['red','🔴 Atrasados'],['Pausados','Pausados'],['Finalizados','Finalizados']].map(([k,l])=>(
        <button key={k} className={"fpill "+(quick===k?'on':'')} onClick={()=>setQuick(k)}>{l}</button>))}
    </div>

    {viewMode==='cards'?(
      <div className="proj-grid">{list.map(p=>{const pr=projProgress(p);return(
        <div key={p.id} className="pcard" onClick={()=>go('projects',p.id)} style={p.archived?{opacity:.72,borderStyle:'dashed'}:null}>
          <div className="between"><b style={{fontSize:'.98rem'}}>{p.name}</b><Signal p={p}/></div>
          <div className="row" style={{flexWrap:'wrap',gap:6}}><Badge c={TIER_C(p.tier)}>{p.tier}</Badge><span className="tag-soft">{p.tipo}</span><span className="tag-soft">{p.setor}</span>{p.archived&&<span className="tag-soft">🗄 Arquivado</span>}</div>
          <div className="between"><Pill c={PHASE_C[p.phase]}>{shortPhase(p.phase)}</Pill><SinaisMini p={p} rotulo/></div>
          {!temPlanoFases(p)&&<PhaseSegments phase={p.phase}/>}

          <div className="bar-track"><div className="bar-fill" style={{width:pr.pct+'%'}}></div></div>
          {p.status!=='Em andamento'&&<div><Pill c={STATUS_C[p.status]}>{p.status}</Pill></div>}

            {isAdmin(auth)&&<button className="btn btn-danger btn-sm" onClick={()=>excluir(p)}>{I.trash} Excluir</button>}
          </div>

          <td><Pill c={PHASE_C[p.phase]}>{shortPhase(p.phase)}</Pill></td><td><Signal p={p}/></td><td><SinaisMini p={p}/></td>

  </div>);
}

function NewProjectModal({close,onCreate}){
  const {db}=useDB();
  const [f,setF]=useState({name:'',tier:db.tiers[0],tipo:db.tipos[0],setor:db.setores[0],coordinator:db.team[0].id,manager:'Wagner',consultants:[],owner:'',phone:'',perfil:db.perfis[0],startDate:isoDate(TODAY),meses:9,endDate:isoDate(addMonths(TODAY,9)),drive:'',notes:''});
  const [err,setErr]=useState('');
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  // duração e início são a fonte da verdade → o fim é sempre derivado deles
  const setInicio=(v)=>setF(s=>({...s,startDate:v,endDate:v&&s.meses>0?isoDate(addMonths(v,s.meses)):s.endDate}));
  const setMeses=(v)=>{ const n=Math.max(1,Math.min(60,parseInt(v)||0));
    setF(s=>({...s,meses:v===''?'':n,endDate:s.startDate&&n>0?isoDate(addMonths(s.startDate,n)):s.endDate})); };
  const toggle=(id)=>setF(s=>({...s,consultants:s.consultants.includes(id)?s.consultants.filter(x=>x!==id):[...s.consultants,id]}));
  const submit=()=>{
    if(!f.name.trim()){setErr('Nome é obrigatório');return;}
    if(!f.owner.trim()){setErr('Nome do dono/contato é obrigatório');return;}
    if(!(f.meses>0)){setErr('Duração (meses) é obrigatória');return;}
    if(!f.startDate){setErr('Data de início é obrigatória');return;}
    const endDate=isoDate(addMonths(f.startDate,f.meses));
    const cons=f.consultants.length?f.consultants:[f.coordinator];
    const base=db.base||{deliverables:db.dlvTemplate||[],activities:[]};
    const dlv=buildDeliverables(base.deliverables,cons);
    const pid='p'+uid();
    const acts=buildActivities(base.activities,cons,dlv,pid); // atividades do Projeto Base entram no backlog
    const p={id:pid,num:Date.now()%10000,name:f.name.trim(),coordinator:f.coordinator,manager:f.manager,phase:PHASES[0],tier:f.tier,tipo:f.tipo,setor:f.setor,owner:f.owner.trim(),phone:f.phone,perfil:f.perfil,consultants:cons,status:'Em andamento',startDate:f.startDate,endDate:endDate,duracaoMeses:f.meses,marcos:marcoDates(f.startDate,endDate),
      deliverables:dlv,activities:acts,actSeeded:true,
      archived:false,archivedAt:'',pauses:[],marcosReais:{1:'',2:'',3:'',4:''},realEnd:'',
      feed:[{id:uid(),type:'sistema',title:'Projeto criado',description:'Projeto criado a partir do Projeto Base · duração '+f.meses+' meses.',author:f.coordinator,date:fmtBR(TODAY),links:[],attachments:[]}],links:{drive:f.drive,agenda:'',juridico:'',apresentacao:'',manuais:'',outros:''},notes:f.notes};
    onCreate(p);
  };
  return (<div className="overlay" onClick={close}><div className="modal wide" onClick={e=>e.stopPropagation()}>
    <div className="modal-h"><h3>Novo Cliente</h3><button className="x" onClick={close}>{I.x}</button></div>
    <div className="modal-b">
      {err&&<div style={{background:'var(--coral-soft)',color:'#c0392b',padding:'9px 12px',borderRadius:8,fontSize:'.8rem',fontWeight:600,marginBottom:14}}>{err}</div>}
      <div className="fld"><label className="req">Nome do cliente</label><input className="inp" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="Ex.: Padaria do Bairro" autoFocus/></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14}}>
        <div className="fld"><label className="req">Tier</label><select className="sel" value={f.tier} onChange={e=>set('tier',e.target.value)}>{db.tiers.map(s=><option key={s}>{s}</option>)}</select></div>
        <div className="fld"><label className="req">Tipo</label><select className="sel" value={f.tipo} onChange={e=>set('tipo',e.target.value)}>{db.tipos.map(s=><option key={s}>{s}</option>)}</select></div>
        <div className="fld"><label>Setor do cliente</label><select className="sel" value={f.setor} onChange={e=>set('setor',e.target.value)}>{db.setores.map(s=><option key={s}>{s}</option>)}</select></div>
        <div className="fld"><label className="req">Coordenador</label><select className="sel" value={f.coordinator} onChange={e=>set('coordinator',e.target.value)}>{db.team.filter(t=>t.role!=='Gerente').map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
        <div className="fld"><label>Gerente</label><select className="sel" value={f.manager} onChange={e=>set('manager',e.target.value)}>{MANAGERS.map(m=><option key={m}>{m}</option>)}</select></div>
        <div className="fld"><label>Perfil do cliente</label><select className="sel" value={f.perfil} onChange={e=>set('perfil',e.target.value)}>{db.perfis.map(s=><option key={s}>{s}</option>)}</select></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <div className="fld"><label className="req">Dono / contato principal</label><input className="inp" value={f.owner} onChange={e=>set('owner',e.target.value)} placeholder="Nome do responsável"/></div>
        <div className="fld"><label>Telefone do contato</label><input className="inp" value={f.phone} onChange={e=>set('phone',e.target.value)} placeholder="(00) 00000-0000"/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14}}>
        <div className="fld"><label className="req">Data de início</label><input type="date" className="inp" value={f.startDate} onChange={e=>setInicio(e.target.value)}/></div>
        <div className="fld"><label className="req">Duração (meses)</label><input type="number" min="1" max="60" className="inp" value={f.meses} onChange={e=>setMeses(e.target.value)}/></div>
        <div className="fld"><label>Previsão de conclusão</label><input type="date" className="inp" value={f.endDate} disabled style={{background:'#f4f5fa',color:'var(--text-2)',cursor:'not-allowed'}}/></div>
      </div>
      <div className="muted" style={{fontSize:'.76rem',marginTop:-4,marginBottom:12}}>A previsão de conclusão é calculada automaticamente (início + duração). Marcos e fases se distribuem a partir dela; você pode ajustar a data no Overview do projeto depois, se precisar.</div>
      <div className="fld"><label>Consultores</label><div className="pills">{db.team.filter(t=>t.role!=='Gerente').map(t=><button key={t.id} className={"fpill "+(f.consultants.includes(t.id)?'on':'')} onClick={()=>toggle(t.id)}>{t.name}</button>)}</div></div>
      <div className="fld" style={{marginBottom:0}}><label>Link Google Drive</label><input className="inp" value={f.drive} onChange={e=>set('drive',e.target.value)} placeholder="https://drive..."/></div>
    </div>
    <div className="modal-f"><button className="btn btn-ghost" onClick={close}>Cancelar</button><button className="btn btn-primary" onClick={submit}>Criar cliente</button></div>
  </div></div>);
}
