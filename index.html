function SettingsPage(){
  const {db,update,flash,auth,sync}=useDB();
  const souAdmin=isAdmin(auth);   // importar, limpar importados e reiniciar substituem ou apagam a base: só o Administrador
  const fileRef=useRef(),csvRef=useRef();
  const [impSprint,setImpSprint]=useState(false);
  /* Tudo o que veio de planilha pode voltar atrás — é o contrário do importar. */
  const imp=contaImportados(db);
  const limparImp=()=>{
    if(!confirm('Limpar tudo o que entrou por importação?\n\n'
      +imp.tarefas+' tarefa(s)'
      +(imp.clientes? ', '+imp.clientes+' cliente(s) criados pela importação':'')
      +(imp.pessoas? ' e '+imp.pessoas+' pessoa(s) criadas pela importação':'')
      +'.\n\nO que foi cadastrado à mão fica. Cliente que já ganhou plano ou tarefas próprias também fica.')) return;
    const saida={};
    update(d=>{ Object.assign(saida,limparImportados(d,null)); return d; });
    setTimeout(()=>flash('Removidos: '+saida.tarefas+' tarefa(s), '+saida.clientes+' cliente(s), '
      +saida.pessoas+' pessoa(s)'+(saida.mantidos? ' · '+saida.mantidos+' mantido(s) por terem conteúdo próprio':'')),80);
  };
  const download=(name,content,mime)=>{const b=new Blob([content],{type:mime||'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);};
  const exportJSON=()=>download('focus_franquias_backup.json',JSON.stringify(db,null,2),'application/json');
  /* ATUALIZAR HTML — gera uma copia deste mesmo arquivo com os dados atuais
     ja gravados dentro dele (bloco #seeddata). O arquivo baixado abre em
     qualquer computador ja com tudo preenchido, sem depender do navegador. */
  const atualizarHTML=()=>{
    try{ flash('Arquivo salvo: '+salvarHTMLAtualizado(db)); }
    catch(e){ flash('Erro ao gerar o HTML: '+(e.message||e)); }
  };
  const importJSON=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);update(()=>d,{semCarimbo:true});flash('Base importada');}catch(err){flash('Arquivo inválido');}};r.readAsText(f);};
  /* Simulação: guarda a base real numa chave à parte e carrega a fictícia.
     Sair restaura exatamente o que estava antes. */
  const emSimulacao=!!(db.meta&&db.meta.simulacao);
  const entrarSim=()=>{
    if(!confirm('Entrar no modo simulação?\n\nSeus dados reais ficam guardados e voltam quando você sair.')) return;
    try{ localStorage.setItem(SIM_KEY,JSON.stringify(db)); }catch(e){ flash('Não consegui guardar sua base'); return; }
    update(()=>gerarSimulacao(db),{semCarimbo:true});
    flash('Modo simulação ativado');
  };
  const sairSim=()=>{
    let real=null;
    try{ real=JSON.parse(localStorage.getItem(SIM_KEY)||'null'); }catch(e){}
    if(!real){ flash('Backup não encontrado — seus dados não foram alterados na simulação'); return; }
    update(()=>{ const r=normalizeDb(real); r.meta={...(r.meta||{}),simulacao:false}; return r; },{semCarimbo:true});
    try{ localStorage.removeItem(SIM_KEY); }catch(e){}
    flash('De volta aos seus dados');
  };
  const reset=()=>{if(confirm('Zerar todos os dados e voltar ao padrão? (isso apaga alterações locais)')){localStorage.removeItem(LS_KEY);update(()=>buildInitial(),{semCarimbo:true});flash('Base reiniciada');}};
  const baseDlv=()=> (db.base&&db.base.deliverables)||db.dlvTemplate||[];
  const baseActs=()=> (db.base&&db.base.activities)||[];
  // Template de entregáveis via planilha (CSV ; para Excel BR)
  const dlModel=()=>{const rows=[['fase','subgrupo','nome','marco'],...baseDlv().map(t=>[t.fase,t.subgroup,(t.name||'').replace('⭐ ',''),t.marco||''])];download('modelo_entregaveis.csv','\ufeff'+rows.map(r=>r.join(';')).join('\n'),'text/csv;charset=utf-8');};
  const upModel=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{
    const lines=r.result.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());lines.shift();
    const tpl=lines.map(l=>{const c=l.split(';');return{fase:(c[0]||'').trim(),subgroup:(c[1]||'').trim(),name:(c[2]||'').trim(),marco:parseInt(c[3])||0};}).filter(t=>t.name);
    if(!tpl.length){flash('Planilha vazia');return;}
    update(d=>{d.base=d.base||{deliverables:[],activities:[]};d.base.deliverables=tpl;d.dlvTemplate=tpl.map(t=>({...t}));return d;});flash(tpl.length+' entregáveis atualizados no Projeto Base');
  }catch(err){flash('Erro ao ler planilha');}};r.readAsText(f);};
  // reaplica o Projeto Base aos projetos que ainda não têm progresso (todos entregáveis Pendentes e sem atividades)
  const applyBase=()=>{if(!confirm('Reaplicar os entregáveis do Projeto Base aos projetos ainda zerados? Só afeta projetos sem nenhum entregável concluído e sem atividades.'))return;
    update(d=>{let n=0;const bd=(d.base&&d.base.deliverables)||d.dlvTemplate||[];
      d.projects.forEach(p=>{const zero=p.deliverables.every(x=>x.status==='Pendente')&&(!p.activities||!p.activities.length);
        if(zero){p.deliverables=buildDeliverables(bd,p.consultants);n++;}});
      flash(n+' projeto(s) atualizados com o Projeto Base');return d;});};
  // ▼ empurra as ATIVIDADES do Projeto Base para os projetos que estão sem nenhuma
  const seedActs=()=>{
    const alvos=db.projects.filter(p=>!p.activities||!p.activities.length);
    if(!alvos.length){flash('Todos os projetos já têm atividades');return;}
    if(!confirm('Inserir as atividades do Projeto Base no backlog de '+alvos.length+' projeto(s) que estão sem atividades?'))return;
    update(d=>{const ba=(d.base&&d.base.activities)||defaultBaseActivities();let n=0;
      d.projects.forEach(p=>{ if(!p.activities||!p.activities.length){ p.activities=buildActivities(ba,p.consultants,p.deliverables,p.id); p.actSeeded=true; n++; } });
      flash(n+' projeto(s) receberam as atividades do Projeto Base');return d;});
  };
  return (<div style={{display:'flex',flexDirection:'column',gap:16}}>
    {!NUVEM_ON&&<div className="card card-pad" style={{borderLeft:'4px solid '+(emSimulacao?'#C58B2A':'var(--brand)')}}>
      <div className="card-h"><h3>Simulador</h3><span className="sub">ver o sistema com volume de operação real</span></div>
      {emSimulacao
        ? <><div className="custo-box" style={{background:'#fff8e6',borderColor:'#C58B2A',marginTop:0}}>
            <b>Você está no modo simulação.</b> Tudo o que aparece agora é fictício — clientes, pessoas, tarefas e planos.
            Seus dados reais estão guardados e voltam ao sair. Alterações feitas aqui dentro serão descartadas.
          </div>
          <button className="btn btn-primary" style={{marginTop:12}} onClick={sairSim}>Sair da simulação e restaurar meus dados</button></>
        : <><div className="muted" style={{fontSize:'.8rem',lineHeight:1.6}}>
            Preenche o sistema com uma operação fictícia — 6 clientes com cores próprias, 6 pessoas na equipe,
            planos estratégicos com fases e ações, reuniões com horário, prazos de construção, atrasos e
            horas estimadas. Serve para ver como as telas se comportam cheias, antes de cadastrar de verdade.
          </div>
          <button className="btn btn-primary" style={{marginTop:12}} onClick={entrarSim}>{I.play||I.plus} Entrar no modo simulação</button>
          <div className="muted" style={{fontSize:'.73rem',marginTop:8}}>Seus dados atuais são guardados antes e restaurados quando você sair.</div></>}
    </div>}

    <div className="card card-pad"><div className="card-h"><h3>Base de Dados</h3><span className="sub">armazenamento local deste navegador</span></div>
      <div className="row" style={{flexWrap:'wrap',gap:10}}>
        {!NUVEM_ON&&<button className="btn btn-primary btn-sm" onClick={atualizarHTML}>{I.download} Salvar HTML atualizado</button>}
        <button className="btn btn-ghost btn-sm" onClick={exportJSON}>Exportar JSON</button>
        {souAdmin&&<button className="btn btn-ghost btn-sm" onClick={()=>fileRef.current.click()}>Importar JSON</button>}
        {souAdmin&&<button className="btn btn-ghost btn-sm" onClick={()=>setImpSprint(true)}>Importar sprint (.xlsx)</button>}
        {souAdmin&&imp.tarefas>0&&<button className="btn btn-ghost btn-sm" style={{color:'#B33A3A'}} onClick={limparImp}>
          Limpar dados importados ({imp.tarefas})</button>}
        {souAdmin&&<button className="btn btn-danger btn-sm" onClick={reset}>Reiniciar base</button>}
        <input ref={fileRef} type="file" accept=".json" style={{display:'none'}} onChange={importJSON}/>
      </div>
      {impSprint&&<ImportarSprintModal close={()=>setImpSprint(false)}/>}
      <div className="muted" style={{fontSize:'.74rem',marginTop:10}}>As alterações são salvas automaticamente neste navegador. <b>Salvar HTML</b> — aqui, no botão da barra de cima ou com <b>Ctrl+S</b> — baixa uma nova versão deste arquivo com todos os dados já gravados dentro dele: é a forma de guardar o trabalho, enviar para outra pessoa ou abrir em outro computador. O número em âmbar ao lado do botão conta quantas alterações entraram desde o último arquivo gerado. Ao abrir um arquivo salvo, o sistema usa sempre a versão mais recente entre o arquivo e este navegador. Revisão atual: <b>{(db.meta&&db.meta.rev)||0}</b>.</div>
    </div>

    <div className="card card-pad"><div className="card-h"><h3>Cliente Base</h3><span className="sub">estrutura padrão dos novos clientes</span></div>
      <div className="muted" style={{fontSize:'.8rem',marginBottom:12}}>Todo cliente novo nasce com os <b>entregáveis</b> e as <b>atividades</b> definidos aqui (todos zerados). Ajuste o Projeto Base e ele passa a valer para os próximos cadastros. Use “Reaplicar” para empurrar mudanças aos projetos ainda sem progresso.</div>
      <div style={{fontWeight:700,fontSize:'.82rem',marginBottom:6}}>Entregáveis padrão · {baseDlv().length} itens</div>
      <div className="muted" style={{fontSize:'.76rem',marginBottom:8}}>Baixe o modelo, edite no Excel (colunas: fase; subgrupo; nome; marco) e suba para reconstruir. Fases válidas: {PHASES.join(', ')}.</div>
      <div className="row" style={{flexWrap:'wrap',gap:10,marginBottom:16}}>
        <button className="btn btn-primary btn-sm" onClick={dlModel}>{I.download} Baixar modelo (.csv)</button>
        <button className="btn btn-ghost btn-sm" onClick={()=>csvRef.current.click()}>Importar planilha</button>
        <button className="btn btn-ghost btn-sm" onClick={applyBase}>Reaplicar entregáveis aos clientes zerados</button>
        <button className="btn btn-ghost btn-sm" onClick={seedActs}>Inserir atividades nos clientes sem atividades</button>
        <input ref={csvRef} type="file" accept=".csv" style={{display:'none'}} onChange={upModel}/>
      </div>
      <div className="divider"></div>
      <BaseActivitiesEditor db={db} update={update} acts={baseActs()}/>
    </div>

    <div className="grid2">
      <ChipEditor title="Tiers" items={db.tiers} onChange={(v)=>update(d=>{d.tiers=v;return d;})} note="Ex.: Completo, Completo com SCP, Essencial"/>
      <ChipEditor title="Tipos de cliente" items={db.tipos} onChange={(v)=>update(d=>{d.tipos=v;return d;})} note="Varejo, Indústria, Serviço..."/>
      <ChipEditor title="Setores" items={db.setores} onChange={(v)=>update(d=>{d.setores=v;return d;})}/>
      <ChipEditor title="Perfis de cliente" items={db.perfis} onChange={(v)=>update(d=>{d.perfis=v;return d;})}/>
    </div>

    <div className="card card-pad"><div className="card-h"><h3>Equipe (perfis de trabalho)</h3><span className="sub">quem executa os projetos · gerencie na página Equipe</span></div>
      <div className="muted" style={{fontSize:'.76rem',marginBottom:10}}>Isto é a equipe operacional (coordenadores e consultores usados nos projetos). O cargo de cada pessoa (Administrador, Editor ou Visualizador) define as abas que ela vê depois de escolher o nome em “Quem é você?”, na barra de cima. Ajuste os cargos na página Equipe.</div>
      {db.team.map(m=>(<div key={m.id} className="between" style={{padding:'8px 0',borderBottom:'1px solid #f0f1f7'}}>
        <div className="row"><Avatar db={db} id={m.id} size="sm"/><span style={{fontWeight:600,fontSize:'.84rem'}}>{m.name}</span><span className="muted" style={{fontSize:'.76rem'}}>{m.email}</span></div>
        <span className="tag-soft">{m.role}</span></div>))}
    </div>
  </div>);
}

/* ============================================================
   RENDER
   ============================================================ */
/* ============================================================
   RENDER — cópia local, sem autenticação
   O App entra direto, com perfil de administrador local.
   ============================================================ */
function Root(){
  if(NUVEM_ON) return <PortaNuvem/>;
  return (<AUTH.Provider value={PERFIL_LOCAL}><App/></AUTH.Provider>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
<script>
(function(){
  try{
    var src = document.getElementById('appsrc').textContent;
    var out = Babel.transform(src, {presets:[['react',{runtime:'classic'}]]}).code;
    eval(out);
  }catch(e){
    console.error(e);
    var r = document.getElementById('root');
    if(r) r.innerHTML = '<pre style="padding:24px;font-family:monospace;color:#c0392b;white-space:pre-wrap">Erro ao iniciar o sistema:\n'+(e&&e.message?e.message:e)+'</pre>';
  }
})();
</script>


</body></html>
