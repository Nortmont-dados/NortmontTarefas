/* ============================================================
   NORMALIZAÇÃO / MIGRAÇÃO
   Roda em TODO estado que entra no app.
   Garante que projetos antigos ganhem os campos novos — inclusive as
   ATIVIDADES do Projeto Base, que não existiam na versão anterior.
   ============================================================ */
function normalizeDb(s){
  if(!s || typeof s!=='object' || !Array.isArray(s.projects)) return buildInitial();
  s.meta=s.meta||{}; s.meta.version=STATE_VERSION; if(typeof s.meta.rev!=='number') s.meta.rev=0;
  /* Base já em uso (revisão > 0) não passa de novo pelas limpezas únicas antigas:
     sem esta trava, abrir o arquivo num navegador novo apagava a carteira inteira. */
  if(s.meta.rev>0) ['baseLimpaAnsata','limpezaPlanoAnsata','faxinaGeral','metodoNortmont','prazosPorFase',
    'horariosNasJanelas','agendaSemConflito','acoesDistribuidas','acoesViramTarefas','baseZeradaReal',
    'sprintQuinzenal'].forEach(k=>{ if(!s.meta[k]) s.meta[k]=true; });
  /* o período do sprint é escolhido pela gestora; vale antes de tudo */
  if(!s.sprintCfg) s.sprintCfg={dias:14,ancora:(s.sprints&&s.sprints[0]&&s.sprints[0].start)||'2026-10-05'};
  aplicarCfgSprint(s);
  if(!s.base) s.base={deliverables:(s.dlvTemplate||[]).map(d=>({...d})),activities:defaultBaseActivities()};
  if(!s.base.activities||!s.base.activities.length) s.base.activities=defaultBaseActivities();
  if(!s.base.deliverables||!s.base.deliverables.length) s.base.deliverables=DLV_TEMPLATE.map(t=>({fase:t[0],subgroup:t[1],name:t[2],marco:t[3]||0}));
  if(!s.customViz) s.customViz=[];
  if(!s.access) s.access={usuarios:[]};
  // ferramentas e links (aba Ferramentas) — bases antigas não tinham esse campo
  if(!Array.isArray(s.tools)) s.tools=[];
  if(!Array.isArray(s.recados)) s.recados=[];
  /* ---- LIMPEZA ÚNICA ----
     Zera a carteira antiga (projetos de demonstração, tarefas soltas,
     ferramentas, projetos internos e mensagens) e deixa só a Ansata.
     Roda uma vez por base; depois disso o sistema segue normal. */
  if(!s.meta) s.meta={rev:0};
  if(!s.meta.baseLimpaAnsata){
    s.projects=(s.projects||[]).filter(p=>(p.name||'').toLowerCase()==='ansata');
    s.tasks=[]; s.tools=[]; s.internal=[];
    s.messages={general:[],sprint:[],urgent:[]};
    s.notes=[];                      // notas da equipe é uma LISTA, não texto
    s.meta.baseLimpaAnsata=true;
  }
  /* ---- LIMPEZA DO CONTEÚDO PADRÃO DENTRO DA ANSATA ----
     A Ansata já existia na carteira e trazia as atividades e entregáveis
     do Projeto Base. Aqui fica só o que é do planejamento estratégico:
     as ações ligadas a um PE (ou às iniciativas do plano). */
  if(!s.meta.limpezaPlanoAnsata){
    (s.projects||[]).forEach(pr=>{
      if(!pr.bsc) return;
      const antes=(pr.activities||[]).length;
      pr.activities=(pr.activities||[]).filter(a=>a.peId||a.iniciativaId);
      pr.deliverables=[];              // entregáveis do molde padrão não valem para o plano
      pr.actSeeded=true;               // impede que o molde seja semeado de novo
      if(antes!==pr.activities.length) console.info('Ansata: removidas',antes-pr.activities.length,'tarefas do molde padrão');
    });
    s.meta.limpezaPlanoAnsata=true;
  }
  /* ---- FAXINA GERAL (a pedido) ----
     Tira tudo o que não é a Ansata e seu planejamento: outros projetos,
     tarefas gerais, ferramentas, projetos internos, mensagens e notas.
     Dentro da Ansata ficam só as ações ligadas ao plano. Roda uma vez. */
  if(!s.meta.faxinaGeral){
    const antesP=(s.projects||[]).length;
    s.projects=(s.projects||[]).filter(p=>(p.name||'').toLowerCase()==='ansata');
    s.tasks=[]; s.tools=[]; s.internal=[];
    s.messages={general:[],sprint:[],urgent:[]};
    s.notes=[];
    let antesA=0, depoisA=0;
    (s.projects||[]).forEach(pr=>{
      if(!pr.bsc) return;
      antesA+=(pr.activities||[]).length;
      pr.activities=(pr.activities||[]).filter(a=>a.peId||a.iniciativaId);
      pr.deliverables=[]; pr.actSeeded=true;
      depoisA+=pr.activities.length;
    });
    console.info('Faxina: '+(antesP-s.projects.length)+' projetos e '+(antesA-depoisA)+' tarefas avulsas removidos');
    s.meta.faxinaGeral=true;
  }
  /* ---- MIGRAÇÃO PARA O MÉTODO NORTMONT ----
     O plano antigo (BSC com objetivos e projetos estratégicos) sai de cena.
     O cliente recomeça pela Matriz de Maturidade, que é a base do método.
     As tarefas são preservadas — só perdem o vínculo com o plano antigo. */
  if(!s.meta.metodoNortmont){
    let n=0;
    (s.projects||[]).forEach(pr=>{
      if(pr.bsc){ pr.bsc=null; n++; }
      (pr.activities||[]).forEach(a=>{ a.peId=null; a.faseId=null; a.iniciativaId=null; });
    });
    if(n) console.info('Método: plano antigo removido de '+n+' cliente(s) — a base agora é a Matriz de Maturidade');
    s.meta.metodoNortmont=true;
  }
  /* Bases criadas ANTES dos projetos estratégicos existirem já tinham o plano
     (objetivos e indicadores), então semearAnsata as ignora. Aqui os PE-01…PE-06
     são anexados a esses planos, sem tocar no que já está preenchido. */
  try{ (s.projects||[]).forEach(pr=>{
    if(pr.bsc && !((pr.bsc.projetos||[]).length) && (pr.bsc.objetivos||[]).some(o=>o.codigo)) anexarPEs(pr);
  }); }catch(e){ console.warn('PEs:',e); }
  /* Distribui as ações do plano nas fases — só faz sentido depois que os
     PE e suas fases existem, por isso vem aqui e não junto das limpezas. */
  /* Ações importadas vieram todas com a mesma janela genérica do plano.
     Aqui cada uma passa a valer a janela da FASE onde está. */
  if(!s.meta.prazosPorFase){
    let n=0;
    try{ (s.projects||[]).forEach(pr=>{
      (todosPEs(pr)||[]).forEach(pe=>{
        const jan=janelaDasFases(pe);
        (pe.fases||[]).forEach((f,i)=>{
          const j=jan[i]; if(!j||!j.ini) return;
          (pr.activities||[]).forEach(a=>{ if(a.faseId!==f.id) return;
            a.buildStart=j.ini; a.buildEnd=j.fim; a.date=j.fim; n++; });
        });
      });
    }); }catch(e){ console.warn('prazos:',e); }
    if(n){ console.info('Plano: '+n+' ações receberam o prazo da sua fase'); s.meta.prazosPorFase=true; }
  }
  /* Só depois de as janelas estarem definitivas: cada dia útil ganha horário.
     Antes disso a conta sairia sobre datas que ainda iam mudar. */
  if(!s.meta.horariosNasJanelas){
    let n=0;
    const põe=(t)=>{ const w=taskWindow(t);
      if(!w.ini||!t.buildStart) return;
      if(Object.keys(t.sessoes||{}).length) return;
      t.sessoes=horariosSemConflito(s,t,120); n++; };
    try{ (s.projects||[]).forEach(pr=>(pr.activities||[]).forEach(põe));
         (s.tasks||[]).forEach(põe); }catch(e){ console.warn('horarios:',e); }
    if(n) console.info('Prazos: '+n+' janelas ganharam horário de trabalho');
    s.meta.horariosNasJanelas=true;
  }
  /* Horários herdados foram todos criados às 09:00 e se empilharam.
     Aqui cada um é reencaixado no primeiro espaço livre de quem executa. */
  if(!s.meta.agendaSemConflito){
    let m=0;
    try{
      const todas=[]; (s.projects||[]).forEach(pr=>(pr.activities||[]).forEach(a=>todas.push(a)));
      (s.tasks||[]).forEach(a=>todas.push(a));
      todas.forEach(t=>{ t.sessoes={}; });                    // limpa para recalcular do zero
      todas.forEach(t=>{ const w=taskWindow(t);
        if(!w.ini||!t.buildStart) return;
        t.sessoes=horariosSemConflito(s,t,120); m++; });
    }catch(e){ console.warn('agenda:',e); }
    if(m) console.info('Agenda: '+m+' tarefas reencaixadas sem sobreposição');
    s.meta.agendaSemConflito=true;
  }
  if(!s.meta.acoesDistribuidas){
    let n=0;
    try{ (s.projects||[]).forEach(pr=>{ if(pr.bsc) n+=distribuirAcoes(pr); }); }catch(e){ console.warn('distribuir:',e); }
    if(n){ console.info('Plano: '+n+' ações distribuídas nas fases'); s.meta.acoesDistribuidas=true; }
  }
  /* Ações soltas dos projetos do método viram tarefas do cliente. */
  if(!s.meta.acoesViramTarefas){
    let n=0;
    (s.projects||[]).forEach(pr=>{
      (pr.projetos||[]).forEach(prj=>{
        (prj.acoes||[]).forEach(a=>{
          if(!(a.texto||'').trim()) return;
          const quem=(s.team||[]).find(m=>chaveImp(m.name)===chaveImp(a.dono||''));
          pr.activities=pr.activities||[];
          pr.activities.unshift({id:uid(),projectId:pr.id,prjId:prj.id,name:a.texto.trim(),
            type:'Outro',assignees:quem?[quem.id]:[],assignee:quem?quem.id:'',
            date:a.prazo||'',buildStart:'',buildEnd:'',hora:'',durMin:0,sessoes:{},
            column:a.feito?'concluido':'backlog',sprintId:null,prio:'Média',estHoras:0,
            obs:'',notes:'',subs:[],criadaEm:a.prazo||hojeISO(),
            peId:null,faseId:null,iniciativaId:null,deliverableId:''});
          n++;
        });
        prj.acoes=[];
      });
    });
    if(n) console.info('Projetos: '+n+' ação(ões) viraram tarefas do cliente');
    s.meta.acoesViramTarefas=true;
  }

  /* ---- BASE ZERADA ----
     Pedido da gestora: começar do zero para entrar com os dados reais.
     Sai tudo o que é operação — clientes, tarefas, sprints, equipe,
     ferramentas, projetos internos, mural e mensagens. Fica o que é
     molde: Projeto Base, tiers, tipos, setores e perfis. */
  if(!s.meta.baseZeradaReal){
    const antes={p:(s.projects||[]).length,t:allTasks(s).length,e:(s.team||[]).length};
    s.projects=[]; s.tasks=[]; s.team=[]; s.tools=[]; s.internal=[];
    s.notes=[]; s.messages={general:[],sprint:[],urgent:[],project:{}};
    s.customViz=[];
    if(s.base) s.base.activities=[];              // cliente novo não nasce com tarefas padrão
    s.kpi={histTotal:0,histFinalizados:0,histCancelados:0,tempoMedioDias:0,taxaNoPrazo:0};
    s.nps={media:0,coletados:0,historico:[]};
    s.monthly=[];
    s.sprints=[sprintDaData(TODAY)];
    s.currentSprint=s.sprints[0].id;
    try{ localStorage.removeItem(SIM_KEY); }catch(e){}
    s.meta.baseZeradaReal=true;
    s.meta.simulacao=false;
    console.info('Base zerada: '+antes.p+' cliente(s), '+antes.t+' tarefa(s) e '+antes.e+' pessoa(s) removidos');
  }

  /* Sprints semanais viram quinzenais: cada semana cai na sua quinzena,
     sem duplicar, e o sprint atual passa a ser o da quinzena de hoje. */
  if(!s.meta.sprintQuinzenal){
    const mapa={};
    (s.sprints||[]).forEach(x=>{
      const q=sprintDaData(x.start||hojeISO(),x.frozen);
      if(!mapa[q.id]) mapa[q.id]=q;
      if(x.frozen===false) mapa[q.id].frozen=false;
    });
    const hoje=sprintDaData(TODAY);
    if(!mapa[hoje.id]) mapa[hoje.id]=hoje;
    s.sprints=Object.values(mapa).sort((a,b)=>a.start<b.start?-1:1);
    s.sprints.forEach(x=>{ if(x.start>isoDate(mondayOf(TODAY))) x.frozen=false; });
    s.currentSprint=hoje.id;
    s.meta.sprintQuinzenal=true;
  }

  s.tools.forEach(t=>{
    if(!t.id) t.id=uid();
    if(!t.cat) t.cat='Ferramenta';
    if(t.url===undefined) t.url='';
    if(t.desc===undefined) t.desc='';
    if(t.projectId===undefined) t.projectId=null;
    if(t.fav===undefined) t.fav=false;
  });
  // tarefas gerais (aba Tarefas) — bases antigas não tinham esse campo
  if(!Array.isArray(s.tasks)) s.tasks=[];
  s.tasks.forEach(t=>{
    if(!t.id) t.id=uid();
    if(t.projectId===undefined) t.projectId=null;
    if(!t.column) t.column='backlog';
    if(t.sprintId===undefined) t.sprintId=null;
    if(!t.prio) t.prio='Média';
    if(t.notes===undefined) t.notes='';
    if(t.buildStart===undefined) t.buildStart='';
    if(t.buildEnd===undefined) t.buildEnd='';
    if(t.hora===undefined) t.hora='';
    if(t.durMin===undefined) t.durMin=0;
    if(!Array.isArray(t.subs)) t.subs=[];
    if(t.criadaEm===undefined) t.criadaEm='';         // tarefa anterior ao carimbo
    if(!Array.isArray(t.assignees)) t.assignees=t.assignee?[t.assignee]:[];
    if(!t.assignee&&t.assignees.length) t.assignee=t.assignees[0];
    if(t.estHoras===undefined) t.estHoras=0;   // duração estimada, em horas
    if(t.obs===undefined) t.obs='';
    if(!t.sessoes||typeof t.sessoes!=='object') t.sessoes={};
    podaSessoes(t);
  });
  s.projects.forEach(p=>{
    if(p.archived===undefined) p.archived=false;
    if(p.archivedAt===undefined) p.archivedAt='';
    if(!Array.isArray(p.pauses)) p.pauses=[];
    if(!p.marcosReais) p.marcosReais={1:'',2:'',3:'',4:''};
    if(p.realEnd===undefined) p.realEnd='';
    if(!p.cor) p.cor=CORES_CLIENTE[(s.projects.indexOf(p))%CORES_CLIENTE.length];
    /* As fases Expansão e Operacional deram lugar a Ferramentas e Fechamentos */
    if(p.phase==='Expansão') p.phase='Ferramentas';
    if(p.phase==='Operacional') p.phase='Fechamentos';
    (p.deliverables||[]).forEach(d=>{ if(d.fase==='Expansão') d.fase='Ferramentas';
      if(d.fase==='Operacional') d.fase='Fechamentos'; });
    if(!p.rota) p.rota='Estruturação';
    /* Fases antigas (metodologia de franquia) mapeadas para as etapas do método */
    const DE_PARA_FASE={'Diagnóstico e PNF':'Diagnóstico','Expansão':'Planejamento e Modelagem',
      'Ferramentas':'Estruturação','Operacional':'Estruturação','Fechamentos':'Estruturação',
      'Capacitação':'Planejamento e Modelagem','Gestão de Rede':'Gestão lado a lado'};
    if(DE_PARA_FASE[p.phase]) p.phase=DE_PARA_FASE[p.phase];
    if(PHASES.indexOf(p.phase)<0) p.phase='Diagnóstico';
    (p.deliverables||[]).forEach(d=>{ if(DE_PARA_FASE[d.fase]) d.fase=DE_PARA_FASE[d.fase]; });
    if(!p.matriz||!p.matriz.pilares) p.matriz=matrizVazia();
    if(!p.ogsm) p.ogsm={objetivo:{texto:'',horizonte:'12 MESES'},metas:[]};
    if(!Array.isArray(p.projetos)) p.projetos=[];
    if(!p.cronograma) p.cronograma={};
    if(p.cronoSync===undefined) p.cronoSync=true;
    (p.activities||[]).forEach(a=>{ if(a.cronoId===undefined) a.cronoId=null;
      if(a.cronoFase===undefined) a.cronoFase=''; });
    if(p.ticket===undefined) p.ticket=0;         // mensalidade do contrato, base do R$/hora
    /* Histórico do ticket: a primeira linha nasce do valor atual, para a
       evolução ter um ponto de partida mesmo em contratos antigos. */
    if(!Array.isArray(p.ticketHist)) p.ticketHist=[];
    if(!p.ticketHist.length && +p.ticket>0)
      p.ticketHist=[{id:uid(),data:p.startDate||hojeISO(),valor:+p.ticket,motivo:'Contrato inicial'}];
    if(p.horasPlan===undefined) p.horasPlan=0;   // horas/mês previstas no contrato
    if(!Array.isArray(p.activities)) p.activities=[];
    if(p.bsc&&!Array.isArray(p.bsc.objetivos)) p.bsc.objetivos=[];
    if(p.bsc){
      if(!Array.isArray(p.bsc.frentes)) p.bsc.frentes=[];
      if(!Array.isArray(p.bsc.rituais)) p.bsc.rituais=[];
      if(!Array.isArray(p.bsc.decisoes)) p.bsc.decisoes=[];
      if(!p.bsc.agrupar) p.bsc.agrupar=(p.bsc.frentes.length?'frente':'perspectiva');
      p.bsc.alvo=null;                 // o bloco "O alvo" foi removido do sistema
      if(!Array.isArray(p.bsc.projetos)) p.bsc.projetos=[];
      p.bsc.projetos.forEach(pe=>{ if(!pe.id) pe.id=uid();
        if(!Array.isArray(pe.objetivos)) pe.objetivos=[];
        if(!Array.isArray(pe.fases)) pe.fases=[];
        pe.fases.forEach(f=>{ if(!f.id) f.id=uid(); if(!f.status) f.status='nao'; }); });
    }
    if(p.bsc) (p.bsc.objetivos||[]).forEach(o=>{
      if(!Array.isArray(o.indicadores)) o.indicadores=[];
      if(!Array.isArray(o.iniciativas)) o.iniciativas=[];
      if(o.frenteId===undefined) o.frenteId=null;
      if(o.custo===undefined) o.custo='';
      if(o.codigo===undefined) o.codigo='';
      o.indicadores.forEach(i=>{ if(!Array.isArray(i.medicoes)) i.medicoes=[];
        if(i.metaTexto===undefined) i.metaTexto=''; if(i.baseNota===undefined) i.baseNota=''; });
    });
    p.activities.forEach(a=>{ if(!a.prio) a.prio='Média'; if(a.notes===undefined) a.notes='';
      if(a.iniciativaId===undefined) a.iniciativaId=null;
      if(a.peId===undefined) a.peId=null; if(a.faseId===undefined) a.faseId=null;
      if(a.buildStart===undefined) a.buildStart=''; if(a.buildEnd===undefined) a.buildEnd='';
      if(a.hora===undefined) a.hora=''; if(a.durMin===undefined) a.durMin=0;
      if(!Array.isArray(a.subs)) a.subs=[];
      if(a.criadaEm===undefined) a.criadaEm='';
      if(!Array.isArray(a.assignees)) a.assignees=a.assignee?[a.assignee]:[];
      if(!a.assignee&&a.assignees.length) a.assignee=a.assignees[0];
      if(a.estHoras===undefined) a.estHoras=0; if(a.obs===undefined) a.obs='';
      if(!a.sessoes||typeof a.sessoes!=='object') a.sessoes={};
      podaSessoes(a); });
    if(!p.marcos||!p.marcos[1]) p.marcos=marcoDates(p.startDate,p.endDate);
    // ▼ CORREÇÃO: projetos criados na v1 vieram SEM atividades. Semeia uma única vez.
    if(!p.actSeeded && p.activities.length===0){
      p.activities=buildActivities(s.base.activities,p.consultants,p.deliverables,p.id);
      p.actSeeded=true;
    }
  });
  return s;
}

/* Le os dados gravados dentro do proprio arquivo pelo botao "Salvar HTML". */
function readSeed(){
  try{ const el=document.getElementById('seeddata'); if(!el) return null;
    const t=(el.textContent||'').trim(); if(!t) return null;
    return JSON.parse(t);
  }catch(e){ console.warn('seed invalido:',e); return null; }
}
/* Fonte dos dados, na ordem: o mais RECENTE entre o que esta salvo neste
   navegador e o que veio embutido no arquivo; se nao houver nenhum, a carteira padrao. */
function loadState(){
  const seed=readSeed();
  let local=null;
  try{ const r=localStorage.getItem(LS_KEY); if(r) local=JSON.parse(r); }catch(e){}
  const rev=(o)=> (o&&o.meta&&o.meta.rev)||0;
  if(seed&&local) return normalizeDb(rev(local)>rev(seed)? local : seed);
  if(seed)  return normalizeDb(seed);
  if(local) return normalizeDb(local);
  return normalizeDb(buildInitial());   // base nova também passa pelas migrações/cargas
}
function saveState(s){ try{localStorage.setItem(LS_KEY,JSON.stringify(s));}catch(e){} }

/* ============================================================
   VERSÃO LOCAL — sem banco compartilhado
   Esta cópia guarda tudo apenas no localStorage do navegador
   (chave LS_KEY). Não há Supabase, login, nem sincronização.
   Backup/restauração continuam em Configurações → Exportar/Importar JSON.
   ============================================================ */

/* ============================================================
   HELPERS DE UI
   ============================================================ */
const member=(db,id)=> (db.team.find(m=>m.id===id))
  ||{name:id?'(fora da equipe)':'sem responsável',color:'#8b9a99',role:''};
const initials=(n)=> (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
/* Num projeto com planejamento estratégico, quem mede o avanço são as FASES
   dos projetos estratégicos (PE), não os entregáveis do molde padrão.
   Sem plano, segue valendo a régua de entregáveis. */
function temPlanoFases(p){ return ((p.bsc&&p.bsc.projetos)||[]).some(pe=>(pe.fases||[]).length); }
function projProgress(p){
  if(temPlanoFases(p)){
    const ts=(p.activities||[]).filter(a=>a.peId);
    const done=ts.filter(a=>a.column==='concluido').length;
    return {done,total:ts.length,pct:ts.length?Math.round(done/ts.length*100):0,acoes:true};
  }
  const t=p.deliverables.length; const done=p.deliverables.filter(d=>d.status==='Concluído').length;
  return {done,total:t,pct:t?Math.round(done/t*100):0};
}
function faseProgress(p,fase){ const it=p.deliverables.filter(d=>d.fase===fase); const done=it.filter(d=>d.status==='Concluído').length; return {done,total:it.length,pct:it.length?Math.round(done/it.length*100):0}; }

/* ------------------------------------------------------------
   RESPONSÁVEIS
   Uma tarefa pode ter mais de uma pessoa. A lista fica em `assignees`;
   `assignee` continua existindo com o primeiro nome, para que tudo que
   já lia um único responsável siga funcionando.
   ------------------------------------------------------------ */
const respsDe=(t)=>{
  if(!t) return [];
  if(Array.isArray(t.assignees)&&t.assignees.length) return t.assignees;
  return t.assignee? [t.assignee] : [];
};
const temResp=(t,id)=>respsDe(t).indexOf(id)>=0;
/* Grava a lista mantendo `assignee` sincronizado com o primeiro. */
function setResps(t,lista){
  const l=[...new Set((lista||[]).filter(Boolean))];
  t.assignees=l;
  t.assignee=l[0]||'';
}
const nomesResp=(db,t)=>respsDe(t).map(id=>member(db,id).name).join(', ');

/* Grupo de avatares — mostra até três e resume o resto. */
function Avatares({db,t,size}){
  const ids=respsDe(t);
  if(!ids.length) return <span className="muted" style={{fontSize:'.7rem'}}>—</span>;
  return (<span className="avs" title={nomesResp(db,t)}>
    {ids.slice(0,3).map(id=><Avatar key={id} db={db} id={id} size={size||'sm'}/>)}
    {ids.length>3&&<span className={"av mais "+(size||'sm')}>+{ids.length-3}</span>}
  </span>);
}

/* Célula da tabela: mostra os avatares e abre o seletor ao clicar. */
function CelResps({db,t,onChange}){
  const [aberto,setAberto]=useState(false);
  const ids=respsDe(t);
  return (<div className="celresp">
    <button className="celresp-b" onClick={()=>setAberto(v=>!v)} title={ids.length?nomesResp(db,t):'Escolher responsáveis'}>
      {ids.length? <Avatares db={db} t={t}/> : <span className="muted" style={{fontSize:'.72rem'}}>escolher</span>}
      <span className="celresp-s">▾</span>
    </button>
    {aberto&&<>
      <div className="celresp-fundo" onClick={()=>setAberto(false)}></div>
      <div className="celresp-menu">
        <div className="celresp-tit">Quem trabalha nesta tarefa</div>
        <SelResps db={db} valor={ids} onChange={onChange}/>
        <button className="btn btn-ghost btn-sm" style={{width:'100%',marginTop:8,justifyContent:'center'}}
          onClick={()=>setAberto(false)}>pronto</button>
      </div>
    </>}
  </div>);
}

/* Seletor de várias pessoas, em pastilhas. */
function SelResps({db,valor,onChange,compacto}){
  const sel=valor||[];
  const alterna=(id)=>{
    const tem=sel.indexOf(id)>=0;
    onChange(tem? sel.filter(x=>x!==id) : [...sel,id]);
  };
  return (<div className={"selresp"+(compacto?' cp':'')}>
    {(db.team||[]).map(m=>{ const on=sel.indexOf(m.id)>=0;
      return (<button key={m.id} type="button" className={"selresp-p"+(on?' on':'')}
        style={on&&!compacto?{background:m.color,borderColor:m.color}:null}
        onClick={(e)=>{e.stopPropagation(); alterna(m.id);}}
        title={(on?'Tirar ':'Pôr ')+m.name}>
        <span className="selresp-av" style={{background:(on&&!compacto)?'rgba(255,255,255,.28)':m.color,
          boxShadow:(on&&compacto)?'0 0 0 2px #fff, 0 0 0 3px '+m.color:undefined}}>{initials(m.name)}</span>
        {!compacto&&<span>{m.name}</span>}
      </button>);})}
  </div>);
}

function Avatar({db,id,size,name,color}){ const m=id?member(db,id):{name,color}; return <span className={"av "+(size||'')} style={{background:m.color}} title={m.name}>{initials(m.name)}</span>; }
function Badge({children,c}){return <span className="badge" style={{background:c.bg,color:c.fg}}>{children}</span>;}
function Pill({children,c}){return <span className="pill" style={{background:c.bg,color:c.fg}}><i className="dotc" style={{background:c.fg}}></i>{children}</span>;}
function Signal({p}){ const s=sinaleira(p); return <span className={"sig "+s.k}><i className="lamp"></i>{s.label}</span>; }

function Ring({pct,color,size}){
  const w=size||74,r=(w/2)-7,c=2*Math.PI*r,off=c-(pct/100)*c;
  return (<div className="ring-wrap" style={{width:w,height:w}}>
    <svg width={w} height={w} style={{transform:'rotate(-90deg)'}}>
      <circle cx={w/2} cy={w/2} r={r} fill="none" stroke="#edeef5" strokeWidth="7"/>
      <circle cx={w/2} cy={w/2} r={r} fill="none" stroke={color||'var(--brand)'} strokeWidth="7" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} style={{transition:'stroke-dashoffset .5s'}}/>
    </svg><span className="pct" style={{fontSize:w<60?'.8rem':'1rem'}}>{pct}%</span></div>);
}
function BarChart({data,unit}){
  const max=Math.max(...data.map(d=>d.value),1);
  return (<div style={{display:'flex',flexDirection:'column',gap:9}}>
    {data.map((d,i)=>(<div key={i} style={{display:'flex',alignItems:'center',gap:10}} title={d.label+': '+d.value+(unit||'')}>
      <div style={{width:140,fontSize:'.78rem',fontWeight:600,color:'var(--text-2)',textAlign:'right',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{d.label}</div>
      <div style={{flex:1,background:'#f0f1f8',borderRadius:7,height:22,overflow:'hidden'}}>
        <div className="mono" style={{width:(d.value/max*100)+'%',height:'100%',background:d.color||'var(--brand)',borderRadius:7,display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:8,color:'#fff',fontSize:'.72rem',fontWeight:700,minWidth:26,transition:'width .5s'}}>{d.value}{unit||''}</div>
      </div></div>))}
  </div>);
}
// Gráfico de colunas (vertical) com uma ou mais séries. Mostra o número no hover (tooltip).
function ColumnChart({categories,series,height,unit}){
  const h=height||190;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  return (<div>
    <div className="col-chart" style={{height:h}}>
      {categories.map((cat,ci)=>(
        <div key={ci} className="col-group">
          <div className="col-bars">
            {series.map((s,si)=>{const v=s.data[ci]||0;const bc=(s.colors&&s.colors[ci])||s.color;return(
              <div key={si} className="col-bar" style={{height:(v/max*100)+'%',background:bc,minHeight:v>0?4:0}}>
                <span className="col-tip">{cat}{s.name?' · '+s.name:''}: {v}{unit||''}</span>
              </div>);})}
          </div>
          <div className="col-x">{cat}</div>
        </div>))}
    </div>
    {series.length>1 && <div className="row" style={{gap:14,justifyContent:'center',marginTop:10,flexWrap:'wrap'}}>{series.map((s,si)=><span key={si} className="chip"><i style={{width:10,height:10,background:s.color,display:'inline-block',borderRadius:3}}></i>{s.name}</span>)}</div>}
  </div>);
}
function LineChart({series,height,color}){
  const h=height||160,w=560,pad=28;
  const max=Math.max(...series.flatMap(s=>s.data.map(d=>d.v)),1);
  const xs=(i,n)=> pad+(i/(n-1))*(w-pad*2);
  const ys=(v)=> h-pad-(v/max)*(h-pad*2);
  return (<svg viewBox={"0 0 "+w+" "+h} className="linechart" style={{height:h}}>
    {[0,.25,.5,.75,1].map((g,i)=><line key={i} x1={pad} x2={w-pad} y1={pad+g*(h-pad*2)} y2={pad+g*(h-pad*2)} stroke="#eef0f7"/>) }
    {series.map((s,si)=>{
      const n=s.data.length;
      const pts=s.data.map((d,i)=>xs(i,n)+','+ys(d.v)).join(' ');
      return <g key={si}><polyline points={pts} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinejoin="round"/>
        {s.data.map((d,i)=><circle key={i} cx={xs(i,n)} cy={ys(d.v)} r="3" fill={s.color}/>)}</g>;
    })}
    {series[0].data.map((d,i)=><text key={i} x={xs(i,series[0].data.length)} y={h-8} fontSize="9" fill="#8b9a99" textAnchor="middle">{d.x}</text>)}
  </svg>);
}

/* Junta três versões: a última que veio da planilha (base), a desta tela
   (local) e a que alguém gravou depois (remoto). Listas com id são
   juntadas item a item; no resto, quem mudou ganha; se os dois mudaram
   o mesmo campo, fica o desta tela. */
const _js=(x)=>JSON.stringify(x===undefined?null:x);
const _obj=(x)=>x&&typeof x==='object'&&!Array.isArray(x);
const _comId=(a)=>Array.isArray(a)&&a.every(x=>_obj(x)&&x.id!=null);
function merge3(b,l,r){
  const jb=_js(b), jl=_js(l), jr=_js(r);
  if(jl===jb) return r;
  if(jr===jb||jl===jr) return l;
  if(_obj(l)&&_obj(r)){
    const bo=_obj(b)?b:{}, out={};
    new Set([...Object.keys(r),...Object.keys(l)]).forEach(k=>{
      const naL=k in l, naR=k in r, bv=bo[k];
      if(!naL){ if(k in bo&&_js(r[k])===_js(bv)) return; out[k]=r[k]; return; }   // apagado aqui
      if(!naR){ if(k in bo&&_js(l[k])===_js(bv)) return; out[k]=l[k]; return; }   // apagado lá
      out[k]=merge3(bv,l[k],r[k]);
    });
    return out;
  }
  if(_comId(l)&&_comId(r)){
    const bm={}; if(_comId(b)) b.forEach(x=>bm[x.id]=x);
    const lm={}; l.forEach(x=>lm[x.id]=x);
    const rm={}; r.forEach(x=>rm[x.id]=x);
    const out=[];
    r.forEach(x=>{
      if(lm[x.id]!==undefined) out.push(merge3(bm[x.id],lm[x.id],x));
      else if(bm[x.id]!==undefined&&_js(x)===_js(bm[x.id])) return;   // apagado aqui, intocado lá
      else out.push(x);
    });
    l.forEach((x,i)=>{
      if(rm[x.id]!==undefined) return;
      if(bm[x.id]!==undefined&&_js(x)===_js(bm[x.id])) return;        // apagado lá, intocado aqui
      // novo aqui (ou editado aqui e apagado lá): entra logo depois do vizinho que já estava antes dele
      const ant=i>0? l[i-1].id : null; const pos=ant==null? 0 : out.findIndex(y=>y.id===ant)+1;
      out.splice(pos>0?pos:(ant==null?0:out.length),0,x);
    });
    return out;
  }
  return l;
}

// projetos "vivos" (não arquivados) — usados em dashboard, sprint, calendário, KPIs
const ativos=(db)=> db.projects.filter(p=>!p.archived);

/* ============================================================
   POOL UNIFICADO DE TAREFAS
   A aba Tarefas, o Sprint e o Calendário leem daqui. Uma tarefa pode:
   · pertencer a um PROJETO  → mora em project.activities (origem 'projeto')
   · ser GERAL (sem projeto) → mora em db.tasks           (origem 'geral')
   Os dois tipos têm o mesmo formato, então circulam juntos pelo sistema.
   ============================================================ */
function allTasks(db){
  const out=[];
  ativos(db).forEach(p=>(p.activities||[]).forEach(a=>out.push({...a,proj:p,origem:'projeto'})));
  (db.tasks||[]).forEach(t=>out.push({...t,proj:null,origem:'geral'}));
  return out;
}
// Aplica uma alteração numa tarefa, esteja ela num projeto ou no pool geral.
function mutateTask(d,id,fn){
  for(const p of d.projects){ const a=(p.activities||[]).find(x=>x.id===id); if(a){ fn(a,p); return true; } }
  const t=(d.tasks||[]).find(x=>x.id===id); if(t){ fn(t,null); return true; }
  return false;
}
// Remove uma tarefa de onde quer que ela esteja.
function removeTask(d,id){
  for(const p of d.projects){ const i=(p.activities||[]).findIndex(x=>x.id===id); if(i>=0){ p.activities.splice(i,1); return true; } }
  const j=(d.tasks||[]).findIndex(x=>x.id===id); if(j>=0){ d.tasks.splice(j,1); return true; }
  return false;
}
/* Trocar o cliente de uma tarefa é movê-la de dono na base: atividades
   vivem dentro do projeto, tarefas gerais na lista solta. O vínculo com
   o plano antigo (PE/fase) não sobrevive à troca, por isso é limpo. */
function moverParaCliente(d,id,projectId){
  let alvo=null;
  for(const pr of d.projects){ const i=(pr.activities||[]).findIndex(x=>x.id===id);
    if(i>=0){ alvo=pr.activities.splice(i,1)[0]; break; } }
  if(!alvo){ const j=(d.tasks||[]).findIndex(x=>x.id===id);
    if(j>=0) alvo=d.tasks.splice(j,1)[0]; }
  if(!alvo) return false;
  alvo.peId=null; alvo.faseId=null; alvo.iniciativaId=null; alvo.deliverableId='';
  if(projectId){
    const dest=d.projects.find(x=>x.id===projectId); if(!dest) return false;
    alvo.projectId=dest.id;
    dest.activities=[alvo,...(dest.activities||[])];
  } else {
    alvo.projectId=null;
    d.tasks=[alvo,...(d.tasks||[])];
  }
  return true;
}

// Atrasada = tem data no passado e ainda não foi concluída
const taskAtrasada=(t)=> !!t.date && t.date<hojeISO() && t.column!=='concluido' && t.column!=='cancelado';

/* ------------------------------------------------------------
   PRAZOS DA TAREFA
   · date        = PRAZO DE ENTREGA (quando precisa estar pronta)
   · buildStart / buildEnd = PRAZO DE CONSTRUÇÃO (janela de trabalho)
   A janela de construção é o que decide, sozinha, em qual SPRINT a
   tarefa entra e como ela aparece no CALENDÁRIO. Não há botão manual:
   definiu as datas, a tarefa se organiza.
   ------------------------------------------------------------ */
function taskWindow(t){
  const ini = t.buildStart || t.date || '';
  const fimBruto = t.buildEnd || t.date || t.buildStart || '';
  return {ini, fim: (fimBruto && ini && fimBruto<ini)? ini : fimBruto};
}
const semPrazo=(t)=>{ const w=taskWindow(t); return !w.ini && !w.fim; };
// A tarefa pertence ao sprint se a janela de construção cruza a semana dele.
function taskEmSprint(t,sprint){
  if(!sprint) return false;
  const {ini,fim}=taskWindow(t);
  if(!ini&&!fim) return false;
  return (ini||fim)<=sprint.end && (fim||ini)>=sprint.start;
}

   Ativado projeto a projeto. Estrutura:

   Nível 0 · OBJETIVO ESTRATÉGICO (1.1, 1.2…) — o estado a atingir.
             Não termina: melhora. Medido por indicadores.
   Nível 1 · PROJETO ESTRATÉGICO (PE-01…) — movimento com FASES

/* As ações de um projeto do método SÃO tarefas do cliente, amarradas
   pelo campo prjId. Aparecem na aba Tarefas, no sprint e no calendário
   como qualquer outra — a diferença é saber de qual projeto vieram. */
const tarefasDoProjeto=(p,prjId)=>(p.activities||[]).filter(a=>a.prjId===prjId);
const acoesDaFase=(p,faseId)=>(p.activities||[]).filter(a=>a.faseId===faseId);

function progressoFase(p,f){
  const ts=acoesDaFase(p,f.id); const done=ts.filter(a=>a.column==='concluido').length;
  return {total:ts.length,done,pct:ts.length?Math.round(done*100/ts.length):0};
}
/* ------------------------------------------------------------
   QUEM MANDA NO PROGRESSO: AS AÇÕES CONCLUÍDAS
   A situação da fase é deduzida das suas ações — nada de marcar
   status à mão e o painel mentir depois. Fases ainda sem ação
   escrita continuam usando o status manual.
   ------------------------------------------------------------ */
function statusFase(p,f){
  const ts=acoesDaFase(p,f.id);
  if(!ts.length) return f.status||'nao';
  const done=ts.filter(a=>a.column==='concluido').length;
  return done===0? 'nao' : (done===ts.length? 'concluida' : 'andamento');
}
const faseAuto=(p,f)=>acoesDaFase(p,f.id).length>0;   // true = situação vem das ações
function progressoPE(p,pe){
  const fs=pe.fases||[];
  const ts=acoesDoPE(p,pe.id); const done=ts.filter(a=>a.column==='concluido').length;

/* Ações do plano com prazo dentro de uma janela de dias a partir de hoje. */

/* ------------------------------------------------------------
   CALENDÁRIO DO PLANO
   O período do PE vem escrito ("set/26 – fev/27") e cada fase traz a

   cada fase ganha data de começo e de fim — é o que transforma o plano
   em algo que cabe no sprint e no calendário.

const MES_ABREV={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
function inicioDoPE(pe){
  const m=/([a-zç]{3})\/(\d{2})/i.exec(pe.periodo||'');
  if(!m) return null;
  const mes=MES_ABREV[m[1].toLowerCase()]; if(mes===undefined) return null;
  return new Date(2000+ +m[2],mes,1);
}
/* Datas de cada fase, encadeadas. Retorna [{ini,fim}] no mesmo índice das fases. */
function janelaDasFases(pe){
  const ini0=inicioDoPE(pe); const fs=pe.fases||[];
  if(!ini0) return fs.map(()=>({ini:'',fim:''}));
  let cursor=new Date(ini0);
  return fs.map(f=>{
    const sem=semanasDaFase(f)||2;
    const ini=isoDate(cursor);
    const fim=isoDate(addDays(cursor,sem*7-1));
    cursor=addDays(cursor,sem*7);

}
const janelaDaFase=(pe,faseId)=>{ const i=(pe.fases||[]).findIndex(f=>f.id===faseId);

/* O ALVO: o número único que o plano inteiro persegue (hoje → meta → lacuna). */

const frenteVazia=()=>({id:'',num:'',nome:'',sub:'',periodo:'',dono:'',entrega:'',resultado:'',passamExistir:'',cor:'#0F4245'});
const temBSC=(p)=>!!(p.bsc&&p.bsc.ativo);

/* Última medição registrada de um indicador */
function ultimaMedicao(ind){
  const ms=(ind.medicoes||[]).slice().sort((a,b)=>a.data<b.data?-1:1);
  return ms.length? ms[ms.length-1] : null;
}
/* Avanço rumo à meta: funciona para indicadores que sobem e que descem,
   porque mede a fração percorrida entre a linha de base e a meta. */
function avancoIndicador(ind){
  const u=ultimaMedicao(ind); if(!u) return null;
  const base=+ind.baseline, meta=+ind.meta, atual=+u.valor;
  if(!isFinite(base)||!isFinite(meta)||!isFinite(atual)) return null;
  if(meta===base) return atual>=meta?1:0;
  return (atual-base)/(meta-base);
}
/* Farol: compara o avanço com o que já era esperado nesta altura do prazo */
function farolIndicador(ind){
  const av=avancoIndicador(ind);
  if(av===null) return {k:'sem',cor:'#8b9a99',txt:'sem medição'};
  const pct=Math.round(av*100);
  if(av>=1) return {k:'ok',cor:'#2F8F6E',txt:'meta atingida',pct};
  let esperado=null;
  if(ind.inicio&&ind.prazo){
    const t0=dLocal(ind.inicio), t1=dLocal(ind.prazo), hoje=TODAY;
    const tot=t1-t0; if(tot>0) esperado=Math.min(1,Math.max(0,(hoje-t0)/tot));
  }
  if(esperado===null) return {k:av>=.7?'ok':av>=.4?'atencao':'risco',
    cor:av>=.7?'#2F8F6E':av>=.4?'#C58B2A':'#B33A3A',txt:pct+'% da meta',pct};
  const rel=esperado>0? av/esperado : (av>0?1:0);
  const k=rel>=.9?'ok':rel>=.7?'atencao':'risco';
  return {k,cor:k==='ok'?'#2F8F6E':k==='atencao'?'#C58B2A':'#B33A3A',
    txt:pct+'% da meta · esperado '+Math.round(esperado*100)+'%',pct};
}
/* Progresso da iniciativa = tarefas concluídas / tarefas da iniciativa */
function progressoIniciativa(p,ini){
  const ts=(p.activities||[]).filter(a=>a.iniciativaId===ini.id);

}
/* Farol do objetivo: o pior farol entre seus indicadores */
function farolObjetivo(o){

  if(!fs.length) return {k:'sem',cor:'#8b9a99',txt:'sem indicador medido'};
  const ordem={risco:0,atencao:1,ok:2};

const DURACOES=[[0,'sem duração'],[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'1h'],[90,'1h30'],

/* ------------------------------------------------------------

   Dentro do prazo de construção, cada dia pode (opcionalmente) ter o
   horário reservado para trabalhar naquela tarefa:
     t.sessoes = { '2026-08-17': {hora:'09:00', durMin:120}, ... }

   ocupam um horário na agenda.
   ------------------------------------------------------------ */
function diasDaJanela(t){
  const w=taskWindow(t); if(!w.ini||!w.fim) return [];
  const out=[]; let d=dLocal(w.ini); const fim=dLocal(w.fim); let guarda=0;
  while(d<=fim && guarda++<400){ out.push(isoDate(d)); d=addDays(d,1); }

}
const sessaoDe=(t,iso)=>{ const s=(t.sessoes||{})[iso]; return (s&&s.hora)? s : null; };
const contaSessoes=(t)=>Object.values(t.sessoes||{}).filter(x=>x&&x.hora).length;
const ehFimDeSemana=(iso)=>{ const g=dLocal(iso).getDay(); return g===0||g===6; };

const totalSessoes=(t)=>Object.values(t.sessoes||{}).reduce((a,x)=>a+((x&&x.hora)?(+x.durMin||0):0),0);

/* Todo prazo de construção nasce com horário: cada dia útil da janela recebe
   um bloco de trabalho. Sem isso a tarefa vira uma barra de "dia todo" no
   calendário, que não diz quando a pessoa vai realmente sentar para fazer. */
function horariosPadrao(ini,fim,hora,dur){
  const out={}; if(!ini) return out;

    d=addDays(d,1);

function podaSessoes(t){
  const ses=t.sessoes||{}; const ks=Object.keys(ses); if(!ks.length) return;

  ks.forEach(iso=>{ if(iso<w.ini||iso>(w.fim||w.ini)) delete ses[iso]; });

      else if (!n.ctEncerradoEm && (n.ctAnteriores || []).length === (o.ctAnteriores || []).length) add('Contratos', 'reabriu o contrato', nome, '', 'ct:' + id + ':reab');
    }
    if ((n.ctAnteriores || []).length > (o.ctAnteriores || []).length) add('Contratos', 'fez um novo contrato (renovação após encerramento)', nome, rs(n.ticket) + '/mês · início ' + dt(n.ctInicio), 'ct:' + id + ':novo2');
    const renov = (n.ctRenovacoes || []).length > (o.ctRenovacoes || []).length;
    if (renov) { const r = n.ctRenovacoes[n.ctRenovacoes.length - 1] || {}; add('Contratos', 'renovou o contrato', nome, 'até ' + dt(r.ate) + (r.ticketDepois !== r.ticketAntes ? ' · ' + rs(r.ticketAntes) + ' → ' + rs(r.ticketDepois) : ' · mesmo valor'), 'ct:' + id + ':renov'); }
    /* contrato criado agora (cliente que não tinha ticket): uma linha só, com as condições */
    const nasceu = !(o.ticketHist || []).length && !(+o.ticket) && (n.ticketHist || []).length && !(n.ctAnteriores || []).length;
    if (nasceu) add('Contratos', 'criou o contrato', nome, [rs(n.ticket) + '/mês', n.horasPlan ? (+n.horasPlan) + 'h/mês' : '', 'início ' + dt(n.ctInicio || n.startDate), n.ctFim ? 'fim ' + dt(n.ctFim) : 'sem prazo', n.formaPag || ''].filter(Boolean).join(' · '), 'ct:' + id + ':novo');
    const ho = porId(o.ticketHist), hn = porId(n.ticketHist);
    const novos = (n.ticketHist || []).filter(h => h && !ho[h.id]), idos = (o.ticketHist || []).filter(h => h && !hn[h.id]);
    if (!nasceu && !renov && !((n.ctAnteriores || []).length > (o.ctAnteriores || []).length)) {
      novos.forEach(h => {
        if (!(o.ticketHist || []).length || h.motivo === 'Contrato inicial') add('Contratos', 'definiu o ticket', nome, rs(h.valor) + '/mês desde ' + dt(h.data), 'ct:' + id + ':tk');
        else add('Contratos', 'registrou reajuste', nome, rs(o.ticket) + ' → ' + rs(h.valor) + ' a partir de ' + dt(h.data) + (h.motivo ? ' · ' + h.motivo : ''), 'ct:' + id + ':rj:' + h.id);
      });
      idos.filter(h => !novos.some(x => x.motivo === 'Contrato inicial')).forEach(h => add('Contratos', 'apagou um registro do histórico do ticket', nome, rs(h.valor) + ' de ' + dt(h.data), 'ct:' + id + ':rjdel:' + h.id));
      if (!novos.length && !idos.length && (+o.ticket || 0) !== (+n.ticket || 0)) add('Contratos', 'mudou o ticket', nome, rs(o.ticket) + ' → ' + rs(n.ticket), 'ct:' + id + ':tk');
    }
    /* demais campos */
    const mudCt = [], mudCli = [], camposCt = [], camposCli = [];
    Object.keys(Object.assign({}, o, n)).forEach(k => {
      if (IGN[k] || J(o[k]) === J(n[k])) return;
      const r = ROT[k] || k, va = valorLegivel(k, o[k]), vb = valorLegivel(k, n[k]);
      const txt = va !== null && vb !== null ? r + ': ' + va + ' → ' + vb : r;
      if (CONTRATO[k]) { if (!renov || k !== 'ctFim') { mudCt.push(txt); camposCt.push(k); } }
      else { mudCli.push(txt); camposCli.push(k); }
    });
    if (mudCt.length && !nasceu) add('Contratos', 'editou o contrato', nome, mudCt.join(' · '), 'ct:' + id + ':' + camposCt.join(','));
    if (mudCli.length) add('Clientes', 'editou o cliente', nome, mudCli.join(' · '), 'cli:' + id + ':' + camposCli.join(','));
  });
  Object.keys(pa).forEach(id => { if (!pb[id]) { const n = (pa[id].activities || []).length; add('Clientes', 'excluiu o cliente', pa[id].name || 'cliente', n ? 'junto com ' + n + ' tarefa' + (n > 1 ? 's' : '') : '', 'cli:' + id + ':del'); } });

  /* ---------- equipe e acessos ---------- */
  const ea = porId(a.team), eb = porId(b.team);
  Object.keys(eb).forEach(id => {
    const n = eb[id], o = ea[id];
    if (!o) { add('Equipe', 'adicionou à equipe', n.name, (n.email ? 'e-mail ' + n.email + ' · ' : 'sem e-mail · ') + (PERM[n.perm || 'editor'] || n.perm), 'eq:' + id + ':novo'); return; }
    if (J(o) === J(n)) return;
    const ac = [];
    if ((o.email || '') !== (n.email || '')) ac.push('e-mail: ' + (o.email || '—') + ' → ' + (n.email || '—'));
    if ((o.perm || 'editor') !== (n.perm || 'editor')) ac.push('cargo: ' + (PERM[o.perm || 'editor'] || o.perm) + ' → ' + (PERM[n.perm || 'editor'] || n.perm));
    if (ac.length) add('Equipe', 'mudou o acesso', n.name, ac.join(' · '), 'eq:' + id + ':acesso');
    const outros = Object.keys(Object.assign({}, o, n)).filter(k => k !== 'email' && k !== 'perm' && J(o[k]) !== J(n[k]));
    if (outros.length) add('Equipe', 'editou o cadastro', n.name, outros.map(k => ({ name: 'nome', role: 'função', color: 'cor', cap: 'capacidade', capacity: 'capacidade' }[k] || k)).filter((x, i, arr) => arr.indexOf(x) === i).join(', '), 'eq:' + id + ':' + outros.join(','));
  });
  Object.keys(ea).forEach(id => { if (!eb[id]) add('Equipe', 'removeu da equipe', ea[id].name, '', 'eq:' + id + ':del'); });

  /* ---------- recados ---------- */
  const ra = porId(a.recados), rb = porId(b.recados);
  Object.keys(rb).forEach(id => {
    const n = rb[id], o = ra[id];
    if (!o) { add('Recados', 'deixou um recado', n.para ? 'para ' + pessoa(n.para) : 'para toda a equipe', curto(n.texto, 90), 'rec:' + id + ':novo'); return; }
    if ((n.cientes || []).length > (o.cientes || []).length) add('Recados', 'marcou um recado como ciente', 'de ' + pessoa(n.por), curto(n.texto, 60), 'rec:' + id + ':ciente');
  });
  Object.keys(ra).forEach(id => { if (!rb[id]) add('Recados', 'apagou um recado', ra[id].para ? 'para ' + pessoa(ra[id].para) : 'para toda a equipe', curto(ra[id].texto, 60), 'rec:' + id + ':del'); });

  /* ---------- sprint ---------- */
  const sa = porId(a.sprints), sb = porId(b.sprints);
  Object.keys(sb).forEach(id => { if (!sa[id]) add('Sprint', 'abriu o sprint', dt(sb[id].start) + ' a ' + dt(sb[id].end), '', 'sp:' + id); });
  if ((a.currentSprint || '') !== (b.currentSprint || '') && sb[b.currentSprint]) add('Sprint', 'mudou o sprint atual', dt(sb[b.currentSprint].start) + ' a ' + dt(sb[b.currentSprint].end), '', 'sp:atual');
  if (J(a.sprintCfg) !== J(b.sprintCfg)) add('Sprint', 'mudou o período do sprint', (b.sprintCfg || {}).dias ? b.sprintCfg.dias + ' dias' : '', '', 'sp:cfg');

  /* ---------- ferramentas e projetos internos ---------- */
  [['tools', 'Ferramentas', 'a ferramenta'], ['internal', 'Projetos internos', 'o projeto interno']].forEach(([k, area, art]) => {
    const xa = porId(a[k]), xb = porId(b[k]);
    Object.keys(xb).forEach(id => { if (!xa[id]) add(area, 'criou ' + art, xb[id].name, '', k + ':' + id + ':novo'); else if (J(xa[id]) !== J(xb[id])) add(area, 'editou ' + art, xb[id].name, '', k + ':' + id + ':ed'); });
    Object.keys(xa).forEach(id => { if (!xb[id]) add(area, 'excluiu ' + art, xa[id].name, '', k + ':' + id + ':del'); });
  });

  /* ---------- configurações ---------- */
  const CFG = { tiers: 'lista de tiers', tipos: 'tipos de cliente', setores: 'setores', perfis: 'perfis de cliente', base: 'cliente base (entregáveis e atividades)', dlvTemplate: null,
    kpi: 'indicadores', nps: 'NPS', monthly: 'série mensal', customViz: 'visualizações', messages: 'mensagens', notes: 'notas' };
  Object.keys(CFG).forEach(k => { if (CFG[k] && J(a[k]) !== J(b[k])) add('Configurações', 'alterou ' + CFG[k], '', '', 'cfg:' + k); });

  if (out.length > 40) { const n = out.length - 39; out.splice(39); add('Sistema', 'fez várias alterações de uma vez', '', 'e mais ' + n + ' alterações nesta gravação', 'varias'); }
  return out;
}

/* Histórico da cópia local: fica neste navegador (na versão online vai para a planilha) */
const LOG_KEY=LS_KEY+':historico';
function lerLogLocal(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); }catch(e){ return []; } }
function gravarLogLocal(itens,quem){
  if(!itens||!itens.length) return;
  const l=lerLogLocal(), agora=new Date().toISOString(), ult=l[0];
  if(itens.length===1&&ult&&ult.chave===itens[0].chave&&ult.quem===quem.nome&&(Date.now()-Date.parse(ult.quando))<120000)
    Object.assign(ult,itens[0],{quando:agora});
  else l.unshift(...itens.slice().reverse().map(x=>({...x,quando:agora,quem:quem.nome,email:quem.email,cargo:quem.cargo})));
  try{ localStorage.setItem(LOG_KEY,JSON.stringify(l.slice(0,5000))); }catch(e){}
}

        setCursor(0);
      }
    }catch(e){ setErro(e.message||String(e)); }

  };
  useEffect(()=>{ carregar(false); },[per,quem,area,buscaAp]);
  const membro=(x)=>(db.team||[]).find(m=>(x.email&&String(m.email||'').toLowerCase()===String(x.email).toLowerCase())||m.name===x.quem);
  const pessoas=(db.team||[]).filter(m=>NUVEM_ON? m.email : true);
  const diaDe=(iso)=>{ const d=new Date(iso); const h=new Date(); h.setHours(0,0,0,0);
    const dd=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-h)/864e5);
    if(dd===0) return 'Hoje'; if(dd===-1) return 'Ontem';
    return ['domingo','segunda','terça','quarta','quinta','sexta','sábado'][d.getDay()]+', '+('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear(); };
  const hora=(iso)=>{ const d=new Date(iso); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };

        </div>

          <select className="sel inp-sm" style={{width:150}} value={area} onChange={e=>setArea(e.target.value)}>
            <option value="">Todas as áreas</option>{AREAS_LOG.map(a=><option key={a}>{a}</option>)}</select>
          <form onSubmit={e=>{e.preventDefault();setBuscaAp(busca.trim());}} className="row" style={{gap:6}}>
            <input className="inp inp-sm" style={{width:180}} placeholder="Buscar cliente, tarefa…" value={busca} onChange={e=>setBusca(e.target.value)}/>
          </form>
          <button className="btn btn-ghost btn-sm" onClick={()=>carregar(false)} disabled={carregando}>{carregando?'Carregando…':'Atualizar'}</button>
        </div>
      </div>
      <div className="muted" style={{fontSize:'.72rem',marginTop:10}}>
        {NUVEM_ON? 'Cada ação é gravada pelo servidor com o e-mail do login de quem fez — não dá para editar nem apagar pela tela. A cópia completa fica na aba “Histórico” da planilha.'
          : 'Nesta cópia local, o histórico fica só neste navegador e usa o nome escolhido em “Quem é você?”. Na versão online, cada ação é gravada na planilha com o e-mail do login.'}
      </div>
    </div>

    {erro&&<div className="nv-erro" style={{marginBottom:14}}>{erro}</div>}
    <div className="card card-pad">
      {!linhas.length&&!carregando&&<div className="empty"><div className="ic">🕘</div>Nenhuma ação neste filtro.</div>}
      <div className="log">
        {linhas.map((x,i)=>{ const dia=diaDe(x.quando), novoDia=dia!==diaAnt; diaAnt=dia; const m=membro(x);
          return (<React.Fragment key={(x.row||'')+'-'+i}>
            {novoDia&&<div className="log-dia">{dia}</div>}
            <div className="log-l">
              <span className="log-h mono">{hora(x.quando)}</span>
              {m? <Avatar db={db} id={m.id} size="sm"/> : <span className="av sm" style={{background:'#c9d2d0'}}>{String(x.quem||x.email||'?')[0].toUpperCase()}</span>}
              <div className="log-t">
                <div><b>{x.quem||x.email||'—'}</b> {x.acao}{x.item?<> <b>{x.item}</b></>:null}</div>
                {x.detalhe&&<div className="log-d">{x.detalhe}</div>}
              </div>
              <span className="log-area" style={{color:COR_AREA[x.area]||'#4a5a5c',background:(COR_AREA[x.area]||'#4a5a5c')+'14'}}>{x.area}</span>
            </div>

      </div>
      {NUVEM_ON&&cursor>0&&<div style={{textAlign:'center',marginTop:12}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>carregar(true)} disabled={carregando}>{carregando?'Carregando…':'Carregar mais antigas'}</button></div>}
    </div>
  </div>);
}

function App({nuvem}={}){

  const setEu=(id)=>{ if(nuvem) return; EU_ATUAL=id||''; try{localStorage.setItem(EU_KEY,EU_ATUAL);}catch(e){} setEuState(EU_ATUAL); };
  /* Na nuvem, quem é você vem do login Google, não de uma escolha na tela */
  const euNuvem=useMemo(()=> nuvem? membroDoLogin(db) : '',[db.team]);
  const eu=nuvem? euNuvem : euLocal;
  if(nuvem) EU_ATUAL=eu;
  const auth=useMemo(()=> nuvem? perfilNuvem(db,eu) : perfilDe(db,eu),[db.team,eu,SESSAO&&SESSAO.cargo]);
  const primeiraAba=useMemo(()=>(ABAS.find(a=>podeVer(auth,a.k))||{k:'dashboard'}).k,[auth]);
  // Restaura a última aba/projeto que a pessoa estava vendo (se ainda tiver permissão);
  // senão, cai na primeira aba permitida. Assim um F5 não joga de volta na inicial.
  const rotaInicial=useMemo(()=>{
    try{ const r=JSON.parse(sessionStorage.getItem('focus_route')||'null');
      if(r&&r.page&&podeVer(auth,r.page)) return r;
    }catch(e){}
    return {page:primeiraAba,projectId:null};
  },[auth,primeiraAba]);
  const [route,setRoute]=useState(rotaInicial);
  useEffect(()=>{ try{ sessionStorage.setItem('focus_route',JSON.stringify(route)); }catch(e){} },[route]);
  const [filter,setFilter]=useState({coordinator:'Todos',manager:'Todos',phase:'Todas',tier:'Todos',tipo:'Todos',status:'Todos',sig:'Todos',arquivo:'Ativos'});
  const [filterOpen,setFilterOpen]=useState(false);
  const [sbOpen,setSbOpen]=useState(false);
  // sidebar recolhida: a preferência fica guardada para a próxima visita
  const [sbMin,setSbMin]=useState(()=>{ try{return localStorage.getItem(LS_KEY+':sbmin')==='1';}catch(e){return false;} });
  useEffect(()=>{ try{localStorage.setItem(LS_KEY+':sbmin',sbMin?'1':'0');}catch(e){} },[sbMin]);
  const [toast,setToast]=useState(null);
  const [sync,setSync]=useState({estado:nuvem?'nuvem':'local', msg:''});
  const dbRef=useRef(db); dbRef.current=db;

  /* ---------- WRITE: cópia local no navegador; na nuvem, na planilha ---------- */
  useEffect(()=>{ if(!nuvem) saveState(db); },[db]);

  /* ---------- NUVEM: envia, junta quando há conflito e acompanha a versão ---------- */
  const nv=useRef(null);
  if(nuvem&&!nv.current){ const j=JSON.stringify(db); nv.current={rev:nuvem.rev,baseObj:JSON.parse(j),baseJson:j,salvando:false,substituir:false,timer:null,falhas:0}; }
  const pendente=()=> !!nv.current && JSON.stringify(dbRef.current)!==nv.current.baseJson;
  const agendarEnvio=(ms)=>{ const s=nv.current; if(!s) return; clearTimeout(s.timer); s.timer=setTimeout(enviar,ms==null?1000:ms); };
  const enviar=async()=>{
    const s=nv.current; if(!s) return;
    if(s.salvando){ agendarEnvio(800); return; }
    const j=JSON.stringify(dbRef.current);
    if(j===s.baseJson){ setSync(x=>x.estado==='nuvem'?x:{estado:'nuvem',msg:''}); return; }
    if(!SESSAO){ setSync({estado:'sessao',msg:''}); return; }
    s.salvando=true; setSync({estado:'salvando',msg:''});
    try{
      const r=await nuvemApi('salvar',{base:j,baseRev:s.rev,substituir:s.substituir});
      if(r.ok){ s.rev=r.rev; s.baseJson=j; s.baseObj=JSON.parse(j); s.substituir=false; s.falhas=0;
        setSync({estado:'nuvem',msg:''});
        if(r.ajustado){   /* só o administrador muda e-mails e cargos: o servidor desfez e a tela volta ao que vale */
          try{ const c=await nuvemApi('carregar'); if(c.ok&&c.base){ const remoto=normalizeDb(JSON.parse(c.base));
            s.rev=c.rev; s.baseObj=remoto; s.baseJson=JSON.stringify(remoto); setDb(JSON.parse(s.baseJson)); } }catch(e){}
          flash('Só um administrador altera e-mails e cargos da equipe'); } }
      else if(r.conflito){
        const remoto=normalizeDb(JSON.parse(r.base));
        const junto=JSON.parse(JSON.stringify(merge3(s.baseObj,dbRef.current,remoto)));
        s.rev=r.rev; s.baseObj=remoto; s.baseJson=JSON.stringify(remoto);
        setDb(junto);
        setSync({estado:'pendente',msg:'juntando com as alterações de '+(r.por||'outra pessoa')});
      }
      else if(r.erro==='sessao'){ guardarSessao(null); setSync({estado:'sessao',msg:''}); }
      else if(r.erro==='ocupado'){ setSync({estado:'pendente',msg:''}); agendarEnvio(1500); }
      else { setSync({estado:'erro',msg:r.erro||'não consegui gravar'}); }
    }catch(e){
      s.falhas++; setSync({estado:'offline',msg:''});
      agendarEnvio(Math.min(30000,1000*Math.pow(2,s.falhas)));
    }finally{ s.salvando=false; }
  };
  useEffect(()=>{ if(nuvem) agendarEnvio(); },[db]);
  useEffect(()=>{
    if(!nuvem) return;
    const olhar=async()=>{
      const s=nv.current; if(!s||s.salvando||pendente()||!SESSAO) return;
      try{
        const r=await nuvemApi('rev');
        if(r.ok&&r.cargo&&SESSAO&&r.cargo!==SESSAO.cargo){ guardarSessao(Object.assign({},SESSAO,{cargo:r.cargo})); setSync(x=>({...x})); }
        if(r.ok&&r.rev>s.rev){
          const c=await nuvemApi('carregar');
          if(c.ok&&c.base&&c.rev>s.rev&&!s.salvando&&!pendente()){
            const remoto=normalizeDb(JSON.parse(c.base));
            s.rev=c.rev; s.baseObj=remoto; s.baseJson=JSON.stringify(remoto);
            setDb(JSON.parse(s.baseJson)); setSync({estado:'nuvem',msg:''});
          }
        } else if(!r.ok&&r.erro==='sessao'){ guardarSessao(null); setSync({estado:'sessao',msg:''}); }
      }catch(e){}
    };
    const t=setInterval(()=>{ if(!document.hidden) olhar(); },20000);
    const vis=()=>{ if(!document.hidden) olhar(); };
    const sair=(e)=>{ if(pendente()){ e.preventDefault(); e.returnValue=''; } };
    document.addEventListener('visibilitychange',vis);
    window.addEventListener('beforeunload',sair);
    return ()=>{ clearInterval(t); document.removeEventListener('visibilitychange',vis); window.removeEventListener('beforeunload',sair); };
  },[]);
  const reentrar=async(cred)=>{
    try{ const r=await nuvemApi('entrar',{credential:cred});
      if(r.ok){ guardarSessao(r.sessao); setSync({estado:'pendente',msg:''}); agendarEnvio(0); }
      else setSync({estado:'sessao',msg:r.negado?'Esta conta não tem acesso.':(r.erro||'')});
    }catch(e){ setSync({estado:'sessao',msg:'Sem conexão com a base.'}); }
  };

  // toda alteração local incrementa a revisão (controle de versão do registro)
  const update=(fn,opts)=>setDb(prev=>{
    const base=deepClone(prev);
    const novo=(typeof fn==='function')? (fn(base)||base) : fn;
    if(!(opts&&opts.semCarimbo)) carimbarTarefas(prev,novo);
    else if(nv.current) nv.current.substituir=true;   // importar/reiniciar: a planilha é substituída (só administrador)
    novo.meta=novo.meta||{}; novo.meta.rev=((prev.meta&&prev.meta.rev)||0)+1;
    if(!nuvem){ try{
      const itens=(opts&&opts.semCarimbo)? [{area:'Sistema',acao:'substituiu a base inteira',item:'',detalhe:'importação, simulação ou reinício',chave:'subst'}]
        : descreverMudancas(prev,novo);
      const m=(prev.team||[]).find(x=>x.id===EU_ATUAL);
      gravarLogLocal(itens,{nome:m?m.name:'Sem identificação',email:m?(m.email||''):'',cargo:PERM_LABEL[(m&&m.perm)||'editor']||''});
    }catch(e){} }
    return novo;
  });
  const flash=(m)=>{setToast(m);setTimeout(()=>setToast(null),2400);};
  const go=(page,projectId=null)=>{setRoute({page,projectId});setSbOpen(false);try{window.scrollTo(0,0);}catch(e){}};
  const filterActive=Object.entries(filter).some(([k,v])=> k==='arquivo' ? v!=='Ativos' : (v!=='Todos'&&v!=='Todas'));
  const filtered=useMemo(()=> db.projects.filter(p=>{
    if(filter.arquivo==='Ativos'&&p.archived)return false;
    if(filter.arquivo==='Arquivados'&&!p.archived)return false;
    if(filter.coordinator!=='Todos'&&member(db,p.coordinator).name!==filter.coordinator)return false;
    if(filter.manager!=='Todos'&&p.manager!==filter.manager)return false;
    if(filter.phase!=='Todas'&&p.phase!==filter.phase)return false;
    if(filter.tier!=='Todos'&&p.tier!==filter.tier)return false;
    if(filter.tipo!=='Todos'&&p.tipo!==filter.tipo)return false;
    if(filter.status!=='Todos'&&p.status!==filter.status)return false;
    if(filter.sig!=='Todos'&&sinaleira(p).k!==filter.sig)return false;
    return true;
  }),[db.projects,filter]);
  /* Trocou de pessoa e a aba atual não é dela: volta para a primeira que ela pode ver. */
  useEffect(()=>{ if(!podeVer(auth,route.page)) setRoute({page:primeiraAba,projectId:null}); },[auth]);
  const ctx={db,update,go,route,flash,filter,setFilter,filtered,sync,auth,eu,setEu};
  return (<AUTH.Provider value={auth}><DB.Provider value={ctx}>
    <div className={"app "+(sbMin?'sb-min':'')}>
      <Sidebar open={sbOpen} min={sbMin} setMin={setSbMin}/>
      <div className="main">
        <Topbar setSbOpen={setSbOpen} filterOpen={filterOpen} setFilterOpen={setFilterOpen} filterActive={filterActive}/>
        <AvisoSimulacao/>
        {filterOpen && <GlobalFilter db={db} filter={filter} setFilter={setFilter} close={()=>setFilterOpen(false)}/>}
        {sync.estado==='erro' && <div style={{background:'#fdecea',color:'#a93226',padding:'10px 26px',fontSize:'.8rem',fontWeight:600,borderBottom:'1px solid #f5c6c0'}}>⚠️ Sincronização: {sync.msg}</div>}
        {sync.estado==='sessao' && <div className="nv-faixa">
          <span><b>Sua sessão expirou.</b> Entre de novo para gravar as alterações — nada do que você fez foi perdido.{sync.msg?' '+sync.msg:''}</span>
          <BotaoGoogle onCredencial={reentrar} largura={220}/></div>}
        <div className="page"><PageRouter/></div>
      </div>
    </div>
    {toast && <div className="toast">{toast}</div>}
  </DB.Provider></AUTH.Provider>);
}
function PageRouter(){
  const {route,auth}=useDB();
  if(!podeVer(auth,route.page)) return <div className="empty"><div className="ic">🔒</div>Você não tem permissão para ver esta aba.<div className="muted" style={{fontSize:'.8rem',marginTop:6}}>{NUVEM_ON? 'Seu cargo não dá acesso a esta aba. Se precisar, peça a um administrador.' : 'Escolha seu nome em “Quem é você?”, na barra de cima. Se for o caso, peça a um administrador para ajustar seu cargo em Equipe.'}</div></div>;
  switch(route.page){
    case 'dashboard':return <Dashboard/>;
    case 'tasks':return <TasksPage/>;
    case 'sprint':return <SprintPage/>;
    case 'projects':return route.projectId?<ProjectDetail/>:<ProjectsList/>;
    case 'calendar':return <CalendarPage/>;
    case 'team':return <TeamPage/>;
    case 'internal':return <InternalPage/>;
    case 'tools':return <ToolsPage/>;
    case 'analise':return <AnalisePage/>;
    case 'contratos':return <ContratosPage/>;
    case 'funcionamento':return <FuncionamentoPage/>;
    case 'historico':return <HistoricoPage/>;
    case 'settings':return <SettingsPage/>;
    default:return <Dashboard/>;
  }
}

/* ------------------------------------------------------------
   SALVAR O HTML
   O sistema é um arquivo só: os dados moram no navegador, mas o que
   viaja (para outro computador, para o backup, para outra pessoa) é
   um HTML com a base já gravada dentro. É isto que este botão gera.
   ------------------------------------------------------------ */
const REV_HTML=LS_KEY+':htmlrev';     // revisão da base no último arquivo gerado
const QUANDO_HTML=LS_KEY+':htmlquando';
function baixarArquivo(nome,conteudo,mime){
  const b=new Blob([conteudo],{type:mime||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=nome; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function salvarHTMLAtualizado(db){
  const doc=document.documentElement.cloneNode(true);
  const root=doc.querySelector('#root'); if(root) root.innerHTML='';   // a tela renderizada não vai junto
  let seed=doc.querySelector('#seeddata');
  if(!seed){ seed=document.createElement('script'); seed.type='application/json'; seed.id='seeddata';
    const app=doc.querySelector('#appsrc'); app.parentNode.insertBefore(seed,app); }
  /* escapar "<" evita que uma tag de fechamento dentro de algum texto quebre o arquivo */
  seed.textContent=JSON.stringify(db).replace(/</g,'\\u003c');
  const z=(n)=>('0'+n).slice(-2), d=new Date();
  const nome='Focus_Franquias_'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'_'+z(d.getHours())+'h'+z(d.getMinutes())+'.html';
  baixarArquivo(nome,'<!DOCTYPE html>\n'+doc.outerHTML,'text/html;charset=utf-8');
  try{
    localStorage.setItem(REV_HTML,String((db.meta&&db.meta.rev)||0));
    localStorage.setItem(QUANDO_HTML,new Date().toISOString());
  }catch(e){}
  return nome;
}
/* Botão da barra de cima: salva e conta quantas alterações entraram
   desde o último arquivo gerado. */
function BotaoSalvarHTML(){
  const {db,flash}=useDB();
  const rev=(db.meta&&db.meta.rev)||0;
  const [marco,setMarco]=useState(()=>{
    try{ const v=localStorage.getItem(REV_HTML); if(v!==null) return +v; }catch(e){}
    return rev;        // arquivo recém-aberto já está em dia consigo mesmo
  });
  const [quando,setQuando]=useState(()=>{ try{return localStorage.getItem(QUANDO_HTML)||'';}catch(e){return '';} });
  useEffect(()=>{ try{ if(localStorage.getItem(REV_HTML)===null) localStorage.setItem(REV_HTML,String(rev)); }catch(e){} },[]);
  useEffect(()=>{ if(rev<marco) setMarco(rev); },[rev]);   // base trocada/importada
  const pendentes=Math.max(0,rev-marco);
  const salvar=()=>{
    try{ const nome=salvarHTMLAtualizado(db); setMarco(rev); setQuando(new Date().toISOString());
      flash('Arquivo salvo: '+nome); }
    catch(e){ flash('Não consegui gerar o arquivo: '+(e.message||e)); }
  };
  /* Ctrl/Cmd + S salva o arquivo, como em qualquer editor */
  useEffect(()=>{
    const h=(e)=>{ if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='s'){ e.preventDefault(); salvar(); } };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[db,rev,marco]);
  const titulo=(pendentes? pendentes+' alteração(ões) desde o último arquivo. ' : '')
    +'Baixa este sistema como um HTML com todos os dados dentro'
    +(quando? ' · último em '+fmtBR(quando.slice(0,10))+' às '+quando.slice(11,16) : '')
    +' (Ctrl+S)';
  return (<button className={"btn-salvar"+(pendentes?' pend':'')} onClick={salvar} title={titulo}>
    {I.download}<span>Salvar HTML</span>
    {pendentes>0&&<span className="btn-salvar-n">{pendentes>99?'99+':pendentes}</span>}
  </button>);
}

/* ============================================================
   CAMPOS "LIVE" — corrigem o cursor que pulava fora da caixa de texto
   O problema: cada tecla disparava um setDb() global (deepClone + re-render
   de toda a árvore) e, logo depois, o eco do Realtime substituía o estado.
   Solução: o campo guarda o texto localmente e só grava no db ao sair
   (onBlur) ou depois de 600ms parado.
   ============================================================ */
function LiveInput({value,onCommit,className,style,placeholder,type,disabled}){
  const [v,setV]=useState(value||'');
  const foco=useRef(false); const timer=useRef(null);
  useEffect(()=>{ if(!foco.current) setV(value||''); },[value]);
  const agenda=(nv)=>{ setV(nv); clearTimeout(timer.current); timer.current=setTimeout(()=>{ if(nv!==(value||'')) onCommit(nv); },600); };
  const fechar=()=>{ foco.current=false; clearTimeout(timer.current); if(v!==(value||'')) onCommit(v); };
  return <input type={type||'text'} className={className||'inp'} style={style} placeholder={placeholder} disabled={disabled}
    value={v} onFocus={()=>{foco.current=true;}} onChange={e=>agenda(e.target.value)} onBlur={fechar}
    onKeyDown={e=>{ if(e.key==='Enter'&&type!=='textarea') e.target.blur(); }}/>;
}
function LiveArea({value,onCommit,className,style,placeholder,rows}){
  const [v,setV]=useState(value||'');
  const foco=useRef(false); const timer=useRef(null);
  useEffect(()=>{ if(!foco.current) setV(value||''); },[value]);
  const agenda=(nv)=>{ setV(nv); clearTimeout(timer.current); timer.current=setTimeout(()=>{ if(nv!==(value||'')) onCommit(nv); },800); };
  return <textarea className={className||'ta'} style={style} rows={rows} placeholder={placeholder} value={v}
    onFocus={()=>{foco.current=true;}} onChange={e=>agenda(e.target.value)}
    onBlur={()=>{ foco.current=false; clearTimeout(timer.current); if(v!==(value||'')) onCommit(v); }}/>;
}

   · Administrador: todo o sistema.

     Calendário, Ferramentas, Funcionamento Geral e Configurações (sem as

const ABAS_EDITOR=['dashboard','sprint','tasks','projects','calendar','tools','funcionamento','settings'];

  viewer:'Mesmas abas do Editor',

function perfilDe(db,eu){
  const team=(db&&db.team)||[];
  const todas=ABAS.map(a=>a.k);
  if(!team.length) return {...PERFIL_LOCAL,abas:todas};            // base vazia: ninguém fica trancado do lado de fora
  const m=team.find(x=>x.id===eu);
  const temAdmin=team.some(x=>x.perm==='admin');
  if(m&&(m.perm==='admin'||!temAdmin))                                // sem nenhum admin cadastrado, quem estiver usando administra
    return {email:m.email||'',nome:m.name,id:m.id,papel:'admin',abas:todas,ativo:true};
  return {email:m?m.email||'':'',nome:m?m.name:'',id:m?m.id:'',papel:(m&&m.perm)||'editor',
    abas:ABAS_EDITOR.slice(),ativo:true,semIdent:!m};
}

/* Tarefas de verdade (não cópias), de clientes arquivados inclusive. */
function tarefasReais(d){
  const o=[];
  (d.projects||[]).forEach(p=>(p.activities||[]).forEach(a=>o.push(a)));
  (d.tasks||[]).forEach(t=>o.push(t));
  return o;
}
/* Compara o antes e o depois de cada alteração:
   tarefa nova ganha quem criou; tarefa que virou "Finalizado" ganha quem
   concluiu e quando; tarefa reaberta perde esse registro. */
function carimbarTarefas(prev,novo){
  try{
    const antes={}; let nPrev=0;
    tarefasReais(prev||{}).forEach(t=>{ antes[t.id]=t.column||'backlog'; nPrev++; });
    const agora=tarefasReais(novo||{});
    // base inteira trocada (importação de JSON, simulação): não é criação de ninguém
    if(nPrev&&agora.length&&!agora.some(t=>antes[t.id]!==undefined)) return;
    const hoje=hojeISO();
    agora.forEach(t=>{
      const era=antes[t.id];
      if(era===undefined){
        if(!t.criadoPor) t.criadoPor=EU_ATUAL||'';
        if(!t.criadaEm) t.criadaEm=hoje;
        return;
      }
      if(t.column==='concluido'&&era!=='concluido'){ t.concluidoPor=EU_ATUAL||''; t.concluidoEm=hoje; }
      else if(t.column!=='concluido'&&era==='concluido'){ t.concluidoPor=''; t.concluidoEm=''; }
    });
  }catch(e){ console.warn('carimbo:',e); }
}

          </div>

            placeholder="Por quê? (opcional)"

          <div className="muted" style={{fontSize:'.68rem',marginTop:6}}>

              : 'sem avaliação'}
          </div>
        </div>);})}
    </div>
  </div>);
}

/* ------------------------------------------------------------
   SALVAR UMA TAREFA EDITADA
   Mesmo formulário para criar e editar. Se o cliente mudou, a tarefa
   é movida de verdade antes de receber os novos campos.
   ------------------------------------------------------------ */
function useSalvarTarefa(depois){
  const {db,update,flash}=useDB();
  return (t)=>{
    const limpo={...t}; delete limpo.proj; delete limpo.origem;
    const existe=allTasks(db).find(x=>x.id===limpo.id) || tarefasReais(db).find(x=>x.id===limpo.id);
    if(!existe){ update(d=>{addTaskTo(d,limpo);return d;}); flash('Tarefa criada'); }
    else{
      update(d=>{
        if((existe.projectId||null)!==(limpo.projectId||null)) moverParaCliente(d,limpo.id,limpo.projectId||null);
        mutateTask(d,limpo.id,a=>{ Object.keys(limpo).forEach(k=>{ if(k!=='id') a[k]=limpo[k]; }); });
        return d;
      });
      flash('Tarefa atualizada');
    }
    if(depois) depois();
  };
}
/* Tira os campos de tela antes de abrir a tarefa no formulário. */
const paraEdicao=(t)=>{ const {proj,origem,...x}=t; return {...x,projectId:t.projectId||'',peId:t.peId||'',faseId:t.faseId||''}; };

/* ------------------------------------------------------------
   ADICIONAR NO GRUPO
   Botão logo abaixo das tarefas de cada grupo. A tarefa nasce com o
   que o grupo e os filtros já dizem: cliente, quem faz, situação,
   prioridade e, quando for o caso, a janela do sprint.
   ------------------------------------------------------------ */
function AddRapido({padrao,rotulo,compacto}){
  const {db,update,flash}=useDB();
  const pd=padrao||{};
  const chave=JSON.stringify(pd);
  const [aberto,setAberto]=useState(false);
  const mk=()=>({name:'',projectId:pd.projectId||'',prio:pd.prio||'Média',estHoras:'',
    date:pd.date||'',assignees:(pd.assignees||[]).slice()});
  const [f,setF]=useState(mk);
  useEffect(()=>{ setF(mk()); },[chave]);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const criar=()=>{
    const nome=(f.name||'').trim();
    if(!nome){ flash('Dê um nome à tarefa'); return; }
    const bs=pd.buildStart||'', be=pd.buildEnd||bs;
    const nova={id:uid(),name:nome,type:tipoPeloNome(nome),prio:f.prio,
      assignees:f.assignees||[],assignee:(f.assignees||[])[0]||'',
      projectId:f.projectId||null,deliverableId:'',notes:'',obs:'',
      date:f.date||be||'',buildStart:bs,buildEnd:be,hora:'',durMin:0,sessoes:{},
      estHoras:+f.estHoras||0,column:pd.column||'backlog',sprintId:null,
      peId:null,faseId:null,iniciativaId:null,...(pd.extra||{})};
    update(d=>{ addTaskTo(d,nova); return d; });
    setF(mk());
    const cli=nova.projectId? (db.projects.find(x=>x.id===nova.projectId)||{}).name : '';
    flash('“'+nome+'” criada'+(cli?' em '+cli:''));
  };
  if(!aberto) return (<button className="add-sprint-b" onClick={()=>setAberto(true)}>
    {I.plus} {rotulo||'nova tarefa aqui'}</button>);
  const dica=[];
  if(pd.column&&pd.column!=='backlog') dica.push('situação: '+COL_LABEL[pd.column]);
  if(pd.buildStart) dica.push('construção '+fmtBR(pd.buildStart).slice(0,5)+' a '+fmtBR(pd.buildEnd||pd.buildStart).slice(0,5));
  if(pd.extra&&pd.extra.peId) dica.push('entra na fase deste grupo');
  return (<div className="add-sprint" onClick={e=>e.stopPropagation()}>
    <input className="inp" style={{marginBottom:7,fontSize:'.82rem',padding:'7px 10px'}} value={f.name} autoFocus
      onChange={e=>set('name',e.target.value)}
      onKeyDown={e=>{ if(e.key==='Enter') criar(); if(e.key==='Escape') setAberto(false); }}
      placeholder="O que precisa ser feito?"/>
    <div className={compacto?'add-r-c':'add-r'}>
      <select className="mini-sel" value={f.projectId} onChange={e=>set('projectId',e.target.value)}
        disabled={!!(pd.extra&&pd.extra.peId)}>
        <option value="">Sem cliente</option>
        {ativos(db).map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select>
      <select className="mini-sel" value={f.prio} onChange={e=>set('prio',e.target.value)}>
        {PRIOS.map(x=><option key={x} value={x}>{PRIO_SIGLA[x]} · {x}</option>)}</select>
      <input type="date" className="mini-sel" value={f.date} onChange={e=>set('date',e.target.value)} title="Prazo de entrega"/>
      <input type="number" min="0" step="0.5" className="mini-sel" style={{textAlign:'right'}}
        value={f.estHoras} onChange={e=>set('estHoras',e.target.value)} placeholder="horas" title="Horas estimadas"/>
    </div>
    <div style={{marginTop:7}}>
      <SelResps db={db} valor={f.assignees||[]} compacto={compacto} onChange={(l)=>set('assignees',l)}/>
    </div>
    <div className="row" style={{gap:7,marginTop:8}}>
      <button className="btn btn-primary btn-sm" style={{flex:1,justifyContent:'center'}} onClick={criar}>{I.plus} Adicionar</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>{ setF(mk()); setAberto(false); }}>fechar</button>
    </div>
    {dica.length>0&&<div className="muted" style={{fontSize:'.68rem',marginTop:6}}>Já entra com {dica.join(' · ')}.</div>}
  </div>);
}

/* ============================================================
   CAIXA DE ALERTAS
   Recados curtos da equipe. Vão para todos ou para uma pessoa; quem
   lê marca "ciente". O Editor vê os recados para todos, para ele e os
   que ele mesmo deixou; o Administrador vê todos e quem já leu.
   ============================================================ */
function recadosVisiveis(db,eu,auth){
  const adm=isAdmin(auth);
  return (db.recados||[]).filter(r=>adm||!r.para||r.para===eu||r.por===eu)
    .slice().sort((a,b)=>a.em<b.em?1:-1);
}
const recadoLido=(r,eu)=>!!eu&&(r.cientes||[]).indexOf(eu)>=0;
function recadosNovos(db,eu,auth){ return recadosVisiveis(db,eu,auth).filter(r=>!recadoLido(r,eu)).length; }
function CaixaRecados(){
  const {db,update,flash,auth,eu}=useDB();
  const souAdmin=isAdmin(auth);
  const euValido=!!eu&&(db.team||[]).some(m=>m.id===eu);
  const [txt,setTxt]=useState('');
  const [para,setPara]=useState('');
  const [imp,setImp]=useState(false);
  const [verLidos,setVerLidos]=useState(false);
  useEffect(()=>{ setPara(''); setTxt(''); },[eu]);
  const meus=recadosVisiveis(db,eu,auth);
  const novos=meus.filter(r=>!recadoLido(r,eu)), lidos=meus.filter(r=>recadoLido(r,eu));
  const enviar=()=>{
    const t=txt.trim(); if(!t) return;
    if(!euValido){ flash('Escolha seu nome em “Quem é você?” antes de deixar um recado'); return; }
    update(d=>{ d.recados=[{id:uid(),texto:t,por:eu,para:para||'',em:new Date().toISOString(),
      importante:imp,cientes:[eu]},...(d.recados||[])]; return d; });
    setTxt(''); setImp(false);
    flash('Recado deixado '+(para?'para '+member(db,para).name:'para toda a equipe'));
  };
  const ciente=(r)=>update(d=>{ const x=(d.recados||[]).find(y=>y.id===r.id);
    if(x){ x.cientes=x.cientes||[]; if(x.cientes.indexOf(eu)<0) x.cientes.push(eu); } return d; });
  const excluir=(r)=>{ if(!confirm('Apagar este recado?')) return;
    update(d=>{ d.recados=(d.recados||[]).filter(y=>y.id!==r.id); return d; }); };
  const quando=(iso)=>{ const d=new Date(iso), dia=isoDate(d);
    return (dia===hojeISO()?'hoje':fmtBR(dia).slice(0,5))+' às '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
  const Linha=({r,velho})=>{
    const leram=(r.cientes||[]).filter(id=>id!==r.por).map(id=>nomeOuVazio(db,id)).filter(Boolean);
    return (<div className={"rec"+(r.importante?' imp':'')+(velho?' lido':'')}>
      <Avatar db={db} id={r.por} size="sm"/>
      <div style={{flex:1,minWidth:0}}>
        <div className="rec-h"><b>{nomeOuVazio(db,r.por)||'—'}</b>
          <span>→ {r.para? member(db,r.para).name : 'toda a equipe'}</span><span>· {quando(r.em)}</span>
          {r.importante&&<span className="rec-tag">importante</span>}</div>
        <div className="rec-t">{r.texto}</div>
        {(souAdmin||r.por===eu)&&<div className="rec-c">{leram.length? 'ciente: '+leram.join(', ') : 'ninguém marcou ciente ainda'}</div>}
      </div>
      {!velho&&euValido&&<button className="btn btn-ghost btn-sm" onClick={()=>ciente(r)}>{I.check} ciente</button>}
      {(souAdmin||r.por===eu)&&<button className="icon-btn" style={{width:22,height:22,color:'var(--text-3)'}}
        onClick={()=>excluir(r)} title="Apagar recado">{I.x}</button>}
    </div>);
  };
  return (<div className="card card-pad" style={{marginBottom:18}}>
    <div className="card-h"><h3>Caixa de alertas</h3>
      <span className="sub">recados da equipe{novos.length?' · '+novos.length+' novo'+(novos.length>1?'s':''):''}</span></div>
    <div className="rec-form">
      <input className="inp" value={txt} onChange={e=>setTxt(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter') enviar(); }}
        placeholder={euValido?'Deixe um recado ou alerta…':'Escolha seu nome em “Quem é você?” para deixar recados'}/>
      <select className="sel" style={{width:180}} value={para} onChange={e=>setPara(e.target.value)}>
        <option value="">Para toda a equipe</option>
        {db.team.filter(m=>m.id!==eu).map(m=><option key={m.id} value={m.id}>Para {m.name}</option>)}</select>
      <label className="rec-imp"><input type="checkbox" checked={imp} onChange={e=>setImp(e.target.checked)}/> importante</label>
      <button className="btn btn-primary btn-sm" onClick={enviar}>Enviar</button>
    </div>
    {novos.length? novos.map(r=><Linha key={r.id} r={r}/>)
      : <div className="muted" style={{fontSize:'.8rem',padding:'10px 0 2px'}}>Nenhum recado novo.</div>}
    {lidos.length>0&&<button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={()=>setVerLidos(v=>!v)}>
      {verLidos?'ocultar':'ver'} {lidos.length===1?'o recado já lido':'os '+lidos.length+' recados já lidos'}</button>}
    {verLidos&&lidos.map(r=><Linha key={r.id} r={r} velho/>)}
  </div>);
}
