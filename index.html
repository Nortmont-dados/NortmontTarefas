    setTimeout(()=>{ setRes({...saida}); setPasso('feito');
      flash(saida.tarefas+' tarefa(s) importadas'); },80);
  };
  /* Desfazer: tira exatamente o que esta importação acabou de criar. */
  const desfazer=()=>{
    if(!res||!res.ids) return;
    if(!confirm('Desfazer esta importação?\n\nSaem as '+res.tarefas+' tarefa(s) que acabaram de entrar'
      +(res.clientes?', '+res.clientes+' cliente(s)':'')+(res.pessoas?' e '+res.pessoas+' pessoa(s)':'')
      +' criados agora. O que você já tinha antes não é tocado.')) return;
    const saida={};
    update(d=>{ Object.assign(saida,limparImportados(d,res.ids)); return d; });
    setTimeout(()=>{ flash('Importação desfeita · '+saida.tarefas+' tarefa(s) removidas'); close(); },80);
  };

  const Linha=({l})=>{
    const on=abas.indexOf(l.aba)>=0;
    return (<label className={"imp-aba"+(on?' on':'')}>
      <input type="checkbox" checked={on}
        onChange={()=>setAbas(x=>on? x.filter(y=>y!==l.aba) : [...x,l.aba])}/>
      <div style={{flex:1,minWidth:0}}>
        <div className="imp-aba-n">{l.aba}</div>
        <div className="muted" style={{fontSize:'.7rem'}}>
          {l.ini? fmtBR(l.ini)+' → '+fmtBR(l.fim) : 'sem período no nome'}
          {!l.doNome&&l.ini&&' · período pelos prazos'}
        </div>
      </div>
      <div style={{textAlign:'right',flex:'none'}}>
        <div style={{fontSize:'.78rem',fontWeight:700}}>{l.itens.length}</div>
        <div className="muted" style={{fontSize:'.66rem'}}>{l.horas?fmtHoras(l.horas)+'h':'—'}</div>
      </div>
    </label>);
  };

  return (<div className="overlay" onClick={close}><div className="modal xl" onClick={e=>e.stopPropagation()}>
    <div className="modal-h">
      <h3>Importar sprint da planilha</h3>
      <button className="x" onClick={close}>{I.x}</button>
    </div>

    {/* ---------- 1. o arquivo ---------- */}
    {passo==='arquivo'&&<div className="modal-b">
      <div className="imp-drop"
        onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('on');}}
        onDragLeave={e=>e.currentTarget.classList.remove('on')}
        onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('on');
          ler((e.dataTransfer.files||[])[0]);}}
        onClick={()=>inputRef.current&&inputRef.current.click()}>
        <div className="imp-drop-i">{I.upload}</div>
        <div style={{fontWeight:700,fontSize:'.92rem'}}>{lendo? 'Lendo '+arquivo+'…' : 'Solte aqui a planilha de sprint'}</div>
        <div className="muted" style={{fontSize:'.78rem',marginTop:4}}>
          ou clique para escolher um arquivo .xlsx
        </div>
        <input ref={inputRef} type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          style={{display:'none'}} onChange={e=>ler(e.target.files[0])}/>
      </div>
      {erro&&<div className="imp-erro">{erro}</div>}
      <button className="imp-sobre" onClick={()=>setSobre(v=>!v)}>
        {sobre?'▾':'▸'} como a planilha precisa estar
      </button>
      {sobre&&<div className="muted" style={{fontSize:'.78rem',lineHeight:1.6,marginTop:6}}>
        Cada aba é um sprint e cada linha é uma tarefa. O sistema procura, nas primeiras
        linhas, um cabeçalho com <b>Cliente</b> e <b>Atividade</b> — e a partir dele lê também
        <b> Responsável</b>, <b>Prazo</b>, <b>Duração (horas)</b>, <b>Prioridade</b>, <b>Status</b> e <b>Observação</b>,
        nas colunas em que estiverem. Duas tabelas lado a lado na mesma aba funcionam.
        O período do sprint sai do nome da aba (“06.10-17.10”), e o ano, dos prazos das linhas.
        Nada é gravado antes da sua conferência.
      </div>}
    </div>}

    {/* ---------- 2. conferir ---------- */}
    {passo==='conferir'&&plano&&<div className="modal-b">
      <div className="imp-resumo">
        <div><b>{arquivo}</b> · {plano.lotes.length} aba(s) com tarefas</div>
        <button className="btn btn-ghost btn-sm" onClick={()=>{setPasso('arquivo');setPlano(null);}}>trocar arquivo</button>
      </div>

      <div className="imp-sec">
        <div className="imp-sec-h">
          <h4>Quais sprints entram</h4>
          <div className="row" style={{gap:6}}>
            <button className="imp-mini" onClick={()=>setAbas(plano.lotes.map(l=>l.aba))}>marcar todas</button>
            <button className="imp-mini" onClick={()=>setAbas([])}>limpar</button>
          </div>
        </div>
        <div className="imp-abas">{plano.lotes.slice().sort((a,b)=>(b.ini||'').localeCompare(a.ini||''))
          .map(l=><Linha key={l.aba} l={l}/>)}</div>
      </div>

      <div className="imp-sec">
        <div className="imp-sec-h"><h4>Clientes da planilha</h4>
          <span className="muted" style={{fontSize:'.72rem'}}>
            {novosClientes? novosClientes+' cliente(s) serão criados' : 'nenhum cliente novo'}</span></div>
        <div className="imp-grade">
          {Object.entries(plano.clientes).sort((a,b)=>b[1].n-a[1].n).map(([k,c])=>{
            const e=cliDe(k);
            const valor=e.acao==='existente'? ('p:'+e.id) : e.acao;
            return (<div key={k} className="imp-item">
              <div style={{flex:1,minWidth:0}}>
                <div className="imp-item-n">{c.nome}</div>
                <div className="muted" style={{fontSize:'.68rem'}}>{c.n} tarefa(s)</div>
              </div>
              <select className="mini-sel" style={{width:168}} value={valor}
                onChange={ev=>{const v=ev.target.value;
                  if(v.indexOf('p:')===0) setCli(k,{acao:'existente',id:v.slice(2)});
                  else setCli(k,{acao:v,id:null});}}>
                <option value="novo">criar este cliente</option>
                <option value="geral">tarefa geral (sem cliente)</option>
                <option value="ignorar">não importar</option>
                <optgroup label="usar um cliente da base">
                  {projs.map(p=><option key={p.id} value={'p:'+p.id}>{p.name}</option>)}
                </optgroup>
              </select>
            </div>);})}
        </div>
      </div>

      <div className="imp-sec">
        <div className="imp-sec-h"><h4>Quem faz</h4>
          <span className="muted" style={{fontSize:'.72rem'}}>
            {novasPessoas? novasPessoas+' pessoa(s) serão criadas' : 'ninguém novo na equipe'}</span></div>
        <div className="imp-grade">
          {Object.entries(plano.pessoas).sort((a,b)=>b[1].n-a[1].n).map(([k,p])=>{
            const e=pesDe(k);
            return (<div key={k} className="imp-item col">
              <div className="row" style={{gap:8,width:'100%'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div className="imp-item-n">{p.nome}</div>
                  <div className="muted" style={{fontSize:'.68rem'}}>
                    {p.n} tarefa(s)
                    {e.acao==='coletivo'&&' · vale como o time daquela aba'}
                    {e.acao==='novo'&&' · entra na equipe'}
                  </div>
                </div>
                {e.acao!=='coletivo'&&<button className="imp-mini"
                  onClick={()=>setPes(k,{acao:e.acao==='novo'?'existente':'novo',ids:[]})}>
                  {e.acao==='novo'?'escolher alguém da equipe':'criar “'+p.nome+'”'}
                </button>}
              </div>
              {e.acao!=='novo'&&<SelResps db={db} valor={e.ids||[]} compacto
                onChange={(l)=>setPes(k,{acao:l.length?'existente':(e.acao==='coletivo'?'coletivo':'existente'),ids:l})}/>}
            </div>);})}
        </div>
      </div>

      <div className="imp-sec">
        <div className="imp-sec-h"><h4>Como gravar</h4></div>
        <label className="imp-op"><input type="checkbox" checked={op.pularRepetidas}
          onChange={e=>setOp(x=>({...x,pularRepetidas:e.target.checked}))}/>
          <span><b>Não repetir o que já existe</b> — tarefa com o mesmo nome, cliente e prazo é pulada.</span></label>
        <label className="imp-op"><input type="checkbox" checked={op.incluirFeitas}
          onChange={e=>setOp(x=>({...x,incluirFeitas:e.target.checked}))}/>
          <span><b>Trazer também as finalizadas e canceladas</b> — vale para ter o histórico completo.</span></label>
        <label className="imp-op"><input type="checkbox" checked={op.prazoDoPeriodo}
          onChange={e=>setOp(x=>({...x,prazoDoPeriodo:e.target.checked}))}/>
          <span><b>Linha sem prazo recebe o fim do período da aba</b> — assim ela cai no sprint certo em vez de ficar solta no backlog.</span></label>
      </div>
    </div>}

    {/* ---------- 3. feito ---------- */}
    {passo==='feito'&&res&&<div className="modal-b">
      <div className="imp-ok">
        <div className="imp-ok-n">{res.tarefas}</div>
        <div>tarefa(s) importadas</div>
      </div>
      <div className="imp-contas">
        {[['sprints criados',res.sprints],['clientes criados',res.clientes],
          ['pessoas na equipe',res.pessoas],['já existiam',res.repetidas],
          ['deixadas de fora',res.puladas],['sem prazo',res.semPrazo]].map(([l,n])=>(
          <div key={l} className="imp-conta"><span className="n">{n}</span><span className="l">{l}</span></div>))}
      </div>
      <div className="muted" style={{fontSize:'.78rem',lineHeight:1.6,marginTop:12}}>
        As tarefas entraram com prazo, horas estimadas, situação e observação da planilha.
        O horário de cada dia continua sendo coisa sua: use a <b>Distribuição de tarefas</b> para
        encaixar na agenda de cada um.
      </div>
    </div>}

    <div className="modal-f">
      <span className="muted" style={{fontSize:'.76rem'}}>
        {passo==='conferir'&&<>
          até <b>{previsao.n}</b> tarefa(s) · {fmtHoras(previsao.horas)}h estimadas · {abas.length} aba(s)
          {op.pularRepetidas&&<> · o que já existir é pulado</>}
        </>}
      </span>
      <div className="row">
        {passo==='feito'&&res&&res.tarefas>0&&<button className="btn btn-ghost" style={{color:'#B33A3A'}}
          onClick={desfazer} title="Remove o que esta importação criou">desfazer esta importação</button>}
        <button className="btn btn-ghost" onClick={close}>{passo==='feito'?'Fechar':'Cancelar'}</button>
        {passo==='conferir'&&<button className="btn btn-primary" disabled={!previsao.n} onClick={importar}>
          Importar tarefas</button>}
        {passo==='feito'&&<button className="btn btn-primary" onClick={()=>{close(); go('tasks');}}>
          Ver as tarefas</button>}
      </div>
    </div>
  </div></div>);
}

/* ------------------------------------------------------------
   REGISTRO DO SPRINT FECHADO
   Ao abrir o sprint seguinte, o anterior guarda a lista do que havia
   nele. Como as tarefas em aberto mudam de janela, só esta foto conta
   a história: quantas eram, quem fazia, quantas horas, o que terminou
   e o que passou adiante.
   ------------------------------------------------------------ */
function RegistroSprint({sprint}){
  const {db,go}=useDB();
  const [aberto,setAberto]=useState(false);
  const reg=sprint&&sprint.registro;
  if(!reg||!(reg.itens||[]).length) return null;
  const itens=reg.itens;
  const feitas=itens.filter(x=>x.status==='concluido').length;
  const canceladas=itens.filter(x=>x.status==='cancelado').length;
  const repassadas=itens.filter(x=>x.repassada).length;
  const horas=itens.reduce((a,x)=>a+(+x.horas||0),0);
  const pct=itens.length? Math.round(feitas/itens.length*100) : 0;
  const destino=(db.sprints||[]).find(x=>x.id===reg.paraOSprint);
  return (<div className="card card-pad" style={{marginBottom:14,borderLeft:'4px solid #C58B2A'}}>
    <div className="reg-h">
      <b style={{fontSize:'.92rem'}}>Registro do fechamento</b>
      <span className="muted" style={{fontSize:'.75rem'}}>
        foto de {fmtBR(sprint.start)} a {fmtBR(sprint.end)}, tirada em {fmtBR(reg.fechadoEm)}
        {destino&&<> · seguiu para {rotuloSprint(destino)}</>}
      </span>
      <button className="imp-mini" style={{marginLeft:'auto'}} onClick={()=>setAberto(v=>!v)}>
        {aberto?'ocultar a lista':'ver as '+itens.length+' tarefas'}</button>
    </div>
    <div className="row" style={{gap:24,flexWrap:'wrap'}}>
      <span className="reg-n"><b>{itens.length}</b> no sprint</span>
      <span className="reg-n" style={{color:'#2F8F6E'}}><b>{feitas}</b> concluídas ({pct}%)</span>
      <span className="reg-n" style={{color:'#C58B2A'}}><b>{repassadas}</b> repassadas</span>
      {canceladas>0&&<span className="reg-n" style={{color:'#B33A3A'}}><b>{canceladas}</b> canceladas</span>}
      <span className="reg-n"><b>{fmtHoras(horas)}h</b> estimadas</span>
    </div>
    {aberto&&<div className="tbl-wrap" style={{marginTop:12,maxHeight:420,overflowY:'auto'}}>
      <table className="tbl dist">
        <thead><tr><th>Tarefa</th><th style={{width:132}}>Cliente</th><th style={{width:120}}>Quem fazia</th>
          <th style={{width:62,textAlign:'right'}}>Horas</th><th style={{width:86}}>Criada</th>
          <th style={{width:120}}>Como terminou</th></tr></thead>
        <tbody>{itens.map((x,i)=>(<tr key={x.id+'·'+i}>
          <td><div style={{fontWeight:600,fontSize:'.82rem'}}>{x.name}</div>
            {x.repassada&&<span className="tag-soft tag-rep">↩ seguiu para o próximo</span>}</td>
          <td>{x.cliente
            ? <span className="click" style={{color:'var(--brand)',fontWeight:600,fontSize:'.78rem'}}
                onClick={()=>x.pid&&go('projects',x.pid)}>{x.cliente}</span>
            : <span className="muted" style={{fontSize:'.74rem'}}>tarefa geral</span>}</td>
          <td><div className="row" style={{gap:4,flexWrap:'wrap'}}>
            {(x.quem||[]).length? (x.quem||[]).map(w=><Avatar key={w} db={db} id={w} size="sm"/>)
              : <span className="muted" style={{fontSize:'.72rem'}}>—</span>}</div></td>
          <td className="mono" style={{textAlign:'right',fontSize:'.78rem'}}>{x.horas?fmtHoras(x.horas):'—'}</td>
          <td className="mono muted" style={{fontSize:'.72rem'}}>{x.criadaEm?fmtBR(x.criadaEm):'—'}</td>
          <td><span className="badge" style={{background:(COL_COLOR[x.status]||'#8b9a99')+'22',color:COL_COLOR[x.status]||'#4a5a5c'}}>
            {COL_LABEL[x.status]||x.status}</span></td>
        </tr>))}</tbody>
      </table>
    </div>}
  </div>);
}

/* ------------------------------------------------------------
   PERÍODO DO SPRINT
   Quanto dura e quando começa. A escolha vale para os próximos — os
   sprints já fechados ficam como estão, porque são história.
   ------------------------------------------------------------ */
function PeriodoModal({sprint,close}){
  const {db,update,flash}=useDB();
  const cfg=db.sprintCfg||{dias:14,ancora:sprint.start};
  const [dias,setDias]=useState(+cfg.dias||14);
  const [ini,setIni]=useState(sprint.start);
  const fim=useMemo(()=>isoDate(addDays(dLocal(ini),Math.max(7,+dias||14)-1)),[ini,dias]);
  const seg=dLocal(ini).getDay()===1;
  const salvar=()=>{
    const d2=Math.max(7,Math.min(28,+dias||14));
    update(d=>{
      d.sprintCfg={dias:d2,ancora:ini};
      aplicarCfgSprint(d);
      const sp=d.sprints.find(x=>x.id===sprint.id);
      if(sp){ sp.start=ini; sp.end=isoDate(addDays(dLocal(ini),d2-1));
        sp.week=weekOfYear(dLocal(ini)); sp.year=dLocal(ini).getFullYear(); }
      return d;
    });
    setTimeout(()=>{ flash('Sprint agora vai de '+fmtBR(ini)+' a '+fmtBR(fim)); close(); },60);
  };
  return (<div className="overlay" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="modal-h"><h3>Período do sprint</h3><button className="x" onClick={close}>{I.x}</button></div>
    <div className="modal-b">
      <div className="fld"><label>Duração</label>
        <div className="row" style={{gap:6,flexWrap:'wrap'}}>
          {SPRINT_PERIODOS.map(([n,l])=>(
            <button key={n} className={"fpill "+(dias===n?'on':'')} onClick={()=>setDias(n)}>{l}</button>))}
        </div>
      </div>
      <div className="fld"><label>Começa em</label>
        <input type="date" className="inp" value={ini} onChange={e=>setIni(e.target.value)}/>
        {!seg&&<div className="muted" style={{fontSize:'.73rem',marginTop:5,color:'#C58B2A'}}>
          Esta data não é uma segunda-feira — o sprint vai começar no dia escolhido mesmo assim.</div>}
      </div>
      <div className="imp-resumo" style={{marginTop:4}}>
        <div>Este sprint: <b>{fmtBR(ini)} a {fmtBR(fim)}</b> · {dias} dias</div>
      </div>
      <div className="muted" style={{fontSize:'.76rem',marginTop:12,lineHeight:1.6}}>
        A duração vale para os próximos sprints: o seguinte começa em <b>{fmtBR(isoDate(addDays(dLocal(fim),1)))}</b>.
        Sprints já fechados não mudam. A capacidade da equipe é semanal, então o total disponível
        acompanha a duração — {Math.round(dias/7*10)/10} semana(s) por sprint.
      </div>
    </div>
    <div className="modal-f"><span/><div className="row">
      <button className="btn btn-ghost" onClick={close}>Cancelar</button>
      <button className="btn btn-primary" onClick={salvar}>Salvar período</button></div></div>
  </div></div>);
}

function SprintPage(){
  const {db,update,go,flash,auth}=useDB();
  /* Só o administrador distribui a quinzena e mexe na estrutura do sprint */
  const podeDistribuir=isAdmin(auth);
  /* Dois momentos distintos: MONTAR a semana (distribuir horas) e
     ACOMPANHAR o andamento (status). Cada tela faz uma coisa só. */
  const [modoEscolhido,setModo]=useState('montar');
  const modo=podeDistribuir? modoEscolhido : 'acompanhar';
  const [relatorio,setRelatorio]=useState(false);
  const [importar,setImportar]=useState(false);
  const [periodo,setPeriodo]=useState(false);
  const [view,setView]=useState('kanban'); const [sel,setSel]=useState(db.currentSprint);
  /* Um só conjunto de filtros para os dois modos — o que você filtra na
     distribuição continua filtrado ao acompanhar. */
  const [f,setF]=useState({q:'',cli:'Todos',resp:'Todos',prio:'Todas'});
  const fSet=(k,v)=>setF(x=>({...x,[k]:v}));
  const filtroLimpo=f.q===''&&f.cli==='Todos'&&f.resp==='Todos'&&f.prio==='Todas';
  /* Tarefa nova criada no sprint já nasce com o que os filtros dizem */
  const padraoSprint=(extra)=>{
    const pd={...(extra||{})};
    if(f.cli!=='Todos'&&f.cli!=='Gerais') pd.projectId=f.cli;
    if(f.resp!=='Todos') pd.assignees=[f.resp];
    if(f.prio!=='Todas') pd.prio=f.prio;
    return pd;
  };
  const passa=(t)=>{
    if(f.q&&(t.name||'').toLowerCase().indexOf(f.q.toLowerCase())<0) return false;
    if(f.cli==='Gerais'){ if(t.projectId) return false; }
    else if(f.cli!=='Todos'&&t.projectId!==f.cli) return false;
    if(f.resp!=='Todos'&&!temResp(t,f.resp)) return false;
    if(f.prio!=='Todas'&&(t.prio||'Média')!==f.prio) return false;
    return true;
  };
  const who=f.resp;
  const sprint=db.sprints.find(s=>s.id===sel)||db.sprints.find(s=>s.id===db.currentSprint);
  const frozen=sprint.id!==db.currentSprint;
  // atividades do sprint selecionado (agregadas de todos os projetos)
  // O sprint é montado pelas DATAS: entra tudo (tarefa geral ou atividade de
  // projeto) cuja janela de construção cruza a semana. Na semana atual entram
  // também as pendências cuja janela já venceu, para não sumirem de vista.
  const ehAtual=sprint.id===db.currentSprint;
  let acts=allTasks(db).filter(a=>a.column!=='cancelado').filter(a=>taskEmSprint(a,sprint)||(ehAtual&&taskAtrasadaSprint(a,sprint)));
  const backlog=allTasks(db).filter(a=>semPrazo(a));
  acts=acts.filter(passa);
  /* Sprint fechado: a conta vem do registro, porque as tarefas em aberto
     já mudaram de janela e não estão mais aqui. */
  const reg=sprint&&sprint.registro;
  const planned=reg? reg.itens.length : acts.length;
  const done=reg? reg.itens.filter(x=>x.status==='concluido').length
                : acts.filter(a=>a.column==='concluido').length;
  const tend=planned?Math.round(done/planned*100):0;

  const moveAct=(id,col)=>update(d=>{mutateTask(d,id,a=>{a.column=col;});return d;});

  /* ------------------------------------------------------------
     ARRASTAR CARTÕES ENTRE AS COLUNAS
     Soltar numa coluna do sprint muda a situação da tarefa. Vindo da
     coluna "Sem prazo", a tarefa também ganha a janela deste sprint —
     é o que a traz para o sprint.
     ------------------------------------------------------------ */
  const [arrasto,setArrasto]=useState(null);
  const [alvoCol,setAlvoCol]=useState('');
  const cardArraste=(a,daBacklog)=>frozen? {} : {
    draggable:true,
    onDragStart:(ev)=>{ ev.stopPropagation(); setArrasto({id:a.id,name:a.name,backlog:daBacklog});
      try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',a.id);}catch(x){} },
    onDragEnd:()=>{ setArrasto(null); setAlvoCol(''); },
    style:(arrasto&&arrasto.id===a.id)?{opacity:.4}:null
  };
  const colAlvo=(k)=>frozen? {} : {
    onDragOver:(ev)=>{ if(!arrasto) return; ev.preventDefault(); if(alvoCol!==k) setAlvoCol(k); },
    onDragLeave:()=>{ if(alvoCol===k) setAlvoCol(''); },
    onDrop:(ev)=>{ ev.preventDefault();
      const a=arrasto; setArrasto(null); setAlvoCol('');
      if(!a) return;
      if(k==='__semprazo'){   // tirar do sprint: remove TODOS os prazos, senão a
        // tarefa continuaria caindo no sprint pela data de entrega
        update(d=>{mutateTask(d,a.id,t=>{t.buildStart='';t.buildEnd='';t.date='';t.sessoes={};t.column='backlog';});return d;});
        flash('"'+a.name+'" voltou para Sem prazo · prazos removidos'); return;
      }
      update(d=>{ const sp=d.sprints.find(x=>x.id===sprint.id);
        mutateTask(d,a.id,t=>{ t.column=k;
          if(a.backlog){ t.buildStart=sp.start; t.buildEnd=sp.end; if(!t.date) t.date=sp.end; }
        }); return d; });
      flash(a.backlog? ('"'+a.name+'" programada neste sprint') : ('"'+a.name+'" → '+(COLS.find(c=>c[0]===k)||[])[1]));
    }
  };
  // "programar": dá à tarefa a janela deste sprint — é isso que a traz para ele
  const pullToSprint=(id)=>update(d=>{const sp=d.sprints.find(x=>x.id===d.currentSprint);
    mutateTask(d,id,a=>{a.buildStart=sp.start;a.buildEnd=sp.end;if(!a.date)a.date=sp.end;if(a.column==='backlog')a.column='andamento';});return d;});
  /* Fechar um sprint é tirar uma foto dele: o que havia, quem fazia,
     quantas horas, como terminou e o que foi repassado. Depois disso as
     tarefas em aberto mudam de janela — sem a foto, o sprint antigo
     ficaria vazio e a história se perderia. */
  const newSprint=()=>{
    let destino=null, aviso='';
    update(d=>{
      const cur=d.sprints.find(s=>s.id===d.currentSprint);
      if(!cur) return d;
      if(cur.frozen&&cur.registro){ aviso='Este sprint já foi fechado'; return d; }
      /* a quinzena seguinte pode já existir (alguém empurrou tarefa para
         lá); nesse caso ela é reaproveitada, não duplicada */
      const prox=sprintSeguinte(d,cur);
      /* as tarefas DE VERDADE (allTasks devolve cópias, e aqui se escreve) */
      const noSprint=[];
      (d.projects||[]).forEach(p=>(p.activities||[]).forEach(a=>{ if(taskEmSprint(a,cur)) noSprint.push([a,p]); }));
      (d.tasks||[]).forEach(a=>{ if(taskEmSprint(a,cur)) noSprint.push([a,null]); });
      const levar=(a)=>{
        if(a.column==='concluido'||a.column==='cancelado') return false;
        a.buildStart=prox.start; a.buildEnd=prox.end;
        if(!a.date||a.date<prox.start) a.date=prox.end;
        podaSessoes(a);
        a.carriedFrom=rotuloSprint(cur); a.carriedN=(+a.carriedN||0)+1;
        return true;
      };
      let carried=0;
      const registro={fechadoEm:hojeISO(),paraOSprint:prox.id,itens:[]};
      noSprint.forEach(([a,proj])=>{
        const repassada=levar(a);
        if(repassada) carried++;
        registro.itens.push({id:a.id,name:a.name,
          cliente:proj? proj.name : '', pid:proj? proj.id : null,
          quem:respsDe(a).slice(), horas:+a.estHoras||0,
          status:a.column||'backlog', tipo:a.type||'Outro', prio:a.prio||'Média',
          criadaEm:a.criadaEm||'', repassada});
      });
      cur.frozen=true;
      cur.registro=registro;
      d.currentSprint=prox.id;
      destino=prox.id;
      aviso='Sprint '+rotuloSprint(prox)+' aberto · '+registro.itens.length+' tarefa(s) registradas no anterior, '+carried+' repassadas';
      return d;
    });
    /* fora do update: mexer em estado de tela durante a gravação confunde o React */
    setTimeout(()=>{ if(destino) setSel(destino); if(aviso) flash(aviso); },60);
  };

  return (<div>
    <div className="card card-pad" style={{marginBottom:16}}>
      <div className="between" style={{flexWrap:'wrap',gap:12}}>
        <div className="row" style={{gap:12,flexWrap:'wrap'}}>
          <div><div style={{fontSize:'1.1rem',fontWeight:800}}>Sprint · {fmtBR(sprint.start)} a {fmtBR(sprint.end)}{frozen&&<span className="tag-soft" style={{marginLeft:8}}>congelado</span>}</div>
            <div className="muted" style={{fontSize:'.78rem'}}>quinzena · semanas {sprint.week} e {sprint.week+1} de {sprint.year}</div></div>
        </div>
        <div className="row" style={{gap:10,flexWrap:'wrap'}}>
          <select className="sel" style={{width:'auto'}} value={sel} onChange={e=>setSel(e.target.value)}>{db.sprints.slice().reverse().map(s=><option key={s.id} value={s.id}>{rotuloSprint(s)}{s.id===db.currentSprint?' (atual)':''}</option>)}</select>
          {modo==='acompanhar'&&<div className="seg-ctrl"><button className={view==='kanban'?'on':''} onClick={()=>setView('kanban')}>Kanban</button><button className={view==='list'?'on':''} onClick={()=>setView('list')}>Lista</button></div>}
          {podeDistribuir&&<button className="btn btn-ghost btn-sm" onClick={()=>setPeriodo(true)}
            title="Escolher quanto dura e quando começa">{I.clock} Período</button>}
          {podeDistribuir&&<button className="btn btn-ghost btn-sm" onClick={()=>setImportar(true)}
            title="Trazer as tarefas de uma planilha de sprint">{I.upload} Importar sprint</button>}
          <button className="btn btn-ghost btn-sm" onClick={()=>setRelatorio(true)}>Relatório ao cliente</button>
          {podeDistribuir&&<button className="btn btn-primary btn-sm" onClick={newSprint}>{I.plus} Novo sprint</button>}
        </div>
      </div>

      {/* ---- os dois modos, cada um com seu propósito ---- */}
      {podeDistribuir&&<div className="modo-tabs">
        <button className={modo==='montar'?'on':''} onClick={()=>setModo('montar')}>
          <b>Distribuição de tarefas</b><span>montar a quinzena por horas de cada consultor</span></button>
        <button className={modo==='acompanhar'?'on':''} onClick={()=>setModo('acompanhar')}>
          <b>Andamento do sprint</b><span>acompanhar por situação, do backlog ao concluído</span></button>
      </div>}

      {/* ---- filtros, valem para os dois modos ---- */}
      <div className="row" style={{gap:8,marginTop:12,flexWrap:'wrap',alignItems:'center'}}>
        <input className="inp" style={{flex:'1 1 170px',minWidth:140,maxWidth:260,fontSize:'.8rem',padding:'6px 10px'}}
          value={f.q} onChange={e=>fSet('q',e.target.value)} placeholder="Buscar tarefa…"/>
        <select className="sel" style={{width:160}} value={f.cli} onChange={e=>fSet('cli',e.target.value)}>
          <option value="Todos">Todos os clientes</option><option value="Gerais">Tarefas gerais</option>
          {ativos(db).map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select>
        <select className="sel" style={{width:150}} value={f.resp} onChange={e=>fSet('resp',e.target.value)}>
          <option value="Todos">Toda a equipe</option>
          {db.team.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
        <select className="sel" style={{width:120}} value={f.prio} onChange={e=>fSet('prio',e.target.value)}>
          <option value="Todas">Prioridade</option>
          {PRIOS.map(x=><option key={x} value={x}>{PRIO_SIGLA[x]} · {x}</option>)}</select>
        {!filtroLimpo&&<button className="btn btn-ghost btn-sm" onClick={()=>setF({q:'',cli:'Todos',resp:'Todos',prio:'Todas'})}>limpar</button>}
      </div>
      <div className="row" style={{gap:26,marginTop:16,flexWrap:'wrap'}}>
        <span className="stat-mini"><span className="n">{planned}</span>
          <span className="l">{reg?'tarefas no fechamento':'Tarefas planejadas'}</span></span>
        <span className="stat-mini"><span className="n" style={{color:'var(--green)'}}>{done}</span><span className="l">Concluídas</span></span>
        <span className="stat-mini"><span className="n" style={{color:'var(--coral)'}}>{planned-done}</span>
          <span className="l">{reg?'não concluídas':'Em aberto'}</span></span>
        <span className="stat-mini"><span className="n" style={{color:'var(--brand)'}}>{tend}%</span><span className="l">Conclusão</span></span>
        <div style={{flex:1,minWidth:160,alignSelf:'center'}}><div className="bar-track" style={{height:10}}><div className="bar-fill" style={{width:tend+'%',background:tend>=70?'var(--green)':'#C58B2A'}}></div></div></div>
      </div>
    </div>

    <div className="card card-pad" style={{marginBottom:16}}>
      <RegistroSprint sprint={sprint}/>

      <QuickAddTask titulo={modo==='montar'?'Adicionar ao banco (fora do sprint)':'Adicionar tarefa neste sprint'}
        dica={modo==='montar'
          ? 'Entra no banco, sem semana definida — depois é só distribuir para alguém.'
          : 'A tarefa nasce com o prazo de construção de '+fmtBR(sprint.start)+' a '+fmtBR(sprint.end)+', então já entra neste sprint.'}
        date={modo==='montar'?'':sprint.end}
        buildStart={modo==='montar'?'':sprint.start}
        buildEnd={modo==='montar'?'':sprint.end}/>
    </div>

    {relatorio&&<RelatorioModal sprint={sprint} close={()=>setRelatorio(false)}/>}
    {importar&&<ImportarSprintModal close={()=>setImportar(false)}/>}
    {periodo&&<PeriodoModal sprint={sprint} close={()=>setPeriodo(false)}/>}
    {modo==='montar'? <MontarSprint sprint={sprint} frozen={frozen} filtro={f} passa={passa}/> : (
    view==='kanban'?(
      <div>
      {!frozen&&<div className="muted" style={{fontSize:'.72rem',marginBottom:10}}>
        Pegue o cartão pelo <b>⠿</b> (ou por qualquer parte dele) e solte na coluna desejada — as setas ◀ ▶ fazem o mesmo, um passo por vez.
        Vindo de <b>Sem prazo</b>, a tarefa ganha a janela desta semana; voltando para lá, ela sai do sprint.
      </div>}
      <div className={"kanban"+(arrasto?' arrastando':'')}>
        <div {...colAlvo('__semprazo')} className={"kb-col"+(alvoCol==='__semprazo'?' alvo':'')}>
          <div className="kb-h" style={{color:'#4a5a5c'}}>Sem prazo<span className="kb-cnt">{backlog.length}</span></div>
          <div className="muted" style={{fontSize:'.72rem',marginBottom:8}}>Tarefas sem prazo de construção definido</div>
          {backlog.map(a=>(<div key={a.id} {...cardArraste(a,true)} className="kb-card"
            title={frozen?undefined:'Arraste para uma coluna do sprint para programar nesta semana'}>
            {!frozen&&<span className="kb-grip" aria-hidden="true">⠿</span>}
            <div className="row" style={{justifyContent:'space-between'}}><span className="act-type" style={{background:ACT_TYPE_C[a.type]+'22',color:ACT_TYPE_C[a.type]}}>{a.type}</span><Avatares db={db} t={a}/></div>
            <div style={{fontSize:'.82rem',fontWeight:600,margin:'6px 0'}}>{a.name}</div>
            <div className="between">{a.proj? <a onClick={()=>go('projects',a.proj.id)} style={{fontSize:'.72rem',color:'var(--brand)',fontWeight:600,cursor:'pointer'}}>{a.proj.name}</a> : <span className="tag-soft" style={{fontSize:'.66rem'}}>tarefa geral</span>}

function MemberModal({m,close,onSave,onDelete}){
  const {db}=useDB();
  const [f,setF]=useState(m.id?m:{...m,id:'u'+uid()});
  const [erro,setErro]=useState('');
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  /* o e-mail é o login: precisa ser válido e não pode estar em outra pessoa */
  const salvar=()=>{
    const email=String(f.email||'').trim().toLowerCase();
    if(!String(f.name||'').trim()){ setErro('Preencha o nome.'); return; }
    if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setErro('Esse e-mail não parece válido.'); return; }
    const outro=email&&(db.team||[]).find(x=>x.id!==f.id&&String(x.email||'').trim().toLowerCase()===email);
    if(outro){ setErro('Esse e-mail já está cadastrado para '+outro.name+'.'); return; }
    onSave({...f,email});
  };
  return (<div className="overlay" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="modal-h"><h3>{m.id?'Editar membro':'Novo membro'}</h3><button className="x" onClick={close}>{I.x}</button></div>

        <div style={{flex:1}}><div className="fld" style={{marginBottom:0}}><label>Nome</label><input className="inp" value={f.name} onChange={e=>set('name',e.target.value)} autoFocus/></div></div></div>
      <div className="fld"><label>E-mail de acesso (conta Google)</label><input className="inp" value={f.email} onChange={e=>{set('email',e.target.value);setErro('');}} placeholder="nome@focusfranquias.com.br"/>
        <div className="muted" style={{fontSize:'.72rem',marginTop:4}}>É com esta conta Google que a pessoa entra no sistema online. O sistema reconhece o e-mail no login e aplica o cargo abaixo. Sem e-mail, ela não entra.</div></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <div className="fld"><label>Função</label><select className="sel" value={f.role} onChange={e=>set('role',e.target.value)}>{[...new Set(['Coordenadora','Consultora','Consultor(a)','Gerente',f.role].filter(Boolean))].map(r=><option key={r}>{r}</option>)}</select></div>
        <div className="fld"><label>Cargo de acesso</label><select className="sel" value={f.perm} onChange={e=>set('perm',e.target.value)}>{Object.entries(PERM_LABEL).map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
          <div className="muted" style={{fontSize:'.72rem',marginTop:4}}>{CARGO_DESC[f.perm]||''}</div></div>
      </div>
      <div className="fld"><label>Cor do avatar</label><div className="row" style={{flexWrap:'wrap',gap:8}}>{AVATAR_COLORS.map(c=><button key={c} onClick={()=>set('color',c)} style={{width:30,height:30,borderRadius:'50%',background:c,border:f.color===c?'3px solid #000019':'2px solid #fff',boxShadow:'0 0 0 1px #ddd',cursor:'pointer'}}/>)}</div></div>
    </div>
    {erro&&<div className="nv-erro" style={{margin:'0 22px 12px'}}>{erro}</div>}

function groupCount(projects,dimKey,db){
  const get=VIZ_DIMS[dimKey].get; const map={};
  projects.forEach(p=>{const k=get(p,db)||'—';map[k]=(map[k]||0)+1;});

}
