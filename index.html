  const dica=useDica();
  return (<div className="ch-wrap" ref={dica.ref} onMouseLeave={dica.esconder}>
    <svg viewBox={'0 0 '+W+' '+H} className="ch-svg" role="img" aria-label="Receita com contrato vencendo nos próximos 12 meses">
      <line x1={L} x2={W-R} y1={Y(0)} y2={Y(0)} stroke={COR_COM.eixo}/>
      {meses.map((x,i)=>{ const cx=L+slot*i+slot/2, y0=Y(x.v);
        return (<g key={x.rot} onMouseMove={(e)=>dica.mostrar(e,<><div className="ch-dt">{x.rot}</div>
            <LinhaDica cor={COR_COM.desce} rot="Receita que vence" val={fmtRS(x.v)} forte/>
            {x.cli.map(c=><LinhaDica key={c.id} rot={c.name+' · '+fmtBR(ctFim(c))} val={fmtRS(+c.ticket||0)}/>)}
            {!x.cli.length&&<div className="ch-nota">Nenhum contrato vence neste mês.</div>}</>)}>
          <rect x={cx-slot/2} y={T} width={slot} height={ih+B} fill="transparent"/>
          {x.v>0&&<path d={'M'+(cx-bw/2)+' '+Y(0)+' V'+(y0+3)+' Q'+(cx-bw/2)+' '+y0+' '+(cx-bw/2+3)+' '+y0+' H'+(cx+bw/2-3)+' Q'+(cx+bw/2)+' '+y0+' '+(cx+bw/2)+' '+(y0+3)+' V'+Y(0)+' Z'} fill={COR_COM.desce}/>}
          {x.v>0&&<text x={cx} y={y0-6} textAnchor="middle" className="ch-rot">{fmtK(x.v)}</text>}
          <text x={cx} y={H-10} textAnchor="middle" className="ch-eixo">{x.rot}</text>
        </g>);})}
    </svg>
    <dica.Balao/>
  </div>);
}

const TileCom=({rot,val,sub,cor,dica})=>(<div className="kpi" title={dica||''}><div className="bar" style={{background:cor||COR_COM.base}}></div>
  <div className="lab">{rot}</div><div className="val" style={{color:'var(--navy)'}}>{val}</div><div className="sub">{sub}</div></div>);

/* ---------- O painel ---------- */
function AnaliseComercial({db,go,update,onEditar}){
  const todos=db.projects||[];
  const L=useMemo(()=>leituraComercial(todos,12),[db.projects]);
  const hoje=hojeISO();
  const ativosT=L.ativosHoje;
  const mrr=L.mrr, n=ativosT.length;
  const ticketMedio=n? mrr/n : 0;
  const horasC=ativosT.reduce((a,p)=>a+(+p.horasPlan||0),0);
  /* receita já contratada até o fim de cada contrato */
  const semFim=ativosT.filter(p=>!ctFim(p)||ctFim(p)<hoje);
  const carteira=ativosT.reduce((a,p)=>{ if(!ctFim(p)||ctFim(p)<hoje) return a;
    const meses=(dLocal(ctFim(p))-dLocal(hoje))/86400000/30.44; return a+(+p.ticket||0)*meses; },0);
  const mrr12=L.serie.length? L.mrrIni : 0;
  const varAno=mrr12? (mrr-mrr12)/mrr12 : null;
  /* concentração */
  const porTk=ativosT.map(p=>({p,v:recEm(p,hoje)})).sort((a,b)=>b.v-a.v);
  const top3=porTk.slice(0,3).reduce((a,x)=>a+x.v,0);
  const hhi=mrr? Math.round(porTk.reduce((a,x)=>a+Math.pow(x.v/mrr*100,2),0)) : 0;
  const nivelHHI=hhi>2500?'alta':hhi>1500?'moderada':'baixa';
  let ac=0; const classe={}; porTk.forEach(x=>{ classe[x.p.id]= ac/mrr<.8?'A':ac/mrr<.95?'B':'C'; ac+=x.v; });
  const nA=porTk.filter(x=>classe[x.p.id]==='A').length;
  const itensConc=(()=>{ const top=porTk.slice(0,10).map(x=>({k:x.p.id,rot:x.p.name,v:x.v,
      marca:<span className={'abc abc-'+classe[x.p.id]}>{classe[x.p.id]}</span>,
      extra:<LinhaDica rot="Curva ABC" val={'classe '+classe[x.p.id]}/>}));
    const resto=porTk.slice(10); if(resto.length) top.push({k:'outros',rot:'Outros '+resto.length+' clientes',v:resto.reduce((a,x)=>a+x.v,0),
      marca:<span className="abc abc-C">C</span>});
    return top; })();
  /* mix da carteira */
  const [dim,setDim]=useState('tier');
  const DIMS=[['tier','Tier'],['tipo','Tipo'],['setor','Setor'],['phase','Etapa'],['coord','Coordenação'],['casa','Tempo de casa']];
  const grupoDe=(p)=>{
    if(dim==='coord') return (p.coordinator&&member(db,p.coordinator).name)||'Sem coordenação';
    if(dim==='casa'){ const m=mesesDeCasa(p); return !ctIni(p)?'Sem data de entrada':m<6?'Até 6 meses':m<12?'6 a 12 meses':m<24?'1 a 2 anos':'Mais de 2 anos'; }
    if(dim==='phase') return p.phase? shortPhase(p.phase) : 'Sem etapa';
    return p[dim]||'Não informado';
  };
  const ORD_CASA=['Até 6 meses','6 a 12 meses','1 a 2 anos','Mais de 2 anos','Sem data de entrada'];
  const itensMix=(()=>{ const g={}; ativosT.forEach(p=>{ const k=grupoDe(p); g[k]=g[k]||{k,rot:k,v:0,n:0,hp:0}; g[k].v+=recEm(p,hoje); g[k].n++; g[k].hp+=(+p.horasPlan||0); });
    const arr=Object.values(g).map(x=>({...x,extra:<><LinhaDica rot="Ticket médio" val={fmtRS(x.v/x.n)}/>{x.hp>0&&<LinhaDica rot="R$/hora contratado" val={fmtRS(x.v/x.hp)}/>}</>}));
    return dim==='casa'? arr.sort((a,b)=>ORD_CASA.indexOf(a.k)-ORD_CASA.indexOf(b.k)) : arr.sort((a,b)=>b.v-a.v); })();
  /* rentabilidade real do mês: ticket ÷ horas que o time alocou no cliente */
  const iniM=isoDate(new Date(TODAY.getFullYear(),TODAY.getMonth(),1)), fimM=isoDate(new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0));
  const linhasH=useMemo(()=>horasDoSprint(db,iniM,fimM),[db]);
  const halteres=ativosT.map(p=>{ const tk=recEm(p,hoje), hp=+p.horasPlan||0, min=somaMin(linhasH.filter(l=>l.pid===p.id));
      return {p,tk,hp,min,prev:hp?tk/hp:0,real:min?tk/(min/60):0}; })
    .filter(x=>x.prev||x.real).sort((a,b)=>(b.real||b.prev)-(a.real||a.prev));
  const minTot=halteres.reduce((a,x)=>a+x.min,0), tkComHoras=halteres.filter(x=>x.min).reduce((a,x)=>a+x.tk,0);
  const mediaReal=minTot? tkComHoras/(minTot/60) : 0;
  const nAbaixo=halteres.filter(x=>x.prev&&x.real&&x.real<x.prev*.85).length;
  /* vencimentos e risco */
  const meses12=Array.from({length:12},(_,i)=>{ const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+i,1);
    const ini=isoDate(d), fim=isoDate(new Date(d.getFullYear(),d.getMonth()+1,0));
    const cli=ativosT.filter(p=>ctFim(p)&&ctFim(p)>=ini&&ctFim(p)<=fim&&ctFim(p)>=hoje);
    return {rot:MES[d.getMonth()].slice(0,3).toLowerCase()+'/'+String(d.getFullYear()).slice(2),cli,v:cli.reduce((a,p)=>a+(+p.ticket||0),0)}; });
  const venc12=meses12.reduce((a,x)=>a+x.v,0);
  const risco=ativosT.map(p=>{ const mot=[]; const s=sinaisDe(p);
      SINAL_CATS.forEach(([k,l])=>{ if((s[k]||{}).cor==='vermelho') mot.push({t:'sinaleira vermelha · '+l,g:2}); else if((s[k]||{}).cor==='amarelo') mot.push({t:'amarelo · '+l,g:1}); });
      if(ctFim(p)&&ctFim(p)>=hoje){ const dd=Math.round((dLocal(ctFim(p))-dLocal(hoje))/86400000); if(dd<=90) mot.push({t:'contrato vence em '+dd+' dias',g:dd<=30?2:1}); }
      const g=mot.reduce((a,x)=>a+x.g,0);
      return {p,mot,g,v:recEm(p,hoje)}; })
    .filter(x=>x.mot.some(m=>m.g>=2)||x.g>=2).sort((a,b)=>b.g-a.g||b.v-a.v);
  /* o indicador conta só quem está com alguma sinaleira vermelha */
  const vermelhos=ativosT.filter(p=>SINAL_CATS.some(([k])=>((sinaisDe(p)[k]||{}).cor==='vermelho')));
  const emRisco=vermelhos.reduce((a,p)=>a+recEm(p,hoje),0);

  if(!mrr) return (<div className="card card-pad anc-vazio">
    <div className="anc-vazio-t">
      <h3>A análise comercial aparece aqui assim que os clientes tiverem contrato</h3>
      <p>Nenhum cliente {db.meta&&db.meta.simulacao?'desta simulação ':''}tem <b>ticket mensal</b> preenchido ainda. Com o ticket, as horas/mês, a data de entrada
        e a data de fim de cada contrato, esta área mostra:</p>
      <ul>
        <li><b>8 indicadores</b> — receita recorrente e anualizada, receita em carteira, ticket médio, retenção, cancelamentos, concentração e receita em risco</li>
        <li><b>Evolução da receita</b> mês a mês e a <b>ponte</b> de 12 meses: novos, reajustes, reduções e cancelados</li>
        <li><b>Curva ABC</b> dos clientes e a <b>composição</b> da carteira por tier, tipo, setor, etapa, coordenação e tempo de casa</li>
        <li><b>R$ por hora</b> contratado × real, cliente a cliente, e os <b>vencimentos</b> dos próximos 12 meses com a receita em risco</li>
      </ul>
      <div className="row" style={{gap:8,flexWrap:'wrap',marginTop:14}}>
        <button className="btn btn-primary" onClick={onEditar}>Preencher na aba Contratos</button>
        {db.meta&&db.meta.simulacao&&<button className="btn btn-ghost" onClick={()=>update(d=>contratosFicticios(d))}>
          Gerar contratos fictícios nesta simulação</button>}
      </div>
    </div>
  </div>);

  return (<div className="anc">
    <div className="kpi-grid anc-kpis">
      <TileCom rot="Receita recorrente" val={fmtK(mrr)} cor={COR_COM.base}
        sub={varAno==null? n+(n===1?' contrato vigente':' contratos vigentes') : (varAno>=0?'+':'')+fmtPct(varAno,1)+' em 12 meses · '+n+(n===1?' contrato':' contratos')}/>
      <TileCom rot="Receita anualizada" val={fmtK(mrr*12)} sub="receita recorrente × 12"/>
      <TileCom rot="Receita em carteira" val={fmtK(carteira)} cor={COR_COM.sobe}
        sub={'contratada até o fim dos contratos'+(semFim.length?' · '+semFim.length+' sem data de fim':'')}
        dica="Soma do ticket de cada cliente pelos meses que faltam até a data de fim do contrato."/>
      <TileCom rot="Ticket médio" val={fmtRS(ticketMedio)} sub={horasC? fmtRS(mrr/horasC)+'/h contratado em média' : 'informe as horas/mês'}/>
      <TileCom rot="Retenção líquida 12m" val={L.nrr==null?'—':fmtPct(L.nrr)} cor={L.nrr!=null&&L.nrr<1?COR_COM.desce:COR_COM.sobe}
        sub={L.nrr==null?'precisa de 12 meses de histórico':'retenção bruta '+fmtPct(L.grr)+' · reajustes incluídos'}
        dica="Quanto os clientes que já pagavam há 12 meses pagam hoje, em relação ao que pagavam. Acima de 100%, os reajustes compensam as perdas."/>
      <TileCom rot="Cancelamentos 12m" val={L.perdidos.length} cor={L.perdidos.length?COR_COM.desce:COR_COM.sobe}
        sub={L.perdidos.length? fmtRS(L.mov.saiu)+'/mês perdidos · '+L.perdidos.map(p=>p.name).slice(0,3).join(', ')+(L.perdidos.length>3?'…':'') : 'nenhum cliente saiu'}/>
      <TileCom rot="Concentração" val={fmtPct(mrr?top3/mrr:0)} cor={hhi>2500?COR_COM.desce:COR_COM.base}
        sub={'nos 3 maiores · concentração '+nivelHHI}
        dica={'Índice HHI '+hhi+': abaixo de 1.500 é baixa, de 1.500 a 2.500 moderada, acima de 2.500 alta.'}/>
      <TileCom rot="Receita em risco" val={fmtK(emRisco)} cor={emRisco?COR_COM.desce:COR_COM.sobe}
        sub="receita de clientes em vermelho na carteira"
        dica={vermelhos.length? fmtPct(emRisco/mrr)+' da receita · '+vermelhos.map(p=>p.name).join(', ') : 'Nenhum cliente com sinaleira vermelha.'}/>
    </div>

    <div className="anc-g2">
      <div className="card card-pad">
        <div className="card-h"><h3>Evolução da receita recorrente</h3><span className="sub">últimos 12 meses</span></div>
        <GraficoMRR serie={L.serie}/>
      </div>
      <div className="card card-pad">
        <div className="card-h"><h3>De onde veio a variação</h3><span className="sub">ponte de 12 meses</span></div>
        <PonteMRR ini={L.mrrIni} mov={L.mov} fim={mrr}/>
        <div className="ch-leg"><span><i style={{background:COR_COM.base}}></i>receita no ponto</span>
          <span><i style={{background:COR_COM.sobe}}></i>aumenta</span><span><i style={{background:COR_COM.desce}}></i>diminui</span></div>
      </div>
    </div>

    <div className="anc-g2">
      <div className="card card-pad">
        <div className="card-h"><h3>Concentração da receita</h3><span className="sub">curva ABC · {nA} cliente{nA===1?'':'s'} fazem 80%</span></div>
        <BarrasH itens={itensConc} total={mrr} mostrarAcum cor={COR_COM.barra}/>
        <div className="ch-nota-b">A = clientes que somam os primeiros 80% da receita; B = os 15% seguintes; C = o restante. A última coluna é o acumulado.</div>
      </div>
      <div className="card card-pad">
        <div className="card-h"><h3>Composição da carteira</h3><span className="sub">receita por grupo</span></div>
        <div className="row" style={{gap:6,flexWrap:'wrap',marginBottom:12}}>{DIMS.map(([k,l])=><button key={k} className={'fpill '+(dim===k?'on':'')} onClick={()=>setDim(k)}>{l}</button>)}</div>
        <BarrasH itens={itensMix} total={mrr} cor={COR_COM.barra}/>
      </div>
    </div>

    <div className="anc-g2">
      <div className="card card-pad">
        <div className="card-h"><h3>R$ por hora: contratado × real</h3><span className="sub">{MES[TODAY.getMonth()]} · ticket ÷ horas</span></div>
        {halteres.length? <HaltereRH linhas={halteres} media={mediaReal}/> : <div className="muted" style={{fontSize:'.8rem'}}>Sem horas contratadas nem alocadas neste mês.</div>}
        <div className="ch-leg"><span><i className="ch-oco"></i>contratado (ticket ÷ horas/mês)</span><span><i style={{background:COR_COM.base,borderRadius:'50%'}}></i>real (ticket ÷ horas das tarefas do mês)</span>
          {nAbaixo>0&&<span><i style={{background:COR_COM.desce,borderRadius:'50%'}}></i>{nAbaixo} abaixo de 85% do contratado</span>}</div>
      </div>
      <div className="card card-pad">
        <div className="card-h"><h3>Vencimentos de contrato</h3><span className="sub">{fmtK(venc12)}/mês vencem em 12 meses</span></div>
        <GraficoVenc meses={meses12}/>
        <div className="anc-risco">
          <div className="anc-risco-h">Clientes em alerta <span className="muted">sinaleira vermelha ou contrato vencendo em até 30 dias</span></div>
          {risco.length? risco.slice(0,8).map(x=>(<div key={x.p.id} className="anc-risco-l" onClick={()=>go('projects',x.p.id)}>
              <span className="row" style={{gap:7,minWidth:0}}><span style={{width:8,height:8,borderRadius:'50%',background:corDoCliente(x.p),flex:'none'}}></span>
                <b>{x.p.name}</b></span>
              <span className="anc-mot">{x.mot.map((m,i)=><span key={i} className={'anc-chip g'+m.g}>{m.t}</span>)}</span>
              <span className="mono anc-v">{fmtRS(x.v)}</span></div>))
            : <div className="muted" style={{fontSize:'.78rem',padding:'6px 0'}}>Nenhum cliente com sinaleira vermelha ou contrato vencendo nos próximos 30 dias.</div>}
        </div>
      </div>
    </div>
  </div>);
}

/* ============================================================
   CONTRATOS
   O lado comercial de cada cliente, separado da gestão do projeto:
   ticket e reajustes, horas contratadas, vigência, pagamento e
   encerramento. É daqui que a Análise de Carteira lê os números.
   ============================================================ */
const SIT_CT={
  vigente:['Vigente','#2F8F6E','#e6f3ee'], vence:['Vence em breve','#9a5a16','#fbf3e6'],
  vencido:['Vigência passou','#B33A3A','#f8ecec'], futuro:['Começa em breve','#2E7FA8','#e8f1f7'],
  sem:['Sem contrato','#6b7a79','#eef0ef'], encerrado:['Encerrado','#6b7a79','#eef0ef'],
};
const MOTIVOS_SAIDA=['Fim do prazo, sem renovação','Cancelamento pelo cliente','Cancelamento pela Focus','Inadimplência','Projeto concluído','Outro'];
const FORMAS_PAG=['Boleto','Pix','Transferência','Cartão','Outro'];
function situacaoContrato(p){
  const h=hojeISO();
  if((p.ctEncerradoEm&&p.ctEncerradoEm<=h)||p.archived) return {k:'encerrado'};
  if(!(+p.ticket>0)) return {k:'sem'};
  if(ctIni(p)&&ctIni(p)>h) return {k:'futuro'};
  const f=ctFim(p);
  if(f){ const dd=Math.round((dLocal(f)-dLocal(h))/86400000);
    if(dd<0) return {k:'vencido',dd}; if(dd<=90) return {k:'vence',dd}; }
  return {k:'vigente'};
}
const PillCt=({sit})=>{ const c=SIT_CT[sit.k]||SIT_CT.sem;
  return (<span className="ct-pill" style={{color:c[1],background:c[2]}}>{c[0]}{sit.k==='vence'?' · '+sit.dd+' dias':''}{sit.k==='vencido'?' há '+(-sit.dd)+' dias':''}</span>); };

/* Ficha do contrato: condições, reajustes e encerramento */
function ContratoModal({p,close,foco}){
  const {update,flash}=useDB();
  const hist=(p.ticketHist||[]).slice().sort((a,b)=>a.data<b.data?-1:1);
  const travado=hist.length>1;      // com reajustes, o ticket muda por reajuste (fica a data e o motivo)
  const [f,setF]=useState({ticket:String(+p.ticket||''),horasPlan:String(+p.horasPlan||''),ctInicio:ctIni(p),ctFim:ctFim(p),
    diaVenc:String(p.diaVenc||''),formaPag:p.formaPag||'',ctObs:p.ctObs||''});
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const [rj,setRj]=useState({valor:'',data:hojeISO(),motivo:''});
  const [enc,setEnc]=useState({data:hojeISO(),motivo:MOTIVOS_SAIDA[0],obs:''});
  const [abrirEnc,setAbrirEnc]=useState(false);
  /* renovação: o contrato continua, só ganha um novo fim (e, se for o caso, um novo valor) */
  const fimAtual=ctFim(p);
  const diaSeguinte=fimAtual? isoDate(addDays(fimAtual,1)) : hojeISO();
  const [rn,setRn]=useState({fim:fimAtual? isoDate(addDays(addMonths(diaSeguinte,6),-1)) : '',valor:String(+p.ticket||''),motivo:'Renovação'});
  const renRef=useRef(null);
  useEffect(()=>{ if(foco==='renovar'&&renRef.current) setTimeout(()=>renRef.current.scrollIntoView({behavior:'smooth',block:'center'}),80); },[]);
  const prazoRn=(m)=>setRn(x=>({...x,fim:isoDate(addDays(addMonths(diaSeguinte,m),-1))}));
  const renovar=()=>{
    if(!rn.fim||(fimAtual&&rn.fim<=fimAtual)){ flash('O novo fim precisa ser depois do fim atual'); return; }
    const novoV=+rn.valor||0, antes=+p.ticket||0;
    muda(x=>{
      x.ctRenovacoes=[...(x.ctRenovacoes||[]),{id:uid(),em:hojeISO(),de:ctFim(x),ate:rn.fim,ticketAntes:antes,ticketDepois:novoV||antes}];
      x.ctFim=rn.fim;
      if(novoV&&novoV!==antes){
        const base=(x.ticketHist&&x.ticketHist.length)? x.ticketHist : [{id:uid(),data:ctIni(x)||hojeISO(),valor:antes,motivo:'Contrato inicial'}];
        x.ticketHist=[...base,{id:uid(),data:diaSeguinte,valor:novoV,motivo:rn.motivo||'Renovação'}].sort((a,b)=>a.data<b.data?-1:1);
        x.ticket=valorHistEm(x.ticketHist,hojeISO())||antes;
      }
    });
    flash('Contrato renovado até '+fmtBR(rn.fim)); close();
  };
  const muda=(fn)=>update(d=>{ const x=d.projects.find(y=>y.id===p.id); if(x) fn(x); return d; });
  const salvar=()=>{
    muda(x=>{
      x.horasPlan=+f.horasPlan||0; x.ctInicio=f.ctInicio||''; x.ctFim=f.ctFim||'';
      x.diaVenc=+f.diaVenc||''; x.formaPag=f.formaPag||''; x.ctObs=f.ctObs||'';
      if(!travado){ const v=+f.ticket||0; x.ticket=v;
        x.ticketHist=v? [{id:(hist[0]&&hist[0].id)||uid(),data:f.ctInicio||hojeISO(),valor:v,motivo:'Contrato inicial'}] : []; }
      else if(hist[0]&&f.ctInicio&&hist[0].data!==f.ctInicio){
        x.ticketHist=(x.ticketHist||[]).map(h=>h.id===hist[0].id?{...h,data:f.ctInicio}:h); }
    });
    flash('Contrato de '+p.name+' salvo'); close();
  };
  const reajustar=()=>{ const v=+rj.valor||0; if(!v) return;
    muda(x=>{ const base=(x.ticketHist&&x.ticketHist.length)? x.ticketHist : (+x.ticket? [{id:uid(),data:ctIni(x)||rj.data,valor:+x.ticket,motivo:'Contrato inicial'}] : []);
      x.ticketHist=[...base,{id:uid(),data:rj.data||hojeISO(),valor:v,motivo:rj.motivo||'Reajuste'}].sort((a,b)=>a.data<b.data?-1:1);
      x.ticket=valorHistEm(x.ticketHist,hojeISO())||v; });
    setRj({valor:'',data:hojeISO(),motivo:''}); flash('Reajuste registrado');
  };
  const apagarHist=(id)=>{ if(!confirm('Apagar este registro do histórico?')) return;
    muda(x=>{ x.ticketHist=(x.ticketHist||[]).filter(h=>h.id!==id); const vh=valorHistEm(x.ticketHist,hojeISO()); x.ticket=vh===null? +x.ticket||0 : vh; }); };
  const encerrar=()=>{ muda(x=>{ x.ctEncerradoEm=enc.data||hojeISO(); x.ctMotivo=enc.motivo; x.ctMotivoObs=enc.obs; });
    flash('Contrato encerrado'); close(); };
  const reabrir=()=>{ if(!confirm('Reabrir o contrato de '+p.name+'? Ele volta a contar na receita.')) return;
    muda(x=>{ x.ctEncerradoEm=''; x.ctMotivo=''; x.ctMotivoObs=''; }); flash('Contrato reaberto'); close(); };
  const tk=+f.ticket||0, hp=+f.horasPlan||0;
  const encerrado=!!(p.ctEncerradoEm&&p.ctEncerradoEm<=hojeISO());
  return (<div className="overlay" onClick={close}><div className="modal wide" onClick={e=>e.stopPropagation()}>
    <div className="modal-h"><h3><span style={{display:'inline-block',width:10,height:10,borderRadius:'50%',background:corDoCliente(p),marginRight:8}}></span>
      Contrato · {p.name}</h3><button className="x" onClick={close}>{I.x}</button></div>
    <div className="modal-b">
      <div className="ct-sec">Condições</div>
      <div className="ct-form">
        <div className="fld"><label>Ticket mensal (R$)</label>
          <input type="number" min="0" step="50" className="inp" value={travado?String(+p.ticket||''):f.ticket} disabled={travado} onChange={e=>set('ticket',e.target.value)}/>
          {travado&&<div className="ct-ajuda">Com reajustes registrados, o ticket muda pelo reajuste abaixo.</div>}</div>
        <div className="fld"><label>Horas contratadas por mês</label>
          <input type="number" min="0" step="1" className="inp" value={f.horasPlan} onChange={e=>set('horasPlan',e.target.value)}/>
          <div className="ct-ajuda">{(travado?+p.ticket:tk)&&hp? fmtRS((travado?+p.ticket:tk)/hp)+' por hora contratada' : ' '}</div></div>
        <div className="fld"><label>Início do contrato</label>
          <input type="date" className="inp" value={f.ctInicio} onChange={e=>set('ctInicio',e.target.value)}/></div>
        <div className="fld"><label>Fim da vigência</label>
          <input type="date" className="inp" value={f.ctFim} onChange={e=>set('ctFim',e.target.value)}/>
          <div className="ct-ajuda">Deixe vazio se o contrato não tem prazo.</div></div>
        <div className="fld"><label>Forma de pagamento</label>
          <select className="sel" value={f.formaPag} onChange={e=>set('formaPag',e.target.value)}>
            <option value="">—</option>{FORMAS_PAG.map(x=><option key={x}>{x}</option>)}</select></div>
        <div className="fld"><label>Dia de vencimento</label>
          <input type="number" min="1" max="31" className="inp" value={f.diaVenc} onChange={e=>set('diaVenc',e.target.value)}/></div>
      </div>
      <div className="fld"><label>Observações do contrato</label>
        <textarea className="inp" rows={2} value={f.ctObs} placeholder="Multa, índice de reajuste, escopo fora do contrato…" onChange={e=>set('ctObs',e.target.value)}/></div>

      <div className="ct-sec">Histórico do ticket</div>
      {hist.length? <div className="ct-hist">{hist.map((h,i)=>{ const ant=i? +hist[i-1].valor : 0, v=ant? Math.round((+h.valor-ant)/ant*1000)/10 : null;
          return (<div key={h.id} className="ct-hist-l">
            <span className="mono">{fmtBR(h.data)}</span><b className="mono">{fmtRS(h.valor)}</b>
            <span>{h.motivo}</span>
            {v!==null? <span className="mono" style={{color:v>=0?'#2E7FA8':'#9a5a16',fontWeight:700}}>{v>0?'+':''}{String(v).replace('.',',')}%</span> : <span></span>}
            {hist.length>1&&<button className="icon-btn" title="Apagar registro" onClick={()=>apagarHist(h.id)}>{I.x}</button>}
          </div>);})}</div>
        : <div className="muted" style={{fontSize:'.78rem',marginBottom:8}}>Nenhum valor registrado ainda. Preencha o ticket mensal acima.</div>}
      <div className="ct-rj">
        <div className="fld" style={{marginBottom:0}}><label>Novo ticket</label>
          <input type="number" min="0" step="50" className="inp" value={rj.valor} onChange={e=>setRj(x=>({...x,valor:e.target.value}))}/></div>
        <div className="fld" style={{marginBottom:0}}><label>A partir de</label>
          <input type="date" className="inp" value={rj.data} onChange={e=>setRj(x=>({...x,data:e.target.value}))}/></div>
        <div className="fld" style={{marginBottom:0,flex:2}}><label>Motivo</label>
          <input className="inp" value={rj.motivo} placeholder="Reajuste anual (IPCA), ampliação de escopo…" onChange={e=>setRj(x=>({...x,motivo:e.target.value}))}/></div>
        <button className="btn btn-ghost btn-sm" onClick={reajustar} disabled={!(+rj.valor>0)}>Registrar reajuste</button>
      </div>

      {!(p.ctEncerradoEm&&p.ctEncerradoEm<=hojeISO())&&<div ref={renRef} className={foco==='renovar'?'ct-foco':''}>
        <div className="ct-sec">Renovação</div>
        <div className="muted" style={{fontSize:'.76rem',marginBottom:8,lineHeight:1.5}}>
          {fimAtual? <>A vigência atual vai até <b>{fmtBR(fimAtual)}</b>. Renovar estende o mesmo contrato: o cliente não sai da receita e não conta como cancelamento.
            Se o valor mudar, o novo ticket vale a partir de {fmtBR(diaSeguinte)}.</>
            : <>Este contrato não tem fim de vigência. Para registrar um prazo, preencha “Fim da vigência” acima.</>}</div>
        {fimAtual&&<div className="ct-rj">
          <div className="fld" style={{marginBottom:0}}><label>Novo fim da vigência</label>
            <input type="date" className="inp" value={rn.fim} onChange={e=>setRn(x=>({...x,fim:e.target.value}))}/>
            <div className="row" style={{gap:5,marginTop:5}}>{[6,12,24].map(m=><button key={m} type="button" className="fpill" style={{padding:'3px 9px',fontSize:'.68rem'}} onClick={()=>prazoRn(m)}>+{m} meses</button>)}</div></div>
          <div className="fld" style={{marginBottom:0}}><label>Ticket na renovação</label>
            <input type="number" min="0" step="50" className="inp" value={rn.valor} onChange={e=>setRn(x=>({...x,valor:e.target.value}))}/>
            <div className="ct-ajuda">{+rn.valor&&+p.ticket&&+rn.valor!==+p.ticket? ((+rn.valor>+p.ticket?'+':'')+String(Math.round((+rn.valor-+p.ticket)/+p.ticket*1000)/10).replace('.',',')+'% sobre o atual') : 'mesmo valor'}</div></div>
          <div className="fld" style={{marginBottom:0,flex:1.6}}><label>Motivo do valor</label>
            <input className="inp" value={rn.motivo} placeholder="Renovação com reajuste (IPCA)…" onChange={e=>setRn(x=>({...x,motivo:e.target.value}))}/>
            <div className="ct-ajuda"> </div></div>
          <button className="btn btn-primary btn-sm" style={{marginBottom:20}} onClick={renovar}>Renovar contrato</button>
        </div>}
        {(p.ctRenovacoes||[]).length>0&&<div className="ct-hist" style={{marginTop:4}}>{(p.ctRenovacoes||[]).slice().reverse().map(r=>(
          <div key={r.id} className="ct-hist-l" style={{gridTemplateColumns:'86px minmax(0,1fr) auto'}}>
            <span className="mono">{fmtBR(r.em)}</span>
            <span>Renovado: {r.de?fmtBR(r.de):'sem prazo'} → {fmtBR(r.ate)}</span>
            <b className="mono">{r.ticketDepois!==r.ticketAntes? fmtRS(r.ticketAntes)+' → '+fmtRS(r.ticketDepois) : fmtRS(r.ticketDepois)}</b></div>))}</div>}
      </div>}
      {(p.ctAnteriores||[]).length>0&&<><div className="ct-sec">Contratos anteriores</div>
        {(p.ctAnteriores||[]).map((c,i)=>(<div key={i} className="ct-hist-l" style={{gridTemplateColumns:'1fr auto'}}>
          <span>{fmtBR(c.inicio)} a {fmtBR(c.encerradoEm)} · {c.motivo||'encerrado'}</span><b className="mono">{fmtRS(c.ticket)}</b></div>))}</>}
      <div className="ct-sec">Encerramento</div>
      {encerrado
        ? <div className="ct-enc"><div><b>Encerrado em {fmtBR(p.ctEncerradoEm)}</b> · {p.ctMotivo||'sem motivo registrado'}
            {p.ctMotivoObs&&<div className="muted" style={{fontSize:'.76rem'}}>{p.ctMotivoObs}</div>}</div>
            <button className="btn btn-ghost btn-sm" onClick={reabrir}>Reabrir contrato</button></div>
        : !abrirEnc? <div className="row" style={{gap:10,alignItems:'center'}}>
            <span className="muted" style={{fontSize:'.78rem',flex:1}}>Ao encerrar, o cliente sai da receita recorrente a partir da data informada e entra nos cancelamentos da análise. O cadastro do cliente continua.</span>
            <button className="btn btn-ghost btn-sm" style={{color:'#B33A3A'}} onClick={()=>setAbrirEnc(true)}>Encerrar contrato</button></div>
        : <div className="ct-rj">
            <div className="fld" style={{marginBottom:0}}><label>Encerrado em</label>
              <input type="date" className="inp" value={enc.data} onChange={e=>setEnc(x=>({...x,data:e.target.value}))}/></div>
            <div className="fld" style={{marginBottom:0,flex:1.4}}><label>Motivo</label>
              <select className="sel" value={enc.motivo} onChange={e=>setEnc(x=>({...x,motivo:e.target.value}))}>{MOTIVOS_SAIDA.map(m=><option key={m}>{m}</option>)}</select></div>
            <div className="fld" style={{marginBottom:0,flex:2}}><label>Observação</label>
              <input className="inp" value={enc.obs} onChange={e=>setEnc(x=>({...x,obs:e.target.value}))}/></div>
            <button className="btn btn-sm" style={{background:'#B33A3A',color:'#fff'}} onClick={encerrar}>Confirmar</button>
          </div>}
    </div>
    <div className="modal-f"><span/><div className="row">
      <button className="btn btn-ghost" onClick={close}>Cancelar</button>
      <button className="btn btn-primary" onClick={salvar}>Salvar condições</button></div></div>
  </div></div>);
}

/* Novo contrato: para um cliente que já está no sistema (sem contrato ou
   com o anterior encerrado) ou para um cliente novo, criado aqui mesmo. */
function NovoContratoModal({close,onCriado}){
  const {db,update,flash}=useDB();
  const hoje=hojeISO();
  const disponiveis=(db.projects||[]).filter(p=>{ const k=situacaoContrato(p).k; return k==='sem'||k==='encerrado'; })
    .sort((a,b)=>a.name.localeCompare(b.name));
  const [modo,setModo]=useState(disponiveis.length?'existente':'novo');
  const [pid,setPid]=useState((disponiveis[0]||{}).id||'');
  const [nome,setNome]=useState('');
  const [f,setF]=useState({ticket:'',horasPlan:'',inicio:hoje,fim:'',formaPag:'',diaVenc:'',obs:''});
  const [erro,setErro]=useState('');
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const prazo=(m)=>set('fim',f.inicio? isoDate(addDays(addMonths(f.inicio,m),-1)) : '');
  const criar=()=>{
    const v=+f.ticket||0;
    if(modo==='novo'&&!nome.trim()){ setErro('Escreva o nome do cliente.'); return; }
    if(modo==='existente'&&!pid){ setErro('Escolha o cliente.'); return; }
    if(!v){ setErro('Informe o ticket mensal.'); return; }
    if(!f.inicio){ setErro('Informe o início do contrato.'); return; }
    if(f.fim&&f.fim<f.inicio){ setErro('O fim não pode ser antes do início.'); return; }
    if(modo==='novo'&&(db.projects||[]).some(p=>chaveImp(p.name)===chaveImp(nome))){ setErro('Já existe um cliente com esse nome. Escolha-o em “Cliente que já está no sistema”.'); return; }
    let idFinal=pid;
    update(d=>{
      let x;
      if(modo==='novo'){
        const id=clienteDaImportacao(d,nome.trim()); x=d.projects.find(p=>p.id===id);
        x.importado=false; x.startDate=f.inicio;
        x.feed=[{id:uid(),type:'sistema',title:'Cliente criado pelo contrato',description:'Entrou na carteira pela aba Contratos.',
          author:EU_ATUAL||'',date:fmtBR(hojeISO()),links:[],attachments:[]}];
      } else x=d.projects.find(p=>p.id===pid);
      if(!x) return d;
      idFinal=x.id;
      /* renovação: o contrato encerrado vai para o histórico do cliente */
      if(x.ctEncerradoEm||x.archived){
        if(x.ctEncerradoEm) x.ctAnteriores=[...(x.ctAnteriores||[]),{inicio:ctIni(x),fim:ctFim(x),encerradoEm:x.ctEncerradoEm,motivo:x.ctMotivo||'',ticket:+x.ticket||0}];
        x.ctEncerradoEm=''; x.ctMotivo=''; x.ctMotivoObs=''; x.archived=false; x.archivedAt='';
      }
      x.ctInicio=f.inicio; x.ctFim=f.fim||''; x.horasPlan=+f.horasPlan||0;
      x.formaPag=f.formaPag||''; x.diaVenc=+f.diaVenc||''; x.ctObs=f.obs||'';
      x.ticket=v;
      x.ticketHist=[...(x.ticketHist||[]).filter(h=>h.data<f.inicio),{id:uid(),data:f.inicio,valor:v,motivo:x.ctAnteriores&&x.ctAnteriores.length?'Novo contrato (renovação)':'Contrato inicial'}];
      return d;
    });
    flash(modo==='novo'? 'Cliente e contrato criados' : 'Contrato criado');
    onCriado&&onCriado(idFinal); close();
  };
  const sel=disponiveis.find(p=>p.id===pid);
  return (<div className="overlay" onClick={close}><div className="modal wide" onClick={e=>e.stopPropagation()}>
    <div className="modal-h"><h3>Novo contrato</h3><button className="x" onClick={close}>{I.x}</button></div>
    <div className="modal-b">
      <div className="ct-sec">Cliente</div>
      <div className="seg-ctrl" style={{marginBottom:12}}>
        <button className={modo==='existente'?'on':''} onClick={()=>setModo('existente')} disabled={!disponiveis.length}>Cliente que já está no sistema</button>
        <button className={modo==='novo'?'on':''} onClick={()=>setModo('novo')}>Cliente novo</button>
      </div>
      {modo==='existente'
        ? (disponiveis.length? <div className="fld"><label>Cliente</label>
            <select className="sel" value={pid} onChange={e=>setPid(e.target.value)}>
              {disponiveis.map(p=><option key={p.id} value={p.id}>{p.name}{situacaoContrato(p).k==='encerrado'?' · contrato anterior encerrado':''}</option>)}</select>
            <div className="ct-ajuda">{sel&&situacaoContrato(sel).k==='encerrado'? 'É uma renovação: o contrato anterior fica guardado no histórico e continua contando no período dele.' : 'Aparecem aqui os clientes sem contrato e os com contrato encerrado.'}</div></div>
          : <div className="muted" style={{fontSize:'.8rem',marginBottom:10}}>Todos os clientes já têm contrato vigente.</div>)
        : <div className="fld"><label>Nome do cliente</label>
            <input className="inp" value={nome} autoFocus placeholder="Ex.: Padaria Pão Dourado" onChange={e=>setNome(e.target.value)}/>
            <div className="ct-ajuda">O cliente é criado na carteira só com o nome. Tier, setor, equipe e o resto do cadastro você completa depois em Clientes.</div></div>}

      <div className="ct-sec">Condições</div>
      <div className="ct-form">
        <div className="fld"><label>Ticket mensal (R$)</label>
          <input type="number" min="0" step="50" className="inp" value={f.ticket} onChange={e=>set('ticket',e.target.value)}/></div>
        <div className="fld"><label>Horas contratadas por mês</label>
          <input type="number" min="0" step="1" className="inp" value={f.horasPlan} onChange={e=>set('horasPlan',e.target.value)}/>
          <div className="ct-ajuda">{+f.ticket&&+f.horasPlan? fmtRS(+f.ticket/+f.horasPlan)+' por hora contratada' : ' '}</div></div>
        <div className="fld"><label>Início do contrato</label>
          <input type="date" className="inp" value={f.inicio} onChange={e=>set('inicio',e.target.value)}/></div>
        <div className="fld"><label>Fim da vigência</label>
          <input type="date" className="inp" value={f.fim} onChange={e=>set('fim',e.target.value)}/>
          <div className="row" style={{gap:5,marginTop:5}}>{[6,12,24].map(m=><button key={m} type="button" className="fpill" style={{padding:'3px 9px',fontSize:'.68rem'}} onClick={()=>prazo(m)}>{m} meses</button>)}
            <button type="button" className="fpill" style={{padding:'3px 9px',fontSize:'.68rem'}} onClick={()=>set('fim','')}>sem prazo</button></div></div>
        <div className="fld"><label>Forma de pagamento</label>
          <select className="sel" value={f.formaPag} onChange={e=>set('formaPag',e.target.value)}>
            <option value="">—</option>{FORMAS_PAG.map(x=><option key={x}>{x}</option>)}</select></div>
        <div className="fld"><label>Dia de vencimento</label>
          <input type="number" min="1" max="31" className="inp" value={f.diaVenc} onChange={e=>set('diaVenc',e.target.value)}/></div>
      </div>
      <div className="fld"><label>Observações do contrato</label>
        <textarea className="inp" rows={2} value={f.obs} placeholder="Multa, índice de reajuste, escopo fora do contrato…" onChange={e=>set('obs',e.target.value)}/></div>
      {erro&&<div className="nv-erro" style={{marginTop:0}}>{erro}</div>}
    </div>
    <div className="modal-f"><span/><div className="row">
      <button className="btn btn-ghost" onClick={close}>Cancelar</button>
      <button className="btn btn-primary" onClick={criar}>Criar contrato</button></div></div>
  </div></div>);
}

function ContratosPage(){
  const {db,go,update}=useDB();
  const [fil,setFil]=useState('ativos');
  const [busca,setBusca]=useState('');
  const [aberto,setAberto]=useState(null);
  const [foco,setFoco]=useState('');
  const [editar,setEditar]=useState(false);
  const [novo,setNovo]=useState(false);
  const hoje=hojeISO();
  const todos=(db.projects||[]).filter(p=>!p.archived||+p.ticket>0||p.ctEncerradoEm);
  const linhas=todos.map(p=>({p,sit:situacaoContrato(p)}));
  const vig=linhas.filter(x=>['vigente','vence','vencido'].includes(x.sit.k));
  const mrr=vig.reduce((a,x)=>a+(+x.p.ticket||0),0);
  const venc90=linhas.filter(x=>x.sit.k==='vence');
  const semDados=linhas.filter(x=>x.sit.k==='sem');
  const encerr=linhas.filter(x=>x.sit.k==='encerrado');
  const vencidos=linhas.filter(x=>x.sit.k==='vencido');
  const FILS=[['ativos','Ativos',linhas.filter(x=>x.sit.k!=='encerrado').length],['vence','Vencem em 90 dias',venc90.length],
    ['vencido','Vigência passou',vencidos.length],['sem','Sem contrato',semDados.length],['encerrado','Encerrados',encerr.length],['todos','Todos',linhas.length]];
  const ORD={vencido:0,vence:1,sem:2,futuro:3,vigente:4,encerrado:5};
  const lista=linhas.filter(x=>fil==='todos'?true:fil==='ativos'?x.sit.k!=='encerrado':x.sit.k===fil)
    .filter(x=>!busca||x.p.name.toLowerCase().includes(busca.toLowerCase()))
    /* editando na tabela, a ordem fica parada por nome — a linha não pula enquanto você preenche */
    .sort((a,b)=> editar? a.p.name.localeCompare(b.p.name)
      : (ORD[a.sit.k]-ORD[b.sit.k])||((+b.p.ticket||0)-(+a.p.ticket||0))||a.p.name.localeCompare(b.p.name));
  const setCampo=(pid,campo,valor)=>update(d=>{ const p=d.projects.find(x=>x.id===pid); if(!p) return d;
    if(campo==='ticket'){ const v=+valor||0; p.ticket=v; const h=p.ticketHist||[];
      if(h.length<=1) p.ticketHist=v? [{id:(h[0]&&h[0].id)||uid(),data:ctIni(p)||hojeISO(),valor:v,motivo:'Contrato inicial'}] : []; }
    else if(campo==='horasPlan') p.horasPlan=+valor||0;
    else p[campo]=valor||'';
    return d; });
  const pAberto=aberto&&(db.projects||[]).find(x=>x.id===aberto);

  return (<div>
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="row" style={{gap:28,flexWrap:'wrap'}}>
        <span className="stat-mini"><span className="n" style={{color:'var(--green)'}}>{fmtRS(mrr)}</span><span className="l">receita recorrente mensal</span></span>
        <span className="stat-mini"><span className="n">{vig.length}</span><span className="l">contratos vigentes</span></span>
        <span className="stat-mini"><span className="n" style={{color:venc90.length?'#9a5a16':'var(--text-3)'}}>{venc90.length}</span><span className="l">vencem em 90 dias · {fmtRS(venc90.reduce((a,x)=>a+(+x.p.ticket||0),0))}</span></span>
        <span className="stat-mini"><span className="n" style={{color:vencidos.length?'#B33A3A':'var(--text-3)'}}>{vencidos.length}</span><span className="l">com vigência vencida</span></span>
        <span className="stat-mini"><span className="n" style={{color:semDados.length?'#9a5a16':'var(--text-3)'}}>{semDados.length}</span><span className="l">sem contrato preenchido</span></span>
        <span className="stat-mini"><span className="n" style={{color:'var(--text-3)'}}>{encerr.length}</span><span className="l">encerrados</span></span>
      </div>
    </div>

    <div className="card card-pad">
      <div className="between" style={{flexWrap:'wrap',gap:10,marginBottom:12}}>
        <div className="row" style={{gap:6,flexWrap:'wrap'}}>{FILS.map(([k,l,n])=>
          <button key={k} className={'fpill '+(fil===k?'on':'')} onClick={()=>setFil(k)}>{l} <span style={{opacity:.7}}>{n}</span></button>)}</div>
        <div className="row" style={{gap:8}}>
          <input className="inp inp-sm" style={{width:180}} placeholder="Buscar cliente…" value={busca} onChange={e=>setBusca(e.target.value)}/>
          <button className={'btn btn-sm '+(editar?'btn-primary':'btn-ghost')} onClick={()=>setEditar(e=>!e)}>{editar?'Concluir edição':'Editar na tabela'}</button>
          <button className="btn btn-primary btn-sm" style={{whiteSpace:'nowrap'}} onClick={()=>setNovo(true)}>{I.plus} Novo contrato</button>
          <button className="btn btn-ghost btn-sm" style={{whiteSpace:'nowrap'}} onClick={()=>go('analise')}>Ver análise</button>
        </div>
      </div>
      {editar&&<div className="muted" style={{fontSize:'.74rem',marginBottom:8}}>Preencha direto na tabela; cada campo grava ao sair dele. Reajustes, pagamento e encerramento ficam na ficha — clique no nome do cliente.</div>}
      <div style={{overflowX:'auto'}}><table className="tbl">
        <thead><tr><th>Cliente</th><th>Situação</th><th>Início</th><th>Fim da vigência</th><th>Tempo</th>
          <th>Ticket</th><th>Horas/mês</th><th>R$/h</th><th>Último reajuste</th><th></th></tr></thead>
        <tbody>{lista.map(({p,sit})=>{
          const tk=+p.ticket||0, hp=+p.horasPlan||0;
          const hist=(p.ticketHist||[]).slice().sort((a,b)=>a.data<b.data?-1:1);
          const ult=hist.length>1? hist[hist.length-1] : null, pen=hist.length>1? hist[hist.length-2] : null;
          const vr=ult&&pen&&+pen.valor? Math.round((+ult.valor-+pen.valor)/+pen.valor*1000)/10 : null;
          const meses=mesesDeCasa(p);
          return (<tr key={p.id}>
            <td><div className="row" style={{gap:7,cursor:'pointer'}} onClick={()=>setAberto(p.id)}>
              <span style={{width:9,height:9,borderRadius:'50%',background:corDoCliente(p),flex:'none'}}></span>
              <b style={{fontSize:'.85rem'}}>{p.name}</b></div>
              <div className="muted" style={{fontSize:'.68rem'}}>{[p.tier,p.formaPag&&(p.formaPag+(p.diaVenc?' · dia '+p.diaVenc:''))].filter(Boolean).join(' · ')}</div></td>
            <td><PillCt sit={sit}/>{sit.k==='encerrado'&&p.ctMotivo&&<div className="muted" style={{fontSize:'.64rem',marginTop:2}}>{p.ctMotivo}</div>}</td>
            {editar? <td><input type="date" className="inp inp-sm" defaultValue={ctIni(p)} onBlur={e=>e.target.value!==ctIni(p)&&setCampo(p.id,'ctInicio',e.target.value)}/></td>
              : <td className="mono" style={{fontSize:'.76rem'}}>{ctIni(p)?fmtBR(ctIni(p)):'—'}</td>}
            {editar? <td><input type="date" className="inp inp-sm" defaultValue={ctFim(p)} onBlur={e=>e.target.value!==ctFim(p)&&setCampo(p.id,'ctFim',e.target.value)}/></td>
              : <td className="mono" style={{fontSize:'.76rem'}}>{ctFim(p)?fmtBR(ctFim(p)):<span className="muted">sem prazo</span>}</td>}
            <td className="mono" style={{fontSize:'.76rem'}}>{meses?meses+' m':'—'}</td>
            {editar&&hist.length<=1? <td><input type="number" min="0" step="50" className="inp inp-sm" style={{width:105}} defaultValue={tk||''} placeholder="R$/mês"
                  onBlur={e=>(+e.target.value||0)!==tk&&setCampo(p.id,'ticket',e.target.value)}/></td>
              : <td className="mono" style={{fontSize:'.82rem',fontWeight:800,whiteSpace:'nowrap'}}>{tk?fmtRS(tk):'—'}
                  {ticketFuturo(p)&&<div style={{fontSize:'.64rem',fontWeight:600,color:'#2E7FA8'}}>→ {fmtRS(ticketFuturo(p).valor)} em {fmtBR(ticketFuturo(p).data).slice(0,5)}</div>}</td>}
            {editar? <td><input type="number" min="0" step="1" className="inp inp-sm" style={{width:72}} defaultValue={hp||''} placeholder="h/mês"
                  onBlur={e=>(+e.target.value||0)!==hp&&setCampo(p.id,'horasPlan',e.target.value)}/></td>
              : <td className="mono" style={{fontSize:'.78rem'}}>{hp?hp+'h':'—'}</td>}
            <td className="mono" style={{fontSize:'.76rem',color:'var(--text-2)',whiteSpace:'nowrap'}}>{tk&&hp?fmtRS(tk/hp):'—'}</td>
            <td>{ult? <><span className="mono" style={{fontSize:'.74rem'}}>{fmtBR(ult.data)}</span>
                {vr!==null&&<span className="mono" style={{fontSize:'.72rem',fontWeight:700,marginLeft:6,color:vr>=0?'#2E7FA8':'#9a5a16'}}>{vr>0?'+':''}{String(vr).replace('.',',')}%</span>}
                <div className="muted" style={{fontSize:'.64rem'}}>{ult.motivo}</div></>
              : <span className="muted" style={{fontSize:'.72rem'}}>—</span>}</td>
            <td><div className="row" style={{gap:5,flexWrap:'nowrap'}}>
              {(sit.k==='vence'||sit.k==='vencido')&&<button className="btn btn-primary btn-sm" onClick={()=>{setFoco('renovar');setAberto(p.id);}}>Renovar</button>}
              <button className="btn btn-ghost btn-sm" onClick={()=>{setFoco('');setAberto(p.id);}}>Abrir</button></div></td>
          </tr>);})}
          {!lista.length&&<tr><td colSpan={10}><div className="muted" style={{fontSize:'.8rem',padding:'10px 0'}}>Nenhum contrato neste filtro.</div></td></tr>}
        </tbody></table></div>
      <div className="muted" style={{fontSize:'.72rem',marginTop:10,lineHeight:1.5}}>
        Contrato chegando ao fim aparece como “Vence em breve” com o botão <b>Renovar</b>: a renovação estende o mesmo contrato, sem tirar o cliente da receita.
        As datas do contrato são próprias e não mexem no cronograma do projeto. Sem data de início, vale a data de início do cliente.
        A Análise de Carteira lê tudo daqui: ticket e reajustes formam a receita mês a mês, o fim da vigência vira vencimento e o encerramento entra nos cancelamentos.
      </div>
    </div>
    {pAberto&&<ContratoModal p={pAberto} foco={foco} close={()=>{setAberto(null);setFoco('');}}/>}
    {novo&&<NovoContratoModal close={()=>setNovo(false)} onCriado={()=>setFil('ativos')}/>}
  </div>);
}

function PainelComercial({projs,db,go,update}){
  return (<div>
    <AnaliseComercial db={db} go={go} update={update} onEditar={()=>go('contratos')}/>
    <div className="card card-pad ct-link">
      <div><b>Contratos</b><span className="muted"> · ticket, reajustes, horas, vigência e encerramento de cada cliente ficam na aba Contratos.</span></div>
      <button className="btn btn-ghost btn-sm" onClick={()=>go('contratos')}>{I.doc} Abrir Contratos</button>
    </div>
  </div>);
}

function AnalisePage(){
  const {db,go,update}=useDB();
  const [per,setPer]=useState('mes');
  const [modo,setModo]=useState('comercial');   // comercial | cliente | pessoa

  const faixa=useMemo(()=>{
    const seg=mondayOf(TODAY), y=TODAY.getFullYear(), m=TODAY.getMonth();
    if(per==='semana') return {ini:isoDate(seg),fim:isoDate(addDays(seg,6)),rot:'semana de '+fmtBR(isoDate(seg))};
    if(per==='mes') return {ini:isoDate(new Date(y,m,1)),fim:isoDate(new Date(y,m+1,0)),rot:MES[m]+' '+y};
    if(per==='mes_prox') return {ini:isoDate(new Date(y,m+1,1)),fim:isoDate(new Date(y,m+2,0)),rot:MES[(m+1)%12]+' '+(m===11?y+1:y)};
    if(per==='trim') return {ini:isoDate(TODAY),fim:isoDate(new Date(y,m+3,0)),rot:'próximos 3 meses'};
    return {ini:'0000-01-01',fim:'9999-12-31',rot:'todo o período'};
  },[per]);
  const dias=useMemo(()=>{
    if(per==='tudo') return 90;
    return Math.max(1,Math.round((dLocal(faixa.fim)-dLocal(faixa.ini))/86400000)+1);
  },[faixa,per]);

  const linhas=useMemo(()=>horasDoSprint(db,faixa.ini,faixa.fim),[db,faixa]);
  const projs=ativos(db);
  const equipe=db.team;

  /* ---- matriz cliente × pessoa ---- */
  /* ALOCADO = as horas das tarefas do sprint no período. ENTREGUE = a parte
     dessas horas que já está em tarefa concluída. PLANEJADO = as horas que
     você informou no contrato do cliente. */
  const hoje=hojeISO();
  const filtra=(pid,who)=>linhas.filter(l=>(pid===null? !l.pid : l.pid===pid)&&(!who||l.who===who));
  const min=(pid,who)=>somaMin(filtra(pid,who));                                   // alocado no período
  const minPassado=(pid,who)=>somaMin(filtra(pid,who).filter(l=>l.feito));          // já concluído
  const totalMin=somaMin(linhas);
  const totalPassado=somaMin(linhas.filter(l=>l.feito));
  const porCliente=projs.map(p=>({p,min:min(p.id,null),passado:minPassado(p.id,null),
    plan:Math.round(horasPlanPeriodo(p,dias)*60)}))
    .filter(x=>x.min>0||x.plan>0).sort((a,b)=>b.min-a.min);
  const minGerais=min(null,null);
  const porPessoa=equipe.map(m=>({m,min:somaMin(linhas.filter(l=>l.who===m.id)),
    passado:somaMin(linhas.filter(l=>l.who===m.id&&l.iso<=hoje))})).filter(x=>x.min>0)
    .sort((a,b)=>b.min-a.min);
  const planTot=porCliente.reduce((a,x)=>a+x.plan,0);

  /* ---- capacidade: horas úteis do período por pessoa ---- */
  const diasUteis=useMemo(()=>{
    if(per==='tudo') return 66;
    let n=0,d=dLocal(faixa.ini),g=0;
    while(d<=dLocal(faixa.fim)&&g++<400){ if(!ehFimDeSemana(isoDate(d))) n++; d=addDays(d,1); }
    return n;
  },[faixa,per]);
  /* A régua de cada pessoa é a capacidade semanal cadastrada em Equipe,
     proporcional aos dias úteis do período. Sem cadastro, vale a jornada. */
  const capDaPessoa=(m)=>Math.round(((+m.cap||+m.capacity||((JOR_FIM-JOR_INI)*5))/5)*diasUteis*60);

  const ticketTot=porCliente.reduce((a,x)=>a+ticketDoPeriodo(x.p,dias),0);
  const rsHora=totalMin? ticketTot/(totalMin/60) : 0;

  const Barra=({v,max,cor})=>(<div className="bar-track"><div className="bar-fill"
    style={{width:(max?Math.min(100,v/max*100):0)+'%',background:cor}}></div></div>);

  /* Uma barra só: o contratado define o trilho, o realizado preenche.
     Passando de 100%, o excedente continua em vermelho depois da marca. */
  const BarraPlano=({plan,real,cor})=>{
    if(!plan) return (<div className="bplan sem"><div className="bplan-fill" style={{width:'100%',background:'#c9d2d0'}}></div></div>);
    const r=real/plan;
    if(r<=1) return (<div className="bplan">
      <div className="bplan-fill" style={{width:(r*100)+'%',background:cor}}></div></div>);
    const dentro=100/r;                       // onde fica a marca do contratado
    return (<div className="bplan estourou">
      <div className="bplan-fill" style={{width:dentro+'%',background:cor}}></div>
      <div className="bplan-over" style={{left:dentro+'%',width:(100-dentro)+'%'}}></div>
      <div className="bplan-marca" style={{left:dentro+'%'}} title="limite contratado"></div>
    </div>);
  };

  return (<div>
    {/* ---- filtros ---- */}
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="between" style={{flexWrap:'wrap',gap:12}}>
        <div className="row" style={{gap:8,flexWrap:'wrap'}}>
          {modo!=='comercial'&&PERIODOS_AN.map(([k,l])=><button key={k} className={"fpill "+(per===k?'on':'')} onClick={()=>setPer(k)}>{l}</button>)}
          {modo==='comercial'&&<span className="muted" style={{fontSize:'.78rem'}}>Receita recorrente, retenção, concentração, rentabilidade por hora e vencimentos</span>}
        </div>
        <div className="seg-ctrl">
          <button className={modo==='comercial'?'on':''} onClick={()=>setModo('comercial')}>Comercial</button>
          <button className={modo==='cliente'?'on':''} onClick={()=>setModo('cliente')}>Por cliente</button>
          <button className={modo==='pessoa'?'on':''} onClick={()=>setModo('pessoa')}>Por pessoa</button>
        </div>
      </div>
      {modo!=='comercial'&&<div className="row" style={{gap:26,marginTop:14,flexWrap:'wrap'}}>
        <span className="stat-mini"><span className="n">{planTot?emHoras(planTot)+'h':'—'}</span><span className="l">contratadas · {faixa.rot}</span></span>
        <span className="stat-mini"><span className="n" style={{color:planTot&&totalMin>planTot?'var(--coral)':'var(--green)'}}>{emHoras(totalMin)}h</span><span className="l">alocadas no sprint</span></span>
        <span className="stat-mini"><span className="n" style={{color:'var(--text-3)'}}>{emHoras(totalPassado)}h</span><span className="l">em tarefas concluídas</span></span>
        <span className="stat-mini"><span className="n" style={{color:'var(--brand)'}}>{porCliente.length}</span><span className="l">clientes com horas</span></span>
        <span className="stat-mini"><span className="n" style={{color:'var(--green)'}}>{ticketTot?fmtRS(ticketTot):'—'}</span><span className="l">ticket do período</span></span>
        <span className="stat-mini"><span className="n" style={{color:rsHora&&rsHora<150?'var(--coral)':'var(--text-1)'}}>{rsHora?fmtRS(rsHora):'—'}</span><span className="l">R$ por hora alocada</span></span>
      </div>}
      {modo!=='comercial'&&(!ticketTot||!planTot)&&<div className="muted" style={{fontSize:'.74rem',marginTop:8}}>
        No Cockpit de cada cliente, informe o <b>ticket mensal</b> e as <b>horas planejadas/mês</b> do contrato.
        As horas o sistema conta sozinho: são as horas estimadas das tarefas do sprint.
      </div>}
    </div>

    {modo==='comercial' ? <PainelComercial projs={projs} db={db} go={go} update={update}/> :
     modo==='cliente' ? (<>
      {/* ---- cliente: ticket × horas ---- */}
      <div className="card card-pad" style={{marginBottom:14}}>
        <div className="card-h"><h3>Ticket × horas do time</h3><span className="sub">{faixa.rot}</span></div>
        {!porCliente.length? <div className="empty">Nenhuma hora alocada neste período.</div>
        : <><div className="muted" style={{fontSize:'.73rem',marginBottom:8}}>
            <b>Contratado</b> é o que você informou no contrato do cliente (horas/mês, proporcional ao período).
            <b> Alocado</b> é a soma das horas estimadas das tarefas deste cliente no período — as mesmas
            que você distribui no sprint. A barra é o contrato: cheia significa que a distribuição
            consumiu tudo o que foi previsto. O trecho listrado em vermelho, depois da marca, é o que passou disso.
          </div><div style={{overflowX:'auto'}}><table className="tbl">
          <thead><tr><th>Cliente</th><th style={{width:210}}>Contratado × alocado</th><th style={{width:76}}>Desvio</th>
            <th>Ticket no período</th><th>R$ por hora</th><th>Equipe envolvida</th></tr></thead>
          <tbody>{porCliente.map(({p,min:mm,passado:pp,plan:pl})=>{
            const tk=ticketDoPeriodo(p,dias), rh=mm? tk/(mm/60):0;
            const time=equipe.map(m=>({m,min:min(p.id,m.id)})).filter(x=>x.min>0).sort((a,b)=>b.min-a.min);
            const abaixo=!!(rh&&rh<rsHora*0.7);   // !! para o 0 não aparecer solto na tela
            const desvio=pl? Math.round((mm-pl)/pl*100) : null;
            const estourou=!!(pl&&mm>pl);   // !! evita o 0 aparecer solto na tela
            return (<tr key={p.id} className="click" onClick={()=>go('projects',p.id)}>
              <td><div className="row" style={{gap:7}}>
                <span style={{width:9,height:9,borderRadius:'50%',background:corDoCliente(p),flex:'none'}}></span>
                <b style={{fontSize:'.85rem'}}>{p.name}</b></div></td>
              {/* barra única: o contratado é o trilho, o alocado preenche */}
              <td>
                <div className="row" style={{gap:10,alignItems:'center'}}>
                  <div style={{flex:1}}><BarraPlano plan={pl} real={mm} cor={corDoCliente(p)}/></div>
                  <span className="mono" style={{fontSize:'.78rem',fontWeight:800,whiteSpace:'nowrap',
                    color:estourou?'#B33A3A':'var(--text-1)'}}>{emHoras(mm)}h
                    <span className="muted" style={{fontWeight:500}}> / {pl?emHoras(pl)+'h':'sem plano'}</span></span>
                </div>
                <div className="muted" style={{fontSize:'.65rem',marginTop:3}}>
                  {pp>0? emHoras(pp)+'h em tarefas concluídas' : 'nada concluído ainda'}
                  {pl>0&&mm<pl&&<span> · restam {emHoras(pl-mm)}h do contrato</span>}
                  {estourou&&<span style={{color:'#B33A3A'}}> · {emHoras(mm-pl)}h além do contratado</span>}
                </div>
              </td>
              <td>{desvio!==null? <span className="mono" style={{fontSize:'.82rem',fontWeight:800,color:estourou?'#B33A3A':'#2F8F6E'}}>
                    {desvio>0?'+':''}{desvio}%</span>
                : <span className="muted" style={{fontSize:'.72rem'}}>sem plano</span>}
                {estourou&&<div className="muted" style={{fontSize:'.66rem',color:'#B33A3A'}}>estourou</div>}</td>
              <td className="mono" style={{fontSize:'.8rem'}}>{tk?fmtRS(tk):'—'}</td>
              <td><span className="mono" style={{fontSize:'.82rem',fontWeight:800,color:abaixo?'#B33A3A':'var(--text-1)'}}>
                {rh?fmtRS(rh):'—'}</span>
                {pl>0&&<div className="mono muted" style={{fontSize:'.68rem'}}>previsto {fmtRS(tk/(pl/60))}</div>}
                {abaixo&&<div className="muted" style={{fontSize:'.66rem',color:'#B33A3A'}}>abaixo da média</div>}</td>
              <td><div className="row" style={{gap:5,flexWrap:'wrap'}}>
                {time.slice(0,5).map(({m,min:mi})=>(<span key={m.id} className="carga" style={{padding:'2px 8px 2px 2px'}}
                  title={m.name+' · '+emHoras(mi)+'h alocadas neste cliente'}>
                  <Avatar db={db} id={m.id} size="sm"/><b>{emHoras(mi)}h</b></span>))}</div></td>
            </tr>);})}
            {minGerais>0&&<tr><td className="muted">Tarefas gerais (sem cliente)</td>
              <td className="mono" style={{fontSize:'.78rem'}}>{emHoras(minGerais)}h alocadas</td>
              <td>—</td><td>—</td><td>—</td><td></td></tr>}
          </tbody></table></div></>}
      </div>

      {/* ---- matriz cliente × pessoa ---- */}
      <div className="card card-pad">
        <div className="card-h"><h3>Quem trabalha em quê</h3><span className="sub">horas alocadas, por cliente e por pessoa</span></div>
        <div style={{overflowX:'auto'}}><table className="tbl matriz">
          <thead><tr><th>Cliente</th>{equipe.map(m=><th key={m.id} style={{textAlign:'center'}}>{m.name.split(' ')[0]}</th>)}<th style={{textAlign:'right'}}>Total</th></tr></thead>
          <tbody>{porCliente.map(({p,min:mm})=>(
            <tr key={p.id}>
              <td><div className="row" style={{gap:7}}>
                <span style={{width:8,height:8,borderRadius:'50%',background:corDoCliente(p),flex:'none'}}></span>
                <span style={{fontSize:'.82rem',fontWeight:600}}>{p.name}</span></div></td>
              {equipe.map(m=>{const v=min(p.id,m.id);
                return (<td key={m.id} style={{textAlign:'center'}}>
                  {v? <span className="cel-h" style={{background:m.color+(v>=240?'2e':'14'),color:m.color}}>{emHoras(v)}</span>
                    : <span className="muted" style={{fontSize:'.7rem'}}>·</span>}</td>);})}
              <td className="mono" style={{textAlign:'right',fontWeight:800,fontSize:'.8rem'}}>{emHoras(mm)}h</td>
            </tr>))}
            <tr style={{borderTop:'2px solid var(--border)'}}>
              <td><b style={{fontSize:'.8rem'}}>Total por pessoa</b></td>
              {equipe.map(m=>{const v=somaMin(linhas.filter(l=>l.who===m.id));
                const cp=capDaPessoa(m), pct=cp?Math.round(v/cp*100):0;
                return (<td key={m.id} style={{textAlign:'center'}}>
                  <div className="mono" style={{fontWeight:800,fontSize:'.8rem'}}>{emHoras(v)}h</div>
                  <div className="muted" style={{fontSize:'.66rem',color:pct>85?'#B33A3A':undefined}}>{pct}% da capacidade</div></td>);})}
              <td className="mono" style={{textAlign:'right',fontWeight:800}}>{emHoras(totalMin)}h</td>
            </tr>
          </tbody></table></div>
        <div className="muted" style={{fontSize:'.72rem',marginTop:10}}>
          A porcentagem compara com a capacidade semanal de cada um (cadastrada em Equipe), proporcional aos
          {' '}{diasUteis} dias úteis do período. Acima de 85% a pessoa está sem folga para imprevistos.
        </div>
      </div>
    </>) : (<>
      {/* ---- por pessoa ---- */}
      {porPessoa.map(({m,min:mm,passado:pp})=>{
        const doP=linhas.filter(l=>l.who===m.id);
        const porCli=projs.map(p=>({p,min:somaMin(doP.filter(l=>l.pid===p.id))})).filter(x=>x.min>0).sort((a,b)=>b.min-a.min);
        const gerais=somaMin(doP.filter(l=>!l.pid));
        const constr=somaMin(doP.filter(l=>l.tipo==='construcao')), reun=somaMin(doP.filter(l=>l.tipo==='reuniao'));
        const cp=capDaPessoa(m), pct=cp?Math.round(mm/cp*100):0;
        return (<div key={m.id} className="card card-pad" style={{marginBottom:14,borderLeft:'4px solid '+m.color}}>
          <div className="between" style={{flexWrap:'wrap',gap:12,marginBottom:12}}>
            <div className="row" style={{gap:10}}>
              <Avatar db={db} id={m.id}/>
              <div><div style={{fontWeight:800,fontSize:'.95rem'}}>{m.name}</div>
                <div className="muted" style={{fontSize:'.74rem'}}>{m.role||'Consultoria'}</div></div>
            </div>
            <div className="row" style={{gap:22,flexWrap:'wrap'}}>
              <span className="stat-mini"><span className="n">{emHoras(mm)}h</span><span className="l">alocadas</span></span>
              <span className="stat-mini"><span className="n" style={{color:'var(--text-3)'}}>{emHoras(pp)}h</span><span className="l">concluídas</span></span>
              <span className="stat-mini"><span className="n" style={{color:pct>85?'var(--coral)':'var(--brand)'}}>{pct}%</span><span className="l">da capacidade ({emHoras(cp)}h)</span></span>
              <span className="stat-mini"><span className="n" style={{color:'var(--text-3)'}}>{emHoras(constr)}h</span><span className="l">construção</span></span>
              <span className="stat-mini"><span className="n" style={{color:'var(--text-3)'}}>{emHoras(reun)}h</span><span className="l">reuniões</span></span>
            </div>
          </div>
          {porCli.map(({p,min:mi})=>(

/* Estado inicial da matriz de um cliente: nada cumprido, nada avaliado. */
function matrizVazia(){
  const pil={};
  MAT_PILARES.forEach(p=>{
    pil[p.id]={aplicavel:p.opcional?false:true, metaNivel:3, criterios:{}};
    [1,2,3,4].forEach(n=>(p.criterios[n]||[]).forEach((txt,i)=>{
      pil[p.id].criterios[n+'.'+i]={ok:false,evidencia:'',data:''};
    }));
  });
  return {pilares:pil, historico:[], avaliadaEm:''};
}
const critId=(n,i)=>n+'.'+i;

/* Nível do pilar: o maior nível cujos critérios estão todos cumpridos,
   somados aos anteriores. Zero significa que nem o nível 1 fechou. */
function nivelDoPilar(mat,pil){
  const st=(mat.pilares||{})[pil.id]; if(!st) return 0;
  let nivel=0;
  for(const n of [1,2,3]){
    const lista=pil.criterios[n]||[];
    if(!lista.length) continue;
    const todos=lista.every((_,i)=>((st.criterios||{})[critId(n,i)]||{}).ok);
    if(todos) nivel=n; else break;
  }
  return nivel;
}
function progressoNivel(mat,pil,n){
  const st=(mat.pilares||{})[pil.id]||{criterios:{}};
  const lista=pil.criterios[n]||[];
  const ok=lista.filter((_,i)=>((st.criterios||{})[critId(n,i)]||{}).ok).length;
  return {ok,total:lista.length,pct:lista.length?Math.round(ok/lista.length*100):0};
}
/* Gaps = critérios não cumpridos dos níveis 2 e 3. São os candidatos a
   estratégia e projeto no Planejamento, conforme o método. */
function gapsDoPilar(mat,pil){
  const st=(mat.pilares||{})[pil.id]||{criterios:{}};
  const out=[];
  [1,2,3].forEach(n=>(pil.criterios[n]||[]).forEach((txt,i)=>{
    if(!((st.criterios||{})[critId(n,i)]||{}).ok) out.push({nivel:n,texto:txt,id:critId(n,i)});
  }));
  return out;
}
const pilaresAtivos=(mat)=>MAT_PILARES.filter(p=>((mat.pilares||{})[p.id]||{}).aplicavel!==false);
function nivelGeral(mat){
  const ps=pilaresAtivos(mat); if(!ps.length) return 0;
  return Math.min(...ps.map(p=>nivelDoPilar(mat,p)));
}

   d:'Tudo o que você faz é gravado neste navegador na hora. Para levar o trabalho embora — outro computador, outra pessoa, backup — use Salvar HTML (barra de cima ou Ctrl+S): sai um arquivo com os dados dentro. O contador âmbar mostra quantas alterações ainda não entraram em nenhum arquivo.'},
  {t:'Importação se desfaz',
   d:'Toda tarefa que veio de planilha guarda de qual aba veio, e cliente ou pessoa criados na hora ficam marcados. Por isso dá para desfazer: na própria tela da importação, logo depois, ou em Configurações → Base de Dados, que limpa tudo o que já entrou por planilha. O que foi cadastrado à mão não é tocado, e cliente que já ganhou conteúdo próprio fica.'},
  {t:'Importar não repete o que já existe',
   d:'Tarefa com o mesmo nome, cliente e prazo não entra duas vezes — dá para importar a mesma planilha de novo depois de atualizá-la, e só o que é novo entra. Cliente e pessoa com o nome já cadastrado também são reaproveitados em vez de duplicados.'},
  {t:'O que foi concluído não se apaga',
   d:'Tarefa concluída que sai do cronograma é preservada — perde o vínculo, mas continua no histórico. Apagar destruiria registro de trabalho feito.'},
];

        o dado nasce num lugar só, e as outras telas leem dali. Esta página descreve esse desenho —
        o que cada aba faz, de onde tira o que mostra e o que o sistema calcula sozinho.

          <b>{r.t}</b><p>{r.d}</p>

    {/* ---- onde os dados ficam ---- */}

      <div className="card card-pad">
        <div className="fg-dados">
          <div>
            <span className="fg-det-lab">ARMAZENAMENTO</span>
            <p>
              Tudo fica salvo no seu próprio navegador, numa chave única do sistema. Não há servidor nem login:
              o arquivo HTML roda sozinho, e os dados ficam na máquina de quem abriu.
            </p>
          </div>
          <div>
            <span className="fg-det-lab">CÓPIA E TRANSPORTE</span>
            <p>
              Em <b className="fg-link" onClick={()=>go('settings')}>Configurações → Base de Dados</b> dá para exportar
              a base, importar noutra máquina ou gerar uma cópia do arquivo com os dados embutidos.
            </p>
          </div>
          <div>
            <span className="fg-det-lab">SIMULADOR</span>
            <p>
              O modo simulação enche o sistema com uma operação fictícia para você ver as telas cheias.
              Seus dados reais ficam guardados e voltam inteiros ao sair.
            </p>
          </div>
          <div>
            <span className="fg-det-lab">ATUALIZAÇÕES</span>
            <p>
              Quando o sistema ganha um campo novo, ele se ajusta sozinho ao abrir a base antiga —
              sem perder o que já estava lá. Cada ajuste roda uma vez só.
            </p>
          </div>
        </div>
      </div>
    </Secao>

    {/* ---- o vocabulário ---- */}
    <Secao titulo="O vocabulário" sub="Palavras que o sistema usa com sentido preciso.">
      <div className="card" style={{overflow:'hidden'}}>

          ['Prazo de entrega','A data em que a tarefa precisa estar pronta. É o que vence.'],
          ['Prazo de construção','A janela de dias em que se trabalha nela. É o que coloca a tarefa no sprint.'],
          ['Horário reservado','A hora marcada num dia específico dentro dessa janela. É o que conta como hora realizada.'],
          ['Horas planejadas','As horas previstas no contrato do cliente, por mês. Informadas por você.'],
          ['Horas realizadas','O que está marcado na agenda. Calculadas pelo sistema.'],
          ['Gap','Critério da Matriz ainda não cumprido. É a matéria-prima do plano e dos projetos.'],

          ['Etapa','Em qual das quatro fases do método o cliente está hoje.'],
        ].map(([t,d])=>(<div key={t} className="fg-voc">
          <b>{t}</b><span>{d}</span>
        </div>))}
      </div>
    </Secao>
  </div>);
}


/* ============================================================
   MÓDULO 9 — FERRAMENTAS
   Guarda os HTMLs/sistemas internos da Focus e os sites dos clientes,
   num só lugar, com busca, favoritos e vínculo opcional a um projeto.
   ============================================================ */
const TOOL_CATS=[
  ['Ferramenta','Ferramentas internas','#0F4245','Sistemas e HTMLs criados pela Focus'],
  ['Cliente','Sites dos clientes','#2F8F6E','Sites, catálogos e páginas das marcas'],
  ['Documento','Documentos e planilhas','#C58B2A','Drive, planilhas e materiais de apoio'],
  ['Externo','Serviços externos','#4a5a5c','Plataformas de terceiros que a equipe usa'],
];
const catInfo=(k)=>TOOL_CATS.find(c=>c[0]===k)||TOOL_CATS[0];
// aceita "focus.com.br" e transforma em link válido
const normUrl=(u)=>{ u=(u||'').trim(); if(!u) return ''; return /^https?:\/\//i.test(u)? u : 'https://'+u; };
const dominioDe=(u)=>{ try{ return new URL(normUrl(u)).hostname.replace(/^www\./,''); }catch(e){ return ''; } };

function ToolsPage(){
  const {db,update,go,flash}=useDB();
  const [q,setQ]=useState('');
  const [cat,setCat]=useState('Todas');
  const [soFav,setSoFav]=useState(false);
  const [modal,setModal]=useState(null);

  const tools=db.tools||[];
  const lista=useMemo(()=>tools.filter(t=>{
    if(soFav&&!t.fav) return false;
    if(cat!=='Todas'&&t.cat!==cat) return false;
    if(q){ const k=q.toLowerCase();
      const proj=t.projectId?(db.projects.find(p=>p.id===t.projectId)||{}).name||'':'';
      if((t.name+' '+t.desc+' '+t.url+' '+proj).toLowerCase().indexOf(k)<0) return false; }
    return true;
  }).sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||a.name.localeCompare(b.name)),[tools,q,cat,soFav,db.projects]);

  const salvar=(t)=>{
    const limpo={...t,name:(t.name||'').trim(),url:normUrl(t.url),projectId:t.projectId||null};
    if(!limpo.name){flash('Dê um nome à ferramenta');return;}
    update(d=>{ d.tools=d.tools||[];
      const i=d.tools.findIndex(x=>x.id===limpo.id);
      if(i>=0) d.tools[i]=limpo; else d.tools.unshift({...limpo,id:uid()});
      return d; });
    flash(tools.some(x=>x.id===t.id)?'Ferramenta atualizada':'Ferramenta adicionada'); setModal(null);
  };
  const excluir=(t)=>{ if(!confirm('Remover "'+t.name+'" das ferramentas?')) return;
    update(d=>{d.tools=(d.tools||[]).filter(x=>x.id!==t.id);return d;}); flash('Removida'); };
  const favoritar=(id)=>update(d=>{const t=(d.tools||[]).find(x=>x.id===id); if(t) t.fav=!t.fav; return d;});
  const novo=()=>setModal({id:'',name:'',url:'',desc:'',cat:'Ferramenta',projectId:'',fav:false});

  const porCat=(k)=>tools.filter(t=>t.cat===k).length;

  return (<div>
    <div className="card card-pad" style={{marginBottom:16}}>
      <div className="between" style={{flexWrap:'wrap',gap:12}}>
        <div className="row" style={{gap:24,flexWrap:'wrap'}}>
          {TOOL_CATS.map(([k,l,c])=>(
            <span key={k} className="stat-mini" style={{cursor:'pointer'}} onClick={()=>setCat(cat===k?'Todas':k)}>
              <span className="n" style={{color:c}}>{porCat(k)}</span><span className="l">{l}</span></span>))}
        </div>
        <button className="btn btn-primary" onClick={novo}>{I.plus} Nova ferramenta</button>
      </div>
    </div>

    <div className="card card-pad" style={{marginBottom:16}}>
      <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'center'}}>
        <input className="inp" style={{flex:1,minWidth:200}} value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar por nome, endereço, cliente…"/>
        <select className="sel" style={{width:200}} value={cat} onChange={e=>setCat(e.target.value)}>
          <option>Todas</option>{TOOL_CATS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
        <button className={"fpill "+(soFav?'on':'')} onClick={()=>setSoFav(v=>!v)}>{I.starOn} Favoritas</button>
        {(q||cat!=='Todas'||soFav)&&<button className="btn btn-ghost btn-sm" onClick={()=>{setQ('');setCat('Todas');setSoFav(false);}}>Limpar</button>}
      </div>
    </div>

    {!tools.length? (
      <div className="card card-pad"><div className="empty" style={{padding:40}}>
        <div className="ic">{I.tool}</div>
        Nenhuma ferramenta cadastrada ainda.
        <div className="muted" style={{fontSize:'.82rem',marginTop:8,maxWidth:460,marginLeft:'auto',marginRight:'auto'}}>
          Use este espaço para reunir os HTMLs e sistemas da Focus, os sites dos clientes e os links que a equipe abre todo dia — assim ninguém precisa caçar endereço em conversa antiga.
        </div>
        <button className="btn btn-primary" style={{marginTop:14}} onClick={novo}>{I.plus} Adicionar a primeira</button>
      </div></div>
    ) : !lista.length? (
      <div className="card card-pad"><div className="empty" style={{padding:30}}><div className="ic">🔍</div>Nada encontrado com esses filtros.</div></div>
    ) : (
      <div className="tools-grid">
        {lista.map(t=>{const ci=catInfo(t.cat), proj=t.projectId?db.projects.find(p=>p.id===t.projectId):null, dom=dominioDe(t.url);
          return (<div key={t.id} className="tool-card">
            <div className="between" style={{alignItems:'flex-start'}}>
              <span className="badge" style={{background:ci[2]+'1c',color:ci[2]}}>{ci[1]}</span>
              <button className="icon-btn" style={{width:24,height:24,color:t.fav?'#e8a33d':'var(--text-3)'}}
                onClick={()=>favoritar(t.id)} title={t.fav?'Remover dos favoritos':'Marcar como favorita'}>{I.starOn}</button>
            </div>
            <div style={{fontWeight:700,fontSize:'.94rem',margin:'8px 0 4px'}}>{t.name}</div>
            {t.desc&&<div className="muted" style={{fontSize:'.78rem',marginBottom:6}}>{t.desc}</div>}
            {dom&&<div className="mono muted" style={{fontSize:'.72rem',marginBottom:8}}>{dom}</div>}
            {proj&&<div style={{marginBottom:8}}><span className="tag-soft" style={{cursor:'pointer',fontSize:'.68rem'}} onClick={()=>go('projects',proj.id)}>{proj.name}</span></div>}
            <div className="row" style={{gap:6,marginTop:'auto',paddingTop:8}}>
              {t.url
                ? <a className="btn btn-primary btn-sm" href={t.url} target="_blank" rel="noopener noreferrer" style={{flex:1,justifyContent:'center'}}>{I.ext} Abrir</a>
                : <span className="muted" style={{fontSize:'.74rem',flex:1}}>sem endereço</span>}
              <button className="btn btn-ghost btn-sm" onClick={()=>setModal({...t,projectId:t.projectId||''})}>Editar</button>
              <button className="icon-btn" style={{width:26,height:26,color:'var(--text-3)'}} onClick={()=>excluir(t)} title="Remover">{I.x}</button>
            </div>
          </div>);})}
      </div>
    )}

    {modal&&<ToolModal db={db} init={modal} close={()=>setModal(null)} onSave={salvar}/>}
  </div>);
}

function ToolModal({db,init,close,onSave}){
  const [t,setT]=useState(init);
  const set=(k,v)=>setT(x=>({...x,[k]:v}));
  const ci=catInfo(t.cat);
  return (<div className="overlay" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="modal-h"><h3>{init.id?'Editar ferramenta':'Nova ferramenta'}</h3><button className="x" onClick={close}>{I.x}</button></div>
    <div className="modal-b">
      <div className="fld"><label>Nome</label>
        <input className="inp" value={t.name} onChange={e=>set('name',e.target.value)} placeholder="Ex.: Sistema de Auditoria · Redemac" autoFocus/></div>
      <div className="fld"><label>Endereço (URL)</label>
        <input className="inp" value={t.url} onChange={e=>set('url',e.target.value)} placeholder="focus-franquias.vercel.app ou https://…"/>
        <div className="muted" style={{fontSize:'.73rem',marginTop:4}}>Pode colar sem o https:// — o sistema completa sozinho.</div></div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
        <div className="fld"><label>Categoria</label>
          <select className="sel" value={t.cat} onChange={e=>set('cat',e.target.value)}>
            {TOOL_CATS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
          <div className="muted" style={{fontSize:'.72rem',marginTop:4}}>{ci[3]}</div></div>
        <div className="fld"><label>Cliente vinculado (opcional)</label>
          <select className="sel" value={t.projectId} onChange={e=>set('projectId',e.target.value)}>
            <option value="">— nenhum —</option>
            {ativos(db).map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div>
      </div>
      <div className="fld"><label>Descrição</label>
        <textarea className="inp" rows={2} value={t.desc} onChange={e=>set('desc',e.target.value)} placeholder="Para que serve, quem usa, observações…"/></div>
      <label className="row" style={{gap:8,cursor:'pointer',fontSize:'.84rem',fontWeight:600}}>
        <button className={"chk sm "+(t.fav?'on':'')} onClick={()=>set('fav',!t.fav)}>{t.fav&&I.check}</button>
        Marcar como favorita
      </label>
    </div>
    <div className="modal-f"><span/><div className="row">
      <button className="btn btn-ghost" onClick={close}>Cancelar</button>
      <button className="btn btn-primary" onClick={()=>onSave(t)}>{init.id?'Salvar':'Adicionar'}</button></div></div>
  </div></div>);
}

/* ============================================================
   MÓDULO 8 — COMUNICAÇÃO
   ============================================================ */
function CommPage(){
  const {db,update}=useDB();
  const [chan,setChan]=useState('general'); const [txt,setTxt]=useState(''); const [as,setAs]=useState('lara');
  const [noteF,setNoteF]=useState({title:'',content:''});
  const chans=[['general','# geral'],['sprint','# sprint'],['urgent','# urgente']];
  const msgs=db.messages[chan]||[];
  const send=()=>{if(!txt.trim())return;update(d=>{d.messages[chan]=[...(d.messages[chan]||[]),{id:uid(),who:as,text:txt.trim(),time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}];return d;});setTxt('');};
  const addNote=()=>{if(!noteF.title.trim())return;update(d=>{d.notes.unshift({id:uid(),title:noteF.title.trim(),content:noteF.content,date:new Date().toLocaleDateString('pt-BR')});return d;});setNoteF({title:'',content:''});};
  const delNote=(id)=>update(d=>{d.notes=d.notes.filter(n=>n.id!==id);return d;});
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:16,alignItems:'start'}}>
    <div className="card" style={{display:'flex',flexDirection:'column',height:'70vh',overflow:'hidden'}}>
      <div className="row" style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',gap:8}}>{chans.map(([k,l])=><button key={k} className={"fpill "+(chan===k?'on':'')} onClick={()=>setChan(k)}>{l}</button>)}</div>
      <div style={{flex:1,overflowY:'auto',padding:16,display:'flex',flexDirection:'column',gap:12}}>
        {msgs.map(m=>m.sys?<div key={m.id} className="chat-sys">{m.text}</div>:(<div key={m.id} className="row" style={{alignItems:'flex-start',gap:10}}>
          <Avatar db={db} id={m.who} size="sm"/><div><div className="row" style={{gap:8}}><b style={{fontSize:'.82rem'}}>{member(db,m.who).name}</b><span className="muted" style={{fontSize:'.7rem'}}>{m.time}</span></div><div style={{fontSize:'.86rem',marginTop:2}}>{m.text}</div></div></div>))}
        {!msgs.length&&<div className="empty">Sem mensagens neste canal.</div>}
      </div>
      <div className="row" style={{padding:12,borderTop:'1px solid var(--border)',gap:8}}>
        <select className="sel" style={{width:'auto'}} value={as} onChange={e=>setAs(e.target.value)}>{db.team.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
        <input className="inp" style={{flex:1}} placeholder="Mensagem..." value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/>
        <button className="btn btn-primary" onClick={send}>Enviar</button>
      </div>
    </div>
    <div className="card card-pad"><div className="card-h"><h3>Notas fixadas</h3></div>
      <div className="fld"><input className="inp" placeholder="Título da nota" value={noteF.title} onChange={e=>setNoteF(s=>({...s,title:e.target.value}))}/></div>
      <div className="fld"><textarea className="ta" placeholder="Conteúdo..." value={noteF.content} onChange={e=>setNoteF(s=>({...s,content:e.target.value}))}/></div>
      <button className="btn btn-primary btn-sm" style={{width:'100%',marginBottom:14}} onClick={addNote}>{I.plus} Fixar nota</button>
