<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nortmont · Gestão de Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script crossorigin="" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin="" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ============================================================
   NORTMONT · DESIGN SYSTEM
   Tokens do Guia de Marca v1.0. Teal profundo como protagonista,
   navy como segunda voz, mint para fundos claros e ink no texto.
   ============================================================ */
:root{
  /* Paleta principal */
  --teal-deep:#0F4245;
  --navy:#011E3C;
  --mint:#E0EEE7;
  --ink:#130F10;
  /* Apoio */
  --sage:#A8CCA8;
  --blue-mid:#3F598C;
  --blue-deep:#173164;

  /* Papéis na interface (nomes mantidos para não quebrar o resto) */
  --bg:var(--navy);
  --sidebar:#011E3C;
  --sidebar-2:#02294f;
  --sidebar-hover:#0b3457;
  --sidebar-border:#0d2f52;
  --brand:#0F4245;          /* teal profundo — cor de ação */
  --brand-dark:#08292b;
  --brand-light:#1a5f63;
  --lavender:var(--sage);
  --lavender-soft:#eaf4ee;  /* realce claro, derivado do mint */
  --coral:#B33A3A;          /* erro da marca */
  --coral-soft:#f8ecec;
  --white:#ffffff;
  /* App */
  --app-bg:#f6f8f7;
  --surface:#ffffff;
  --border:#dfe6e3;
  --text:#130F10;
  --text-2:#4a5a5c;
  --text-3:#8b9a99;
  /* Semânticas do guia */
  --green:#2F8F6E;  --green-soft:#e6f3ee;
  --red:#B33A3A;    --red-soft:#f8ecec;
  --yellow:#C58B2A; --yellow-soft:#fbf3e6;
  --blue:#3F598C;   --blue-soft:#ecf0f7;
  --purple:#173164; --purple-soft:#e9edf4;
  /* Espaçamento · escala 4px */
  --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
  /* Raios: quadrado em containers, pílula em botões — sem meio-termo */
  --r-none:0; --r-sm:4px; --r-md:8px; --r-lg:14px; --r-xl:24px; --r-pill:999px;
  --r-card:14px; --r-input:10px;
  /* Elevação com tinta navy */
  --sh:0 1px 2px rgba(1,30,60,.08);
  --sh-hover:0 4px 12px rgba(1,30,60,.08);
  --sh-pop:0 10px 28px rgba(1,30,60,.12);
  --sh-modal:0 24px 60px rgba(1,30,60,.18);
  --sb-w:250px;
  --sb-min:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Escala tipográfica do guia: display em SemiBold com tracking negativo */
h1,h2,h3{font-weight:600;letter-spacing:-.015em;color:var(--navy)}
h1{font-size:1.9rem;line-height:1.08}
h2{font-size:1.35rem;line-height:1.15}
h3{line-height:1.3}
/* Eyebrow: caixa alta com tracking generoso */
.eyebrow,.ag-tit,.pe-n,.grupo-h .muted{letter-spacing:.14em}
html,body{height:100%}
body{
  font-family:'Montserrat',system-ui,sans-serif;
  font-size:14px;color:var(--text);background:var(--app-bg);
  -webkit-font-smoothing:antialiased;line-height:1.45;
}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:.85rem}
a{color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd2e3;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#b6bad0}

/* ===== App shell ===== */
.app{display:flex;min-height:100vh}
/* ===== Sidebar ===== */
.sb{width:var(--sb-w);background:var(--sidebar);color:#c9cbe6;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:40;border-right:1px solid var(--sidebar-border)}
.sb-brand{padding:20px 20px 16px;border-bottom:1px solid var(--sidebar-border)}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1rem;box-shadow:0 4px 14px rgba(73,58,213,.5)}
.sb-logo .name{font-weight:800;color:#fff;font-size:1.02rem;letter-spacing:-.3px}
.sb-logo .logo-full{height:40px;width:auto;display:block}
.sb-logo .logo-mark{height:26px;width:auto;display:none}
.app.sb-min .sb-logo .logo-full{display:none}
.app.sb-min .sb-logo .logo-mark{display:block}
.sb-sub{margin-top:8px;font-size:.7rem;color:#7c7fb0;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px}
.sb-nav::-webkit-scrollbar-thumb{background:#2a2a4a}
.sb-group{margin:6px 0 14px}
.sb-group-t{font-size:.62rem;text-transform:uppercase;letter-spacing:1.5px;color:#5b5e8a;font-weight:700;padding:4px 10px 8px}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:#b4b7da;font-weight:500;font-size:.85rem;transition:.15s ease;position:relative;width:100%;text-align:left}
.sb-item:hover{background:var(--sidebar-hover);color:#fff}
.sb-item.active{background:linear-gradient(90deg,rgba(73,58,213,.28),rgba(73,58,213,.08));color:#fff}
.sb-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-light)}
.sb-item .ic{width:18px;height:18px;flex-shrink:0;opacity:.9}
.sb-item .badge{margin-left:auto;background:var(--brand);color:#fff;font-size:.66rem;font-weight:700;padding:1px 8px;border-radius:20px;min-width:22px;text-align:center}
.sb-item .badge.coral{background:var(--coral)}
.sb-foot{padding:14px;border-top:1px solid var(--sidebar-border);font-size:.72rem;color:#8083b3}
.sb-foot .sp{display:flex;align-items:center;gap:7px;margin-bottom:9px;color:#c9cbe6;font-weight:600}
.sb-foot .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(39,174,96,.6);animation:pulse 2s infinite}
.sb-foot button{color:var(--lavender);font-weight:600;font-size:.74rem;display:flex;align-items:center;gap:6px}
.sb-foot button:hover{color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,174,96,.5)}70%{box-shadow:0 0 0 7px rgba(39,174,96,0)}100%{box-shadow:0 0 0 0 rgba(39,174,96,0)}}

/* ===== Main ===== */
.main{margin-left:var(--sb-w);flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;display:flex;align-items:center;padding:0 26px;gap:16px}
.tb-title{font-size:1.15rem;font-weight:700;letter-spacing:-.3px}
.tb-crumb{font-size:.78rem;color:var(--text-3);margin-top:1px}
.tb-crumb b{color:var(--text-2)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.sprint-badge{display:flex;align-items:center;gap:7px;background:var(--brand-dark);color:#fff;padding:6px 13px;border-radius:20px;font-size:.74rem;font-weight:600}
.sprint-badge .dot{width:7px;height:7px;border-radius:50%;background:#5fe0a0;animation:pulse 2s infinite}
.saved{font-size:.72rem;color:var(--green);display:flex;align-items:center;gap:5px;font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:.15s;position:relative}
.icon-btn:hover{background:var(--app-bg);color:var(--brand)}
.icon-btn.on{background:var(--brand);color:#fff}
.filter-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--coral)}

.page{padding:26px;max-width:1500px;width:100%}
.page-head{margin-bottom:20px}
.page-head h1{font-size:1.3rem;font-weight:800;letter-spacing:-.4px}
.page-head p{color:var(--text-2);font-size:.85rem;margin-top:3px}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh)}
.card-pad{padding:18px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:.95rem;font-weight:700}
.card-h .sub{font-size:.76rem;color:var(--text-3);font-weight:500}
.card-h .right{margin-left:auto}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh);padding:16px 16px 15px;position:relative;overflow:hidden;transition:.15s}
.kpi:hover{box-shadow:var(--sh-hover);transform:translateY(-2px)}
.kpi .bar{position:absolute;top:0;left:0;right:0;height:3px}
.kpi .lab{font-size:.66rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);font-weight:700}
.kpi .val{font-size:2rem;font-weight:800;letter-spacing:-1px;margin:6px 0 2px;line-height:1}
.kpi .sub{font-size:.72rem;color:var(--text-2)}

/* badges / pills */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 9px;border-radius:var(--r-pill)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;padding:4px 11px;border-radius:var(--r-pill)}
.dotc{width:7px;height:7px;border-radius:50%;display:inline-block}

/* avatar */
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.72rem;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.av.lg{width:46px;height:46px;font-size:1.05rem}
.av.sm{width:22px;height:22px;font-size:.62rem}
.av-row{display:flex}
.av-row .av{margin-left:-7px;border:2px solid #fff}
.av-row .av:first-child{margin-left:0}

/* progress */
.bar-track{height:8px;background:#edeef5;border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand),var(--brand-light));transition:width .4s ease}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:6px;border-radius:3px;background:#e4e6f0}
.seg i.done{background:var(--brand)}
.seg i.cur{background:var(--coral);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.5}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r-pill);font-weight:500;font-size:.82rem;transition:.15s;border:1px solid transparent;letter-spacing:.01em}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(73,58,213,.3)}
.btn-primary:hover{background:var(--brand-dark)}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text-2)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-coral{background:var(--coral);color:#fff}
.btn-coral:hover{filter:brightness(.92)}
.btn-danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:5px 11px;font-size:.76rem}

/* inputs */
.inp,.sel,.ta{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-input);background:#fff;color:var(--text);transition:.15s}
.inp:focus,.sel:focus,.ta:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(73,58,213,.12)}
.ta{resize:vertical;min-height:70px;line-height:1.5}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.74rem;font-weight:600;color:var(--text-2);margin-bottom:5px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:.83rem}
.tbl th{text-align:left;font-size:.66rem;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th:hover{color:var(--brand)}
.tbl td{padding:11px 12px;border-bottom:1px solid #f0f1f7;vertical-align:middle}
.tbl tr.click{cursor:pointer;transition:.12s}
.tbl tr.click:hover td{background:#faf9ff}

/* pills filter */
.pills{display:flex;gap:7px;flex-wrap:wrap}
.fpill{padding:6px 13px;border-radius:20px;font-size:.76rem;font-weight:600;background:#fff;border:1px solid var(--border);color:var(--text-2);transition:.15s}
.fpill:hover{border-color:var(--brand);color:var(--brand)}
.fpill.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* grids */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh);padding:17px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:12px}
.pcard:hover{box-shadow:var(--sh-hover);transform:translateY(-3px);border-color:#d3d6e8}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,10,30,.5);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;box-shadow:var(--sh-modal);width:100%;max-width:560px;animation:rise .25s ease-out}
.modal.lg{max-width:800px}
.modal.wide{max-width:760px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-h h3{font-size:1.05rem;font-weight:700}
.modal-h .x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.modal-h .x:hover{background:var(--app-bg);color:var(--text)}
.modal-b{padding:22px;max-height:64vh;overflow-y:auto}
.modal-f{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:11px 16px;font-size:.84rem;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--brand)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.kcol{background:#f0f1f8;border-radius:12px;padding:10px;min-height:120px}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700;font-size:.82rem}
.kcol-h .cnt{margin-left:auto;background:#fff;color:var(--text-2);font-size:.7rem;padding:1px 8px;border-radius:20px;font-weight:700}
.kcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:9px;box-shadow:var(--sh);transition:.15s}
.kcard:hover{box-shadow:var(--sh-hover)}
.kcard .plab{font-size:.68rem;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
.kcard .plab:hover{text-decoration:underline}
.kcard .ttl{font-size:.82rem;font-weight:600;margin:5px 0 9px;line-height:1.35}
.kcard .meta{display:flex;align-items:center;gap:8px}
.kcard .hrs{margin-left:auto;font-size:.74rem;font-weight:700;color:var(--text-2)}
.kadd{width:100%;padding:8px;border:1.5px dashed #c9cce0;border-radius:9px;color:var(--text-3);font-weight:600;font-size:.78rem;transition:.15s;margin-top:3px}
.kadd:hover{border-color:var(--brand);color:var(--brand)}

/* timeline */
.tl{position:relative;padding-left:8px}
.tl-node{display:flex;gap:16px;position:relative;padding-bottom:6px}
.tl-line{position:absolute;left:14px;top:30px;bottom:0;width:2px;background:#e4e6f0}
.tl-line.done{background:var(--brand)}
.tl-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1;font-size:.8rem;color:#fff;font-weight:700}
.tl-body{padding-bottom:22px;flex:1}
.tl-body h4{font-size:.9rem;font-weight:700}
.tl-body .meta{font-size:.74rem;color:var(--text-3);margin-top:2px}
.tl-marco{display:inline-flex;align-items:center;gap:6px;margin-top:7px;background:var(--coral-soft);color:var(--coral);font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:8px}

/* deliverable row */
.dl-fase{margin-bottom:18px}
.dl-fh{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:10px 14px;border-radius:10px;background:#f7f8fc;border:1px solid var(--border)}
.dl-fh h4{font-size:.86rem;font-weight:700}
.dl-fh .cnt{font-size:.74rem;color:var(--text-2);font-weight:600}
.dl-fh .bar-track{width:130px;margin-left:auto}
.dl-row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid #f0f1f7;transition:.12s}
.dl-row:hover{background:#fafaff}
.dl-row.marco{background:var(--coral-soft)}
.dl-row.marco .dl-name{font-weight:700;color:#c5341f}
.dl-name{flex:1;font-size:.84rem;min-width:0}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid #cfd2e3;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.mini-sel{padding:4px 8px;border:1px solid var(--border);border-radius:7px;font-size:.74rem;font-weight:600;background:#fff;cursor:pointer}

/* heatmap */
.heat td,.heat th{text-align:center;padding:8px 6px;border:1px solid #eef0f7;font-size:.76rem}
.heat th{background:#f7f8fc;font-weight:700;color:var(--text-2)}
.heat td.lbl{text-align:left;font-weight:600;background:#fafbff}
.heat .cell{border-radius:6px;color:#fff;font-weight:700;font-family:'JetBrains Mono',monospace;font-size:.72rem;display:inline-block;min-width:30px;padding:4px 0}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px;align-items:center}
.fn-row{display:flex;align-items:center;gap:14px;width:100%}
.fn-bar{height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.84rem;transition:.3s;min-width:60px}
.fn-lab{width:190px;font-size:.8rem;font-weight:600;text-align:right;color:var(--text-2)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--text-3);padding:6px 0}
.cal-day{min-height:84px;border:1px solid var(--border);border-radius:9px;padding:6px;background:#fff;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:3px}
.cal-day:hover{border-color:var(--brand);background:#fafaff}
.cal-day.out{background:#fafbfd;color:var(--text-3)}
.cal-day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal-day .num{font-size:.78rem;font-weight:700}
.cal-ev{font-size:.64rem;font-weight:600;color:#fff;padding:2px 6px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* chat */
.chat-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;height:calc(100vh - 150px)}
.chat-main{display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh);overflow:hidden}
.chat-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.chat-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:#fafbfd}
.msg{display:flex;gap:10px;max-width:75%}
.msg .bub{background:#fff;border:1px solid var(--border);border-radius:4px 12px 12px 12px;padding:9px 13px}
.msg .who{font-size:.72rem;font-weight:700;margin-bottom:2px}
.msg .txt{font-size:.84rem}
.msg .tm{font-size:.64rem;color:var(--text-3);margin-top:3px}
.msg.sys{align-self:center;max-width:80%;text-align:center}
.msg.sys .bub{background:var(--yellow-soft);border-color:#f3e6a8;border-radius:10px;color:#8a6d00;font-size:.78rem}

.nv-marca{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin:-30px -30px 22px;padding:24px 30px 18px;background:#0b1f33;border-radius:16px 16px 0 0}
.nv-marca .nv-logo-img{height:42px;width:auto}
.nv-marca>span{font-size:.74rem;color:#9fb3c8;letter-spacing:.3px}
.nv-marca b{display:block;font-size:1.05rem;color:var(--navy,#0b1f33)}
.nv-marca span{font-size:.74rem;color:var(--text-3,#8b9a99)}
.nv-logo{width:40px;height:40px;border-radius:11px;background:#0F4245;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
.nv-gbtn{margin:14px 0 6px;min-height:44px}
.nv-erro{margin-top:12px;background:#fdecea;color:#a93226;border:1px solid #f5c6c0;border-radius:9px;padding:9px 11px;font-size:.8rem;line-height:1.45;word-break:break-word}
.nv-acoes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.nv-link{background:none;border:none;color:var(--text-3,#8b9a99);font-size:.78rem;cursor:pointer;padding:0;text-decoration:underline}
.nv-load{display:flex;gap:10px;align-items:center;font-size:.88rem;color:var(--text-2,#4a5a5c);padding:10px 0}
.nv-spin{width:18px;height:18px;border:2.5px solid #dfe6e5;border-top-color:#0F4245;border-radius:50%;animation:nvgira .8s linear infinite}
@keyframes nvgira{to{transform:rotate(360deg)}}
.nv-faixa{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fdf6ec;border-bottom:1px solid #ecd3a6;padding:8px 26px;font-size:.8rem;color:#7a5a1c}
.nv-faixa .nv-gbtn{margin:0;min-height:0}
.nv-eu{gap:7px}
.nv-eu-n{display:flex;flex-direction:column;line-height:1.1;font-size:.78rem;font-weight:700;color:var(--navy,#0b1f33)}
.nv-eu-n small{font-size:.62rem;font-weight:600;color:var(--text-3,#8b9a99)}
.nv-eu button{border:none;background:#eef2f1;border-radius:999px;padding:4px 10px;font-size:.7rem;font-weight:700;color:var(--text-2,#4a5a5c);cursor:pointer}
.nv-eu button:hover{background:#e3e9e8}
.tbl-comp th,.tbl-comp td{padding-left:7px;padding-right:7px}
.dash-visao{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:9px 14px;margin-bottom:14px;font-size:.84rem;flex-wrap:wrap}
.rec{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border-radius:9px;margin-top:8px;background:#fafbfb;border:1px solid var(--border)}
.rec.imp{background:#fdf6ec;border-color:#ecd3a6}
.rec.lido{opacity:.62}
.rec-h{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;font-size:.73rem;color:var(--text-3)}
.rec-h b{color:var(--navy);font-size:.8rem}
.rec-t{font-size:.86rem;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.rec-c{font-size:.68rem;color:var(--text-3);margin-top:3px}
.rec-tag{font-size:.58rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#C58B2A;background:#fbf3e6;border-radius:999px;padding:1px 8px}
.rec-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec-form .inp{flex:1;min-width:220px}
.rec-imp{display:inline-flex;gap:5px;align-items:center;font-size:.76rem;color:var(--text-2);cursor:pointer}
.sinal-g.sm{padding:2px 5px;gap:3px}
.sinal-g.sm .sinal-b{width:12px;height:12px;border-width:1.5px}
.sin-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.sin-tile{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:#fff}
.sin-tile.ruim{border-color:#e8c4c4;background:#fdf8f8}
.sin-tile-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.79rem;cursor:pointer;margin-bottom:6px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sin-tile-h:hover{color:var(--brand)}
.sin-linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sin-cat{display:inline-flex;align-items:center;gap:4px;font-size:.58rem;font-weight:800;color:var(--text-3);letter-spacing:.06em}
.ag-linha{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f2f4f4}
.ag-linha:last-child{border-bottom:none}
.ag-data{width:46px;flex:none;text-align:center;line-height:1.1}
.ag-data b{display:block;font-size:.92rem;color:var(--navy)}
.ag-data span{font-size:.6rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ag-data.hoje b{color:var(--brand)}
.add-r{display:grid;grid-template-columns:1.6fr .8fr 1fr .55fr;gap:7px}
.add-r-c{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.add-r .mini-sel,.add-r-c .mini-sel{width:100%;min-width:0}


/* ===== v2.1 · Calendário ===== */
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}   /* só dias úteis */
.cal-cell{min-height:78px;border:1px solid var(--border);border-radius:9px;padding:6px;background:#fff;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:4px}
.cal-cell:hover{border-color:var(--brand);background:#fafaff}
.cal-cell.empty{background:transparent;border:none;cursor:default;pointer-events:none}
.cal-cell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal-cell.sel{border-color:var(--brand);background:var(--lavender-soft)}
.cal-d{font-size:.78rem;font-weight:700;color:var(--text-2)}
.cal-cell.today .cal-d{color:var(--brand)}
.cal-evs{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
/* Barras de PRAZO DE CONSTRUÇÃO: atravessam os dias, coladas nas bordas da
   célula, para formarem uma faixa contínua ao longo da semana. */
.cal-bars{display:flex;flex-direction:column;gap:2px;margin:2px -7px 0}
.cal-bar{height:13px;background:var(--blue);color:#fff;font-size:.6rem;font-weight:700;
  display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;opacity:.92}
.cal-bar.ini{border-radius:7px 0 0 7px;margin-left:2px}
.cal-bar.fim{border-radius:0 7px 7px 0;margin-right:2px}
.cal-bar.solo{border-radius:7px;margin:0 2px}
.cal-bar.meio{}
.cal-bar.done{background:var(--green);opacity:.55}
.cal-bar-mais{font-size:.6rem;color:var(--text-3);font-weight:700;padding-left:7px}
/* Prazo de ENTREGA em vermelho */
.cal-entrega{display:flex;align-items:center;gap:4px;font-size:.62rem;font-weight:700;color:var(--red);
  background:var(--red-soft);border-radius:5px;padding:1px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-cell.tem-entrega .cal-d{color:var(--red)}
/* ---- agenda: cartão de evento usado nas visões Semana e Dia ---- */
.ag-ev{border-left:3px solid var(--brand);background:#fff;border:1px solid var(--border);border-left-width:3px;
  border-radius:8px;padding:6px 9px;margin-bottom:6px;transition:.12s}
.ag-ev:hover{box-shadow:var(--sh-hover);border-color:var(--brand)}
.ag-tit{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--text-3);margin-bottom:6px}
/* ===== Visão SEMANA no formato de agenda ===== */
.wk{border:1px solid var(--border);border-radius:11px;overflow:hidden;background:#fff}
.wk-cab,.wk-allday{display:grid;grid-template-columns:56px repeat(5,1fr)}
.wk-cab{border-bottom:1px solid var(--border);background:#fafbff}
.wk-dia{padding:9px 6px;text-align:center;cursor:pointer;border-left:1px solid var(--border);transition:.12s}
.wk-dia:hover{background:#f2f4fb}
.wk-dia.sel{background:var(--lavender-soft)}
.wk-dow{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);font-weight:700}
.wk-num{display:block;font-size:1.12rem;font-weight:800;color:var(--text-1);line-height:1.3}
.wk-dia.hoje .wk-num{background:var(--brand);color:#fff;border-radius:50%;width:30px;height:30px;
  line-height:30px;margin:2px auto 0}
.wk-allday{border-bottom:1px solid var(--border);min-height:34px;background:#fcfcff}
.wk-gutter{border-right:1px solid var(--border);position:relative}
.wk-gl{position:absolute;right:6px;top:5px;font-size:.58rem;color:var(--text-3);text-align:right;
  text-transform:uppercase;letter-spacing:.5px;font-weight:700;line-height:1.1}
.wk-ad{border-left:1px solid var(--border);padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.wk-ad.alvo{background:var(--lavender-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.wk-barra{color:#fff;font-size:.65rem;font-weight:700;border-radius:4px;padding:2px 6px;cursor:grab;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-item{font-size:.65rem;font-weight:700;border-left:3px solid;border-radius:4px;padding:2px 6px;cursor:grab;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-mais{font-size:.62rem;color:var(--text-3);font-weight:700;cursor:pointer;padding-left:4px}
.wk-corpo{display:grid;grid-template-columns:56px repeat(5,1fr);position:relative}
.wk-horas{position:relative}
.wk-hora{border-bottom:1px solid var(--border);box-sizing:border-box;position:relative}
.wk-hora .mono{position:absolute;right:6px;top:-7px;font-size:.64rem;color:var(--text-3);font-weight:700;background:#fff;padding:0 2px}
.wk-col{position:relative;border-left:1px solid var(--border)}
.wk-col.sel{background:#fbfbff}
.wk-cel{position:absolute;left:0;right:0;border-bottom:1px solid #f2f3f9;box-sizing:border-box;cursor:pointer;transition:.1s}
.wk-cel:hover{background:var(--lavender-soft)}
.wk-cel.alvo{background:var(--lavender-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.wk-bloco{position:absolute;border-radius:5px;border-left:3px solid;padding:1px 5px;overflow:hidden;
  cursor:grab;box-sizing:border-box;z-index:2;box-shadow:0 1px 2px rgba(0,0,25,.07)}
.wk-bloco:hover{z-index:6;box-shadow:var(--sh-hover)}
.wk-bloco.feito{opacity:.5}
.wk-bloco.conflito,.dia-bloco.conflito{outline:2px solid #B33A3A;outline-offset:-2px}
.wk-bloco.conflito::after,.dia-bloco.conflito::after{content:'⚠';position:absolute;top:1px;right:3px;font-size:.6rem;color:#B33A3A}
.wk-bloco-h{font-size:.6rem;font-weight:800;line-height:1.1}
.wk-bloco-t{font-size:.68rem;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){ .wk-cab,.wk-allday,.wk-corpo{grid-template-columns:40px repeat(5,1fr)} }

/* ---- visão SEMANA: 5 colunas ---- */
.sem-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:start}
.sem-col{border:1px solid var(--border);border-radius:10px;padding:8px;background:#fafbff;min-height:150px;cursor:pointer}
.sem-col.hoje{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.sem-col.sel{background:var(--lavender-soft)}
.sem-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:7px;margin-bottom:8px;border-bottom:1px solid var(--border);color:var(--text-2)}
.sem-bar{background:var(--blue);color:#fff;font-size:.66rem;font-weight:700;border-radius:6px;padding:2px 7px;margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.92}
.sem-bar.done{background:var(--green);opacity:.55}
/* ---- visão DIA: linha do tempo ---- */
.dia-grid{display:grid;grid-template-columns:62px 1fr;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
/* ---- linha do tempo do dia: altura proporcional à duração ---- */
.dia-tl{display:grid;grid-template-columns:62px 1fr;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.dia-tl-horas{border-right:1px solid var(--border);background:#fafbff}
.dia-tl-h{display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 8px 0 0;
  font-size:.7rem;color:var(--text-3);font-weight:700;border-bottom:1px solid var(--border);box-sizing:border-box}
.dia-tl-corpo{position:relative}
.dia-tl-faixa{position:absolute;left:0;right:0;border-bottom:1px solid var(--border);box-sizing:border-box}
.dia-tl-faixa:nth-child(odd){background:#fcfcff}
.dia-tl-faixa.alvo{background:var(--lavender-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.dia-bloco{position:absolute;border-radius:7px;border-left:3px solid;padding:3px 7px;overflow:hidden;
  cursor:grab;box-sizing:border-box;transition:.12s;box-shadow:0 1px 3px rgba(0,0,25,.06)}
.dia-bloco:hover{box-shadow:var(--sh-hover);z-index:5}
.dia-bloco.feito{opacity:.5}
.dia-bloco-h{font-size:.65rem;font-weight:800;line-height:1.2}
.dia-bloco-t{font-size:.76rem;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dia-bloco-s{font-size:.66rem;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dia-agora{position:absolute;left:0;right:0;height:2px;background:#B33A3A;z-index:6}
.dia-agora i{position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#B33A3A;display:block}
.dia-h{padding:9px 10px;font-size:.72rem;color:var(--text-3);font-weight:700;background:#fafbff;border-bottom:1px solid var(--border);text-align:right}
.dia-slot{padding:7px 9px;border-bottom:1px solid var(--border);border-left:1px solid var(--border);min-height:42px}
.dia-slot:empty{background:repeating-linear-gradient(45deg,transparent,transparent 8px,#fbfbfe 8px,#fbfbfe 16px)}
@media(max-width:900px){
  .sem-grid{grid-template-columns:1fr}
  .dia-grid{grid-template-columns:52px 1fr}
}
.cal-ev{width:8px;height:8px;border-radius:50%;display:inline-block}
.cal-more{font-size:.6rem;font-weight:700;color:var(--text-3)}

/* ===== v2.1 · Chat (mensagem de sistema) ===== */
.chat-sys{align-self:center;background:#eef0f7;color:var(--text-3);font-size:.72rem;font-weight:600;padding:4px 12px;border-radius:20px}
/* ===== v2.2 · gráfico de colunas com tooltip (números no hover) ===== */
.col-chart{display:flex;align-items:stretch;gap:8px;width:100%}
.col-group{flex:1;display:flex;flex-direction:column;min-width:0}
.col-bars{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.col-bar{flex:1;max-width:32px;border-radius:5px 5px 0 0;position:relative;min-height:2px;cursor:default;transition:filter .15s}
.col-bar:hover{filter:brightness(1.14)}
.col-bar:hover .col-tip{opacity:1;transform:translateX(-50%) translateY(0)}
.col-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(3px);background:#000019;color:#fff;font-size:.66rem;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;margin-bottom:6px;z-index:8;transition:.15s;box-shadow:0 4px 12px rgba(0,0,25,.25)}
.col-x{text-align:center;font-size:.63rem;color:var(--text-3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

     dados é substituído pelo cronograma de cada cliente ao abrir. -->
<script type="text/plain" id="cronotpl">
<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--navy:#011E3C;--teal:#0F4245;--green:#A8CCA8;--mint:#E0EEE7;--mint2:#EEF4F1;--ink:#011E3C;--muted:#44546A;--line:#D5E3DB;--amber:#C58B2A;--wk:#F1F4F6;--hol:#F6EBD6;--red:#B33A3A}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#E9EEF1;font-family:Montserrat,'Helvetica Neue',Arial,sans-serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
button,input,select,textarea{font-family:inherit}

/* barra de ferramentas */
.bar{position:sticky;top:0;z-index:30;background:var(--navy);display:flex;align-items:center;gap:8px;padding:10px 18px;flex-wrap:wrap}
.bar strong{color:var(--green);font-size:12px;letter-spacing:.2em;font-weight:600;margin-right:auto;text-transform:uppercase}
.bar button{font:600 12px Montserrat,sans-serif;border-radius:999px;padding:7px 14px;cursor:pointer;border:1.5px solid var(--green);background:transparent;color:#E0EEE7}
.bar button.pri{background:var(--green);color:var(--navy)}
.bar button:disabled{opacity:.4;cursor:default}
.bar label{color:#E0EEE7;font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:0 6px}
.bar label input{accent-color:var(--green);width:15px;height:15px}
.bar .hint{width:100%;color:#BFD3C6;font-size:11.5px;line-height:1.5}
.bar .hint b{color:#fff;font-weight:600}

/* textos editáveis */
[contenteditable]{outline:none;border-radius:3px;cursor:text;min-width:8px;display:inline-block}
@media screen{
  [contenteditable]:hover{box-shadow:0 0 0 1px rgba(15,66,69,.35)}
  [contenteditable]:focus{box-shadow:0 0 0 2px var(--teal);background:#fffdf3;color:var(--ink)}
  .band [contenteditable]:hover{box-shadow:0 0 0 1px rgba(168,204,168,.7)}
  .band [contenteditable]:focus{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 0 0 2px var(--green)}
  .key.dk [contenteditable]:focus{background:rgba(255,255,255,.12);color:#fff}
}

/* páginas A4 paisagem */
.page{width:297mm;height:210mm;margin:22px auto;background:#fff;box-shadow:0 2px 18px rgba(1,30,60,.12);display:flex;flex-direction:column;overflow:hidden;position:relative}
.band{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:6mm 11mm 5mm}
.band img{height:28px;width:auto}
.band .tt{margin-left:auto;text-align:right}
.band .k{font-size:9.5px;letter-spacing:.2em;color:var(--green);font-weight:600;text-transform:uppercase}
.band h1{font-size:20px;font-weight:600;margin:3px 0 0;letter-spacing:-.3px}
.inner{padding:4.5mm 11mm 0;flex:1;display:flex;flex-direction:column;min-height:0}
.pf{padding:4mm 11mm 6mm;display:flex;justify-content:space-between;font-size:9px;color:var(--muted);border-top:1px solid var(--mint)}
.keys{display:flex;gap:8px;margin-bottom:3.5mm;flex-wrap:wrap}
.key{border:1px solid var(--line);border-radius:9px;padding:4px 11px;display:flex;align-items:baseline;gap:8px;font-size:10.5px;color:var(--muted)}
.key b{font-size:13.5px;color:var(--ink);font-weight:600}
.key.dk{background:var(--navy);border-color:var(--navy);color:#BFD3C6}
.key.dk b{color:#fff}

/* gantt */
.gantt{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:9.5px;position:relative;user-select:none}
.gh,.gr{display:grid;grid-template-columns:86mm 1fr}
.gh .lab{background:var(--navy);color:#fff;font-weight:600;padding:0 10px 6px;display:flex;align-items:flex-end;font-size:10px}
.scale{background:var(--navy);color:#fff;position:relative}
.weeks,.days{display:grid}
.weeks>div{border-left:1px solid rgba(168,204,168,.35);padding:5px 4px 3px;font-weight:600;font-size:9.5px;white-space:nowrap;overflow:hidden}
.weeks>div small{color:var(--green);font-weight:500;margin-left:4px}
.days>div{text-align:center;font-size:8px;padding:2px 0 4px;color:#BFD3C6;border-left:1px solid rgba(168,204,168,.18);line-height:1.2}
.days>div.we{color:#6F8597}
.days>div.ho{color:var(--amber)}
.gr{border-top:1px solid #E6EDEA;min-height:6.9mm}
.gr .lab{padding:2.5px 10px;line-height:1.22;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;user-select:text}
.gr .lab .n{font-weight:600;font-size:9.3px}
.gr .lab .q{color:var(--muted);font-size:8.2px}
.gr.ph{min-height:5.4mm}
.gr.ph .lab{background:var(--mint2);font-weight:700;color:var(--teal);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase}
.gr.ph .track{background:var(--mint2)}
.track{position:relative}
.bg{position:absolute;inset:0;display:grid;pointer-events:none}
.bg>div{border-left:1px solid #F0F3F2}
.bg>div.we{background:var(--wk)}
.bg>div.ho{background:var(--hol)}
.bg>div.wk0{border-left:1px solid #C9D7D0}
.seg{position:absolute;top:50%;height:13px;transform:translateY(-50%);border-radius:7px;cursor:grab;touch-action:none}
.seg .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.seg .h.l{left:-2px}.seg .h.r{right:-2px}
@media screen{.seg:hover .h{background:rgba(255,255,255,.55);border-radius:7px}}
.t-int{background:var(--green)}
.t-cli{background:var(--teal)}
.sum{position:absolute;top:50%;height:6px;transform:translateY(-50%);background:var(--teal);opacity:.55;border-radius:2px}
.sum:before,.sum:after{content:"";position:absolute;bottom:-4px;border:4px solid transparent;border-top-color:var(--teal)}
.sum:before{left:-1px}.sum:after{right:-1px}
.ms{position:absolute;top:50%;width:13px;height:13px;transform:translate(-50%,-50%) rotate(45deg);cursor:grab;touch-action:none}
.ms.t-marco{background:var(--amber)}
.ms.t-ent{background:var(--navy);width:15px;height:15px}
.ms.t-int{background:var(--green);border-radius:50%}
.ms.t-cli{background:var(--teal);border-radius:50%}
.today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--red);pointer-events:none;z-index:3}
.today span{position:absolute;bottom:2px;left:3px;font-size:8px;font-weight:700;color:var(--red);background:#fff;padding:0 3px;border-radius:3px;white-space:nowrap}
.tip{position:fixed;z-index:50;background:var(--navy);color:#fff;font-size:11px;padding:5px 9px;border-radius:6px;pointer-events:none;display:none;white-space:nowrap}
.legend{display:flex;gap:16px;margin-top:3mm;font-size:9.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:9px;border-radius:5px;display:inline-block}
.legend i.dm{width:9px;height:9px;border-radius:0;transform:rotate(45deg)}
.legend i.sq{width:12px;height:12px;border-radius:2px}

/* editor (só na tela) */
.editor{width:calc(100% - 44px);max-width:1480px;min-width:297mm;margin:22px auto;background:#fff;box-shadow:0 2px 18px rgba(1,30,60,.12);border-radius:4px;padding:7mm 9mm 8mm}
.ed-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:4mm}
.ed-h h2{font-size:17px;margin:0;font-weight:600}
.ed-h p{margin:3px 0 0;font-size:10.5px;color:var(--muted);max-width:190mm;line-height:1.5}
.ed-h .cap{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ed-h .cap input{width:46px;font:600 11px Montserrat;border:1px solid var(--line);border-radius:5px;padding:3px 5px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:10px}
th{background:var(--navy);color:#fff;text-align:left;font-weight:600;padding:6px 6px;font-size:9.3px;white-space:nowrap}
td{padding:3px 6px;border-bottom:1px solid #E6EDEA;vertical-align:middle;line-height:1.3}
tr.fz td{background:var(--mint2);color:var(--teal);font-weight:700;font-size:9px;letter-spacing:.12em;padding:4px 7px;text-transform:uppercase}
tr.sub td{color:var(--muted)}
.editor td input,.editor td select{font:500 10px Montserrat,sans-serif;color:var(--ink);border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:4px;width:100%}
.editor td input:hover,.editor td select:hover{border-color:var(--line)}
.editor td input:focus,.editor td select:focus{outline:none;border-color:var(--teal);background:#fffdf3}
.editor input.bad,.cfg input.bad{border-color:var(--red)!important;background:#FBECEC!important}
.editor td input.dt{width:84px}
.editor td input[data-f=nome]{min-width:230px}
.editor td input.num{width:44px;text-align:right}
.ctl{display:flex;gap:3px;justify-content:flex-end;white-space:nowrap}
.ctl button{border:1px solid var(--line);background:#fff;color:var(--teal);border-radius:5px;font-size:10px;font-weight:700;padding:2px 6px;cursor:pointer}
.ctl button.x{color:var(--red)}
.ctl button:disabled{opacity:.3;cursor:default}
.du{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;flex-shrink:0}
.nm{display:flex;align-items:center}
.int-col{background:#FAFBF7}
tr.flash td{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:#FFF3C4}100%{background:transparent}}

/* dados do projeto */
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:4mm 9mm;margin-bottom:6mm;padding-bottom:6mm;border-bottom:1px solid var(--line)}
.cfg h3{font-size:9.5px;letter-spacing:.14em;color:var(--teal);margin:0 0 2.5mm;font-weight:700;text-transform:uppercase}
.cfg .f{display:flex;flex-direction:column;gap:3px;font-size:9.5px;color:var(--muted);font-weight:600;margin-bottom:2.5mm}
.cfg .f small{font-weight:500}
.cfg input,.cfg textarea{font:500 11px Montserrat,sans-serif;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.cfg textarea{min-height:46px;resize:vertical;line-height:1.45}
.cfg input:focus,.cfg textarea:focus{outline:none;border-color:var(--teal);background:#fffdf3}
.cfg .row{display:flex;gap:6px;align-items:center}
.cfg .row input{flex:1}
.cfg .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.cfg button{font:600 10.5px Montserrat,sans-serif;border:1px solid var(--line);background:#fff;color:var(--teal);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.cfg button.x{color:var(--red)}
.cfg button:disabled{opacity:.35;cursor:default}
.cfg .frow{display:flex;gap:5px;align-items:center;margin-bottom:4px}
.cfg .frow input{flex:1}
.cfg .cnt{font-size:9.5px;color:var(--muted);width:52px;text-align:right}
.cfg table.ct th{font-size:8.6px;padding:5px 6px}
.cfg table.ct td{padding:3px 4px;border:0}
.cfg table.ct td input{padding:4px 6px;font-size:10.5px}
.cfg .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.cfg .acts span{font-size:10px;color:var(--muted);margin-right:auto}


/* caixa recolhível dos dados do projeto */
.addmenu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(1,30,60,.18);padding:6px;min-width:220px;display:flex;flex-direction:column}
.addmenu .am-t{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--teal);padding:6px 10px 4px;text-transform:uppercase}
.addmenu button{font:500 12px Montserrat,sans-serif;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer}
.addmenu button:hover{background:var(--mint2)}
.addmenu button:last-child{color:var(--teal);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.cfgbox{border:1px solid var(--line);border-radius:10px;margin-bottom:7mm;background:#fff}
.cfgbox summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;user-select:none}
.cfgbox summary::-webkit-details-marker{display:none}
.cfgbox summary b{display:block;font-size:15px;font-weight:600}
.cfgbox summary small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.cfgbox .chev{color:var(--teal);font-size:13px;transition:transform .15s}
.cfgbox[open] .chev{transform:rotate(90deg)}
.cfgbox .tg{margin-left:auto;font:600 11px Montserrat,sans-serif;border:1.5px solid var(--teal);color:var(--teal);border-radius:999px;padding:5px 14px}
.cfgbox summary:hover .tg{background:var(--teal);color:#fff}
.cfgbox[open] summary{border-bottom:1px solid var(--line)}
.cfgbox .cfg{padding:5mm 16px 2mm;margin:0;border:0}
.cfg>div{min-width:0}
.cfg table.ct{table-layout:fixed}

.addb{font:600 9.5px Montserrat,sans-serif;letter-spacing:0;text-transform:none;border:1px solid var(--teal);color:var(--teal);background:#fff;border-radius:999px;padding:2px 9px;cursor:pointer;white-space:nowrap}
.addb:hover{background:var(--teal);color:#fff}
.gr.ph .lab{flex-direction:row;align-items:center;justify-content:space-between;gap:6px}
.gr.ph .addb{opacity:0;transition:opacity .12s;font-size:8.5px;padding:1px 8px}
.gr.ph:hover .addb{opacity:1}
tr.fz td .fzw{display:flex;align-items:center;justify-content:space-between}
/* descritivo (página 2) */
.desc td{padding:5px 8px;font-size:10px}
.desc td.a{font-weight:600}
.desc td.per{white-space:nowrap}
.desc .tp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.notes{margin-top:auto;padding-top:3mm;font-size:9.5px;color:var(--muted);line-height:1.55}
.notes b{color:var(--ink)}
.notes [contenteditable]{display:inline}

/* horas (página 3) */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:3mm}
.cd{border:1px solid var(--line);border-radius:10px;padding:5px 12px}
.cd .l{font-size:9px;letter-spacing:.12em;color:var(--teal);font-weight:700}
.cd .v{font-size:17px;font-weight:600;margin-top:2px}
.cd .s{font-size:9px;color:var(--muted)}
.cd.alert .v{color:var(--red)}
.sec-t{font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--teal);margin:0 0 2mm}
.hm{width:100%;border-collapse:collapse;font-size:8.6px;table-layout:fixed}
.hm th{padding:3px 2px;text-align:center;font-size:8px;font-weight:600;line-height:1.15}
.hm th.wkh{font-size:8.6px;border-left:2px solid #fff}
.hm td{padding:0;height:4.8mm;text-align:center;border-bottom:1px solid #fff;border-left:1px solid #fff;font-variant-numeric:tabular-nums}
.hm td.p{text-align:left;padding:0 6px;font-weight:600;background:#fff;border-bottom:1px solid #E6EDEA}
.hm td.tot{font-weight:700;background:var(--mint2)}
.hm td.wks{border-left:2px solid #C9D7D0}
.hm tr.trow td{font-weight:700;background:var(--mint2);border-top:1px solid var(--line)}
.over{background:#F3D3D3!important;color:var(--red)!important;font-weight:700}
.wt td{padding:2px 6px;font-size:8.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #E6EDEA;font-variant-numeric:tabular-nums}
.wt td.c{text-align:right}
.wt th{text-align:right;padding:5px 6px;font-size:8.6px}
.wt th:first-child{text-align:left}
.wt tr.trow td{font-weight:700;background:var(--mint2)}

@page{size:A4 landscape;margin:0}
@media print{
  body{background:#fff}
  .bar,.tip,.editor,.screen-only{display:none!important}
  .page{margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .page.last{page-break-after:auto;break-after:auto}
  body.nohoras #p3{display:none!important}
  .seg,.ms{cursor:default}
}
@media screen and (max-width:1180px){ body{overflow-x:auto} .page,.editor{margin:16px} .editor{width:auto} }
</style>
</head>

<script type="application/json" id="data">__DADOS_DO_CLIENTE__<\/script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
window.D=D;   /* exposto para o sistema ler o estado do cronograma */
var CLIENT=D.modo==='cliente';
var TIPOS=['int','cli','marco','ent'];
var COLORS={int:'var(--green)',cli:'var(--teal)',marco:'var(--amber)',ent:'var(--navy)'};
var WD=['D','S','T','Q','Q','S','S'],WDN=['dom','seg','ter','qua','qui','sex','sáb'];
var undo=[],dirty=false;

function def(o,k,v){if(o[k]===undefined||o[k]===null)o[k]=v;}
function defaults(){
  def(D,'autoSort',true);def(D,'cap',8);def(D,'incluirHoras',false);
  def(D,'consultoria','Nortmont');def(D,'cliente','Nome da empresa');def(D,'projeto','Nome do projeto');
  def(D,'rodape',D.consultoria);def(D,'nota','');def(D,'inicio','');def(D,'semanas',0);delete D.semanasExtra;
  def(D,'fases',[]);def(D,'feriados',[]);def(D,'tasks',[]);def(D,'ordemEquipe',[]);
  def(D,'equipeSistema',[]);
  def(D,'titulos',{});def(D.titulos,'p1','Cronograma');def(D.titulos,'p2','Tarefas e prazos');def(D.titulos,'p3','Horas por dia e por semana');def(D.titulos,'k3','Uso interno · equipe '+D.consultoria);
  def(D,'rotulos',{});def(D.rotulos,'int',D.consultoria);def(D.rotulos,'cli','Com o cliente');def(D.rotulos,'marco','Batimento');def(D.rotulos,'ent','Entrega');
  def(D,'legenda',{});def(D.legenda,'int','Trabalho da '+D.consultoria);def(D.legenda,'cli','Encontro ou trabalho com a equipe do cliente');def(D.legenda,'marco','Batimento');def(D.legenda,'ent','Entrega');
}
defaults();

/* datas */
function P(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function F(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function BR(s){var a=s.split('-');return a[2]+'/'+a[1];}
function BRY(s){var a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0];}
function LONG(s){return WDN[P(s).getDay()]+', '+BR(s);}
function add(s,n){var d=P(s);d.setDate(d.getDate()+n);return F(d);}
function diff(a,b){return Math.round((P(b)-P(a))/864e5);}
function isHol(s){return D.feriados.indexOf(s)>=0;}
function isWe(s){var g=P(s).getDay();return g===0||g===6;}
function isBD(s){return !isWe(s)&&!isHol(s);}
function nextBD(s){while(!isBD(s))s=add(s,1);return s;}
function addBD(s,n){s=nextBD(s);while(n>0){s=add(s,1);if(isBD(s))n--;}return s;}
function monday(s){var d=P(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return F(d);}
function bdays(s,e){var n=0;for(var d=s;d<=e;d=add(d,1)){if(isBD(d))n++;}return n;}
function tdays(t){var n=0;t.segs.forEach(function(s){n+=bdays(s[0],s[1]);});return n;}
function parseBR(v,ref){var m=String(v).trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);if(!m)return null;
  var y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):+(ref||F(new Date())).slice(0,4),d=new Date(y,+m[2]-1,+m[1]);
  if(d.getMonth()!==+m[2]-1)return null;return F(d);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function slug(t){return String(t||'Projeto').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'Projeto';}
function tmin(t){var m='9999';t.segs.forEach(function(s){if(s[0]<m)m=s[0];});return m;}
function tmax(t){var m='0000';t.segs.forEach(function(s){if(s[1]>m)m=s[1];});return m;}
function pmin(){var m='9999';D.tasks.forEach(function(t){if(t.segs.length&&tmin(t)<m)m=tmin(t);});return m==='9999'?null:m;}
function people(t){return String(t.eq||'').split(/\s*[,·\/;]\s*|\s+e\s+/).map(function(x){return x.trim();}).filter(Boolean);}
function isPt(t){return t.tipo==='marco'||t.tipo==='ent';}
function find(id){for(var i=0;i<D.tasks.length;i++)if(D.tasks[i].id==id)return D.tasks[i];}
function getK(k){var p=k.split('.'),o=D;for(var i=0;i<p.length;i++){if(o==null)return '';o=o[p[i]];}return o==null?'':o;}
function setK(k,v){var p=k.split('.'),o=D;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;}

function snap(){undo.push(JSON.stringify(D));if(undo.length>80)undo.shift();document.getElementById('bUndo').disabled=false;dirty=true;}
function doUndo(){if(!undo.length)return;D=JSON.parse(undo.pop());defaults();if(!undo.length)document.getElementById('bUndo').disabled=true;syncChecks();all(true);}

/* Nomes da equipe do sistema: alimentam a sugestão da coluna "Quem faz",
   para o que se escreve aqui casar com quem existe lá. */
var EQPH=(D.equipeSistema||[]).length? 'ex.: '+(D.equipeSistema||[]).slice(0,2).join(', ') : 'ex.: Ana, Pedro';
(function(){var dl=document.getElementById('eqnomes');if(!dl)return;
  dl.innerHTML=(D.equipeSistema||[]).map(function(n){return '<option value="'+esc(n)+'">';}).join('');})();

/* ordenação: fases pela primeira data, tarefas pela data de início */
function sortAll(){
  D.tasks.forEach(function(t){t.segs.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0;});});
  D.tasks.forEach(function(t){if(D.fases.indexOf(t.fase)<0)D.fases.push(t.fase);});
  if(!D.autoSort)return;
  var fmin={};D.tasks.forEach(function(t){var m=tmin(t);if(!fmin[t.fase]||m<fmin[t.fase])fmin[t.fase]=m;});
  var idx={};D.fases.forEach(function(f,i){idx[f]=i;});
  D.fases.sort(function(a,b){var x=fmin[a]||'9999',y=fmin[b]||'9999';return x<y?-1:x>y?1:idx[a]-idx[b];});
  D.tasks.forEach(function(t,i){t._i=i;});
  D.tasks.sort(function(a,b){var x=tmin(a),y=tmin(b);if(x!==y)return x<y?-1:1;x=tmax(a);y=tmax(b);if(x!==y)return x<y?-1:1;return a._i-b._i;});
  D.tasks.forEach(function(t){delete t._i;});
}
function ord(){var o=[];D.fases.forEach(function(f){D.tasks.forEach(function(t){if(t.fase===f)o.push(t);});});return o;}

var RANGE=null,frozen=false;
function range(){
  if(frozen&&RANGE)return RANGE;
  var mn='9999',mx='0000';D.tasks.forEach(function(t){if(!t.segs.length)return;if(tmin(t)<mn)mn=tmin(t);if(tmax(t)>mx)mx=tmax(t);});
  if(mn==='9999'){mn=F(new Date());mx=mn;}
  if(D.inicio&&D.inicio<mn)mn=D.inicio;
  var a=monday(mn),b=add(monday(mx),6),nw=parseInt(D.semanas,10)||0;
  if(nw>0){var bw=add(a,7*nw-1);if(bw>b)b=bw;}
  RANGE={s:a,n:diff(a,b)+1};return RANGE;
}

/* cabeçalhos, legenda e textos soltos */
function renderHead(){
  document.querySelectorAll('[data-k]').forEach(function(el){if(el!==document.activeElement)el.textContent=getK(el.getAttribute('data-k'));});
  document.querySelectorAll('[data-leg]').forEach(function(el){if(el!==document.activeElement)el.textContent=D.legenda[el.getAttribute('data-leg')]||'';});
  document.title=D.titulos.p1+' · '+D.cliente;

}

}

function renderGantt(){
  var R=range(),n=R.n,g=document.getElementById('gantt'),cols='repeat('+n+',1fr)';
  var h='<div class="gh"><div class="lab">Tarefa</div><div class="scale"><div class="weeks" style="grid-template-columns:repeat('+(n/7)+',1fr)">';
  for(var w=0;w<n/7;w++){var ws=add(R.s,w*7);h+='<div>Semana '+(w+1)+'<small>'+BR(ws)+'–'+BR(add(ws,6))+'</small></div>';}
  h+='</div><div class="days" style="grid-template-columns:'+cols+'">';var bg='';
  for(var i=0;i<n;i++){var d=add(R.s,i),c=isHol(d)?'ho':(isWe(d)?'we':'');
    h+='<div class="'+c+'">'+WD[P(d).getDay()]+'<br>'+P(d).getDate()+'</div>';bg+='<div class="'+c+(i%7===0?' wk0':'')+'"></div>';}
  h+='</div></div></div>';
  var bgh='<div class="bg" style="grid-template-columns:'+cols+'">'+bg+'</div>',o=ord(),cur=null;
  o.forEach(function(t){
    if(t.fase!==cur){cur=t.fase;var fs=o.filter(function(x){return x.fase===cur&&x.segs.length;}),mn='9999',mx='0000';
      fs.forEach(function(x){if(tmin(x)<mn)mn=tmin(x);if(tmax(x)>mx)mx=tmax(x);});
      h+='<div class="gr ph"><div class="lab"><span contenteditable="true" data-fn="'+esc(cur)+'">'+esc(cur)+'</span><button type="button" class="addb screen-only" data-addf="'+esc(cur)+'" title="Adicionar tarefa nesta fase">+ tarefa</button></div><div class="track">'+bgh+
        (fs.length?'<div class="sum" style="left:calc('+(diff(R.s,mn)/n*100)+'% + 2px);width:calc('+((diff(mn,mx)+1)/n*100)+'% - 4px)"></div>':'')+'</div></div>';}
    var segs='',dates=t.segs.map(function(s){return s[0]===s[1]?BR(s[0]):BR(s[0])+'–'+BR(s[1]);}).join(' · ');
    t.segs.forEach(function(s,si){var l=diff(R.s,s[0])/n*100,wd=(diff(s[0],s[1])+1)/n*100;
      if(isPt(t))segs+='<div class="ms t-'+t.tipo+'" data-t="'+t.id+'" data-s="'+si+'" style="left:'+(l+wd/2)+'%"></div>';
      else segs+='<div class="seg t-'+t.tipo+'" data-t="'+t.id+'" data-s="'+si+'" style="left:calc('+l+'% + 2px);width:calc('+wd+'% - 4px)"><div class="h l"></div><div class="h r"></div></div>';});
    h+='<div class="gr"><div class="lab"><span class="n" contenteditable="true" data-tn="'+t.id+'">'+esc(t.nome)+'</span><span class="q"><span contenteditable="true" data-tq="'+t.id+'">'+esc(t.quem)+'</span>'+(dates?' · '+dates:'')+'</span></div><div class="track" data-t="'+t.id+'">'+bgh+segs+'</div></div>';
  });
  g.innerHTML=h;
  var td=F(new Date()),ti=diff(R.s,td);
  if(ti>=0&&ti<n){var line=document.createElement('div');line.className='today';
    line.style.left='calc(86mm + (100% - 86mm) * '+((ti+0.5)/n)+')';line.innerHTML='<span>hoje '+BR(td)+'</span>';g.appendChild(line);}
}

function renderEditor(){
  var o=ord(),h='',cur=null,num=0;
  o.forEach(function(t){
    if(t.fase!==cur){cur=t.fase;h+='<tr class="fz"><td colspan="'+(CLIENT?9:11)+'"><div class="fzw"><span>'+esc(cur)+'</span><button type="button" class="addb" data-addf="'+esc(cur)+'">+ tarefa nesta fase</button></div></td></tr>';}
    num++;
    var segs=t.segs.length?t.segs:[null];

      h+='<tr class="'+(first?'':'sub')+'" data-t="'+t.id+'" data-s="'+si+'"><td>'+(first?num:'')+'</td>';

        h+='<td><div class="nm"><span class="dot" style="background:'+COLORS[t.tipo]+'"></span><input data-f="nome" value="'+esc(t.nome)+'"></div></td>';
        var fo='';D.fases.forEach(function(f){fo+='<option'+(f===t.fase?' selected':'')+'>'+esc(f)+'</option>';});fo+='<option value="__nova">+ nova fase…</option>';
        h+='<td><select data-f="fase">'+fo+'</select></td>';

        h+='<td><select data-f="tipo">'+opt+'</select></td>';
      } else h+='<td colspan="4" style="padding-left:24px">↳ trecho '+(si+1)+'</td>';
      if(s)h+='<td><input class="dt" data-f="s" value="'+BRY(s[0])+'"></td><td><input class="dt" data-f="e" value="'+BRY(s[1])+'"></td><td class="du">'+bdays(s[0],s[1])+'</td>';
      else h+='<td colspan="3" style="color:var(--red)">sem datas: use "+ trecho"</td>';
      if(!CLIENT){
        if(first)h+='<td class="int int-col"><input data-f="eq" list="eqnomes" value="'+esc(t.eq||'')+'" placeholder="'+esc(EQPH)+'"></td><td class="int int-col" style="text-align:right"><input class="num" type="number" min="0" max="12" step="0.5" data-f="h" value="'+(t.h||0)+'"></td>';
        else h+='<td class="int int-col"></td><td class="int int-col"></td>';
      }
      h+='<td><div class="ctl">';
      if(first){var dis=D.autoSort?' disabled title="Desligue a ordenação automática para mover à mão"':'';
        h+='<button data-a="up"'+dis+'>↑</button><button data-a="dn"'+dis+'>↓</button><button data-a="seg" title="Dividir em mais um trecho">+ trecho</button><button class="x" data-a="del" title="Remover tarefa">×</button>';}
      else h+='<button class="x" data-a="dseg" title="Remover trecho">×</button>';
      h+='</div></td></tr>';
    });
  });
  document.getElementById('tb').innerHTML=h;
  var cp=document.getElementById('cap');if(cp)cp.value=D.cap;
}

function renderPrint(){
  var o=ord(),h='',cur=null,num=0;
  o.forEach(function(t){
    if(t.fase!==cur){cur=t.fase;h+='<tr class="fz"><td colspan="6">'+esc(cur)+'</td></tr>';}
    num++;
    var per=t.segs.map(function(s){return s[0]===s[1]?LONG(s[0]):LONG(s[0])+' a '+LONG(s[1]);}).join('<br>');
    h+='<tr><td>'+num+'</td><td class="a">'+esc(t.nome)+'</td><td>'+esc(t.quem)+'</td><td><span class="tp"><span class="dot" style="background:'+COLORS[t.tipo]+'"></span>'+esc(D.rotulos[t.tipo])+'</span></td><td class="per">'+per+'</td><td class="du">'+tdays(t)+'</td></tr>';
  });

/* horas */
function hoursModel(){
  var R=range(),days=[],mn0='9999',mx0='0000';D.tasks.forEach(function(t){if(!t.segs.length)return;if(tmin(t)<mn0)mn0=tmin(t);if(tmax(t)>mx0)mx0=tmax(t);});
  for(var i=0;i<R.n;i++){var d=add(R.s,i);if(isBD(d)&&d>=mn0&&d<=mx0)days.push(d);}
  var ppl=[],pd={},tw={},nW=R.n/7;
  (D.ordemEquipe||[]).forEach(function(p){if(ppl.indexOf(p)<0)ppl.push(p);});
  D.tasks.forEach(function(t){people(t).forEach(function(p){if(ppl.indexOf(p)<0)ppl.push(p);});});
  ppl.forEach(function(p){pd[p]={};});
  D.tasks.forEach(function(t){var ps=people(t),h=+t.h||0;tw[t.id]=[];for(var w=0;w<nW;w++)tw[t.id].push(0);
    if(!h||!ps.length)return;
    t.segs.forEach(function(s){for(var d=s[0];d<=s[1];d=add(d,1)){if(!isBD(d))continue;var w=Math.floor(diff(R.s,d)/7);
      ps.forEach(function(p){pd[p][d]=(pd[p][d]||0)+h;});tw[t.id][w]+=h*ps.length;}});
  });
  ppl=ppl.filter(function(p){return days.some(function(d){return pd[p][d];});});
  return {R:R,days:days,ppl:ppl,pd:pd,tw:tw,nW:nW};
}
function fmt(v){return v?(Math.round(v*10)/10).toString().replace('.',','):'';}
function renderHours(){
  if(CLIENT)return;
  var M=hoursModel(),cap=+D.cap||8,tot=0,over=0,weekT=[];for(var w=0;w<M.nW;w++)weekT.push(0);
  M.ppl.forEach(function(p){M.days.forEach(function(d){var v=M.pd[p][d]||0;tot+=v;if(v>cap)over++;weekT[Math.floor(diff(M.R.s,d)/7)]+=v;});});
  var pk=0;weekT.forEach(function(v,i){if(v>weekT[pk])pk=i;});
  var wUsed=weekT.filter(function(v){return v>0;}).length||1;
  document.getElementById('hcards').innerHTML=
    '<div class="cd"><div class="l">HORAS PREVISTAS</div><div class="v">'+(fmt(tot)||'0')+' h</div><div class="s">'+M.ppl.length+' pessoas · '+M.days.length+' dias úteis</div></div>'+
    '<div class="cd"><div class="l">MÉDIA POR SEMANA</div><div class="v">'+(fmt(tot/wUsed)||'0')+' h</div><div class="s">nas '+wUsed+' semanas com tarefa</div></div>'+
    '<div class="cd"><div class="l">SEMANA DE PICO</div><div class="v">Semana '+(pk+1)+'</div><div class="s">'+(fmt(weekT[pk])||'0')+' h · '+BR(add(M.R.s,pk*7))+' a '+BR(add(M.R.s,pk*7+4))+'</div></div>'+
    '<div class="cd'+(over?' alert':'')+'"><div class="l">DIAS ACIMA DA CAPACIDADE</div><div class="v">'+over+'</div><div class="s">pessoa-dia acima de '+fmt(cap)+' h</div></div>';
  var h='<table class="hm"><thead><tr><th style="width:24mm;text-align:left;padding-left:6px">Semana</th>',wk=-1,span=0,heads=[];
  M.days.forEach(function(d){var w=Math.floor(diff(M.R.s,d)/7);if(w!==wk){if(span)heads.push([wk,span]);wk=w;span=0;}span++;});if(span)heads.push([wk,span]);
  heads.forEach(function(x){h+='<th class="wkh" colspan="'+x[1]+'">S'+(x[0]+1)+'</th>';});
  h+='<th style="width:13mm">Total</th></tr><tr><th style="text-align:left;padding-left:6px">Pessoa</th>';
  wk=-1;M.days.forEach(function(d){var w=Math.floor(diff(M.R.s,d)/7);h+='<th'+(w!==wk?' class="wkh"':'')+'>'+WD[P(d).getDay()]+'<br>'+P(d).getDate()+'</th>';wk=w;});

function renameFase(old,nv){
  if(!nv||nv===old)return false;
  snap();
  var i=D.fases.indexOf(old),j=D.fases.indexOf(nv);
  if(j>=0){D.fases.splice(i,1);}else D.fases[i]=nv;
  D.tasks.forEach(function(t){if(t.fase===old)t.fase=nv;});
  return true;
}
function shiftAll(target){
  var pm=pmin();if(!pm){alert('Ainda não há tarefas com datas.');return;}
  var dw=Math.round(diff(monday(pm),monday(target))/7)*7;
  if(!dw){alert('O projeto já começa nessa semana.');return;}
  snap();
  D.tasks.forEach(function(t){t.segs=t.segs.map(function(s){return[add(s[0],dw),add(s[1],dw)];});});
  if(D.inicio)D.inicio=add(D.inicio,dw);
  var hit=[];D.tasks.forEach(function(t){t.segs.forEach(function(s){for(var d=s[0];d<=s[1];d=add(d,1))if(isHol(d)&&!isWe(d)&&hit.indexOf(t.nome)<0)hit.push(t.nome);});});
  all(true);
  alert('Projeto movido '+Math.abs(dw/7)+' semana(s) '+(dw>0?'para frente':'para trás')+'. Agora começa em '+BRY(pmin())+'.\n\nConfira a lista de feriados para o novo período.'+(hit.length?'\n\nTarefas que passam por feriado: '+hit.join('; '):''));
}

  if(e.button!==0)return;
  var el=e.target.closest('.seg,.ms');if(!el)return;e.preventDefault();
  var t=find(el.getAttribute('data-t')),si=+el.getAttribute('data-s'),tr=el.parentNode.getBoundingClientRect();
  var mode=e.target.classList.contains('l')?'l':(e.target.classList.contains('r')?'r':'m');
  frozen=true;snap();drag={t:t,si:si,mode:mode,x:e.clientX,o:t.segs[si].slice(),ppd:tr.width/RANGE.n,moved:false};
});
window.addEventListener('pointermove',function(e){
  if(!drag)return;var dd=Math.round((e.clientX-drag.x)/drag.ppd),s=drag.t.segs[drag.si],o=drag.o,mn=RANGE.s,mx=add(RANGE.s,RANGE.n-1);
  if(drag.mode==='m'){var ns=add(o[0],dd),ne=add(o[1],dd);if(ns<mn||ne>mx)return;s[0]=ns;s[1]=ne;}
  else if(drag.mode==='l'){var a=add(o[0],dd);if(a>s[1]||a<mn)return;s[0]=a;}
  else{var b=add(o[1],dd);if(b<s[0]||b>mx)return;s[1]=b;}
  if(dd!==0)drag.moved=true;renderGantt();
  tip.style.display='block';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';
  tip.textContent=(s[0]===s[1]?LONG(s[0]):LONG(s[0])+' → '+LONG(s[1]))+' · '+bdays(s[0],s[1])+' dia(s) útil(eis)';
});
window.addEventListener('pointerup',function(){
  if(!drag)return;if(!drag.moved){undo.pop();if(!undo.length)document.getElementById('bUndo').disabled=true;}
  drag=null;frozen=false;tip.style.display='none';all(true);
});
G.addEventListener('click',function(e){var b=e.target.closest('[data-addf]');if(b)addTask(b.getAttribute('data-addf'),true);});
G.addEventListener('dblclick',function(e){
  if(e.target.closest('.seg,.ms,[contenteditable]'))return;
  var tr=e.target.closest('.track[data-t]');if(!tr)return;
  var t=find(tr.getAttribute('data-t')),R=range(),r=tr.getBoundingClientRect(),i=Math.floor((e.clientX-r.left)/r.width*R.n);
  if(i<0||i>=R.n)return;var d=add(R.s,i);
  for(var k=0;k<t.segs.length;k++)if(d>=t.segs[k][0]&&d<=t.segs[k][1])return;
  snap();t.segs.push([d,d]);all(true);
});
G.addEventListener('contextmenu',function(e){
  var el=e.target.closest('.seg,.ms');if(!el)return;e.preventDefault();
  var t=find(el.getAttribute('data-t')),si=+el.getAttribute('data-s'),s=t.segs[si];
  var msg=t.segs.length>1?'Apagar este trecho de "'+t.nome+'" ('+(s[0]===s[1]?BR(s[0]):BR(s[0])+'–'+BR(s[1]))+')?':'Este é o único trecho de "'+t.nome+'". Apagar a tarefa inteira?';
  if(!confirm(msg))return;snap();
  if(t.segs.length>1)t.segs.splice(si,1);else D.tasks.splice(D.tasks.indexOf(t),1);
  all(true);
});

/* salvar e PDF */
function save(client){
  var data=JSON.parse(JSON.stringify(D));
  if(client){data.modo='cliente';data.incluirHoras=false;data.tasks.forEach(function(t){delete t.eq;delete t.h;});delete data.ordemEquipe;delete data.cap;}
  var doc=document.documentElement.cloneNode(true);
  ['gantt','tb','pt','keys','hcards','hmap','hweek','notes','cfg'].forEach(function(id){var el=doc.querySelector('#'+id);if(el)el.innerHTML='';});
  var cb=doc.querySelector('#cfgBox');if(cb){cb.removeAttribute('open');cb.querySelector('.tg').textContent='Abrir';}
  doc.querySelectorAll('img.logo').forEach(function(i){i.removeAttribute('src');});
  doc.querySelectorAll('[data-k],[data-leg]').forEach(function(el){el.textContent='';});
  if(client){doc.querySelectorAll('.int').forEach(function(el){el.parentNode.removeChild(el);});}
  doc.querySelector('#tip').style.display='none';
  doc.querySelector('#data').textContent=JSON.stringify(data,null,1).replace(/<\//g,'<\\/');
  var html='<!doctype html>\n'+doc.outerHTML;
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  a.download=slug(D.cliente)+'_Cronograma_'+(client?'Cliente':'Interno')+'.html';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  if(!client)dirty=false;
}
var bsv=document.getElementById('bSave');if(bsv)bsv.addEventListener('click',function(){save(false);});
document.getElementById('bSaveC').addEventListener('click',function(){save(true);});
document.getElementById('bPdf').addEventListener('click',function(){if(document.activeElement)document.activeElement.blur();setTimeout(function(){window.print();},50);});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});

if(CLIENT){document.querySelectorAll('.int').forEach(function(el){el.parentNode.removeChild(el);});}
setLogo();syncChecks();all(true);
})();
<\/script>

const {useState,useEffect,useRef,useMemo,createContext,useContext} = React;

/* ============================================================
   FOCUS FRANQUIAS · v2 — MODELO DE DADOS
   ============================================================ */
// HOJE = data real do dispositivo (meio-dia local, para não escorregar de fuso).
// Antes era uma data fixa (07/07/2026), o que deixava a linha "hoje" do Gantt errada.
function hojeDate(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate(),12,0,0); }
const TODAY = hojeDate();
// isoDate à prova de fuso (não usa toISOString, que converte para UTC)
const isoDate = (d)=>{ const x=(d instanceof Date? d : new Date(d)); if(isNaN(x)) return '';
  const p=(n)=>String(n).padStart(2,'0'); return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate()); };
const hojeISO = ()=> isoDate(hojeDate());
// converte 'YYYY-MM-DD' em Date local (evita o bug de UTC-3 puxar 1 dia pra trás)
const dLocal = (s)=>{ if(!s) return null; if(s instanceof Date) return s;
  const m=(''+s).slice(0,10).split('-'); return m.length===3? new Date(+m[0],+m[1]-1,+m[2],12,0,0) : new Date(s); };

  if(!p.startDate) return null;

  const dia=diaDoCronograma(p); if(dia===null) return null;

// ===== helpers de datas / semáforo / semana =====
function weekOfYear(d){ const dt=dLocal(d)||new Date(d); const oneJan=new Date(dt.getFullYear(),0,1); const days=Math.floor((dt-oneJan)/DIA); return Math.ceil((days+oneJan.getDay()+1)/7); }
/* ------------------------------------------------------------
   O SPRINT É QUINZENAL
   Duas semanas cheias, de segunda a domingo. A âncora fixa uma
   segunda-feira que abre quinzena, para que todas caiam sempre nas
   mesmas datas — não importa quando o sistema é aberto.
   ------------------------------------------------------------ */
/* O período é escolhido pela gestora (1 a 4 semanas) e guardado na base.
   Estas variáveis são o espelho dessa escolha, para as contas de data
   não precisarem carregar o banco inteiro. */
let SPRINT_DIAS=14;
let SPRINT_ANCORA='2026-10-05';            // segunda-feira que abre um sprint
const SPRINT_PERIODOS=[[7,'1 semana'],[14,'2 semanas (quinzenal)'],[21,'3 semanas'],[28,'4 semanas']];
function aplicarCfgSprint(db){
  const c=(db&&db.sprintCfg)||{};
  SPRINT_DIAS=Math.max(7,Math.min(28,+c.dias||14));
  SPRINT_ANCORA=c.ancora||'2026-10-05';
  return {dias:SPRINT_DIAS,ancora:SPRINT_ANCORA};
}
function inicioDoSprint(d){
  const seg=mondayOf(d);
  const base=mondayOf(dLocal(SPRINT_ANCORA));
  const dif=Math.round((seg-base)/86400000);
  const resto=((dif%SPRINT_DIAS)+SPRINT_DIAS)%SPRINT_DIAS;
  return addDays(seg,-resto);
}
/* Monta o sprint da quinzena em que a data cai. */
function sprintDaData(d,congelado){
  const ini=inicioDoSprint(d);
  return {id:'s'+weekOfYear(ini)+'-'+ini.getFullYear(),week:weekOfYear(ini),year:ini.getFullYear(),
    start:isoDate(ini),end:isoDate(addDays(ini,SPRINT_DIAS-1)),frozen:!!congelado};
}
/* "12/10 a 25/10" — é assim que a quinzena se apresenta. */
const rotuloSprint=(sp)=> sp? (fmtBR(sp.start).slice(0,5)+' a '+fmtBR(sp.end).slice(0,5)) : '—';
const semanasDoSprint=(sp)=> sp? Math.max(1,Math.round(((dLocal(sp.end)-dLocal(sp.start))/86400000+1)/7)) : 1;

function mondayOf(d){ const dt=dLocal(d)||new Date(d); const day=(dt.getDay()+6)%7; const r=new Date(dt); r.setDate(r.getDate()-day); return r; }
function addDays(d,n){ const dt=dLocal(d)||new Date(d); const r=new Date(dt); r.setDate(r.getDate()+n); return r; }
// soma N meses no calendário (mantém o dia; se o mês de destino não tiver o dia, cai no último dia dele)
function addMonths(d,n){ const dt=dLocal(d)||new Date(d); const dia=dt.getDate();
  const r=new Date(dt.getFullYear(),dt.getMonth()+Number(n||0),1);
  const ult=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();
  r.setDate(Math.min(dia,ult)); return r; }
function fmtBR(d){ if(!d) return '—'; if(d instanceof Date) d=isoDate(d); const s=(''+d).slice(0,10).split('-'); return s.length===3? s[2]+'/'+s[1]+'/'+s[0] : (''+d); }
function diffDias(a,b){ const x=dLocal(a),y=dLocal(b); if(!x||!y) return 0; return Math.round((y-x)/DIA); }

/* ===== PAUSAS ===== */
// Total de dias parados dentro de uma janela (usa o fim da pausa ou HOJE, se ainda aberta)
function pausedDays(p, ate){
  const lim=dLocal(ate)||TODAY; const ini=dLocal(p.startDate);
  return (p.pauses||[]).reduce((tot,ps)=>{
    const a=dLocal(ps.start); if(!a) return tot;
    const b=ps.end? dLocal(ps.end) : lim;
    const de=new Date(Math.max(a, ini||a)), ate2=new Date(Math.min(b, lim));
    const d=Math.round((ate2-de)/DIA);
    return tot + (d>0? d : 0);
  },0);
}
function pausaAtiva(p){ const h=hojeISO(); return (p.pauses||[]).some(ps=>ps.start<=h && (!ps.end || ps.end>=h)); }
// % de tempo decorrido DESCONTANDO os dias de pausa (assim uma pausa retroativa não "atrasa" o semáforo)
function elapsedPct(p){
  const s=dLocal(p.startDate), e=dLocal(p.endDate);
  if(!s||!e||e<=s) return 100;
  const totalUteis=Math.max(1,(e-s)/DIA - pausedDays(p, p.endDate));
  const corridos=Math.max(0,(TODAY-s)/DIA - pausedDays(p, hojeISO()));
  return Math.max(0,Math.min(100,Math.round(corridos/totalUteis*100)));
}

function sinaleira(p){
  if(p.status==='Pausado'||p.status==='Cancelado') return {k:'gray',label:p.status};
  if(p.status==='Finalizado') return {k:'green',label:'Entregue'};
  const prog=projProgress(p);
  // projeto ainda zerado (sem entregáveis concluídos e sem atividades) → não é avaliado como atrasado
  if(prog.pct===0 && (!p.activities||p.activities.length===0)) return {k:'gray',label:'Aguardando dados'};
  const done=prog.pct, elapsed=elapsedPct(p);
  const gap=done-elapsed;
  if(gap>=-8) return {k:'green',label:'No prazo'};
  if(gap>=-22) return {k:'yellow',label:'Atenção'};
  return {k:'red',label:'Atrasado'};
}

// marcos planejados nas divisas das 5 fases (1/5, 2/5, 3/5 e no fim)
function marcoDates(start,end){
  const s=new Date(start),e=new Date(end),span=e-s;
  const at=(f)=>isoDate(new Date(s.getTime()+span*f));
  return {1:at(0.20),2:at(0.40),3:at(0.60),4:at(0.80)};
}
