/* ============================================================
   COCKPIT DO CLIENTE
   A tela dos 30 segundos antes da reunião: onde o plano está,
   o que venceu, o que vem e o que decidir. Só aparece quando o
   cliente tem planejamento; sem plano, segue o Overview de sempre.
   ============================================================ */
function Cockpit({p,mutate}){
  const {db,go,flash}=useDB();
  const ativas=fasesAtivas(p);
  const atrasadas=acoesAtrasadas(p);
  const proximas=acoesNoPeriodo(p,14);
  const semana=acoesSemana(p);
  const objs=todosObjetivos(p);
  const emRisco=objs.filter(o=>farolObjetivo(o).k==='risco');
  const pr=projProgress(p);
  const decs=((p.bsc&&p.bsc.decisoes)||[]).filter(d=>!d.ok);
  const semPrazo=(p.activities||[]).filter(a=>a.peId&&a.column!=='concluido'&&!a.date&&!a.buildStart);
  const concluir=(id)=>mutate(pr2=>{const a=pr2.activities.find(x=>x.id===id); if(a) a.column=(a.column==='concluido')?'andamento':'concluido';});

  const Linha=({a,mostrarData})=>(
    <div className="row" style={{gap:8,padding:'6px 0',borderBottom:'1px solid #f4f5fa'}}>
      <button className={"chk sm "+(a.column==='concluido'?'on':'')} onClick={()=>concluir(a.id)}>{a.column==='concluido'&&I.check}</button>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:'.81rem',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.name}</div>
        <div className="muted" style={{fontSize:'.69rem'}}>{(()=>{const pe=achaPE(p,a.peId); const f=pe&&(pe.fases||[]).find(x=>x.id===a.faseId);
          return (pe?pe.cod:'')+(f?' · '+f.nome:'');})()}</div>
      </div>
      {mostrarData&&a.date&&<span className="mono" style={{fontSize:'.72rem',fontWeight:700,color:taskAtrasada(a)?'#B33A3A':'var(--text-2)'}}>{fmtBR(a.date).slice(0,5)}</span>}
      <Avatares db={db} t={a}/>
    </div>);

  return (<div style={{display:'flex',flexDirection:'column',gap:16}}>
    <SinaleirasCliente p={p} mutate={mutate}/>
    {/* ---- a jornada do método: rota, etapa e dia do cronograma ---- */}
    <div className="card card-pad">
      <div className="between" style={{flexWrap:'wrap',gap:12,marginBottom:12}}>
        <div className="row" style={{gap:8,flexWrap:'wrap',alignItems:'center'}}>
          {PHASES.map((e,i)=>{
            const mapa=ETAPA_DIAS[p.rota||'Estruturação']||{}, faixa=mapa[e];
            const naoSeAplica=!faixa;
            const atual=p.phase===e, esperada=etapaEsperada(p)===e;
            const c=PHASE_C[e]||{bg:'#eee',fg:'#555'};
            return (<button key={e} className={"etapa-pill"+(atual?' on':'')+(naoSeAplica?' off':'')}
              style={atual?{background:c.fg,borderColor:c.fg}:null}
              onClick={()=>!naoSeAplica&&mutate(pr=>pr.phase=e)}
              title={naoSeAplica?'Não se aplica à Rota Direta':ETAPA_PERGUNTA[e]}>
              <b>{i}. {shortPhase(e)}</b>
              <span>{naoSeAplica?'não se aplica':(faixa[1]===null?'dia '+faixa[0]+'+':'dia '+faixa[0]+'–'+faixa[1])}</span>
              {esperada&&!atual&&<i title="É a etapa esperada para hoje">•</i>}
            </button>);})}
        </div>
        {(()=>{const dia=diaDoCronograma(p); if(dia===null) return null;
          const esp=etapaEsperada(p), atrasado=esp&&PHASES.indexOf(esp)>PHASES.indexOf(p.phase);
          return (<div style={{textAlign:'right'}}>
            <div className="mono" style={{fontSize:'.9rem',fontWeight:800}}>dia {dia}</div>
            <div className="muted" style={{fontSize:'.7rem',color:atrasado?'var(--coral)':undefined}}>
              {atrasado? 'esperado: '+shortPhase(esp) : 'no cronograma'}</div>
          </div>);})()}
      </div>
      <div className="row" style={{gap:30,flexWrap:'wrap',alignItems:'center'}}>
        <span className="stat-mini"><span className="n">{pr.pct}%</span><span className="l">do plano concluído</span></span>
        <span className="stat-mini"><span className="n" style={{color:'var(--text-3)'}}>{pr.done}/{pr.total}</span><span className="l">ações</span></span>
        <span className="stat-mini"><span className="n" style={{color:atrasadas.length?'var(--coral)':'var(--green)'}}>{atrasadas.length}</span><span className="l">atrasadas</span></span>
        <span className="stat-mini"><span className="n" style={{color:'var(--brand)'}}>{semana.length}</span><span className="l">em construção esta semana</span></span>
        <span className="stat-mini"><span className="n" style={{color:emRisco.length?'var(--coral)':'var(--green)'}}>{emRisco.length}</span><span className="l">objetivos em risco</span></span>
      </div>
    </div>

    <div className="cockpit-grid" style={{display:'grid',gridTemplateColumns:'1.15fr .85fr',gap:16,alignItems:'start'}}>
      <div style={{display:'flex',flexDirection:'column',gap:16}}>
        {/* ---- fases correntes: o coração da tela ---- */}
        <div className="card card-pad">
          <div className="card-h"><h3>Onde cada projeto está</h3><span className="sub">fase corrente de cada PE</span></div>
          {ativas.length? ativas.map(({pe,f,pg})=>{
            const st=faseInfo(statusFase(p,f));
            return (<div key={pe.id} className="row" style={{gap:12,padding:'10px 0',borderBottom:'1px solid #f4f5fa',cursor:'pointer'}}
              onClick={()=>go('projects',p.id)}>
              <span className="mono" style={{fontSize:'.72rem',fontWeight:800,color:'#0F4245',width:46}}>{pe.cod}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:'.86rem',fontWeight:700}}>{f.nome}</div>
                <div className="muted" style={{fontSize:'.72rem'}}>{pe.nome}{(()=>{const j=janelaDaFase(pe,f.id); return j.ini?' · '+fmtBR(j.ini).slice(0,5)+' → '+fmtBR(j.fim).slice(0,5):(f.dur?' · '+f.dur:'');})()}{f.entrega?' · entrega: '+f.entrega:''}</div>
              </div>
              <div style={{width:90}}><div className="bar sm"><div style={{width:pg.pct+'%',background:st[2]}}></div></div>
                <div className="mono muted" style={{fontSize:'.68rem',marginTop:3,textAlign:'right'}}>{pg.done}/{pg.total} ações</div></div>
            </div>);})
          : <div className="muted" style={{fontSize:'.82rem'}}>Todas as fases concluídas 🎉</div>}
        </div>

        {/* ---- o que venceu ---- */}
        {atrasadas.length>0&&<div className="card card-pad" style={{borderLeft:'4px solid #B33A3A'}}>

        {decs.length>0&&<div className="card card-pad">
          <div className="card-h"><h3>Decisões pendentes</h3></div>
          {decs.slice(0,5).map((dd,i)=>(<div key={i} className="row" style={{gap:8,padding:'5px 0',alignItems:'flex-start'}}>
            <span style={{color:'var(--coral)',fontWeight:800}}>·</span>
            <span style={{fontSize:'.78rem'}}>{dd.texto||dd.nome||String(dd)}</span></div>))}
        </div>}

        {/* ---- pendências de gestão ---- */}
        {semPrazo.length>0&&<div className="card card-pad" style={{borderLeft:'4px solid #C58B2A'}}>
          <div className="card-h"><h3>Sem prazo definido</h3><span className="sub">{semPrazo.length} ações</span></div>
          <div className="muted" style={{fontSize:'.78rem'}}>
            Elas não entram no sprint nem no calendário enquanto não tiverem prazo de construção.
          </div>
          {semPrazo.slice(0,4).map(a=>(<div key={a.id} className="row" style={{gap:8,padding:'5px 0',borderBottom:'1px solid #f4f5fa'}}>
            <span style={{fontSize:'.78rem',flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.name}</span>
            <Avatares db={db} t={a}/></div>))}
          {semPrazo.length>4&&<div className="muted" style={{fontSize:'.72rem',marginTop:6}}>e mais {semPrazo.length-4}.</div>}
        </div>}

        <div className="card card-pad">
          <div className="card-h"><h3>Contato</h3></div>
          <div style={{fontSize:'.82rem'}}>{p.owner||'—'}</div>
          {p.phone&&<div className="muted" style={{fontSize:'.78rem'}}>{p.phone}</div>}
          <div className="muted" style={{fontSize:'.76rem',marginTop:8}}>
            Coordenação: {member(db,p.coordinator).name} · Gestão: {member(db,p.manager).name}
          </div>
          <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}}>
            <div className="muted" style={{fontSize:'.72rem',marginBottom:6}}>Rota do cliente</div>
            <div className="row" style={{gap:6,marginBottom:12}}>
              {ROTAS.map(r=>(<button key={r} className={"fpill "+(p.rota===r?'on':'')}

                Rota {r}</button>))}
            </div>
            <div className="muted" style={{fontSize:'.72rem',marginBottom:6}}>Contrato: ticket e horas previstas por mês</div>
            <div className="row" style={{gap:8,alignItems:'baseline',marginBottom:12,flexWrap:'wrap'}}>

                  onCommit={v=>mutate(pr=>pr.ticket=+v||0)}/></span>
              <span className="row" style={{gap:4,alignItems:'baseline'}}>
                <LiveInput className="inp" type="number" style={{width:72}} value={p.horasPlan||0}
                  onCommit={v=>mutate(pr=>pr.horasPlan=+v||0)}/>

            <div className="muted" style={{fontSize:'.72rem',marginBottom:6}}>Cor deste cliente no calendário</div>
            <div className="row" style={{gap:4,flexWrap:'wrap'}}>
              {CORES_CLIENTE.map(c=>(<button key={c} className={"swatch"+(corDoCliente(p)===c?' on':'')}
                style={{background:c}} onClick={()=>mutate(pr=>pr.cor=c)} title={c}/>))}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>);
}

        <Info label="Tier"><select className="mini-sel" value={p.tier} onChange={e=>mutate(pr=>pr.tier=e.target.value)}>{db.tiers.map(x=><option key={x}>{x}</option>)}</select></Info>
        <Info label="Tipo"><select className="mini-sel" value={p.tipo} onChange={e=>mutate(pr=>pr.tipo=e.target.value)}>{db.tipos.map(x=><option key={x}>{x}</option>)}</select></Info>
        <Info label="Setor"><select className="mini-sel" value={p.setor} onChange={e=>mutate(pr=>pr.setor=e.target.value)}>{db.setores.map(x=><option key={x}>{x}</option>)}</select></Info>
        <Info label="Perfil do cliente"><select className="mini-sel" value={p.perfil} onChange={e=>mutate(pr=>pr.perfil=e.target.value)}>{db.perfis.map(x=><option key={x}>{x}</option>)}</select></Info>
        <Info label="Status"><select className="mini-sel" value={p.status}
          onChange={e=>mutate(pr=>{pr.status=e.target.value;feedLog(pr,'Status alterado para '+e.target.value);})}>

        {!temPlanoFases(p)&&<Info label="Fase"><select className="mini-sel" value={p.phase} onChange={e=>mutate(pr=>pr.phase=e.target.value)}>{PHASES.map(x=><option key={x}>{x}</option>)}</select></Info>}
        <Info label="Início"><input type="date" className="mini-sel" value={p.startDate||''} onChange={e=>setDatas('startDate',e.target.value)}/></Info>
        <Info label="Previsão"><input type="date" className="mini-sel" value={p.endDate||''} onChange={e=>setDatas('endDate',e.target.value)}/></Info>
        <Info label="Entrega real"><input type="date" className="mini-sel" value={p.realEnd||''} onChange={e=>mutate(pr=>pr.realEnd=e.target.value)}/></Info>

      </div>
      <div className="card card-pad"><div className="card-h"><h3>Contato & Equipe</h3></div>

        <Info label="Telefone"><LiveInput className="mini-sel" style={{width:170}} value={p.phone} onCommit={v=>mutate(pr=>pr.phone=v)} placeholder="(00) 00000-0000"/></Info>
        <Info label="Coordenador"><div className="row" style={{gap:6}}><Avatar db={db} id={p.coordinator} size="sm"/><select className="mini-sel" value={p.coordinator} onChange={e=>mutate(pr=>pr.coordinator=e.target.value)}>{db.team.filter(t=>t.role!=='Gerente').map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div></Info>
        <Info label="Gerente"><select className="mini-sel" value={p.manager} onChange={e=>mutate(pr=>pr.manager=e.target.value)}>{MANAGERS.map(m=><option key={m}>{m}</option>)}</select></Info>

        <div style={{padding:'8px 0'}}><span className="muted" style={{fontSize:'.78rem'}}>Observações</span>

      </div>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div className="card card-pad"><div className="card-h"><h3>Progresso por Fase</h3>
        {temPlanoFases(p)&&<span className="sub">fases dos projetos estratégicos</span>}</div>
        {temPlanoFases(p)
          ? (p.bsc.projetos||[]).map(pe=>{
              const fs=pe.fases||[]; if(!fs.length) return null;
              const feitas=fs.filter(f=>statusFase(p,f)==='concluida').length;
              return (<div key={pe.id} style={{marginBottom:16}}>
                <div className="between" style={{marginBottom:7}}>
                  <span className="mono" style={{fontSize:'.72rem',fontWeight:800,color:'#0F4245'}}>{pe.cod}</span>
                  <span className="mono muted" style={{fontSize:'.7rem'}}>{feitas}/{fs.length}</span>
                </div>
                {fs.map((f,i)=>{ const pf=progressoFase(p,f), sk=statusFase(p,f), st=faseInfo(sk);
                  const pct = sk==='concluida'?100 : (sk==='andamento'? Math.max(pf.pct,8) : pf.pct);
                  return (<div key={f.id} style={{marginBottom:9}}>
                    <div className="between" style={{marginBottom:4,gap:8}}>
                      <span style={{fontSize:'.78rem',fontWeight:600,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        <span className="mono muted" style={{fontSize:'.68rem',marginRight:6}}>{String(i+1).padStart(2,'0')}</span>{f.nome}</span>
                      <span className="mono" style={{fontSize:'.7rem',fontWeight:700,color:st[2]}}>{pct}%</span>
                    </div>
                    <div className="bar-track"><div className="bar-fill" style={{width:pct+'%',background:st[2]}}></div></div>
                    {pf.total>0&&<div className="muted" style={{fontSize:'.68rem',marginTop:2}}>{pf.done}/{pf.total} ações</div>}
                  </div>);})}
              </div>);})
          : DLV_FASES.map(f=>{const fp=faseProgress(p,f);return(<div key={f} style={{marginBottom:13}}><div className="between" style={{marginBottom:5}}><span style={{fontSize:'.8rem',fontWeight:600}}>{f}</span><span className="mono" style={{fontSize:'.74rem',fontWeight:700,color:'var(--brand)'}}>{fp.pct}%</span></div><div className="bar-track"><div className="bar-fill" style={{width:fp.pct+'%'}}></div></div></div>);})}
      </div>
      <div className="card card-pad"><div className="card-h"><h3>Próximas Entregas</h3></div>
        {temPlanoFases(p)? (()=>{
            const pend=(p.bsc.projetos||[]).flatMap(pe=>(pe.fases||[]).filter(f=>statusFase(p,f)!=='concluida'&&f.entrega).map(f=>({pe,f})));
            if(!pend.length) return <div className="muted" style={{fontSize:'.82rem'}}>Todas as fases entregues 🎉</div>;
            return pend.slice(0,7).map(({pe,f})=>(<div key={f.id} style={{padding:'7px 0',borderBottom:'1px solid #f0f1f7'}}>
              <div className="row" style={{gap:6}}>
                <span className="mono" style={{fontSize:'.68rem',fontWeight:800,color:'#0F4245'}}>{pe.cod}</span>
                <span style={{fontSize:'.8rem',fontWeight:600}}>{f.entrega}</span></div>
              <div className="muted" style={{fontSize:'.71rem',marginTop:2}}>{f.nome}{f.dur?' · '+f.dur:''}</div>
            </div>));
          })()
        : (<>{nextDel.map(d=>(<div key={d.id} className="between" style={{padding:'7px 0',borderBottom:'1px solid #f0f1f7'}}><span style={{fontSize:'.82rem'}}>{d.name.replace('⭐ ','⭐ ')}</span><span className="badge" style={{background:DLV_STATUS_C[d.status]+'22',color:DLV_STATUS_C[d.status]}}>{d.status}</span></div>))}
          {!nextDel.length&&<div className="muted" style={{fontSize:'.82rem'}}>Todos os entregáveis concluídos 🎉</div>}</>)}
      </div>
    </div>
  </div>);
}

function TabDeliverables({p,mutate}){
  const {db}=useDB();
  const [fFase,setFFase]=useState('Todas'); const [fStatus,setFStatus]=useState('Todos'); const [q,setQ]=useState(''); const [openC,setOpenC]=useState({});
  const setDel=(id,fn)=>mutate((proj)=>{const d=proj.deliverables.find(x=>x.id===id);fn(d,proj);});
  const toggleDone=(id)=>setDel(id,(d,proj)=>{
    const done=d.status!=='Concluído'; d.status=done?'Concluído':'Pendente';
    if(done){ d.endDate=isoDate(TODAY);
      if(d.marco){ const nf=MARCO_NEXT[d.marco]; if(PHASES.indexOf(nf)>PHASES.indexOf(proj.phase)){proj.phase=nf;feedLog(proj,'Marco '+d.marco+' concluído → fase avançou para '+nf,'','sistema');} }
    }
  });
  const addDel=(fase,subgroup)=>mutate(proj=>{proj.deliverables.push({id:uid(),name:'Novo entregável',fase,subgroup,marco:0,status:'Pendente',assignee:proj.consultants[0]||'',startDate:isoDate(TODAY),endDate:'',description:'',comment:''});});
  const delDel=(id)=>mutate(proj=>{proj.deliverables=proj.deliverables.filter(x=>x.id!==id);});

  return (<div>
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="between" style={{flexWrap:'wrap',gap:10}}>
        <div className="row" style={{flexWrap:'wrap',gap:10}}>
          <input className="inp" style={{width:200}} placeholder="Buscar entregável..." value={q} onChange={e=>setQ(e.target.value)}/>
          <select className="sel" style={{width:'auto'}} value={fFase} onChange={e=>setFFase(e.target.value)}>{['Todas',...DLV_FASES].map(x=><option key={x}>{x}</option>)}</select>
          <select className="sel" style={{width:'auto'}} value={fStatus} onChange={e=>setFStatus(e.target.value)}>{['Todos',...DLV_STATUS].map(x=><option key={x}>{x}</option>)}</select>
        </div>
        <span className="muted" style={{fontSize:'.78rem'}}>% do projeto conta só entregáveis concluídos</span>
      </div>
    </div>
    {DLV_FASES.filter(f=>fFase==='Todas'||fFase===f).map(fase=>{
      const fp=faseProgress(p,fase);
      return (<div key={fase} className="card" style={{marginBottom:14,overflow:'hidden'}}>
        <div className="dl-fh" style={{margin:0,borderRadius:0,border:'none',borderBottom:'1px solid var(--border)'}}>
          <h4>{fase}</h4><span className="cnt">{fp.done}/{fp.total}</span>
          <div className="bar-track"><div className="bar-fill" style={{width:fp.pct+'%'}}></div></div><span className="mono" style={{fontWeight:700,fontSize:'.78rem',color:'var(--brand)'}}>{fp.pct}%</span>
        </div>
        {(SUBGROUPS[fase]||['—']).map(sub=>{
          let items=p.deliverables.filter(d=>d.fase===fase&&d.subgroup===sub).filter(d=>{
            if(fStatus!=='Todos'&&d.status!==fStatus)return false;
            if(q&&!d.name.toLowerCase().includes(q.toLowerCase()))return false; return true;});
          return (<div key={sub} style={{padding:'0 4px 4px'}}>
            <div className="subg">{sub}<span className="cnt">{items.filter(d=>d.status==='Concluído').length}/{items.length}</span>
              <button className="btn btn-ghost btn-sm" style={{marginLeft:8,padding:'2px 8px'}} onClick={()=>addDel(fase,sub)}>{I.plus}</button></div>
            {items.map(d=>(<div key={d.id}>
              <div className={"dl-row "+(d.marco?'marco':'')}>
                <button className={"chk "+(d.status==='Concluído'?'on':'')} onClick={()=>toggleDone(d.id)}>{d.status==='Concluído'&&I.check}</button>
                <input className="dl-name" style={{border:'none',background:'transparent',fontWeight:d.marco?700:400,color:d.marco?'#c5341f':'inherit'}} value={d.name.replace('⭐ ','')} onChange={e=>setDel(d.id,x=>x.name=(d.marco?'⭐ ':'')+e.target.value)}/>
                <select className="mini-sel" style={{color:DLV_STATUS_C[d.status]}} value={d.status} onChange={e=>setDel(d.id,(x,proj)=>{x.status=e.target.value;if(e.target.value==='Concluído')x.endDate=isoDate(TODAY);})}>{DLV_STATUS.map(x=><option key={x}>{x}</option>)}</select>
                <select className="mini-sel" value={d.assignee} onChange={e=>setDel(d.id,x=>x.assignee=e.target.value)}>{db.team.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
                <input type="date" className="mini-sel" title="Início" value={d.startDate} onChange={e=>setDel(d.id,x=>x.startDate=e.target.value)}/>
                <input type="date" className="mini-sel" title="Conclusão" value={d.endDate} onChange={e=>setDel(d.id,x=>x.endDate=e.target.value)}/>
                <button className="icon-btn" style={{width:26,height:26,color:d.description?'var(--brand)':'var(--text-3)'}} onClick={()=>setOpenC(o=>({...o,[d.id]:!o[d.id]}))} title="Descrição">≡</button>
                {!d.marco&&<button className="icon-btn" style={{width:26,height:26,color:'var(--text-3)'}} onClick={()=>delDel(d.id)} title="Excluir">{I.trash}</button>}
              </div>
              {openC[d.id]&&<div style={{padding:'8px 14px 12px 46px',background:'#fafaff'}}><textarea className="ta" style={{minHeight:48}} placeholder="Descrição específica deste entregável..." value={d.description} onChange={e=>setDel(d.id,x=>x.description=e.target.value)}/></div>}
            </div>))}
            {!items.length&&<div className="muted" style={{fontSize:'.76rem',padding:'6px 14px'}}>Nenhum item.</div>}
          </div>);
        })}
      </div>);
    })}
  </div>);
}

/* ============================================================
   ABA TAREFAS DO CLIENTE
   Tudo o que está em curso para este cliente, no mesmo formato do
   quadro geral — mas agrupado pelo plano (projeto estratégico e fase),
   que é como o trabalho realmente se organiza aqui dentro.
   ============================================================ */
/* Aba Matriz: a ficha de posicionamento do método, preenchida no
   Diagnóstico e reposicionada a cada trimestre. */
/* ============================================================
   TRILHA DA JORNADA
   O cronograma do método desenhado como estrada: cada marco na sua
   etapa, com o dia previsto. Serve para o cliente ver onde está e o
   que vem — e para a equipe marcar o que já aconteceu.
   Os marcos vêm do cronograma padrão (Capítulo 4), por rota.
   ============================================================ */
const TRILHA_MARCOS={
  'Estruturação':[
    {id:'m1', nome:'Kick-off',            leg:'Dia 0',        dia:0,   etapa:0},
    {id:'m2', nome:'Caixa de 30 dias',    leg:'Semana 2',     dia:14,  etapa:0},
    {id:'m3', nome:'Mapa de dívidas',     leg:'Semana 4',     dia:28,  etapa:0},
    {id:'m4', nome:'Sistema parametrizado',leg:'Semana 6',    dia:42,  etapa:0},
    {id:'m5', nome:'DFC histórico',       leg:'Semanas 6–8',  dia:49,  etapa:0, cond:true},
    {id:'m6', nome:'1º fechamento',       leg:'Semana 8',     dia:56,  etapa:0},
    {id:'m7', nome:'Gate de saída',       leg:'Semana 12 · dia 60', dia:60, etapa:0, gate:true},
    {id:'m8', nome:'Diagnóstico',         leg:'Dia 90',       dia:90,  etapa:1},
    {id:'m9', nome:'Plano assinado',      leg:'Dia 120',      dia:120, etapa:2},

/* ============================================================
   CRONOGRAMA SEMANAL DO CLIENTE
   Uma linha por semana: o foco combinado, as tarefas com janela naquela
   semana, os compromissos com hora e os marcos da trilha que caem ali.
   É onde a gestora define "o que este cliente recebe nesta semana".
   ============================================================ */
/* ------------------------------------------------------------
   CRONOGRAMA → TAREFAS
   Cada LINHA do cronograma É uma tarefa do cliente: mesmo nome, mesmo
   período, mesmas horas, mesmas pessoas. O cronograma manda nesses campos;
   a tarefa guarda o que é só dela — situação, horários do dia e observações.
   ------------------------------------------------------------ */
const CRONO_TIPO={int:'Documento',cli:'Reunião',marco:'Reunião',ent:'Entrega'};
const CRONO_ROTULO={int:'interna',cli:'com o cliente',marco:'batimento',ent:'entrega'};

/* Quem executa, lido do cronograma. A coluna "Quem faz" aceita mais de um
   nome ("Ana, Pedro"); cada nome reconhecido entra como responsável. */
function quensDoCrono(db,p,t){
  /* devolve na ordem em que os nomes aparecem escritos */
  const acha=(txt)=>{ const s=(txt||'').toLowerCase();
    if(!s.trim()) return [];
    return (db.team||[]).map(m=>({id:m.id,i:(m.name||'')?s.indexOf((m.name||'').toLowerCase()):-1}))
      .filter(x=>x.i>=0).sort((a,b)=>a.i-b.i).map(x=>x.id); };
  const porEq=acha(t.eq);          // a coluna "Quem faz" é a que manda
  if(porEq.length) return porEq;
  const porQuem=acha(t.quem);      // sem ela, tenta o texto de quem participa
  if(porQuem.length) return porQuem;
  const padrao=p.coordinator||((db.team||[])[0]||{}).id||'';
  return padrao? [padrao] : [];
}
function janelaDoCrono(t){
  const segs=(t.segs||[]).filter(x=>x&&x[0]&&x[1]);
  if(!segs.length) return null;
  const ini=segs.map(x=>x[0]).sort()[0];
  const fim=segs.map(x=>x[1]).sort().pop();
  return {ini,fim,n:segs.length};
}

/* Reconcilia: cria o que falta, atualiza o que mudou, remove o que saiu
   do cronograma. Tarefas já concluídas não são apagadas — só perdem o
   vínculo, para não sumir histórico de trabalho feito. */
function sincronizarCrono(db,pr){
  if(!pr.cronoDoc||pr.cronoSync===false) return {criadas:0,atualizadas:0,removidas:0};
  const doc=pr.cronoDoc, lista=(doc.tasks||[]).filter(t=>(t.nome||'').trim());
  const r={criadas:0,atualizadas:0,removidas:0};
  const vistos=new Set();

  lista.forEach(t=>{
    const cid='crono:'+t.id;
    vistos.add(cid);
    const j=janelaDoCrono(t);
    const existente=(pr.activities||[]).find(a=>a.cronoId===cid);
    const campos={
      name:(t.nome||'').trim(),
      type:CRONO_TIPO[t.tipo]||'Outro',
      estHoras:+t.h||0,
      cronoFase:t.fase||'',
    };
    const quem=quensDoCrono(db,pr,t);
    if(j){ campos.buildStart=j.ini; campos.buildEnd=j.fim; campos.date=j.fim; }
    if(existente){
      let mudou=false;
      Object.entries(campos).forEach(([k,v])=>{ if(existente[k]!==v){ existente[k]=v; mudou=true; } });
      /* o cronograma manda em quem faz, mas só quando mudou de verdade */
      if(respsDe(existente).join(',')!==quem.join(',')){ setResps(existente,quem); mudou=true; }
      /* a janela encolheu? horários fora dela não fazem sentido */
      podaSessoes(existente);
      if(mudou) r.atualizadas++;
    }else{
      pr.activities=pr.activities||[];
      pr.activities.unshift({id:uid(),projectId:pr.id,cronoId:cid,cronoFase:campos.cronoFase,
        name:campos.name,type:campos.type,assignees:quem,assignee:quem[0]||'',
        date:campos.date||'',buildStart:campos.buildStart||'',buildEnd:campos.buildEnd||'',
        hora:'',durMin:0,sessoes:{},column:'backlog',sprintId:null,prio:'Média',
        estHoras:campos.estHoras,obs:'',notes:'',peId:null,faseId:null,iniciativaId:null,deliverableId:'',
        criadaEm:hojeISO()});
      r.criadas++;
    }
  });

  /* saiu do cronograma */
  (pr.activities||[]).forEach(a=>{
    if(!a.cronoId||vistos.has(a.cronoId)) return;
    if(a.column==='concluido'){ a.cronoId=null; return; }   // feito fica, sem vínculo
    a._remover=true; r.removidas++;
  });
  if(r.removidas) pr.activities=(pr.activities||[]).filter(a=>!a._remover);
  return r;
}

/* O modelo do cronograma é embutido como texto. Ao embutir, a tag de
   fechamento de script foi neutralizada com uma barra invertida para
   não encerrar o bloco antes da hora; aqui ela é restaurada. */
const TAG_FECHA='<'+'/'+'script>';
const TAG_ESCAPADA='<'+'\\'+'/'+'script>';
function cronoTemplate(){
  const el=document.getElementById('cronotpl');
  return el? el.textContent.split(TAG_ESCAPADA).join(TAG_FECHA) : '';
}
function cronoPadrao(){
  const el=document.getElementById('cronopadrao');
  try{ return el? JSON.parse(el.textContent) : {}; }catch(e){ console.warn('crono padrão:',e); return {}; }
}
/* Documento inicial de um cliente: o modelo padrão, já com o nome dele. */
function cronoInicial(p){
  const d=cronoPadrao();
  d.cliente=p.name||d.cliente;
  d.projeto=d.projeto||'Cronograma do projeto';
  d.modo='interno';
  d.tasks=[];
  return d;
}
const semanaISO=(iso)=>{ const d=mondayOf(dLocal(iso)); return isoDate(d); };
const numSemana=(iso)=>{ const d=dLocal(iso); const ini=new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-ini)/86400000)+ini.getDay()+1)/7); };

/* O modelo roda dentro de um iframe, exatamente como o arquivo original.
   Como o srcdoc herda a mesma origem, dá para ler o estado dele (a variável
   D) e guardar no cliente — e devolver ao abrir de novo. */
function CronogramaModelo({p,mutate}){
  const {db,flash}=useDB();
  const ref=useRef(null);
  const [pronto,setPronto]=useState(false);
  const ultimo=useRef('');

  const doc=useMemo(()=>{
    const base={...(p.cronoDoc||cronoInicial(p))};
    base.equipeSistema=(db.team||[]).map(m=>m.name);   // sugestões da coluna "Quem faz"
    const tpl=cronoTemplate();
    if(!tpl) return '';
    return tpl.replace('__DADOS_DO_CLIENTE__',JSON.stringify(base).replace(/</g,'\\u003c'));
  },[p.id]);

  /* Guarda o que o modelo tem agora, se mudou desde a última gravação. */
  const salvar=()=>{
    const w=ref.current&&ref.current.contentWindow;
    if(!w||!w.D) return;
    let txt=''; try{ txt=JSON.stringify(w.D); }catch(e){ return; }
    if(txt===ultimo.current) return;
    ultimo.current=txt;
    try{ mutate(pr=>{ pr.cronoDoc=JSON.parse(txt); sincronizarCrono(db,pr); }); }catch(e){}
  };
  useEffect(()=>{
    const t=setInterval(salvar,2000);
    return ()=>{ salvar(); clearInterval(t); };
  },[p.id]);

  if(!doc) return <div className="card card-pad"><div className="empty">Modelo de cronograma não encontrado neste arquivo.</div></div>;
  return (<div className="card" style={{overflow:'hidden',padding:0}}>
    <div className="row" style={{gap:10,padding:'9px 14px',borderBottom:'1px solid var(--border)',
      background:'#fafbfb',flexWrap:'wrap',alignItems:'center'}}>
      <span className="muted" style={{fontSize:'.74rem'}}>
        Modelo Nortmont de cronograma — salvo automaticamente. Cada linha daqui
        é uma tarefa deste cliente: o nome, o período, as horas e quem faz vêm
        desta tabela.
      </span>
      <label className="row" style={{gap:5,fontSize:'.74rem',color:'var(--text-2)',cursor:'pointer'}}
        title="Cada linha do cronograma é uma tarefa deste cliente">
        <input type="checkbox" checked={p.cronoSync!==false}
          onChange={e=>{const on=e.target.checked;
            mutate(pr=>{ pr.cronoSync=on; if(on) sincronizarCrono(db,pr); });
            flash(on?'As linhas do cronograma passam a aparecer na aba Tarefas':'Sincronização desligada');}}/>
        alimenta a aba Tarefas
      </label>
      <button className="btn btn-ghost btn-sm" style={{marginLeft:'auto'}} onClick={()=>{salvar();
        const n=(p.activities||[]).filter(a=>a.cronoId).length;
        flash(n+' tarefa(s) vindas do cronograma');}}>salvar agora</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>{
        if(!confirm('Recomeçar o cronograma deste cliente a partir do modelo em branco?')) return;
        ultimo.current='';
        mutate(pr=>{ pr.cronoDoc=cronoInicial(pr); });
      }}>recomeçar do modelo</button>
    </div>
    <iframe ref={ref} srcDoc={doc} title="Cronograma" onLoad={()=>setPronto(true)}
      style={{width:'100%',height:'calc(100vh - 230px)',minHeight:620,border:'none',display:'block'}}/>
  </div>);
}

function TabCronograma({p,mutate}){
  const {db,update,flash}=useDB();
  const [base,setBase]=useState(()=>isoDate(mondayOf(TODAY)));
  const [modal,setModal]=useState(null);
  const [vista,setVista]=useState('modelo');   // modelo | semanas
  const QTD=8;

  const semanas=useMemo(()=>{
    const out=[];
    for(let i=0;i<QTD;i++){
      const seg=addDays(dLocal(base),i*7);
      const sex=addDays(seg,4), dom=addDays(seg,6);
      out.push({ini:isoDate(seg),fim:isoDate(dom),sex:isoDate(sex),n:numSemana(isoDate(seg))});
    }
    return out;
  },[base]);

  const cron=p.cronograma||{};
  const setFoco=(k,v)=>mutate(pr=>{ pr.cronograma=pr.cronograma||{}; 
    pr.cronograma[k]={...(pr.cronograma[k]||{}),foco:v}; });

  /* tarefas do cliente cuja janela de construção cruza a semana */
  const daSemana=(sem)=>(p.activities||[]).filter(t=>{
    const w=taskWindow(t); if(!w.ini) return false;
    return w.ini<=sem.fim && (w.fim||w.ini)>=sem.ini;
  });
  const horas=(l)=>l.reduce((a,t)=>a+(+t.estHoras||0),0);
  /* horas efetivamente reservadas na agenda naquela semana */
  const horasAgenda=(sem)=>{
    let min=0;
    (p.activities||[]).forEach(t=>{
      Object.entries(t.sessoes||{}).forEach(([iso,se])=>{
        if(se&&se.hora&&iso>=sem.ini&&iso<=sem.fim) min+=(+se.durMin||0); });
      if(t.date&&t.hora&&t.date>=sem.ini&&t.date<=sem.fim) min+=(+t.durMin||60);
    });
    return min;
  };
  /* marcos da trilha previstos para a semana */
  const marcosDa=(sem)=>{
    if(!p.startDate) return [];
    const lista=TRILHA_MARCOS[p.rota||'Estruturação']||[];
    return lista.filter(m=>{ const d=isoDate(addDays(dLocal(p.startDate),m.dia));
      return d>=sem.ini&&d<=sem.fim; });
  };
  const etapaDa=(sem)=>{
    if(!p.startDate) return null;
    const dia=Math.floor((dLocal(sem.ini)-dLocal(p.startDate))/86400000);
    const mapa=ETAPA_DIAS[p.rota||'Estruturação']||{};
    for(const e of PHASES){ const f=mapa[e]; if(!f) continue;
      if(dia>=f[0]&&(f[1]===null||dia<=f[1])) return e; }
    return null;
  };

  const novaTarefa=(sem)=>setModal({name:'',type:'Outro',assignee:p.consultants[0]||(db.team[0]||{}).id,
    projectId:p.id,peId:'',faseId:'',deliverableId:'',
    date:sem.sex,buildStart:sem.ini,buildEnd:sem.sex,hora:'',durMin:60,estHoras:2,obs:'',
    prio:'Média',notes:'',column:'backlog',sprintId:null,sessoes:{}});
  const salvar=(nova)=>{ update(d=>{addTaskTo(d,nova);return d;}); flash('Tarefa adicionada à semana'); setModal(null); };

  const hojeSem=isoDate(mondayOf(TODAY));

  return (<div>
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="between" style={{flexWrap:'wrap',gap:12}}>
        <div>
          <h3 style={{fontSize:'1rem'}}>Cronograma semanal</h3>
          <span className="muted" style={{fontSize:'.77rem'}}>
            {vista==='modelo'
              ? 'Gantt do projeto no modelo da casa — fases, tarefas, equipe e horas'
              : 'O que este cliente recebe em cada semana — foco, tarefas e marcos'}
          </span>
        </div>
        <div className="row" style={{gap:10,flexWrap:'wrap'}}>
          <div className="seg-ctrl">
            <button className={vista==='modelo'?'on':''} onClick={()=>setVista('modelo')}>Cronograma do projeto</button>
            <button className={vista==='semanas'?'on':''} onClick={()=>setVista('semanas')}>Semana a semana</button>
          </div>
          {vista==='semanas'&&<div className="row" style={{gap:6}}>
            <button className="icon-btn" onClick={()=>setBase(isoDate(addDays(dLocal(base),-28)))}>◀</button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setBase(isoDate(mondayOf(TODAY)))}>Semana atual</button>
            <button className="icon-btn" onClick={()=>setBase(isoDate(addDays(dLocal(base),28)))}>▶</button>
          </div>}
        </div>
      </div>
    </div>

    {vista==='modelo'? <CronogramaModelo p={p} mutate={mutate}/> : semanas.map(sem=>{
      const tarefas=daSemana(sem), ms=marcosDa(sem), et=etapaDa(sem);
      const atual=sem.ini===hojeSem, passada=sem.fim<hojeISO();
      const min=horasAgenda(sem);
      const feitas=tarefas.filter(t=>t.column==='concluido').length;
      const c=et?(PHASE_C[et]||{}):{};
      const foco=(cron[sem.ini]||{}).foco||'';
      return (<div key={sem.ini} className={"cron-sem"+(atual?' atual':'')+(passada?' passada':'')}>
        <div className="cron-head">
          <div className="cron-data">
            <b>Semana {sem.n}</b>
            <span className="mono">{fmtBR(sem.ini).slice(0,5)} – {fmtBR(sem.sex).slice(0,5)}</span>
            {atual&&<em>agora</em>}
          </div>
          {et&&<span className="badge" style={{background:c.bg,color:c.fg}}>{shortPhase(et)}</span>}
          <LiveInput className="cron-foco" value={foco} placeholder="Foco combinado para esta semana"
            onCommit={v=>setFoco(sem.ini,v)}/>
          <div className="row" style={{gap:12,flex:'none',alignItems:'center'}}>
            <span className="cron-num" title="tarefas na semana">{feitas}/{tarefas.length}</span>
            <span className="cron-num" style={{color:'var(--brand)'}} title="horas reservadas na agenda">{min?fmtDur(min):'—'}</span>
            <button className="btn btn-ghost btn-sm" onClick={()=>novaTarefa(sem)}>{I.plus}</button>
          </div>
        </div>

        {ms.length>0&&<div className="cron-marcos">
          {ms.map(m=>(<span key={m.id} className="cron-marco">◆ {m.nome} · {m.leg}</span>))}
        </div>}

        {tarefas.length>0
          ? <div className="cron-tarefas">
              {tarefas.map(t=>{
                const atras=taskAtrasada(t), ok=t.column==='concluido';
                const ses=Object.entries(t.sessoes||{}).filter(([iso])=>iso>=sem.ini&&iso<=sem.fim);
                return (<div key={t.id} className="cron-t">
                  <button className={"chk sm "+(ok?'on':'')}
                    onClick={()=>mutate(pr=>{const a=pr.activities.find(x=>x.id===t.id); if(a) a.column=ok?'andamento':'concluido';})}>
                    {ok&&I.check}</button>
                  <span className="cron-t-nome" style={{textDecoration:ok?'line-through':'none',opacity:ok?.6:1}}>{t.name}</span>
                  {atras&&<span className="badge" style={{background:'#f8ecec',color:'#B33A3A'}}>atrasada</span>}
                  <span className="muted" style={{fontSize:'.69rem'}}>
                    {ses.length? ses.map(([iso,se])=>DIA_SEM[dLocal(iso).getDay()].slice(0,3)+' '+se.hora).join(' · ') : 'sem horário'}
                  </span>
                  <span className="mono muted" style={{fontSize:'.7rem',marginLeft:'auto'}}>{t.estHoras?t.estHoras+'h':''}</span>
                  <Avatares db={db} t={t}/>
                </div>);})}
            </div>
          : <div className="cron-vazio">Nada programado para esta semana.</div>}
      </div>);})}

    {vista==='semanas'&&modal&&<TaskModal db={db} init={modal} close={()=>setModal(null)} onSave={salvar}/>}
  </div>);
}

    onDragOver:(e)=>{if(!arrasto)return; e.preventDefault(); if(alvo!==k) setAlvo(k);},
    onDragLeave:()=>{if(alvo===k) setAlvo('');},
    onDrop:(e)=>{e.preventDefault(); const x=arrasto; setArrasto(null); setAlvo(''); if(x) mover(x,k);}});

  /* Ações do sprint dentro do projeto */
  /* As ações são tarefas do cliente com prjId — nascem, mudam e somem
     como qualquer tarefa, e por isso aparecem no sprint e no calendário. */
  const addAcao=(prjId,nome)=>mutate(pr=>{
    pr.activities=pr.activities||[];
    pr.activities.unshift(nasceTarefa({id:uid(),projectId:pr.id,prjId,name:(nome||'').trim()||'Nova ação',
      type:'Outro',assignees:[],assignee:'',date:'',buildStart:'',buildEnd:'',
      hora:'',durMin:0,sessoes:{},column:'backlog',sprintId:null,prio:'Média',estHoras:0,
      obs:'',notes:'',subs:[],peId:null,faseId:null,iniciativaId:null,deliverableId:''}));
  });
  const setAcao=(prjId,aid,k,v)=>mutate(pr=>{
    const a=(pr.activities||[]).find(y=>y.id===aid); if(!a) return;
    a[k]=v;
    if(k==='column'&&v==='concluido'){ const x=(pr.projetos||[]).find(y=>y.id===prjId); if(x) x.ultimaAcao=hojeISO(); }
  });
  const setAcaoResps=(aid,lista)=>mutate(pr=>{
    const a=(pr.activities||[]).find(y=>y.id===aid); if(a) setResps(a,lista);
  });
  const delAcao=(prjId,aid)=>mutate(pr=>{ pr.activities=(pr.activities||[]).filter(y=>y.id!==aid); });

  /* Projeto sem ação executada há dois sprints (30 dias) vira ponto de pauta. */
  const parado=(x)=>{
    if(x.col!=='andamento') return false;
    const ref=x.ultimaAcao||x.aberto; if(!ref) return false;
    return (dLocal(hojeISO())-dLocal(ref))/86400000 > 30;
  };
  const parados=lista.filter(parado);

  const Campo=({x,k,lab,ph,area})=>(<div className="prj-campo">
    <label>{lab}</label>
    <LiveInput className={"prj-inp"+(area?' area':'')} value={x[k]||''} placeholder={ph}
      onCommit={v=>setPrj(x.id,k,v)}/>
  </div>);

  return (<div>
    {/* ---- topo ---- */}
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="between" style={{flexWrap:'wrap',gap:12}}>
        <div className="row" style={{gap:22,flexWrap:'wrap'}}>
          <span className="stat-mini"><span className="n">{lista.length}</span><span className="l">projetos</span></span>
          <span className="stat-mini"><span className="n" style={{color:'var(--brand)'}}>
            {ativos.length}</span><span className="l">em andamento</span></span>
          <span className="stat-mini"><span className="n" style={{color:'var(--green)'}}>{lista.filter(x=>x.col==='concluido').length}</span><span className="l">concluídos</span></span>
          {parados.length>0&&<span className="stat-mini"><span className="n" style={{color:'var(--coral)'}}>{parados.length}</span><span className="l">parados há 2 sprints</span></span>}
        </div>
        <button className="btn btn-primary btn-sm" onClick={novo}>{I.plus} Novo projeto</button>
      </div>
      <div className="row" style={{gap:8,marginTop:10,flexWrap:'wrap'}}>
        <span className="trilha-nota">Sprints de 15 dias · a quinzenal só vê status e desbloqueio</span>
        {parados.length>0&&<span className="trilha-nota" style={{color:'#B33A3A',borderColor:'#e8c4c4',background:'#fdf4f4'}}>
          {parados.length} projeto(s) sem ação há dois sprints — pauta da mensal</span>}
      </div>
    </div>

    {/* ---- quadro de quatro colunas ---- */}
    <div className="prj-quadro">
      {PRJ_COLS.map(([k,l,c])=>{
        const itens=lista.filter(x=>x.col===k).sort((a,b)=>gut(b)-gut(a));
        return (<div key={k} {...zona(k)} className={"prj-col"+(alvo===k?' alvo':'')}>
          <div className="prj-col-h" style={{color:c}}>{l}<span>{itens.length}</span></div>
          {itens.map(x=>{
            const g=gaps.find(y=>y.pilarId===x.pilar&&y.id===x.gapId);
            const tsPrj=tarefasDoProjeto(p,x.id);
            const feitas=tsPrj.filter(a=>a.column==='concluido').length;
            return (<div key={x.id} {...cardDrag(x)} className={"prj-card"+(parado(x)?' parado':'')}
              onClick={()=>setAberto(aberto===x.id?null:x.id)}>
              <div className="row" style={{gap:6,alignItems:'baseline'}}>
                <span className="prj-cod">{x.cod}</span>
                <b style={{fontSize:'.81rem',flex:1,lineHeight:1.3}}>{x.nome||'sem nome'}</b>
                <span className="prj-gut" title="Impacto × Urgência × Base">{gut(x)}</span>
              </div>
              {x.metaSucesso&&<div className="muted" style={{fontSize:'.69rem',marginTop:3}}>{x.metaSucesso}</div>}
              <div className="row" style={{gap:6,marginTop:5,flexWrap:'wrap'}}>
                {g&&<span className="prj-tag">{g.pilar}</span>}
                {tsPrj.length>0&&<span className="prj-tag">{feitas}/{tsPrj.length} ações</span>}
                {parado(x)&&<span className="prj-tag" style={{background:'#f8ecec',color:'#B33A3A'}}>parado</span>}
              </div>
            </div>);})}
          {!itens.length&&<div className="prj-vazio">—</div>}
        </div>);})}
    </div>

    {/* ---- canvas do projeto aberto ---- */}
    {(()=>{ const x=lista.find(y=>y.id===aberto); if(!x) return null;
      const g=gaps.find(y=>y.pilarId===x.pilar&&y.id===x.gapId);
      return (<div className="card card-pad" style={{marginTop:14}}>
        <div className="between" style={{flexWrap:'wrap',gap:12,marginBottom:12}}>
          <div className="row" style={{gap:10,alignItems:'baseline'}}>
            <LiveInput className="prj-cod-inp" value={x.cod} onCommit={v=>setPrj(x.id,'cod',v)}/>
            <LiveInput className="prj-nome" value={x.nome} placeholder="Nome do projeto" onCommit={v=>setPrj(x.id,'nome',v)}/>
          </div>
          <div className="row" style={{gap:8,alignItems:'center'}}>
            <select className="mini-sel" value={x.col} onChange={e=>mover(x,e.target.value)}>
              {PRJ_COLS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
            <button className="btn btn-ghost btn-sm" onClick={()=>excluir(x)}>excluir</button>
            <button className="icon-btn" style={{width:24,height:24}} onClick={()=>setAberto(null)}>{I.x}</button>
          </div>
        </div>

        {/* priorização */}
        <div className="prj-gut-box">
          <span className="muted" style={{fontSize:'.72rem'}}>Priorização</span>
          {[['impacto','Impacto'],['urgencia','Urgência'],['base','Base']].map(([k,l])=>(
            <span key={k} className="row" style={{gap:5,alignItems:'center'}}>
              <span style={{fontSize:'.74rem',color:'var(--text-2)'}}>{l}</span>
              <select className="mini-sel" style={{width:52}} value={x[k]||3} onChange={e=>setPrj(x.id,k,+e.target.value)}>
                {[1,2,3,4,5].map(n=><option key={n} value={n}>{n}</option>)}</select>
            </span>))}
          <span className="prj-gut" style={{fontSize:'.9rem'}}>{gut(x)}</span>
          <select className="mini-sel" style={{flex:1,minWidth:180,maxWidth:420}}
            value={x.gapId?x.pilar+'|'+x.gapId:''}
            onChange={e=>{const [pi,gi]=(e.target.value||'|').split('|'); setPrj(x.id,'pilar',pi); setPrj(x.id,'gapId',gi);}}>
            <option value="">— pilar e célula da Matriz —</option>
            {gaps.map(gp=><option key={gp.pilarId+gp.id} value={gp.pilarId+'|'+gp.id}>N{gp.nivel} · {gp.pilar}: {gp.texto}</option>)}
          </select>
        </div>

        {/* canvas de abertura */}
        <div className="prj-canvas">
          <Campo x={x} k="objetivo"     lab="Objetivo (uma frase)" ph="O que este projeto resolve"/>
          <Campo x={x} k="metaSucesso"  lab="Meta de sucesso" ph="Indicador, valor e prazo"/>
          <Campo x={x} k="escopo"       lab="Escopo" ph="O que está dentro" area/>
          <Campo x={x} k="naoEscopo"    lab="Não escopo" ph="O que está fora" area/>
          <Campo x={x} k="donoCliente"  lab="Responsável no cliente" ph="Quem é o dono"/>
          <Campo x={x} k="donoNortmont" lab="Responsável Nortmont" ph="Quem conduz o método"/>
          <Campo x={x} k="entregaveis"  lab="Entregáveis" ph="Lista do que será entregue" area/>
          <Campo x={x} k="riscos"       lab="Riscos" ph="O que pode travar" area/>
        </div>

        {/* ações = tarefas do cliente */}
        {(()=>{ const ts=tarefasDoProjeto(p,x.id);
          const feitas=ts.filter(a=>a.column==='concluido').length;
          return (<div style={{marginTop:16}}>
          <div className="between" style={{marginBottom:8}}>
            <div className="ag-tit" style={{margin:0}}>Ações do projeto
              <span className="muted" style={{fontWeight:500,fontSize:'.73rem',marginLeft:8}}>
                são tarefas deste cliente{ts.length? ' · '+feitas+'/'+ts.length+' concluídas':''}</span></div>
            <button className="btn btn-ghost btn-sm" onClick={()=>addAcao(x.id)}>{I.plus} ação</button>
          </div>
          {ts.length? <div className="tbl-wrap"><table className="tbl dist">
            <thead><tr><th style={{width:30}}></th><th>Ação</th><th style={{width:104}}>Quem faz</th>
              <th style={{width:116}}>Prazo</th><th style={{width:62,textAlign:'right'}}>Horas</th>
              <th style={{width:124}}>Situação</th><th style={{width:62}}></th></tr></thead>
            <tbody>{ts.map(a=>{ const feito=a.column==='concluido';
              return (<tr key={a.id}>
              <td><button className={"chk sm "+(feito?'on':'')}
                onClick={()=>setAcao(x.id,a.id,'column',feito?'andamento':'concluido')}>{feito&&I.check}</button></td>
              <td><LiveInput className="cel-nome" value={a.name} onCommit={v=>v.trim()&&setAcao(x.id,a.id,'name',v.trim())}/>
                <div className="row" style={{gap:5,flexWrap:'wrap'}}>
                  {contaSubs(a).n>0&&<TagSubs t={a}/>}
                  {a.carriedFrom&&<TagRepassada t={a} mini/>}
                </div></td>
              <td><CelResps db={db} t={a} onChange={(l)=>setAcaoResps(a.id,l)}/></td>
              <td><input type="date" className="cel-sel" value={a.date||''}
                style={taskAtrasada(a)?{color:'#B33A3A',fontWeight:700}:null}
                onChange={e=>setAcao(x.id,a.id,'date',e.target.value)}/></td>
              <td style={{textAlign:'right'}}><input type="number" min="0" step="0.5" className="mt-h"
                value={a.estHoras||''} placeholder="?" onChange={e=>setAcao(x.id,a.id,'estHoras',+e.target.value||0)}/></td>
              <td><select className="cel-sel" style={{color:COL_COLOR[a.column],fontWeight:700}}
                value={a.column} onChange={e=>setAcao(x.id,a.id,'column',e.target.value)}>
                {Object.entries(COL_LABEL).map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></td>
              <td><div className="row" style={{gap:2,justifyContent:'flex-end'}}>
                <BtnProximo t={a}/>
                <button className="icon-btn" style={{width:22,height:22,color:'var(--text-3)'}}
                  onClick={()=>delAcao(x.id,a.id)}>{I.x}</button></div></td>
            </tr>);})}</tbody></table></div>
          : <div className="muted" style={{fontSize:'.78rem'}}>
              Sem ações. Cada ação daqui é uma tarefa do cliente — aparece na aba Tarefas, no sprint e no calendário.</div>}
        </div>);})()}

        {/* encerramento */}
        {x.col==='concluido'&&<div className="prj-fecha">
          <div className="ag-tit" style={{margin:'0 0 8px'}}>Encerramento</div>
          <Campo x={x} k="resultado" lab="Resultado obtido × meta de sucesso" ph="O que de fato aconteceu" area/>
          <Campo x={x} k="licao"     lab="Lição aprendida" ph="O que faríamos diferente" area/>
          <div className="muted" style={{fontSize:'.73rem',marginTop:6}}>
            O método pede também atualizar a ficha da Matriz de Maturidade ao encerrar.
          </div>
        </div>}
      </div>);})()}
  </div>);
}

function TabOGSM({p,mutate}){
  const {db,flash}=useDB();
  const og=p.ogsm||{objetivo:{texto:'',horizonte:'12 MESES'},metas:[]};
  const metas=og.metas||[];
  const [editando,setEditando]=useState(null);

  const setObj=(k,v)=>mutate(pr=>{ pr.ogsm=pr.ogsm||{objetivo:{},metas:[]};
    pr.ogsm.objetivo={...(pr.ogsm.objetivo||{}),[k]:v}; });
  const setMeta=(id,k,v)=>mutate(pr=>{ const m=(pr.ogsm.metas||[]).find(x=>x.id===id); if(m) m[k]=v; });
  const addMeta=()=>mutate(pr=>{ pr.ogsm=pr.ogsm||{objetivo:{},metas:[]};
    pr.ogsm.metas=[...(pr.ogsm.metas||[]),metaVazia()]; });
  const delMeta=(id)=>{ if(!confirm('Remover esta meta do plano?')) return;
    mutate(pr=>{ pr.ogsm.metas=(pr.ogsm.metas||[]).filter(x=>x.id!==id); }); };
  const toggleTag=(id,t)=>mutate(pr=>{ const m=(pr.ogsm.metas||[]).find(x=>x.id===id); if(!m) return;
    const has=(m.tags||[]).indexOf(t)>=0;
    m.tags=has? m.tags.filter(x=>x!==t) : [...(m.tags||[]),t]; });

  /* Gaps da matriz: é deles que as estratégias devem nascer. */
  const mat=p.matriz||matrizVazia();
  const gaps=useMemo(()=>{
    const out=[];
    pilaresAtivos(mat).forEach(pil=>gapsDoPilar(mat,pil).filter(g=>g.nivel<=3)
      .forEach(g=>out.push({pilar:pil.nome,pilarId:pil.id,...g})));
    return out;
  },[mat]);
  const gapDe=(m)=>gaps.find(g=>g.pilarId===m.gapPilar&&g.id===m.gapId);
  const semGap=metas.filter(m=>!m.gapId).length;

  const farolInfo=(k)=>OGSM_FAROL.find(x=>x[0]===(k||''))||OGSM_FAROL[3];
  const tagInfo=(k)=>OGSM_TAGS.find(x=>x[0]===k);
  const cont=(k)=>metas.filter(m=>(m.farol||'')===k).length;

  return (<div>
    {/* ---- objetivo ---- */}
    <div className="ogsm-obj">
      <span className="ogsm-obj-lab">OBJETIVO · <input className="ogsm-hz" value={og.objetivo.horizonte||'12 MESES'}
        onChange={e=>setObj('horizonte',e.target.value)}/></span>
      <LiveInput className="ogsm-obj-txt" value={og.objetivo.texto||''}
        placeholder="Uma frase com os números que definem chegar lá — receita, lucro, caixa e endividamento."
        onCommit={v=>setObj('texto',v)}/>
    </div>

    {/* ---- leitura de topo ---- */}
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="between" style={{flexWrap:'wrap',gap:12}}>
        <div className="row" style={{gap:22,flexWrap:'wrap'}}>
          <span className="stat-mini"><span className="n">{metas.length}</span><span className="l">metas no plano</span></span>
          {OGSM_FAROL.slice(0,3).map(([k,l,c])=>(
            <span key={k} className="stat-mini"><span className="n" style={{color:c}}>{cont(k)}</span>
              <span className="l">{l.toLowerCase()}</span></span>))}
        </div>
        <div className="row" style={{gap:8}}>
          {semGap>0&&<span className="trilha-nota">{semGap} meta(s) sem gap de origem</span>}
          <button className="btn btn-primary btn-sm" onClick={addMeta}>{I.plus} Nova meta</button>
        </div>
      </div>
      <div className="muted" style={{fontSize:'.73rem',marginTop:8}}>
        O plano cabe em uma página; o orçamento é anexo. Toda meta tem valor, prazo e dono — e toda estratégia nasce de um gap da Matriz.
      </div>
    </div>

    {/* ---- a tabela do plano ---- */}
    <div className="card" style={{overflow:'hidden'}}>
      <div className="ogsm-head">
        <div>Meta</div><div>KPIs · indicadores analisados</div>
        <div>Nível · leitura após análise</div><div>Estratégia</div><div></div>
      </div>
      {metas.map(m=>{
        const fi=farolInfo(m.farol), g=gapDe(m), ed=editando===m.id;
        return (<div key={m.id} className="ogsm-row">
          {/* meta */}
          <div>
            <LiveInput className="ogsm-meta" value={m.nome} placeholder="Ex.: Receita de R$ 5,99 mi para R$ 6,9 mi em 12 meses"
              onCommit={v=>setMeta(m.id,'nome',v)}/>
            <div className="row" style={{gap:4,flexWrap:'wrap',marginTop:5}}>
              {OGSM_TAGS.map(([k,l,c,bg])=>{ const on=(m.tags||[]).indexOf(k)>=0;
                return (<button key={k} className="ogsm-tag" onClick={()=>toggleTag(m.id,k)}
                  style={on?{background:bg,color:c,borderColor:'transparent'}:{color:'#b3bfbc',borderColor:'var(--border)',background:'transparent'}}>
                  {l}</button>);})}
            </div>
            {(m.dono||m.prazo||ed)&&<div className="row" style={{gap:6,marginTop:5,flexWrap:'wrap'}}>
              <LiveInput className="ogsm-mini" value={m.dono} placeholder="dono" onCommit={v=>setMeta(m.id,'dono',v)}/>
              <input type="date" className="ogsm-mini" value={m.prazo||''} onChange={e=>setMeta(m.id,'prazo',e.target.value)}/>
            </div>}
          </div>
          {/* kpis */}
          <div>
            <LiveInput className="ogsm-txt" value={m.kpis} placeholder="Quais indicadores respondem por esta meta"
              onCommit={v=>setMeta(m.id,'kpis',v)}/>
          </div>
          {/* farol + leitura */}
          <div>
            <div className="row" style={{gap:4,flexWrap:'wrap',marginBottom:5}}>
              {OGSM_FAROL.map(([k,l,c,bg])=>(
                <button key={k||'sem'} className="ogsm-farol" onClick={()=>setMeta(m.id,'farol',k)}
                  style={(m.farol||'')===k?{background:bg,color:c,borderColor:'transparent',fontWeight:800}
                    :{color:'#b3bfbc',borderColor:'var(--border)',background:'transparent'}}>{l}</button>))}
            </div>
            <LiveInput className="ogsm-txt sm" value={m.leitura} placeholder="O que os números dizem hoje"
              onCommit={v=>setMeta(m.id,'leitura',v)}/>
          </div>
          {/* estratégia + gap de origem */}
          <div>
            <LiveInput className="ogsm-txt" value={m.estrategia} placeholder="De onde o resultado vai vir"
              onCommit={v=>setMeta(m.id,'estrategia',v)}/>
            <select className="ogsm-gap" value={m.gapId?m.gapPilar+'|'+m.gapId:''}
              onChange={e=>{const [pi,gi]=(e.target.value||'|').split('|');
                setMeta(m.id,'gapPilar',pi); setMeta(m.id,'gapId',gi);}}>
              <option value="">— gap de origem na Matriz —</option>
              {gaps.map(gp=><option key={gp.pilarId+gp.id} value={gp.pilarId+'|'+gp.id}>
                N{gp.nivel} · {gp.pilar}: {gp.texto}</option>)}
            </select>
            {g&&<div className="ogsm-origem">↳ nasce do gap N{g.nivel} · {g.pilar}</div>}
          </div>
          <div><button className="icon-btn" style={{width:24,height:24,color:'var(--text-3)'}}
            onClick={()=>delMeta(m.id)} title="Remover meta">{I.x}</button></div>
        </div>);})}
      {!metas.length&&<div className="empty" style={{padding:30}}>
        Nenhuma meta ainda. O plano nasce dos gaps do Diagnóstico —
        {gaps.length? ' há '+gaps.length+' candidatos na Matriz.' : ' preencha a Matriz primeiro.'}
      </div>}
    </div>

    {/* ---- gaps ainda sem meta ---- */}
    {gaps.length>0&&<div className="card card-pad" style={{marginTop:14}}>
      <div className="card-h"><h3>Gaps sem meta</h3><span className="sub">candidatos a estratégia, vindos da Matriz</span></div>
      {(()=>{const usados=new Set(metas.filter(m=>m.gapId).map(m=>m.gapPilar+'|'+m.gapId));
        const livres=gaps.filter(gp=>!usados.has(gp.pilarId+'|'+gp.id));
        if(!livres.length) return <div className="muted" style={{fontSize:'.8rem'}}>Todos os gaps já têm meta associada.</div>;
        return (<div className="row" style={{gap:6,flexWrap:'wrap'}}>
          {livres.slice(0,14).map(gp=>(
            <button key={gp.pilarId+gp.id} className="ogsm-gapchip"
              title={'Criar meta a partir deste gap'}
              onClick={()=>mutate(pr=>{ pr.ogsm=pr.ogsm||{objetivo:{},metas:[]};
                pr.ogsm.metas=[...(pr.ogsm.metas||[]),{...metaVazia(),nome:gp.texto,
                  gapPilar:gp.pilarId,gapId:gp.id,tags:[gp.nivel===3?'ope':'fin']}]; })}>
              <b>N{gp.nivel}</b> {gp.texto}</button>))}
          {livres.length>14&&<span className="muted" style={{fontSize:'.74rem',alignSelf:'center'}}>+{livres.length-14}</span>}
        </div>);})()}
    </div>}
  </div>);
}

function TabTrilha({p,mutate}){
  const {db,flash}=useDB();
  const rota=p.rota||'Estruturação';
  const marcos=TRILHA_MARCOS[rota]||TRILHA_MARCOS['Estruturação'];
  const feitos=(p.trilha&&p.trilha.feitos)||{};
  const dia=diaDoCronograma(p);
  const dataPrev=(m)=>p.startDate? isoDate(addDays(dLocal(p.startDate),m.dia)) : '';

  const alterna=(m)=>mutate(pr=>{
    pr.trilha=pr.trilha||{feitos:{}};
    const at=pr.trilha.feitos[m.id];
    if(at) delete pr.trilha.feitos[m.id];
    else pr.trilha.feitos[m.id]={data:hojeISO()};
  });

  /* ---- geometria da estrada: linhas em serpentina ---- */
  const PORL=4;                                  // marcos por linha
  const W=980, MX=90, MY=104, RAIO=58;
  const linhas=[]; for(let i=0;i<marcos.length;i+=PORL) linhas.push(marcos.slice(i,i+PORL));
  const H=MY*linhas.length+120;
  const passo=(W-MX*2)/(PORL-1);
  const pos=(idx)=>{
    const li=Math.floor(idx/PORL), ci=idx%PORL;
    const daDireita=li%2===1;
    const x=MX+(daDireita? (PORL-1-ci) : ci)*passo;
    return {x,y:MY*li+70,li,daDireita};
  };
  /* caminho contínuo com as curvas de retorno */
  const caminho=useMemo(()=>{
    let d='';
    linhas.forEach((ln,li)=>{
      const y=MY*li+70, dir=li%2===1;
      const x1=dir? MX+(PORL-1)*passo : MX;
      const x2=dir? MX : MX+(PORL-1)*passo;
      d+=(li===0?'M':'L')+x1+' '+y+' L'+x2+' '+y+' ';
      if(li<linhas.length-1){
        const yN=MY*(li+1)+70;
        const cx=dir? MX-RAIO : MX+(PORL-1)*passo+RAIO;
        d+='C'+cx+' '+y+' '+cx+' '+yN+' '+x2+' '+yN+' ';
      }
    });
    return d;
  },[linhas.length,passo]);

  const feitosN=Object.keys(feitos).length;
  const pct=marcos.length?Math.round(feitosN/marcos.length*100):0;

  return (<div>
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="between" style={{flexWrap:'wrap',gap:12}}>
        <div>
          <h3 style={{fontSize:'1rem'}}>Trilha da jornada</h3>
          <span className="muted" style={{fontSize:'.77rem'}}>
            Cronograma do método na Rota {rota}{dia!==null&&<> · hoje é o <b>dia {dia}</b></>}
          </span>
        </div>
        <div className="row" style={{gap:22,flexWrap:'wrap'}}>
          <span className="stat-mini"><span className="n">{feitosN}/{marcos.length}</span><span className="l">marcos cumpridos</span></span>
          <span className="stat-mini"><span className="n" style={{color:'var(--brand)'}}>{pct}%</span><span className="l">da jornada</span></span>
        </div>
      </div>
      <div className="row" style={{gap:16,marginTop:12,flexWrap:'wrap'}}>
        {PHASES.map((e,i)=>(<span key={e} className="row" style={{gap:6,fontSize:'.68rem',
          letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text-2)',fontWeight:700}}>
          <i style={{width:11,height:11,borderRadius:'50%',background:TRILHA_CORES[i],display:'inline-block'}}></i>
          Etapa {i} · {shortPhase(e)}</span>))}
      </div>
    </div>

    <div className="card card-pad" style={{overflowX:'auto'}}>
      <svg viewBox={'0 0 '+W+' '+H} style={{width:'100%',minWidth:700,height:'auto'}}>
        {/* estrada */}
        <path d={caminho} fill="none" stroke="#e8ecea" strokeWidth="26" strokeLinecap="round" strokeLinejoin="round"/>
        <path d={caminho} fill="none" stroke="#cfd8d4" strokeWidth="2" strokeDasharray="9 9" strokeLinecap="round"/>
        {/* marcos */}
        {marcos.map((m,idx)=>{
          const {x,y}=pos(idx);
          const cor=TRILHA_CORES[m.etapa]||'#0F4245';
          const ok=!!feitos[m.id];
          const atual=dia!==null&&!ok&&dia>=m.dia;
          const acima=idx%2===0;
          const ty=acima? y-40 : y+40;
          return (<g key={m.id} style={{cursor:'pointer'}} onClick={()=>alterna(m)}>
            <circle cx={x} cy={y} r="19" fill={ok?cor:'#fff'} stroke={cor} strokeWidth="3"/>
            {atual&&<circle cx={x} cy={y} r="25" fill="none" stroke={cor} strokeWidth="1.5" strokeDasharray="3 3" opacity=".7"/>}
            <text x={x} y={y+5} textAnchor="middle" fontSize="13" fontWeight="800"
              fill={ok?'#fff':cor} style={{fontFamily:'var(--mono)'}}>{ok?'✓':String(idx+1).padStart(2,'0')}</text>
            <text x={x} y={ty} textAnchor="middle" fontSize="13" fontWeight="700" fill="var(--navy)">{m.nome}</text>
            <text x={x} y={ty+15} textAnchor="middle" fontSize="10.5" fill="#8b9a99"
              style={{letterSpacing:'.06em',textTransform:'uppercase'}}>{m.leg}</text>
            {p.startDate&&<text x={x} y={ty+29} textAnchor="middle" fontSize="10" fill="#b3bfbc"
              style={{fontFamily:'var(--mono)'}}>{fmtBR(dataPrev(m)).slice(0,5)}</text>}
          </g>);})}
        {/* início e chegada */}
        <g><rect x={MX-52} y={16} width="104" height="28" rx="14" fill="#0F4245"/>
          <text x={MX} y={35} textAnchor="middle" fontSize="12" fontWeight="800" fill="#fff"
            style={{letterSpacing:'.12em'}}>INÍCIO</text></g>
      </svg>

      {/* regras que o método impõe ao longo da trilha */}
      <div className="row" style={{gap:10,flexWrap:'wrap',marginTop:10}}>
        {rota==='Estruturação'&&<span className="trilha-nota">Gate: sem dois fechamentos, não avança para o Diagnóstico</span>}
        <span className="trilha-nota">O plano só muda na reunião trimestral</span>
      </div>
      <div className="muted" style={{fontSize:'.73rem',marginTop:10}}>
        Clique num marco para registrar que aconteceu. O anel tracejado indica marco cuja data prevista já passou e ainda está aberto.
      </div>
    </div>

    {/* lista de apoio, para leitura rápida e registro de datas */}
    <div className="card card-pad" style={{marginTop:14}}>
      <div className="card-h"><h3>Marcos</h3><span className="sub">previsto × realizado</span></div>
      <div style={{overflowX:'auto'}}><table className="tbl">
        <thead><tr><th style={{width:34}}></th><th>Marco</th><th>Etapa</th><th>Previsto</th><th>Realizado</th></tr></thead>
        <tbody>{marcos.map((m,idx)=>{
          const ok=!!feitos[m.id], prev=dataPrev(m);
          const atrasado=!ok&&prev&&prev<hojeISO();
          return (<tr key={m.id}>
            <td><button className={"chk sm "+(ok?'on':'')} onClick={()=>alterna(m)}>{ok&&I.check}</button></td>
            <td><b style={{fontSize:'.84rem'}}>{String(idx+1).padStart(2,'0')} · {m.nome}</b>
              {m.gate&&<span className="badge" style={{marginLeft:6,background:'#fbf3e6',color:'#C58B2A'}}>gate</span>}
              {m.cond&&<span className="muted" style={{fontSize:'.7rem',marginLeft:6}}>quando aplicável</span>}
              <div className="muted" style={{fontSize:'.7rem'}}>{m.leg}</div></td>
            <td><span className="badge" style={{background:TRILHA_CORES[m.etapa]+'1c',color:TRILHA_CORES[m.etapa]}}>
              Etapa {m.etapa}</span></td>
            <td className="mono" style={{fontSize:'.78rem',color:atrasado?'var(--coral)':'var(--text-2)',fontWeight:atrasado?700:400}}>
              {prev?fmtBR(prev):'—'}</td>
            <td className="mono" style={{fontSize:'.78rem',color:ok?'var(--green)':'var(--text-3)'}}>
              {ok?fmtBR(feitos[m.id].data):'—'}</td>
          </tr>);})}</tbody>
      </table></div>
    </div>
  </div>);
}

function TabMatriz({p,mutate}){
  const {db,flash}=useDB();
  const mat=p.matriz||matrizVazia();
  const [aberto,setAberto]=useState(null);     // pilar expandido
  const [evidDe,setEvidDe]=useState(null);     // critério com evidência aberta

  const marca=(pid,cid,ok)=>mutate(pr=>{
    const st=pr.matriz.pilares[pid]; if(!st) return;
    st.criterios[cid]={...(st.criterios[cid]||{}),ok,data:ok?hojeISO():''};
  });
  const evid=(pid,cid,v)=>mutate(pr=>{
    const st=pr.matriz.pilares[pid]; if(!st) return;
    st.criterios[cid]={...(st.criterios[cid]||{}),evidencia:v};
  });
  const aplicavel=(pid,v)=>mutate(pr=>{ pr.matriz.pilares[pid].aplicavel=v; });
  const metaNivel=(pid,v)=>mutate(pr=>{ pr.matriz.pilares[pid].metaNivel=+v; });

  /* Reposicionamento trimestral: guarda a foto de hoje para comparar depois. */
  const reposicionar=()=>{
    const foto={data:hojeISO(),niveis:{},cumpridos:{}};
    pilaresAtivos(mat).forEach(pil=>{
      foto.niveis[pil.id]=nivelDoPilar(mat,pil);
      foto.cumpridos[pil.id]=[1,2,3].reduce((a,n)=>a+progressoNivel(mat,pil,n).ok,0);
    });
    mutate(pr=>{ pr.matriz.historico=[...(pr.matriz.historico||[]),foto]; pr.matriz.avaliadaEm=hojeISO(); });
    flash('Posição registrada em '+fmtBR(hojeISO()));
  };
  const ultima=(mat.historico||[])[(mat.historico||[]).length-1];

  const ativos=pilaresAtivos(mat);
  const geral=nivelGeral(mat);
  const totalGaps=ativos.reduce((a,pil)=>a+gapsDoPilar(mat,pil).filter(g=>g.nivel<=3).length,0);
  const infoNivel=(n)=>MAT_NIVEIS.find(x=>x.n===n)||{nome:'—',cor:'#8b9a99'};

  return (<div>
    {/* ---- leitura de topo ---- */}
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="between" style={{flexWrap:'wrap',gap:14}}>
        <div>
          <h3 style={{fontSize:'1rem'}}>Matriz de Maturidade Financeira</h3>
          <span className="muted" style={{fontSize:'.77rem'}}>
            Cinco pilares × quatro níveis. O cliente está num nível quando cumpre todos os critérios dos anteriores.
          </span>
        </div>
        <div className="row" style={{gap:22,flexWrap:'wrap',alignItems:'center'}}>
          <span className="stat-mini"><span className="n" style={{color:infoNivel(geral).cor}}>
            {geral||'—'}</span><span className="l">nível geral · {geral?infoNivel(geral).nome:'nível 1 incompleto'}</span></span>
          <span className="stat-mini"><span className="n" style={{color:totalGaps?'var(--yellow)':'var(--green)'}}>{totalGaps}</span><span className="l">gaps abertos</span></span>
          <button className="btn btn-primary btn-sm" onClick={reposicionar}>Registrar posição de hoje</button>
        </div>
      </div>
      {mat.avaliadaEm&&<div className="muted" style={{fontSize:'.73rem',marginTop:8}}>
        Última posição registrada em {fmtBR(mat.avaliadaEm)} · {(mat.historico||[]).length} registro(s) no histórico.
      </div>}
    </div>

    {/* ---- um cartão por pilar ---- */}
    {MAT_PILARES.map(pil=>{
      const st=(mat.pilares||{})[pil.id]||{};
      const desligado=st.aplicavel===false;
      const nivel=nivelDoPilar(mat,pil);
      const meta=st.metaNivel||3;
      const gaps=gapsDoPilar(mat,pil);
      const ab=aberto===pil.id;
      const antes=ultima?(ultima.niveis||{})[pil.id]:undefined;
      const subiu=antes!==undefined&&nivel>antes;
      return (<div key={pil.id} className="card" style={{marginBottom:12,opacity:desligado?.55:1}}>
        <div className="mat-head" onClick={()=>setAberto(ab?null:pil.id)}>
          <span style={{color:'var(--text-3)'}}>{ab?'▾':'▸'}</span>
          <div style={{flex:1,minWidth:0}}>
            <div className="row" style={{gap:8,alignItems:'baseline',flexWrap:'wrap'}}>
              <b style={{fontSize:'.92rem'}}>{pil.nome}</b>
              {pil.opcional&&<label className="row" style={{gap:4,fontSize:'.7rem',color:'var(--text-3)'}}
                onClick={e=>e.stopPropagation()}>
                <input type="checkbox" checked={!desligado} onChange={e=>aplicavel(pil.id,e.target.checked)}/>
                aplicável ao negócio</label>}
            </div>
            {!desligado&&<div className="muted" style={{fontSize:'.72rem',marginTop:2}}>
              {gaps.filter(g=>g.nivel<=meta).length} critério(s) a cumprir para o nível {meta}
            </div>}
          </div>
          {!desligado&&<div className="row" style={{gap:14,alignItems:'center',flex:'none'}}>
            {/* trilha dos três níveis da mensalidade */}
            <div className="row" style={{gap:5}}>
              {[1,2,3].map(n=>{const pr=progressoNivel(mat,pil,n), i=infoNivel(n);
                return (<div key={n} className="mat-nivel" title={i.nome+': '+pr.ok+'/'+pr.total}>
                  <div className="mat-nivel-bar"><div style={{width:pr.pct+'%',background:i.cor}}></div></div>
                  <span style={{color:pr.pct===100?i.cor:'var(--text-3)'}}>{pr.ok}/{pr.total}</span>
                </div>);})}
            </div>
            <span className="mat-badge" style={{background:infoNivel(nivel).cor+'1c',color:infoNivel(nivel).cor}}>
              {nivel? 'Nível '+nivel : 'Nível 0'}{subiu&&<b style={{marginLeft:4}}>↑</b>}</span>
            <select className="mini-sel" style={{width:92}} value={meta} onClick={e=>e.stopPropagation()}
              onChange={e=>metaNivel(pil.id,e.target.value)}>
              {[1,2,3].map(n=><option key={n} value={n}>meta: N{n}</option>)}</select>
          </div>}
        </div>

        {ab&&!desligado&&<div style={{padding:'2px 14px 14px'}}>
          {[1,2,3,4].map(n=>{
            const lista=pil.criterios[n]||[]; if(!lista.length) return null;
            const i=infoNivel(n), pr=progressoNivel(mat,pil,n);
            const foraDoEscopo=n===4;
            return (<div key={n} style={{marginTop:12}}>
              <div className="row" style={{gap:8,alignItems:'baseline',marginBottom:5}}>
                <span className="mat-badge" style={{background:i.cor+'1c',color:i.cor}}>Nível {n} · {i.nome}</span>
                <span className="muted" style={{fontSize:'.7rem'}}>{i.desc}</span>
                {!foraDoEscopo&&<span className="mono muted" style={{fontSize:'.7rem',marginLeft:'auto'}}>{pr.ok}/{pr.total}</span>}
              </div>
              {lista.map((txt,idx)=>{
                const cid=critId(n,idx), c=(st.criterios||{})[cid]||{};
                const aberta=evidDe===pil.id+cid;
                return (<div key={cid} className="mat-crit">
                  <button className={"chk sm "+(c.ok?'on':'')} disabled={foraDoEscopo}
                    onClick={()=>marca(pil.id,cid,!c.ok)} title={foraDoEscopo?'Nível 4 é catálogo à parte':'Marcar como cumprido'}>
                    {c.ok&&I.check}</button>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:'.81rem',textDecoration:c.ok?'line-through':'none',opacity:c.ok?.65:1}}>{txt}</div>
                    {c.evidencia&&!aberta&&<div className="muted" style={{fontSize:'.69rem',marginTop:1}}>evidência: {c.evidencia}</div>}
                    {aberta&&<input className="inp" style={{marginTop:4,fontSize:'.78rem',padding:'4px 8px'}}
                      autoFocus defaultValue={c.evidencia||''} placeholder="O que foi observado? (não vale relato, só evidência)"
                      onBlur={e=>{evid(pil.id,cid,e.target.value); setEvidDe(null);}}
                      onKeyDown={e=>{if(e.key==='Enter'){evid(pil.id,cid,e.target.value); setEvidDe(null);}}}/>}
                  </div>
                  {c.data&&<span className="mono muted" style={{fontSize:'.66rem'}}>{fmtBR(c.data).slice(0,5)}</span>}
                  {!foraDoEscopo&&<button className="icon-btn" style={{width:22,height:22,color:c.evidencia?'var(--brand)':'var(--text-3)'}}
                    onClick={()=>setEvidDe(aberta?null:pil.id+cid)} title="Evidência observada">✎</button>}
                </div>);})}
              {foraDoEscopo&&<div className="muted" style={{fontSize:'.71rem',marginTop:4}}>
                Nível 4 não faz parte da mensalidade — cada item é proposta própria.
              </div>}
            </div>);})}
        </div>}
      </div>);})}

    {/* ---- histórico trimestral ---- */}
    {(mat.historico||[]).length>0&&<div className="card card-pad" style={{marginTop:14}}>
      <div className="card-h"><h3>Evolução</h3><span className="sub">critérios cumpridos por posição registrada</span></div>
      <div style={{overflowX:'auto'}}><table className="tbl">
        <thead><tr><th>Data</th>{ativos.map(p2=><th key={p2.id} style={{textAlign:'center'}}>{p2.nome.split(' ')[0]}</th>)}</tr></thead>
        <tbody>{(mat.historico||[]).slice().reverse().map((h,i)=>(
          <tr key={i}><td className="mono" style={{fontSize:'.78rem'}}>{fmtBR(h.data)}</td>
            {ativos.map(p2=>{const nv=(h.niveis||{})[p2.id]||0, cm=(h.cumpridos||{})[p2.id]||0;
              return (<td key={p2.id} style={{textAlign:'center'}}>
                <span className="mat-badge" style={{background:infoNivel(nv).cor+'1c',color:infoNivel(nv).cor}}>N{nv}</span>
                <div className="mono muted" style={{fontSize:'.66rem'}}>{cm} critérios</div></td>);})}
          </tr>))}</tbody>
      </table></div>
    </div>}

    <div className="muted" style={{fontSize:'.73rem',marginTop:12}}>
      Cada critério não cumprido dos níveis 2 e 3 é candidato a ação ou projeto no Planejamento.
      Um critério só é marcado como cumprido com evidência observada, não com relato.
    </div>
  </div>);
}

function TabTarefas({p,mutate}){
  const {db,flash,go,auth}=useDB();
  const [f,setF]=useState({q:'',resp:'Todos',status:'Abertas',per:'todos'});
  const [agrupar,setAgrupar]=useState('fase');   // fase | resp | status | nenhum
  const [colsExtra,setColsExtra]=useState(false);
  const [modal,setModal]=useState(null);
  const [obsDe,setObsDe]=useState(null);
  const [sessoesDe,setSessoesDe]=useState(null);
  const [fechados,setFechados]=useState([]);     // grupos recolhidos
  const alterna=(k)=>setFechados(a=>a.indexOf(k)>=0? a.filter(x=>x!==k) : [...a,k]);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));

  const todas=(p.activities||[]);
  const padraoGrupoCli=(g)=>{
    const pd={projectId:p.id};
    if(f.resp!=='Todos') pd.assignees=[f.resp];
    if(f.status!=='Abertas'&&f.status!=='Todas') pd.column=f.status;
    if(agrupar==='fase'&&g.k!=='avulsa'){ const [pe,fa]=String(g.k).split('|'); pd.extra={peId:pe,faseId:(fa==='-'?null:fa)}; }
    else if(agrupar==='resp') pd.assignees=(g.k==='—'?[]:[g.k]);
    else if(agrupar==='status') pd.column=g.k;
    return pd;
  };
  const lista=useMemo(()=>{
    const L=todas.filter(t=>{
      if(f.q && (t.name||'').toLowerCase().indexOf(f.q.toLowerCase())<0) return false;
      if(f.resp!=='Todos' && !temResp(t,f.resp)) return false;
      if(f.status==='Abertas'){ if(t.column==='concluido'||t.column==='cancelado') return false; }
      else if(f.status!=='Todas' && t.column!==f.status) return false;
      if(!noPeriodo(t,f.per,db)) return false;
      return true;
    });
    const pOrd={'Alta':0,'Média':1,'Baixa':2};
    L.sort((a,b)=>(pOrd[a.prio||'Média']-pOrd[b.prio||'Média'])||((a.date||'9999')<(b.date||'9999')?-1:1));
    return L;
  },[todas,f]);

  const grupos=useMemo(()=>{
    if(agrupar==='nenhum') return [{k:'t',titulo:'Todas as tarefas',cor:'#4a5a5c',itens:lista}];
    const m=new Map();
    lista.forEach(t=>{
      let k,titulo,cor='#4a5a5c',ordem=99;
      if(agrupar==='fase'){
        const pe=t.peId?achaPE(p,t.peId):null;
        const fase=pe&&t.faseId?(pe.fases||[]).find(x=>x.id===t.faseId):null;
        if(pe){ k=pe.id+'|'+(fase?fase.id:'-'); cor='#0F4245';
          const i=fase?(pe.fases||[]).indexOf(fase)+1:0;
          titulo=pe.cod+' · '+(fase? String(i).padStart(2,'0')+' '+fase.nome : 'sem fase definida');
          ordem=todosPEs(p).indexOf(pe)*100+(fase?i:99);
        } else { k='avulsa'; titulo='Fora do plano'; ordem=9999; }
      } else if(agrupar==='crono'){
        k=t.cronoId? (t.cronoFase||'Sem fase') : 'Fora do cronograma';
        titulo=k; cor=t.cronoId?'#0F4245':'#8b9a99';
        ordem=t.cronoId? ((((p.cronoDoc||{}).fases)||[]).indexOf(t.cronoFase)+1||98) : 99;
      } else if(agrupar==='resp'){
        /* tarefa com duas pessoas aparece na lista de cada uma */
        const q=respsDe(t); const quais=q.length?q:[''];
        quais.forEach(w=>{ const kk=w||'—', tt=w?member(db,w).name:'Sem responsável';
          if(!m.has(kk)) m.set(kk,{k:kk,titulo:tt,cor:undefined,ordem:0,itens:[]});
          m.get(kk).itens.push(t); });
        return;
      }
      else { k=t.column; titulo=COL_LABEL[t.column]||t.column; cor=COL_COLOR[t.column]; }
      if(!m.has(k)) m.set(k,{k,titulo,cor,ordem,itens:[]});
      m.get(k).itens.push(t);
    });
    const g=[...m.values()];
    return (agrupar==='fase'||agrupar==='crono')? g.sort((a,b)=>(a.ordem||0)-(b.ordem||0)) : g.sort((a,b)=>a.titulo.localeCompare(b.titulo));
  },[lista,agrupar,p,db]);

  const campo=(id,k,v)=>mutate(pr=>{const a=pr.activities.find(x=>x.id===id); if(a) a[k]=v;});
  const campoResps=(id,lista)=>mutate(pr=>{const a=pr.activities.find(x=>x.id===id); if(a) setResps(a,lista);});
  const excluir=(t)=>{ if(!confirm('Excluir "'+t.name+'"?')) return;
    mutate(pr=>pr.activities=pr.activities.filter(x=>x.id!==t.id)); flash('Excluída'); };
  const salvar=(nova)=>{
    const existe=todas.some(x=>x.id===nova.id);
    mutate(pr=>{ if(existe){ const i=pr.activities.findIndex(x=>x.id===nova.id);
        pr.activities[i]={...pr.activities[i],...nova}; }
      else pr.activities.unshift(nasceTarefa({...nova,projectId:pr.id})); });
    flash(existe?'Atualizada':'Tarefa criada'); setModal(null);
  };

        <span style={{marginLeft:'auto'}} className="row">

    {!lista.length&&<div className="card card-pad"><div className="empty" style={{padding:28}}><div className="ic">✓</div>

    {grupos.map(g=>{
      const h=g.itens.reduce((a,t)=>a+(+t.estHoras||0),0);
      const ab=g.itens.filter(t=>t.column!=='concluido'&&t.column!=='cancelado').length;
      return (<div key={g.k} className="card" style={{marginBottom:14}}>
