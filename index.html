function TabActivities({p,mutate}){
  const {db,flash}=useDB();
  const [modal,setModal]=useState(null);
  const [cat,setCat]=useState('Todas');
  const [quando,setQuando]=useState('tudo');       // tudo | feitas | abertas
  const [agrupar,setAgrupar]=useState('cat');      // cat | mes

  /* Categorias do histórico: o tipo da atividade traduzido para o que a
     equipe fala. Uma atividade sem tipo conhecido cai em "Outros". */
  const CATS=[
    ['Reunião',    'Reuniões',    '#0F4245'],
    ['Entrega',    'Entregas',    '#2F8F6E'],
    ['Fechamento', 'Fechamentos', '#0F4245'],
    ['Documento',  'Documentos',  '#3F598C'],
    ['Análise',    'Análises',    '#173164'],
    ['Ligação',    'Ligações',    '#e67e22'],
    ['E-mail',     'E-mails',     '#2F8F6E'],
    ['Pesquisa',   'Pesquisas',   '#C58B2A'],
    ['Outro',      'Outros',      '#4a5a5c'],
  ];
  const catDe=(t)=> CATS.some(c=>c[0]===t)? t : 'Outro';
  const catInfo2=(k)=> CATS.find(c=>c[0]===k)||CATS[CATS.length-1];

  const todas=(p.activities||[]);
  const lista=useMemo(()=>{
    let L=todas.filter(a=>{
      if(cat!=='Todas' && catDe(a.type)!==cat) return false;
      if(quando==='feitas' && a.column!=='concluido') return false;
      if(quando==='abertas' && (a.column==='concluido'||a.column==='cancelado')) return false;
      return true;
    });
    return L.slice().sort((a,b)=>((b.date||'')<(a.date||'')?-1:1));   // mais recente primeiro
  },[todas,cat,quando]);

  const grupos=useMemo(()=>{
    const m=new Map();
    lista.forEach(a=>{
      let k,titulo,cor;
      if(agrupar==='cat'){ k=catDe(a.type); const ci=catInfo2(k); titulo=ci[1]; cor=ci[2]; }
      else { k=(a.date||'0000-00').slice(0,7);
        titulo=k==='0000-00'?'Sem data':(MES[+k.slice(5,7)-1]+' '+k.slice(0,4)); cor='#4a5a5c'; }
      if(!m.has(k)) m.set(k,{k,titulo,cor,itens:[]});
      m.get(k).itens.push(a);
    });
    const g=[...m.values()];
    return agrupar==='cat'
      ? g.sort((a,b)=>CATS.findIndex(c=>c[1]===a.titulo)-CATS.findIndex(c=>c[1]===b.titulo))
      : g.sort((a,b)=>b.k<a.k?-1:1);
  },[lista,agrupar]);

  const contaCat=(k)=>todas.filter(a=>catDe(a.type)===k).length;
  const setAct=(id,fn)=>mutate(proj=>{const a=proj.activities.find(x=>x.id===id);if(a)fn(a,proj);});
  const del=(a)=>{ if(!confirm('Excluir "'+a.name+'" do histórico?')) return;
    mutate(proj=>proj.activities=proj.activities.filter(x=>x.id!==a.id)); flash('Removida'); };
  const salvar=(nova)=>{
    const existe=todas.some(x=>x.id===nova.id);
    mutate(proj=>{ if(existe){ const i=proj.activities.findIndex(x=>x.id===nova.id);
        proj.activities[i]={...proj.activities[i],...nova}; }
      else proj.activities.unshift(nasceTarefa({...nova,projectId:proj.id})); });
    flash(existe?'Atualizada':'Registrada no histórico'); setModal(null);
  };
  const novo=()=>setModal({id:'',name:'',type:'Reunião',assignee:p.consultants[0]||'',
    date:isoDate(TODAY),buildStart:'',buildEnd:'',hora:'',durMin:60,estHoras:1,obs:'',
    prio:'Média',projectId:p.id,peId:'',faseId:'',deliverableId:'',column:'concluido',sprintId:null,sessoes:{}});

  const feitas=todas.filter(a=>a.column==='concluido').length;

  return (<div>
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="between" style={{flexWrap:'wrap',gap:12}}>
        <div>
          <h3 style={{fontSize:'1rem'}}>Histórico de atividades</h3>
          <span className="muted" style={{fontSize:'.78rem'}}>
            {todas.length} registros · {feitas} concluídos — reuniões, entregas, fechamentos e o resto do que aconteceu no cliente
          </span>
        </div>
        <button className="btn btn-primary btn-sm" onClick={novo}>{I.plus} Registrar atividade</button>
      </div>
      <div className="row" style={{gap:6,marginTop:12,flexWrap:'wrap'}}>
        <button className={"fpill "+(cat==='Todas'?'on':'')} onClick={()=>setCat('Todas')}>Todas ({todas.length})</button>
        {CATS.filter(c=>contaCat(c[0])>0).map(([k,l,cor])=>(
          <button key={k} className={"fpill "+(cat===k?'on':'')} onClick={()=>setCat(cat===k?'Todas':k)}
            style={cat===k?{background:cor,borderColor:cor,color:'#fff'}:{color:cor}}>{l} ({contaCat(k)})</button>))}
      </div>
      <div className="row" style={{gap:8,marginTop:10,flexWrap:'wrap',alignItems:'center'}}>
        {[['tudo','Tudo'],['feitas','Só concluídas'],['abertas','Só em aberto']].map(([k,l])=>
          <button key={k} className={"fpill "+(quando===k?'on':'')} onClick={()=>setQuando(k)}>{l}</button>)}
        <span style={{marginLeft:'auto'}} className="row">
          <span className="muted" style={{fontSize:'.73rem',marginRight:6}}>agrupar por</span>
          {[['cat','Tipo'],['mes','Mês']].map(([k,l])=>
            <button key={k} className={"fpill "+(agrupar===k?'on':'')} onClick={()=>setAgrupar(k)}>{l}</button>)}
        </span>
      </div>
    </div>

    {!lista.length&&<div className="card card-pad"><div className="empty" style={{padding:30}}>
      <div className="ic">🗒</div>Nada registrado com esse filtro.</div></div>}

    {grupos.map(g=>(<div key={g.k} className="card" style={{marginBottom:14}}>
      <div className="grupo-h" style={{borderLeft:'4px solid '+g.cor}}>
        <span className="grupo-t" style={{color:g.cor}}>{g.titulo}</span>
        <span className="muted" style={{fontSize:'.74rem'}}>
          {g.itens.length} registro{g.itens.length===1?'':'s'} · {g.itens.filter(a=>a.column==='concluido').length} concluído(s)</span>
      </div>
      <div>
        {g.itens.map(a=>{ const ci=catInfo2(catDe(a.type)), feito=a.column==='concluido';
          const ini2=iniciativaDaTarefa(db,{...a,proj:p});
          return (<div key={a.id} className="hist-row">
            <button className={"chk sm "+(feito?'on':'')} onClick={()=>setAct(a.id,x=>x.column=feito?'andamento':'concluido')}
              title={feito?'Reabrir':'Marcar como concluída'}>{feito&&I.check}</button>
            <div className="hist-data mono">{a.date?fmtBR(a.date).slice(0,5):'—'}
              <span>{a.date?fmtBR(a.date).slice(6):''}</span></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:'.85rem',fontWeight:600,textDecoration:feito?'line-through':'none',opacity:feito?.65:1}}>{a.name}</div>
              <div className="row" style={{gap:6,marginTop:2,flexWrap:'wrap'}}>
                {agrupar!=='cat'&&<span className="tag-soft" style={{fontSize:'.63rem',background:ci[2]+'18',color:ci[2],fontWeight:700}}>{ci[1]}</span>}
                <span className="badge" style={{background:COL_COLOR[a.column]+'18',color:COL_COLOR[a.column]}}>{COL_LABEL[a.column]}</span>
                {ini2&&<span className="tag-soft" style={{fontSize:'.63rem',background:'#0F424514',color:'#0F4245',fontWeight:700}}>{ini2.nome}</span>}
                {a.obs&&<span className="muted" style={{fontSize:'.72rem'}}>· {a.obs.slice(0,60)}</span>}
              </div>
            </div>
            <Avatares db={db} t={a}/>
            <button className="icon-btn" style={{width:24,height:24}} onClick={()=>setModal({...a,projectId:p.id,peId:a.peId||'',faseId:a.faseId||''})} title="Editar">✎</button>
            <button className="icon-btn" style={{width:22,height:22,color:'var(--text-3)'}} onClick={()=>del(a)}>{I.x}</button>
          </div>);})}
      </div>
    </div>))}

    {modal&&<TaskModal db={db} init={modal} close={()=>setModal(null)} onSave={salvar}/>}
  </div>);
}

/* ============================================================
   MÓDULO 4 — SPRINT (kanban + lista + backlog + carry-over)
   ============================================================ */
const COLS=[['backlog','Backlog','#8b9a99'],['andamento','Em andamento','#0F4245'],['revisao','Em revisão','#C58B2A'],['concluido','Concluído','#2F8F6E']];
/* ============================================================
   MONTAGEM DO SPRINT POR CAPACIDADE
   A segunda-feira da gestora: distribuir tarefas entre os consultores
   até completar as horas de cada um. A unidade aqui é HORA, não status.
   Colocar na semana só marca a semana — o horário de cada dia é decidido
   depois, na agenda.
   ============================================================ */
/* ============================================================
   RELATÓRIO AO CLIENTE
   Lê o sprint e monta a mensagem de andamento: o que foi concluído, o
   que está em curso e os próximos passos. Tudo editável antes de enviar
   — a estrutura alimenta o texto e a imagem ao mesmo tempo.
   ============================================================ */
function RelatorioModal({sprint,close}){
  const {db,flash}=useDB();
  const clientes=ativos(db).filter(p=>(p.activities||[]).length);
  const [pid,setPid]=useState(()=>(clientes[0]||{}).id||'');
  const p=db.projects.find(x=>x.id===pid);
  const [livre,setLivre]=useState(false);     // texto desacoplado da estrutura
  const [texto,setTexto]=useState('');
  const svgRef=useRef(null);

  /* ---- o que o sprint diz sobre este cliente ---- */
  const dados=useMemo(()=>{
    if(!p) return {feitas:[],andamento:[],proximos:[],marcos:[]};
    const doCliente=(p.activities||[]);
    const naSemana=doCliente.filter(t=>taskEmSprint(t,sprint));
    const prox=doCliente.filter(t=>{
      if(taskEmSprint(t,sprint)) return false;
      if(t.column==='concluido'||t.column==='cancelado') return false;
      const w=taskWindow(t);
      return w.ini && w.ini>sprint.end;
    }).sort((a,b)=>(taskWindow(a).ini||'9999')<(taskWindow(b).ini||'9999')?-1:1);
    /* marcos da trilha que caem na semana */
    let marcos=[];
    if(p.startDate){
      const lista=TRILHA_MARCOS[p.rota||'Estruturação']||[];
      marcos=lista.filter(m=>{ const d=isoDate(addDays(dLocal(p.startDate),m.dia));
        return d>=sprint.start&&d<=sprint.end; }).map(m=>m.nome);
    }
    return {
      feitas:naSemana.filter(t=>t.column==='concluido').map(t=>t.name),
      andamento:naSemana.filter(t=>t.column==='andamento'||t.column==='revisao').map(t=>t.name),
      proximos:prox.slice(0,6).map(t=>t.name),
      marcos,
    };
  },[p,sprint]);

  /* ---- blocos editáveis ---- */
  const [blocos,setBlocos]=useState(null);
  useEffect(()=>{
    setBlocos({
      feitas:[...dados.feitas],
      andamento:[...dados.andamento],
      proximos:[...dados.proximos],
      nota:dados.marcos.length? 'Marco da etapa nesta semana: '+dados.marcos.join(', ')+'.' : '',
    });
    setLivre(false);
  },[pid,sprint.id]);

  const b=blocos||{feitas:[],andamento:[],proximos:[],nota:''};
  const setItem=(k,i,v)=>setBlocos(x=>{const c={...x}; c[k]=[...c[k]]; c[k][i]=v; return c;});
  const delItem=(k,i)=>setBlocos(x=>{const c={...x}; c[k]=c[k].filter((_,j)=>j!==i); return c;});
  const addItem=(k)=>setBlocos(x=>({...x,[k]:[...x[k],'']}));

  /* ---- a mensagem ---- */
  const montar=()=>{
    if(!p) return '';
    const L=[];
    L.push('*'+p.name+' · acompanhamento semanal*');
    L.push('Sprint de '+fmtBR(sprint.start)+' a '+fmtBR(sprint.end));
    const lim=(a)=>a.map(x=>(x||'').trim()).filter(Boolean);
    const f=lim(b.feitas), an=lim(b.andamento), pr=lim(b.proximos);
    if(f.length){ L.push(''); L.push('*O que concluímos*'); f.forEach(x=>L.push('✓ '+x)); }
    if(an.length){ L.push(''); L.push('*Em andamento*'); an.forEach(x=>L.push('• '+x)); }
    if(pr.length){ L.push(''); L.push('*Próximos passos*'); pr.forEach(x=>L.push('→ '+x)); }
    if((b.nota||'').trim()){ L.push(''); L.push((b.nota||'').trim()); }
    L.push(''); L.push('Qualquer dúvida, estamos à disposição.');
    return L.join('\n');
  };
  const mensagem=livre? texto : montar();
  useEffect(()=>{ if(!livre) setTexto(montar()); },[blocos,pid,livre]);

  /* ---- imagem ---- */
  const cor=p?corDoCliente(p):'#0F4245';
  const lim=(a,n)=>a.map(x=>(x||'').trim()).filter(Boolean).slice(0,n);
  const corta=(t,n)=>t.length>n? t.slice(0,n-1)+'…' : t;
  const img=useMemo(()=>{
    const f=lim(b.feitas,5), an=lim(b.andamento,4), pr=lim(b.proximos,4);
    const linhas=[];
    let y=300;
    const secao=(tit,itens,marca,corM)=>{
      if(!itens.length) return;
      linhas.push({tipo:'tit',t:tit,y}); y+=46;
      itens.forEach(it=>{ linhas.push({tipo:'item',t:corta(it,52),y,marca,corM}); y+=42; });
      y+=22;
    };
    secao('O QUE CONCLUÍMOS',f,'✓','#8FBFA4');
    secao('EM ANDAMENTO',an,'•','#C58B2A');
    secao('PRÓXIMOS PASSOS',pr,'→','#7FA8C9');
    return {linhas,alt:Math.max(900,y+140)};
  },[blocos]);

  /* Na tela o SVG escala com width:100%. Num arquivo solto isso vira
     largura zero, então a cópia exportada leva tamanho real em pixels. */
  const svgExportavel=()=>{
    const svg=svgRef.current; if(!svg) return null;
    const c=svg.cloneNode(true);
    c.removeAttribute('style');
    c.setAttribute('width','1080');
    c.setAttribute('height',String(img.alt));
    return c;
  };
  const baixarImagem=()=>{
    const svg=svgExportavel(); if(!svg) return;
    try{
      const xml=new XMLSerializer().serializeToString(svg);
      const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const im=new Image();
      im.onload=()=>{
        const c=document.createElement('canvas');
        c.width=1080; c.height=img.alt;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#011E3C'; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(im,0,0,c.width,c.height);
        c.toBlob(bb=>{
          const a=document.createElement('a');
          a.href=URL.createObjectURL(bb);
          a.download='relatorio-'+slug(p?p.name:'cliente')+'-'+sprint.start+'.png';
          a.click(); URL.revokeObjectURL(a.href); URL.revokeObjectURL(url);
          flash('Imagem baixada');
        },'image/png');
      };
      im.onerror=()=>{ flash('Não consegui converter em PNG — baixe o SVG'); URL.revokeObjectURL(url); };
      im.src=url;
    }catch(e){ flash('Não consegui gerar a imagem'); }
  };
  const baixarSVG=()=>{
    const svg=svgExportavel(); if(!svg) return;
    const xml=new XMLSerializer().serializeToString(svg);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));
    a.download='relatorio-'+slug(p?p.name:'cliente')+'-'+sprint.start+'.svg';
    a.click(); URL.revokeObjectURL(a.href);
  };
  const copiar=()=>{
    const t=mensagem;
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); flash('Mensagem copiada'); return; }
    }catch(e){}
    try{
      const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta); flash('Mensagem copiada');
    }catch(e){ flash('Copie manualmente pelo campo de texto'); }
  };

  const Lista=({k,tit,cor2})=>(<div className="rel-bloco">
    <div className="between" style={{marginBottom:5}}>
      <span className="rel-tit" style={{color:cor2}}>{tit}</span>
      <button className="btn btn-ghost btn-sm" onClick={()=>addItem(k)}>+ item</button>
    </div>
    {b[k].map((it,i)=>(<div key={i} className="rel-item">
      <LiveInput className="rel-inp" value={it} placeholder="descreva em linguagem de cliente"
        onCommit={v=>setItem(k,i,v)}/>
      <button className="icon-btn" style={{width:22,height:22,color:'var(--text-3)'}} onClick={()=>delItem(k,i)}>{I.x}</button>
    </div>))}
    {!b[k].length&&<div className="muted" style={{fontSize:'.74rem'}}>nada nesta seção</div>}
  </div>);

  return (<div className="overlay" onClick={close}><div className="modal rel" onClick={e=>e.stopPropagation()}>
    <div className="modal-h"><h3>Relatório ao cliente</h3><button className="x" onClick={close}>{I.x}</button></div>
    <div className="modal-b">
      <div className="row" style={{gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:12}}>
        <select className="sel" style={{width:200}} value={pid} onChange={e=>setPid(e.target.value)}>
          {clientes.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select>
        <span className="muted" style={{fontSize:'.78rem'}}>
          Sprint · {fmtBR(sprint.start)} a {fmtBR(sprint.end)}
        </span>
        <label className="row" style={{gap:5,fontSize:'.75rem',color:'var(--text-2)',marginLeft:'auto',cursor:'pointer'}}>
          <input type="checkbox" checked={livre} onChange={e=>setLivre(e.target.checked)}/>
          escrever o texto livremente
        </label>
      </div>

      {!clientes.length&&<div className="empty">Nenhum cliente com atividades.</div>}

      {!!clientes.length&&<div className="rel-grid">
        {/* coluna de edição */}
        <div>
          {!livre&&<>
            <Lista k="feitas"    tit="O QUE CONCLUÍMOS"  cor2="#2F8F6E"/>
            <Lista k="andamento" tit="EM ANDAMENTO"      cor2="#C58B2A"/>
            <Lista k="proximos"  tit="PRÓXIMOS PASSOS"   cor2="#3F598C"/>
            <div className="rel-bloco">
              <span className="rel-tit" style={{color:'var(--text-3)'}}>OBSERVAÇÃO</span>
              <LiveInput className="rel-inp" style={{marginTop:5}} value={b.nota}
                placeholder="um recado, um pedido de retorno, um marco da etapa"
                onCommit={v=>setBlocos(x=>({...x,nota:v}))}/>
            </div>
          </>}
          <div className="rel-bloco">
            <span className="rel-tit" style={{color:'var(--text-3)'}}>MENSAGEM</span>
            <textarea className="inp rel-txt" value={mensagem} readOnly={!livre}
              onChange={e=>setTexto(e.target.value)}
              title={livre?undefined:'Marque “escrever o texto livremente” para editar aqui'}/>
            <div className="row" style={{gap:8,marginTop:8,flexWrap:'wrap'}}>
              <button className="btn btn-primary btn-sm" onClick={copiar}>copiar mensagem</button>
              {!livre&&<span className="muted" style={{fontSize:'.72rem',alignSelf:'center'}}>
                o texto segue as listas acima</span>}
            </div>
          </div>
        </div>

        {/* coluna da imagem */}
        <div>
          <span className="rel-tit" style={{color:'var(--text-3)'}}>IMAGEM</span>
          <div className="rel-prev">
            <svg ref={svgRef} xmlns="http://www.w3.org/2000/svg" viewBox={'0 0 1080 '+img.alt}
              style={{width:'100%',height:'auto',display:'block'}}>
              <rect width="1080" height={img.alt} fill="#011E3C"/>
              <rect x="0" y="0" width="1080" height="10" fill={cor}/>
              <text x="72" y="118" fill="#8FBFA4" fontSize="26" fontWeight="700" letterSpacing="6"
                fontFamily="Montserrat, sans-serif">ACOMPANHAMENTO SEMANAL</text>
              <text x="72" y="190" fill="#ffffff" fontSize="56" fontWeight="600"
                fontFamily="Montserrat, sans-serif">{p?p.name:''}</text>
              <text x="72" y="238" fill="#7a93a8" fontSize="27" fontWeight="500"
                fontFamily="Montserrat, sans-serif">
                {'Sprint '+fmtBR(sprint.start)+' a '+fmtBR(sprint.end)}</text>
              <line x1="72" y1="266" x2="1008" y2="266" stroke="#1d3d5c" strokeWidth="2"/>
              {img.linhas.map((l,i)=> l.tipo==='tit'
                ? <text key={i} x="72" y={l.y} fill="#8FBFA4" fontSize="24" fontWeight="700" letterSpacing="4"
                    fontFamily="Montserrat, sans-serif">{l.t}</text>
                : <g key={i}>
                    <text x="76" y={l.y} fill={l.corM} fontSize="28" fontWeight="700"
                      fontFamily="Montserrat, sans-serif">{l.marca}</text>
                    <text x="118" y={l.y} fill="#e8eef3" fontSize="28" fontWeight="500"
                      fontFamily="Montserrat, sans-serif">{l.t}</text>
                  </g>)}
              {(b.nota||'').trim()&&<text x="72" y={img.alt-96} fill="#7a93a8" fontSize="24" fontWeight="500"
                fontFamily="Montserrat, sans-serif">{corta((b.nota||'').trim(),64)}</text>}
              <text x="72" y={img.alt-44} fill="#44627d" fontSize="22" fontWeight="600" letterSpacing="3"
                fontFamily="Montserrat, sans-serif">NORTMONT · CONSULTORIA EM NEGÓCIOS</text>
            </svg>
          </div>
          <div className="row" style={{gap:8,marginTop:8,flexWrap:'wrap'}}>
            <button className="btn btn-primary btn-sm" onClick={baixarImagem}>baixar PNG</button>
            <button className="btn btn-ghost btn-sm" onClick={baixarSVG}>baixar SVG</button>
          </div>
          <div className="muted" style={{fontSize:'.72rem',marginTop:6}}>
            A imagem mostra até 5 conclusões e 4 itens das demais seções, para caber sem apertar.
          </div>
        </div>
      </div>}
    </div>
    <div className="modal-f"><span className="muted" style={{fontSize:'.73rem'}}>
      Gerado a partir do sprint — revise antes de enviar.</span>
      <button className="btn btn-ghost" onClick={close}>Fechar</button></div>
  </div></div>);
}

/* ------------------------------------------------------------
   ADICIONAR DIRETO NO SPRINT
   Montar a semana à mão: a tarefa nasce já dentro da semana e na
   coluna de quem vai fazer. É a mesma tarefa de sempre — aparece na
   aba Tarefas, na aba do cliente e no calendário, porque tudo lê do
   mesmo lugar. A janela de construção é a semana do sprint, que é o
   que faz a tarefa pertencer a ele.
   ------------------------------------------------------------ */
function AddNoSprint({sprint,quem,cliente,compacto,rotulo,prio}){
  const {db,update,flash}=useDB();
  const [aberto,setAberto]=useState(false);
  const vazio=()=>({name:'',projectId:cliente||'',prio:prio||'Média',estHoras:'',
    assignees:quem?[quem]:[]});
  const [f,setF]=useState(vazio);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  useEffect(()=>{ setF(x=>({...x,assignees:quem?[quem]:[],projectId:cliente||x.projectId})); },[quem,cliente]);
  const criar=()=>{
    if(!f.name.trim()){ flash('Dê um nome à tarefa'); return; }
    const nova={id:uid(),name:f.name.trim(),type:tipoPeloNome(f.name),prio:f.prio,
      assignees:f.assignees||[],assignee:(f.assignees||[])[0]||'',
      projectId:f.projectId||null,deliverableId:'',notes:'',obs:'',
      date:sprint.end, buildStart:sprint.start, buildEnd:sprint.end,
      hora:'',durMin:0,sessoes:{},estHoras:+f.estHoras||0,
      column:'backlog',sprintId:null,peId:null,faseId:null,iniciativaId:null};
    update(d=>{ addTaskTo(d,nova); return d; });
    setF(vazio());
    flash('No sprint '+rotuloSprint(sprint)+(nova.assignee? ' · '+member(db,nova.assignee).name : ''));
  };
  const enter=(e)=>{ if(e.key==='Enter') criar(); if(e.key==='Escape') setAberto(false); };

  if(!aberto) return (<button className="add-sprint-b" onClick={()=>setAberto(true)}>
    {I.plus} {rotulo||'tarefa neste sprint'}</button>);
  return (<div className="add-sprint">
    <input className="inp" style={{marginBottom:7,fontSize:'.82rem',padding:'7px 10px'}} value={f.name} autoFocus
      onChange={e=>set('name',e.target.value)} onKeyDown={enter} placeholder="O que precisa ser feito?"/>
    <select className="mini-sel" style={{width:'100%',marginBottom:7}}
      value={f.projectId} onChange={e=>set('projectId',e.target.value)}>
      <option value="">Sem cliente</option>
      {ativos(db).map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select>
    <div className="row" style={{gap:7}}>
      <select className="mini-sel" style={{flex:1,minWidth:0}} value={f.prio} onChange={e=>set('prio',e.target.value)}>
        {PRIOS.map(x=><option key={x} value={x}>{x}</option>)}</select>
      <input type="number" min="0" step="0.5" className="mini-sel" style={{width:64,textAlign:'right',flex:'none'}}
        value={f.estHoras} onChange={e=>set('estHoras',e.target.value)} placeholder="h" title="Horas estimadas"/>
      <span className="muted" style={{fontSize:'.7rem'}}>h</span>
    </div>
    <div style={{marginTop:7}}>
      <SelResps db={db} valor={f.assignees||[]} compacto={compacto} onChange={(l)=>set('assignees',l)}/>
    </div>
    <div className="row" style={{gap:7,marginTop:8}}>
      <button className="btn btn-primary btn-sm" style={{flex:1,justifyContent:'center'}} onClick={criar}>{I.plus} Adicionar</button>
      <button className="btn btn-ghost btn-sm" onClick={()=>{setF(vazio());setAberto(false);}}>fechar</button>
    </div>
    <div className="muted" style={{fontSize:'.68rem',marginTop:6}}>
      Entra no sprint de {fmtBR(sprint.start)} a {fmtBR(sprint.end)} e aparece também na aba Tarefas e no cliente.
    </div>
  </div>);
}

function MontarSprint({sprint,frozen,filtro,passa}){
  const {db,update,flash,go}=useDB();
  const [arrasto,setArrasto]=useState(null);
  const [alvo,setAlvo]=useState('');
  /* Por quem faz (a conta de horas é por pessoa) ou por cliente (o que
     cada um recebe nesta quinzena). */
  const [porQuem,setPorQuem]=useState(()=>{ try{return localStorage.getItem(LS_KEY+':distpor')||'pessoa';}catch(e){return 'pessoa';} });
  useEffect(()=>{ try{localStorage.setItem(LS_KEY+':distpor',porQuem);}catch(e){} },[porQuem]);
  /* Duas leituras da mesma distribuição: o quadro, para arrastar, e a
     lista escrita, para ler linha a linha, conferir e mandar para o time. */
  const [vista,setVista]=useState(()=>{ try{return localStorage.getItem(LS_KEY+':distvista')||'quadro';}catch(e){return 'quadro';} });
  useEffect(()=>{ try{localStorage.setItem(LS_KEY+':distvista',vista);}catch(e){} },[vista]);

  const equipe=db.team;
  const naSemana=(t)=>taskEmSprint(t,sprint);
  const abertas=allTasks(db).filter(t=>t.column!=='concluido'&&t.column!=='cancelado');

  /* banco: o que ainda não tem semana */
  /* Banco = tudo que está em aberto e ainda não entrou neste sprint.
     Inclui tarefas sem prazo e as que estão marcadas para outras semanas. */
  /* O banco respeita os filtros da barra — menos o de responsável, que
     no banco não faz sentido (é justamente o que você vai definir). */
  const passaBanco=(t)=>{
    if(filtro.q&&(t.name||'').toLowerCase().indexOf(filtro.q.toLowerCase())<0) return false;
    if(filtro.cli==='Gerais'){ if(t.projectId) return false; }
    else if(filtro.cli!=='Todos'&&t.projectId!==filtro.cli) return false;
    if(filtro.prio!=='Todas'&&(t.prio||'Média')!==filtro.prio) return false;
    return true;
  };
  const banco=useMemo(()=>abertas.filter(t=>!naSemana(t)).filter(passaBanco)
    .sort((a,b)=>({'Alta':0,'Média':1,'Baixa':2}[a.prio||'Média'])-({'Alta':0,'Média':1,'Baixa':2}[b.prio||'Média'])),
    [db,filtro,sprint]);

  const daPessoa=(id)=>abertas.filter(t=>naSemana(t)&&temResp(t,id)&&passaBanco(t));
  const daPessoaTudo=(id)=>abertas.filter(t=>naSemana(t)&&temResp(t,id));   // sem filtro, para a conta de horas
  const horas=(l)=>l.reduce((a,t)=>a+(+t.estHoras||0),0);
  const semEst=(l)=>l.filter(t=>!(+t.estHoras)).length;
  /* A capacidade cadastrada é SEMANAL; o sprint tem duas semanas. */
  const nSem=semanasDoSprint(sprint);
  const capSemanal=(m)=>(+m.cap||+m.capacity||30);
  const capDe=(m)=>capSemanal(m)*nSem;          // horas na quinzena
  const setCapQuinzena=(mid,v)=>setCap(mid,(+v||0)/nSem);

  /* ---- ações ---- */
  /* Entrar no sprint sem escolher ninguém: a tarefa ganha a janela e fica
     esperando dono. É o caminho rápido do banco para a quinzena. */
  const soParaSemana=(id)=>update(d=>{ mutateTask(d,id,t=>{
      t.buildStart=sprint.start; t.buildEnd=sprint.end;
      if(!t.date||t.date<sprint.start) t.date=sprint.end;
      if(t.column==='backlog') t.column='andamento';
    }); return d; });
  /* Soltar o cartão na coluna de alguém ACRESCENTA essa pessoa — não troca,
     porque duas pessoas podem trabalhar na mesma tarefa. */
  const paraSemana=(id,quem)=>update(d=>{ mutateTask(d,id,t=>{
      if(quem&&!temResp(t,quem)) setResps(t,[...respsDe(t),quem]);
      t.buildStart=sprint.start; t.buildEnd=sprint.end;
      if(!t.date) t.date=sprint.end;
      if(t.column==='backlog') t.column='andamento';
      // horário fica para depois, na agenda
    }); return d; });
  const tiraDaSemana=(id)=>update(d=>{ mutateTask(d,id,t=>{
      t.buildStart=''; t.buildEnd=''; t.sessoes={}; t.column='backlog';
    }); return d; });
  const setHoras=(id,v)=>update(d=>{ mutateTask(d,id,t=>{t.estHoras=+v||0;}); return d; });
  const setCap=(mid,v)=>update(d=>{ const m=d.team.find(x=>x.id===mid); if(m){ m.cap=+v||0; m.capacity=+v||0; } return d; });

  /* ---- arraste ---- */
  const cardDrag=(t)=>frozen?{}:{
    draggable:true,
    onDragStart:(e)=>{ e.stopPropagation(); setArrasto(t);
      try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',t.id);}catch(x){} },
    onDragEnd:()=>{ setArrasto(null); setAlvo(''); },
    className:(arrasto&&arrasto.id===t.id)?'arrastando':''
  };
  const zona=(k,aoSoltar)=>frozen?{}:{
    onDragOver:(e)=>{ if(!arrasto) return; e.preventDefault(); if(alvo!==k) setAlvo(k); },
    onDragLeave:()=>{ if(alvo===k) setAlvo(''); },
    onDrop:(e)=>{ e.preventDefault(); const t=arrasto; setArrasto(null); setAlvo(''); if(t) aoSoltar(t); }
  };

  /* ---- as colunas: pessoas ou clientes ----
     Por pessoa, a régua é a capacidade de cada um. Por cliente, a coluna
     só soma as horas — cliente não tem capacidade, tem contrato. */
  const daCliente=(pid)=>abertas.filter(t=>naSemana(t)&&(pid? t.projectId===pid : !t.projectId)&&passaBanco(t)
    &&(filtro.resp==='Todos'||temResp(t,filtro.resp)));
  const colunas=useMemo(()=>{
    if(porQuem==='cliente'){
      const cols=ativos(db).map(p=>({k:p.id,nome:p.name,cor:corDoCliente(p),cliente:p,
        itens:daCliente(p.id),todas:abertas.filter(t=>naSemana(t)&&t.projectId===p.id)}));
      cols.push({k:'__geral',nome:'Tarefas gerais',cor:CINZA_GERAL,cliente:null,
        itens:daCliente(null),todas:abertas.filter(t=>naSemana(t)&&!t.projectId)});
      /* cliente sem nada na quinzena fica no fim, mas continua aceitando arraste */
      return cols.sort((a,b)=>b.itens.length-a.itens.length);
    }
    return equipe.filter(m=>filtro.resp==='Todos'||filtro.resp===m.id)
      .map(m=>({k:m.id,nome:m.name,cor:m.color,membro:m,
        itens:daPessoa(m.id),todas:daPessoaTudo(m.id)}));
  },[db,filtro,sprint,porQuem,equipe]);

  /* ---- totais da semana ---- */
  const capTotal=equipe.reduce((a,m)=>a+capDe(m),0);
  const usadoTotal=equipe.reduce((a,m)=>a+horas(daPessoaTudo(m.id)),0);
  const semEstTotal=equipe.reduce((a,m)=>a+semEst(daPessoaTudo(m.id)),0);

  const Cartao=({t,naColuna})=>{
    const ini=iniciativaDaTarefa(db,t);
    return (<div {...cardDrag(t)} className={"mt-card "+((cardDrag(t)||{}).className||'')}>
      <div className="row" style={{gap:6,alignItems:'flex-start'}}>
        <span className="mt-prio" style={{color:PRIO_C[t.prio||'Média'].fg}}>{PRIO_SIGLA[t.prio||'Média']}</span>
        <div style={{flex:1,minWidth:0}}>
          <div className="mt-nome">{t.name}</div>
          <div className="row" style={{gap:4,flexWrap:'wrap'}}>
            {contaSubs(t).n>0&&<TagSubs t={t}/>}
            {t.carriedFrom&&<TagRepassada t={t} mini/>}
          </div>
          <div className="row" style={{gap:5,flexWrap:'wrap',marginTop:2}}>
            {t.proj? <span className="mt-cli" style={{color:corDoCliente(t.proj)}}>
                <i style={{background:corDoCliente(t.proj)}}></i>{t.proj.name}</span>
              : <span className="muted" style={{fontSize:'.66rem'}}>tarefa geral</span>}
            {ini&&<span className="muted" style={{fontSize:'.64rem'}}>{ini.nome}</span>}
          </div>
        </div>
        <div className="row" style={{gap:3,alignItems:'center',flex:'none'}}>
          <input type="number" min="0" step="0.5" className="mt-h" value={t.estHoras||''} placeholder="?"
            title="Horas estimadas" onChange={e=>setHoras(t.id,e.target.value)}/>
          <span className="muted" style={{fontSize:'.66rem'}}>h</span>
        </div>
      </div>
      {!frozen&&naColuna&&<div className="mt-quem">
        <CelResps db={db} t={t}
          onChange={(l)=>update(d=>{mutateTask(d,t.id,x=>setResps(x,l));return d;})}/>
      </div>}
      {!frozen&&<div className="mt-acoes">
        {naColuna&&<BtnProximo t={t} compacto/>}
        {naColuna
          ? <button className="mt-btn" onClick={()=>tiraDaSemana(t.id)}>tirar do sprint</button>
          : <><button className="mt-btn forte" onClick={()=>soParaSemana(t.id)}
                title="Põe no sprint sem escolher quem faz">→ sprint</button>
              <select className="mt-sel" value="" onChange={e=>e.target.value&&paraSemana(t.id,e.target.value)}>
                <option value="">com…</option>
                {equipe.map(m=>{const liv=capDe(m)-horas(daPessoaTudo(m.id));
                  return <option key={m.id} value={m.id}>{m.name} · {liv>0?fmtHoras(liv)+'h livres':'sem folga'}</option>;})}
              </select></>}
      </div>}
    </div>);
  };

  /* ---- a mesma distribuição, escrita ---- */
  const LinhaDist=({t,naColuna})=>{
    const atras=taskAtrasada(t);
    return (<tr>
      <td>
        <div style={{fontWeight:600,fontSize:'.82rem'}}>{t.name}</div>
        {(t.obs||t.importadoDe)&&<div className="muted" style={{fontSize:'.68rem',marginTop:1}}>
          {t.obs||('da planilha · '+t.importadoDe)}</div>}
        <div className="row" style={{gap:5,flexWrap:'wrap'}}>
          {contaSubs(t).n>0&&<TagSubs t={t}/>}
          {t.carriedFrom&&<TagRepassada t={t}/>}
        </div>
      </td>
      <td>{t.proj
        ? <span className="mt-cli" style={{color:corDoCliente(t.proj)}}><i style={{background:corDoCliente(t.proj)}}></i>{t.proj.name}</span>
        : <span className="muted" style={{fontSize:'.72rem'}}>tarefa geral</span>}</td>
      <td><CelResps db={db} t={t}
        onChange={(l)=>update(d=>{mutateTask(d,t.id,x=>setResps(x,l));return d;})}/></td>
      <td style={{textAlign:'right'}}>
        <input type="number" min="0" step="0.5" className="mt-h" value={t.estHoras||''} placeholder="?"
          disabled={frozen} title="Horas estimadas" onChange={e=>setHoras(t.id,e.target.value)}/></td>
      <td><span className="mono" style={{fontSize:'.74rem',color:atras?'var(--coral)':'var(--text-2)',
        fontWeight:atras?700:500}}>{t.date?fmtBR(t.date):'—'}</span></td>
      <td><span className="mt-prio" style={{color:PRIO_C[t.prio||'Média'].fg}}>{PRIO_SIGLA[t.prio||'Média']}</span></td>
      {!frozen&&<td style={{textAlign:'right'}}>
        {naColuna
          ? <div className="row" style={{gap:4,justifyContent:'flex-end'}}>
              <BtnProximo t={t}/>
              <button className="mt-btn" onClick={()=>tiraDaSemana(t.id)} title="Tirar deste sprint">tirar</button>
            </div>
          : <div className="row" style={{gap:4,justifyContent:'flex-end'}}>
              <button className="mt-btn forte" onClick={()=>soParaSemana(t.id)}
                title="Põe no sprint sem escolher quem faz">→ sprint</button>
              <select className="mt-sel" style={{width:118}} value="" onChange={e=>e.target.value&&paraSemana(t.id,e.target.value)}>
                <option value="">com…</option>
                {equipe.map(m=>{const liv=capDe(m)-horas(daPessoaTudo(m.id));
                  return <option key={m.id} value={m.id}>{m.name} · {liv>0?fmtHoras(liv)+'h livres':'sem folga'}</option>;})}
              </select>
            </div>}
      </td>}
    </tr>);
  };
  const Cabecalho=({com})=>(<thead><tr>
    <th>Tarefa</th><th style={{width:132}}>Cliente</th><th style={{width:104}}>Quem faz</th>
    <th style={{width:66,textAlign:'right'}}>Horas</th><th style={{width:86}}>Prazo</th>
    <th style={{width:46}}>Prior.</th>{!frozen&&<th style={{width:com||104}}></th>}
  </tr></thead>);

  /* A semana em texto puro — é o que se manda no grupo da equipe. */
  const textoDaSemana=()=>{
    const L=['SPRINT · '+fmtBR(sprint.start)+' a '+fmtBR(sprint.end)+'  (quinzena)',''];
    colunas.forEach(col=>{
      const m=col.membro, lista=col.itens, usado=horas(col.todas), cap=m?capDe(m):0;
      if(!m&&!lista.length) return;
      L.push(col.nome.toUpperCase()+(m? (' — '+fmtHoras(usado)+'h de '+cap+'h'
        +(usado>cap? ' (acima da capacidade)' : ' · '+fmtHoras(cap-usado)+'h livres'))
        : (' — '+fmtHoras(usado)+'h no sprint')));
      if(!lista.length) L.push('  (sem tarefas neste sprint)');
      lista.forEach(t=>L.push('  · '+t.name
        +(m&&t.proj? ' ['+t.proj.name+']' : '')
        +(!m? ' · '+(nomesResp(db,t)||'sem responsável') : '')
        +(t.estHoras? ' · '+fmtHoras(t.estHoras)+'h' : '')
        +(t.date? ' · até '+fmtBR(t.date) : '')
        +(m&&respsDe(t).length>1? ' · com '+respsDe(t).filter(x=>x!==m.id).map(x=>member(db,x).name).join(' e ') : '')));
      L.push('');
    });
    if(banco.length) L.push('NO BANCO (fora deste sprint): '+banco.length+' tarefa(s)');
    return L.join('\n');
  };
  const copiarTexto=()=>{
    const t=textoDaSemana();
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); flash('Distribuição copiada'); return; } }catch(e){}
    try{ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta); flash('Distribuição copiada');
    }catch(e){ flash('Não consegui copiar'); }
  };

  return (<div>
    {/* ---- barra de totais ---- */}
    <div className="card card-pad" style={{marginBottom:14}}>
      <div className="between" style={{flexWrap:'wrap',gap:14}}>
        <div className="row" style={{gap:26,flexWrap:'wrap'}}>
          <span className="stat-mini"><span className="n">{usadoTotal}h</span><span className="l">distribuídas</span></span>
          <span className="stat-mini"><span className="n" style={{color:'var(--text-3)'}}>{capTotal}h</span><span className="l">disponíveis na quinzena</span></span>
          <span className="stat-mini"><span className="n" style={{color:capTotal-usadoTotal<0?'var(--coral)':'var(--green)'}}>
            {capTotal-usadoTotal}h</span><span className="l">livres</span></span>
          <span className="stat-mini"><span className="n" style={{color:'var(--text-3)'}}>{banco.length}</span><span className="l">no banco</span></span>
        </div>
        <div className="row" style={{gap:12,flexWrap:'wrap',alignItems:'center',marginLeft:'auto'}}>
          <div className="muted" style={{fontSize:'.74rem',maxWidth:330}}>
            {semEstTotal>0
              ? <b style={{color:'var(--yellow)'}}>{semEstTotal} tarefa(s) no sprint sem estimativa de horas — elas não entram na conta.</b>
              : (vista==='quadro'
                  ? 'Arraste do banco para a coluna de cada consultor, ou use “atribuir a…”.'
                  : 'A mesma semana escrita, linha a linha — dá para conferir, ajustar e copiar.')}
          </div>
          <div className="seg-ctrl">
            <button className={porQuem==='pessoa'?'on':''} onClick={()=>setPorQuem('pessoa')}>Por quem faz</button>
            <button className={porQuem==='cliente'?'on':''} onClick={()=>setPorQuem('cliente')}>Por cliente</button>
          </div>
          <div className="seg-ctrl">
            <button className={vista==='quadro'?'on':''} onClick={()=>setVista('quadro')}>Quadro</button>
            <button className={vista==='lista'?'on':''} onClick={()=>setVista('lista')}>Lista escrita</button>
          </div>
          {vista==='lista'&&<button className="btn btn-ghost btn-sm" onClick={copiarTexto}
            title="Copia a distribuição em texto, para mandar no grupo">copiar texto</button>}
        </div>
      </div>
    </div>

    {vista==='lista'? (<div>
      {!colunas.length&&<div className="card card-pad" style={{marginBottom:12}}>
        <div className="empty" style={{padding:'18px 6px'}}>
          <b style={{display:'block',marginBottom:6}}>{porQuem==='cliente'?'Nenhum cliente na carteira':'Ninguém cadastrado ainda'}</b>
          O sprint é escrito por {porQuem==='cliente'?'cliente: cadastre um cliente em Clientes':'pessoa: cadastre a equipe para ter as seções'}.
          <div style={{marginTop:12}}>
            <button className="btn btn-primary btn-sm" onClick={()=>go(porQuem==='cliente'?'projects':'team')}>
              Ir para {porQuem==='cliente'?'Clientes':'Equipe'}</button>
          </div>
        </div>
      </div>}
      {/* ---- uma seção por coluna (pessoa ou cliente) ---- */}
      {colunas.map(col=>{
        const m=col.membro;
        const lista=col.itens, usado=horas(col.todas), cap=m?capDe(m):0;
        const livre=cap-usado, pct=cap?Math.min(100,usado/cap*100):0, estourou=!!(cap&&usado>cap);
        const faltaEst=semEst(col.todas);
        if(!m&&!lista.length) return null;        // cliente sem nada no sprint não ocupa espaço
        return (<div key={col.k} className="card" style={{marginBottom:12,overflow:'hidden'}}>
          <div className="dist-h">
            {m? <Avatar db={db} id={m.id} size="sm"/>
              : <span style={{width:12,height:12,borderRadius:'50%',background:col.cor,flex:'none'}}></span>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:'.88rem'}}>{col.nome}
                <span className="muted" style={{fontWeight:500,fontSize:'.73rem',marginLeft:7}}>
                  {m? (m.role||'Consultoria') : (col.todas.length+' tarefa(s) no sprint')}</span></div>
              {m&&<div className="bar-track" style={{marginTop:6,maxWidth:260}}>
                <div className="bar-fill" style={{width:pct+'%',background:estourou?'var(--coral)':(pct>85?'var(--yellow)':col.cor)}}></div></div>}
            </div>
            <div style={{textAlign:'right',flex:'none'}}>
              {m? <><div className="row" style={{gap:3,alignItems:'baseline',justifyContent:'flex-end'}}>
                  <span className="mono" style={{fontWeight:800,fontSize:'.95rem',color:estourou?'var(--coral)':'var(--text-1)'}}>{fmtHoras(usado)}</span>
                  <span className="muted" style={{fontSize:'.72rem'}}>/</span>
                  <input type="number" min="0" step="1" className="mt-cap" value={cap||''} disabled={frozen}
                    title={'Capacidade da quinzena · '+fmtHoras(capSemanal(m))+'h por semana'}
                    onChange={e=>setCapQuinzena(m.id,e.target.value)}/>
                  <span className="muted" style={{fontSize:'.72rem'}}>h</span>
                </div>
                <div className="muted" style={{fontSize:'.69rem',marginTop:2}}>
                  {estourou? <b style={{color:'var(--coral)'}}>{fmtHoras(usado-cap)}h além da capacidade</b>
                    : (livre>0? fmtHoras(livre)+'h livres' : 'sprint completo')}
                  {faltaEst>0&&<span style={{color:'var(--yellow)'}}> · {faltaEst} sem horas</span>}
                </div></>
                : <div className="mono" style={{fontWeight:800,fontSize:'.95rem'}}>{fmtHoras(usado)}h</div>}
            </div>
          </div>
          {lista.length? <div className="tbl-wrap"><table className="tbl dist">
              <Cabecalho/>
              <tbody>{lista.map(t=><LinhaDist key={t.id} t={t} naColuna/>)}</tbody>
            </table></div>
            : <div className="muted" style={{fontSize:'.78rem',padding:'14px 18px 4px'}}>
                Nada definido para {col.nome} neste sprint — escreva abaixo ou puxe do banco.</div>}
          {!frozen&&<div style={{padding:'10px 16px 13px'}}>
            <AddNoSprint sprint={sprint} quem={m?m.id:null} cliente={col.cliente?col.cliente.id:(col.k==='__geral'?'':(filtro.cli!=='Todos'&&filtro.cli!=='Gerais'?filtro.cli:null))} prio={filtro.prio!=='Todas'?filtro.prio:null}
              rotulo={'tarefa para '+col.nome.split(' ')[0]+' neste sprint'}/>
          </div>}
        </div>);})}

      {/* ---- banco ---- */}
      <div className="card" style={{overflow:'hidden'}}>
        <div className="dist-h">
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:'.88rem'}}>Banco de tarefas</div>
            <div className="muted" style={{fontSize:'.72rem'}}>em aberto, fora deste sprint</div>
          </div>
          <span className="muted" style={{fontSize:'.76rem'}}>{banco.length} · {fmtHoras(horas(banco))}h</span>
        </div>
        {banco.length? <div className="tbl-wrap" style={{maxHeight:460,overflowY:'auto'}}><table className="tbl dist">
            <Cabecalho com={150}/>
            <tbody>{banco.map(t=><LinhaDist key={t.id} t={t}/>)}</tbody>
          </table></div>
          : <div className="muted" style={{fontSize:'.78rem',padding:'16px 18px'}}>
              Banco vazio. Tarefas sem prazo aparecem aqui.</div>}
      </div>
    </div>) : (<div className="mt-grid">
      {/* ---- banco de tarefas ---- */}
      <div {...zona('banco',(t)=>tiraDaSemana(t.id))} className={"mt-banco"+(alvo==='banco'?' alvo':'')}>
        <div className="mt-h-col">
          <div className="between"><b style={{fontSize:'.88rem'}}>Banco de tarefas</b>
            <span className="muted" style={{fontSize:'.73rem'}}>{banco.length} · {fmtHoras(horas(banco))}h</span></div>
          <div className="muted" style={{fontSize:'.7rem',marginTop:5}}>em aberto, fora deste sprint — arraste ou use “→ sprint”</div>
        </div>
        <div className="mt-lista">
          {banco.map(t=><Cartao key={t.id} t={t}/>)}
          {!banco.length&&<div className="muted" style={{fontSize:'.78rem',padding:'14px 4px',textAlign:'center'}}>
            Banco vazio. Tarefas sem prazo aparecem aqui.</div>}
        </div>
      </div>

      {/* ---- uma coluna por consultor ---- */}
      {!colunas.length&&<div className="card card-pad" style={{alignSelf:'start'}}>
        <div className="empty" style={{padding:'20px 6px'}}>
          <b style={{display:'block',marginBottom:6}}>{porQuem==='cliente'?'Nenhum cliente na carteira':'Ninguém cadastrado ainda'}</b>
          A distribuição é por {porQuem==='cliente'?'cliente: cadastre um cliente em Clientes':'pessoa: cadastre a equipe para ter as colunas'}.
          <div style={{marginTop:12}}>
            <button className="btn btn-primary btn-sm" onClick={()=>go(porQuem==='cliente'?'projects':'team')}>
              Ir para {porQuem==='cliente'?'Clientes':'Equipe'}</button>
          </div>
          <div className="muted" style={{fontSize:'.73rem',marginTop:10}}>
            Importar uma planilha de sprint também cria as pessoas automaticamente.
          </div>
        </div>
      </div>}
      <div className="mt-cols">
        {colunas.map(col=>{
          const m=col.membro, cli=col.cliente;
          const lista=col.itens, usado=horas(col.todas);
          const cap=m? capDe(m) : 0;
          const livre=cap-usado, pct=cap?Math.min(100,usado/cap*100):0, estourou=!!(cap&&usado>cap);
          const faltaEst=semEst(col.todas);
          const soltar=(t)=> m? paraSemana(t.id,m.k||m.id)
            : update(d=>{ if(col.k!=='__geral'||t.projectId) moverParaCliente(d,t.id,col.k==='__geral'?null:col.k);
                mutateTask(d,t.id,x=>{ x.buildStart=sprint.start; x.buildEnd=sprint.end;
                  if(!x.date||x.date<sprint.start) x.date=sprint.end;
                  if(x.column==='backlog') x.column='andamento'; }); return d; });
          return (<div key={col.k} {...zona(col.k,soltar)}
            className={"mt-col"+(alvo===col.k?' alvo':'')+(estourou?' estourou':'')}>
            <div className="mt-h-col">
              <div className="row" style={{gap:8}}>
                {m? <Avatar db={db} id={m.id} size="sm"/>
                  : <span style={{width:11,height:11,borderRadius:'50%',background:col.cor,flex:'none'}}></span>}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:'.84rem'}}>{col.nome}</div>
                  <div className="muted" style={{fontSize:'.68rem'}}>
                    {m? (m.role||'Consultoria') : (col.todas.length+' no sprint')}</div>
                </div>
                {m? <div className="row" style={{gap:3,alignItems:'baseline'}}>
                    <span className="mono" style={{fontWeight:800,fontSize:'.85rem',color:estourou?'var(--coral)':'var(--text-1)'}}>{fmtHoras(usado)}</span>
                    <span className="muted" style={{fontSize:'.7rem'}}>/</span>
                    <input type="number" min="0" step="1" className="mt-cap" value={cap||''}
                      title={'Capacidade da quinzena · '+fmtHoras(capSemanal(m))+'h por semana'}
                      onChange={e=>setCapQuinzena(m.id,e.target.value)}/>
                    <span className="muted" style={{fontSize:'.7rem'}}>h</span>
                  </div>
                  : <span className="mono" style={{fontWeight:800,fontSize:'.85rem'}}>{fmtHoras(usado)}h</span>}
              </div>
              {m&&<><div className="bar-track" style={{marginTop:7}}>
                  <div className="bar-fill" style={{width:pct+'%',background:estourou?'var(--coral)':(pct>85?'var(--yellow)':col.cor)}}></div></div>
                <div className="muted" style={{fontSize:'.68rem',marginTop:4}}>
                  {estourou? <b style={{color:'var(--coral)'}}>{fmtHoras(usado-cap)}h além da capacidade</b>
                    : (livre>0? fmtHoras(livre)+'h livres' : 'sprint completo')}
                  {faltaEst>0&&<span style={{color:'var(--yellow)'}}> · {faltaEst} sem horas</span>}
                </div></>}
              {!m&&faltaEst>0&&<div className="muted" style={{fontSize:'.68rem',marginTop:4,color:'var(--yellow)'}}>
                {faltaEst} sem horas estimadas</div>}
            </div>
            <div className="mt-lista">
              {lista.map(t=><Cartao key={t.id} t={t} naColuna/>)}
              {!lista.length&&<div className="muted" style={{fontSize:'.74rem',padding:'12px 4px',textAlign:'center'}}>
                {frozen?'—':'Solte tarefas aqui'}</div>}
              {!frozen&&<AddNoSprint sprint={sprint} quem={m?m.id:null} cliente={cli?cli.id:(col.k==='__geral'?'':(filtro.cli!=='Todos'&&filtro.cli!=='Gerais'?filtro.cli:null))} prio={filtro.prio!=='Todas'?filtro.prio:null}
                compacto rotulo={m? ('tarefa para '+m.name.split(' ')[0]) : ('tarefa para '+col.nome.split(' ')[0])}/>}
            </div>
          </div>);})}
      </div>
    </div>)}
  </div>);
}

/* ============================================================
   IMPORTAR SPRINT DE PLANILHA (.xlsx)
   A planilha de sprint da casa tem sempre a mesma espinha:
   Cliente · Atividade · Responsável · Prazo · Duração (horas) · Observação,
   às vezes com Prioridade e Status, às vezes com duas tabelas lado a lado.
   Cada aba é um período (o nome traz as datas) e cada linha é uma tarefa.

   Um .xlsx é um zip de XMLs — e o navegador já sabe descompactar
   (DecompressionStream) e ler XML (DOMParser). Por isso a leitura cabe
   aqui dentro, sem biblioteca nenhuma: o sistema continua sendo um
   arquivo HTML só.
   ============================================================ */
function colDeRef(ref){
  let n=0;
  for(let i=0;i<ref.length;i++){ const c=ref.charCodeAt(i);
    if(c>=65&&c<=90) n=n*26+(c-64);
    else if(c>=97&&c<=122) n=n*26+(c-96);
    else break; }
  return n-1;
}
const pz=(n)=>String(n).padStart(2,'0');
const SERIAL_ZERO=Date.UTC(1899,11,30);
function dataDeSerial(n){
  const d=new Date(SERIAL_ZERO+Math.round(n*86400000));
  return d.getUTCFullYear()+'-'+pz(d.getUTCMonth()+1)+'-'+pz(d.getUTCDate());
}
/* Abre o zip: devolve {nome do arquivo: texto}. */
async function abrirZip(buf,querAbrir){
  const dv=new DataView(buf), td=new TextDecoder('utf-8');
  let eocd=-1;
  const piso=Math.max(0,buf.byteLength-66000);
  for(let i=buf.byteLength-22;i>=piso;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('Este arquivo não parece um .xlsx');
  const total=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  const entradas=[];
  for(let k=0;k<total;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const metodo=dv.getUint16(p+10,true);
    const comp=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    const off=dv.getUint32(p+42,true);
    entradas.push({nome:td.decode(new Uint8Array(buf,p+46,nl)),metodo,comp,off});
    p+=46+nl+el+cl;
  }
  const out={};
  for(const f of entradas){
    if(querAbrir&&!querAbrir(f.nome)) continue;
    if(dv.getUint32(f.off,true)!==0x04034b50) continue;
    const nl=dv.getUint16(f.off+26,true), el=dv.getUint16(f.off+28,true);
    const bytes=new Uint8Array(buf,f.off+30+nl+el,f.comp);
    if(f.metodo===0){ out[f.nome]=td.decode(bytes); continue; }
    if(typeof DecompressionStream!=='function') throw new Error('Este navegador não sabe abrir .xlsx — use o Chrome ou o Edge atualizado.');
    const fluxo=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    out[f.nome]=await new Response(fluxo).text();
  }
  return out;
}
/* Quais estilos de célula são data (para o número virar 06/10/2025). */
function estilosDeData(xml,dp){
  const nativos={14:1,15:1,16:1,17:1,18:1,19:1,20:1,21:1,22:1,45:1,46:1,47:1};
  if(!xml) return ()=>false;
  let doc; try{ doc=dp.parseFromString(xml,'application/xml'); }catch(e){ return ()=>false; }
  const proprios={};
  Array.from(doc.getElementsByTagName('numFmt')).forEach(n=>{
    const code=(n.getAttribute('formatCode')||'').toLowerCase()
      .replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,'');
    proprios[n.getAttribute('numFmtId')]=/[dy]/.test(code)?1:0;
  });
  const xfs=doc.getElementsByTagName('cellXfs')[0];
  const ids=xfs? Array.from(xfs.getElementsByTagName('xf')).map(x=>x.getAttribute('numFmtId')||'0') : [];
  return (s)=>{ const id=ids[+(s||0)]; return id===undefined? false : !!(nativos[+id]||proprios[id]); };
}
function linhasDaAba(doc,sst,ehData){
  const out=[];
  Array.from(doc.getElementsByTagName('row')).forEach(row=>{
    const r=+row.getAttribute('r')||(out.length+1);
    const linha=[];
    Array.from(row.getElementsByTagName('c')).forEach(c=>{
      const i=colDeRef(c.getAttribute('r')||'');
      if(i<0) return;
      const t=c.getAttribute('t')||'n';
      if(t==='inlineStr'){
        linha[i]=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join('');
        return;
      }
      const v=c.getElementsByTagName('v')[0];
      if(!v) return;
      const txt=v.textContent;
      if(t==='s'){ linha[i]=sst[+txt]||''; return; }
      if(t==='str'||t==='e'||t==='b'){ linha[i]=txt; return; }
      const num=parseFloat(txt);
      if(isFinite(num)&&num>20&&ehData(c.getAttribute('s'))) linha[i]=dataDeSerial(num);
      else linha[i]=isFinite(num)?num:txt;
    });
    out[r-1]=linha;
  });
  for(let i=0;i<out.length;i++) if(!out[i]) out[i]=[];
  return out;
}
const REL_NS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
async function lerXlsx(buf){
  const pega=(n)=>n==='xl/workbook.xml'||n==='xl/_rels/workbook.xml.rels'||n==='xl/sharedStrings.xml'
    ||n==='xl/styles.xml'||n.indexOf('xl/worksheets/')===0;
  const fs=await abrirZip(buf,pega);
  if(!fs['xl/workbook.xml']) throw new Error('Não achei a planilha dentro do arquivo');
  const dp=new DOMParser();
  const wb=dp.parseFromString(fs['xl/workbook.xml'],'application/xml');
  const alvos={};
  if(fs['xl/_rels/workbook.xml.rels']){
    const rl=dp.parseFromString(fs['xl/_rels/workbook.xml.rels'],'application/xml');
    Array.from(rl.getElementsByTagName('Relationship')).forEach(r=>{ alvos[r.getAttribute('Id')]=r.getAttribute('Target'); });
  }
  let sst=[];
  if(fs['xl/sharedStrings.xml']){
    const sx=dp.parseFromString(fs['xl/sharedStrings.xml'],'application/xml');
    sst=Array.from(sx.getElementsByTagName('si')).map(si=>
      Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join(''));
  }
  const ehData=estilosDeData(fs['xl/styles.xml'],dp);
  const abas=[];
  Array.from(wb.getElementsByTagName('sheet')).forEach((sh,i)=>{
    const nome=sh.getAttribute('name')||('Aba '+(i+1));
    const rid=sh.getAttributeNS(REL_NS,'id')||sh.getAttribute('r:id');
    let caminho=alvos[rid]||'';
    if(!caminho) caminho='worksheets/sheet'+(i+1)+'.xml';
    caminho=caminho.charAt(0)==='/'? caminho.slice(1) : (caminho.indexOf('xl/')===0? caminho : 'xl/'+caminho);
    const xml=fs[caminho]||fs['xl/worksheets/sheet'+(i+1)+'.xml'];
    if(!xml) return;
    abas.push({nome,linhas:linhasDaAba(dp.parseFromString(xml,'application/xml'),sst,ehData)});
  });
  return abas;
}

/* ---------------- da planilha para o vocabulário do sistema ---------------- */
const IMP_STATUS={'finalizado':'concluido','finalizada':'concluido','concluido':'concluido','concluído':'concluido',
  'concluida':'concluido','concluída':'concluido','feito':'concluido','ok':'concluido',
  'cancelado':'cancelado','cancelada':'cancelado',
  'em andamento':'andamento','andamento':'andamento','fazendo':'andamento','em execução':'andamento',
  'em espera':'backlog','espera':'backlog','a fazer':'backlog','pendente':'backlog','parado':'backlog','não iniciado':'backlog'};
const IMP_PRIO={'p1':'Alta','p2':'Média','p3':'Baixa','alta':'Alta','média':'Média','media':'Média',
  'baixa':'Baixa','urgente':'Alta','crítica':'Alta'};
/* Nomes que não são cliente: viram tarefa geral. */
const IMP_GERAL=['interno','geral','folga','feriado','ferias','férias','nortmont','equipe','administrativo'];
const semAcento=(s)=>String(s||'').normalize? String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'') : String(s||'');
const chaveImp=(s)=>semAcento(s).toLowerCase().replace(/\s+/g,' ').trim();

/* Lê a data de uma célula: já vem ISO quando a planilha marcou como data;
   quando vem texto, aceita dd/mm/aaaa e parentes. */
function dataDaCelula(v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v==='number') return v>20? dataDeSerial(v) : '';
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ let a=+m[3]; if(a<100) a+=2000; return a+'-'+pz(+m[2])+'-'+pz(+m[1]); }
  return '';
}
/* O nome da aba costuma trazer o período: "06.10-17.10", "2408 - 0409",
   "Sprint 20.04 - 0105". Daqui sai o período do sprint; o ano vem das
   datas das linhas. */
function periodoDoNome(nome,anoRef){
  const achados=String(nome||'').replace(/[–—]/g,'-').match(/\d{1,2}[.\/-]\d{1,2}(?!\d)|\d{4}(?!\d)/g);
  if(!achados||achados.length<2) return null;
  const par=(tk)=>{ const m=tk.match(/^(\d{1,2})[.\/-](\d{1,2})$/);
    if(m) return [+m[1],+m[2]];
    return [+tk.slice(0,2),+tk.slice(2)]; };
  const a=par(achados[0]), b=par(achados[1]);
  const ok=(x)=>x[0]>=1&&x[0]<=31&&x[1]>=1&&x[1]<=12;
  if(!ok(a)||!ok(b)) return null;
  const ano=anoRef||TODAY.getFullYear();
  const anoFim=(b[1]<a[1])? ano+1 : ano;
  return {ini:ano+'-'+pz(a[1])+'-'+pz(a[0]), fim:anoFim+'-'+pz(b[1])+'-'+pz(b[0])};
}

/* Acha o cabeçalho e os blocos de colunas — a planilha às vezes traz
   duas tabelas lado a lado, e cada uma é um bloco. */
function blocosDaAba(linhas){
  const lim=Math.min(linhas.length,30);
  for(let i=0;i<lim;i++){
    const h=(linhas[i]||[]).map(chaveImp);
    const inicios=[]; h.forEach((v,j)=>{ if(v==='cliente') inicios.push(j); });
    if(!inicios.length) continue;
    const blocos=[];
    inicios.forEach((ini,k)=>{
      const fim=(k+1<inicios.length)? inicios[k+1] : h.length;
      const m={cli:ini,resp:[]};
      for(let j=ini;j<=fim;j++){
        const c=h[j]; if(!c) continue;
        if(c==='atividade'||c==='tarefa'||c==='demanda'){ if(m.nome===undefined) m.nome=j; }
        else if(c.indexOf('respons')===0) m.resp.push(j);
        else if(c==='prazo'||c==='data'||c.indexOf('entrega')===0){ if(m.prazo===undefined) m.prazo=j; }
        else if(c.indexOf('duracao')===0||c==='horas'||c.indexOf('horas')>=0){ if(m.horas===undefined) m.horas=j; }
        else if(c.indexOf('observ')===0){ if(m.obs===undefined) m.obs=j; }
        else if(c==='status'||c.indexOf('situa')===0){ if(m.status===undefined) m.status=j; }
        else if(c.indexOf('priorid')>=0||c.indexOf('nivel de prior')>=0){ if(m.prio===undefined) m.prio=j; }
      }
      if(m.nome!==undefined) blocos.push(m);
    });
    if(blocos.length) return {cab:i,blocos};
  }
  return null;
}
/* Uma aba vira um lote: período, tarefas e quem aparece nelas. */
function loteDaAba(aba){
  const achado=blocosDaAba(aba.linhas);
  if(!achado) return null;
  const itens=[];
  for(let i=achado.cab+1;i<aba.linhas.length;i++){
    const L=aba.linhas[i]||[];
    achado.blocos.forEach(b=>{
      const nome=String(L[b.nome]===undefined?'':L[b.nome]).trim();
      if(!nome||chaveImp(nome)==='atividade'||chaveImp(nome)==='tarefa') return;
      const quem=[];
      b.resp.forEach(j=>{ const v=String(L[j]||'').trim(); if(v) quem.push(v); });
      itens.push({
        nome,
        cliente:String(L[b.cli]===undefined?'':L[b.cli]).trim(),
        quem,
        prazo:b.prazo===undefined?'':dataDaCelula(L[b.prazo]),
        horas:b.horas===undefined?0:(parseFloat(String(L[b.horas]).replace(',','.'))||0),
        obs:b.obs===undefined?'':String(L[b.obs]||'').trim(),
        status:b.status===undefined?'':String(L[b.status]||'').trim(),
        prio:b.prio===undefined?'':String(L[b.prio]||'').trim(),
        linha:i+1
      });
    });
  }
  if(!itens.length) return null;
  const datas=itens.map(x=>x.prazo).filter(Boolean).sort();
  /* ano de referência: o mais comum entre os prazos das linhas */
  const anos={}; datas.forEach(d=>{ anos[d.slice(0,4)]=(anos[d.slice(0,4)]||0)+1; });
  const anoRef=+Object.keys(anos).sort((a,b)=>anos[b]-anos[a])[0]||0;
  const per=periodoDoNome(aba.nome,anoRef);
  return {aba:aba.nome,itens,
          ini:(per&&per.ini)||datas[0]||'', fim:(per&&per.fim)||datas[datas.length-1]||'',
          doNome:!!per, comPrazo:datas.length,
          horas:itens.reduce((a,x)=>a+(+x.horas||0),0)};
}
/* O plano de importação: o que a planilha tem e como casa com a base. */
function planoDeImportacao(abas,db){
  const lotes=[]; const clientes={}; const pessoas={};
  abas.forEach(a=>{ const l=loteDaAba(a); if(l) lotes.push(l); });
  lotes.forEach(l=>l.itens.forEach(it=>{
    if(it.cliente){ const k=chaveImp(it.cliente);
      (clientes[k]=clientes[k]||{nome:it.cliente,n:0}).n++; }
    it.quem.forEach(q=>{ const k=chaveImp(q);
      (pessoas[k]=pessoas[k]||{nome:q,n:0}).n++; });
  }));
  /* sugestão de destino de cada cliente */
  const projs=(db.projects||[]).filter(p=>!p.archived);
  Object.keys(clientes).forEach(k=>{
    const c=clientes[k];
    if(IMP_GERAL.indexOf(k)>=0){ c.acao='geral'; return; }
    const p=projs.find(x=>chaveImp(x.name)===k)
      ||projs.find(x=>chaveImp(x.name).indexOf(k)===0||k.indexOf(chaveImp(x.name))===0);
    if(p){ c.acao='existente'; c.id=p.id; } else { c.acao='novo'; }
  });
  /* sugestão de quem é cada nome */
  const time=db.team||[];
  const todosIds=[];
  Object.keys(pessoas).forEach(k=>{
    const m=time.find(x=>chaveImp(x.name)===k)
      ||time.find(x=>chaveImp(x.name).split(' ')[0]===k.split(' ')[0]);
    if(m){ pessoas[k].ids=[m.id]; pessoas[k].acao='existente';
      if(todosIds.indexOf(m.id)<0) todosIds.push(m.id); }
    else { pessoas[k].ids=[]; pessoas[k].acao='novo'; }
  });
  /* "Ambos" e "Todos" significam o time daquela planilha */
  ['ambos','todos','todas','equipe','dupla','a dois'].forEach(k=>{
    if(pessoas[k]){ pessoas[k].coletivo=true; pessoas[k].acao='coletivo';
      if(!pessoas[k].ids.length) pessoas[k].ids=todosIds.slice(); }
  });
  return {lotes,clientes,pessoas};
}

/* O tipo não vem na planilha — dá para ler no nome, que é como o time escreve. */
function tipoPeloNome(nome){
  const s=chaveImp(nome);
  if(/reuniao|reuniões|call|alinhamento|apresentacao/.test(s)) return 'Reunião';
  if(/fechamento/.test(s)) return 'Fechamento';
  if(/analise|auditar|auditoria|conferencia|revisao/.test(s)) return 'Análise';
  if(/entrega|enviar|envio/.test(s)) return 'Entrega';
  if(/construcao|montar|montagem|criacao|criar|desenvolvimento|planilha|relatorio/.test(s)) return 'Documento';
  if(/pesquisa|estudar|levantamento|mapeamento/.test(s)) return 'Pesquisa';
  if(/ligar|ligacao|follow/.test(s)) return 'Ligação';
  return 'Outro';
}

/* ---------------- gravar na base ---------------- */
function corLivreDeCliente(d){
  const usadas=(d.projects||[]).map(p=>p.cor);
  return CORES_CLIENTE.find(c=>usadas.indexOf(c)<0)||CORES_CLIENTE[(d.projects||[]).length%CORES_CLIENTE.length];
}
/* Cliente criado pela importação nasce enxuto: nome, cor e o método.
   Entregáveis e tarefas-padrão ficam de fora para não inventar trabalho. */
function clienteDaImportacao(d,nome){
  /* se já existe cliente com esse nome, é ele — importar duas vezes não
     pode criar a mesma carteira de novo */
  const igual=(d.projects||[]).find(p=>chaveImp(p.name)===chaveImp(nome));
  if(igual) return igual.id;
  const hoje=hojeISO();
  const fim=isoDate(addDays(TODAY,320));
  const chefe=((d.team||[])[0]||{}).id||'';
  const p={id:'p'+uid(),num:Date.now()%10000,name:nome,importado:true,tier:(d.tiers||['Completo'])[0],
    tipo:(d.tipos||['Serviço'])[0],setor:(d.setores||['Varejo'])[0],perfil:'',cor:corLivreDeCliente(d),
    owner:'',phone:'',rota:'Estruturação',coordinator:chefe,manager:chefe,consultants:[chefe],
    phase:PHASES[0],status:'Em andamento',startDate:hoje,endDate:fim,
    marcos:marcoDates(hoje,fim),marcosReais:{1:'',2:'',3:'',4:''},realEnd:'',
    archived:false,archivedAt:'',pauses:[],deliverables:[],activities:[],actSeeded:true,
    feed:[{id:uid(),type:'sistema',title:'Cliente criado pela importação',
      description:'Entrou na carteira junto com as tarefas de uma planilha de sprint.',
      author:chefe,date:fmtBR(TODAY),links:[],attachments:[]}],
    links:{drive:'',agenda:'',juridico:'',apresentacao:'',manuais:'',outros:''},
    notes:'',bsc:null,ticket:0,horasPlan:0,matriz:matrizVazia()};
  d.projects.push(p);
  return p.id;
}
function pessoaDaImportacao(d,nome){
  const igual=(d.team||[]).find(m=>chaveImp(m.name)===chaveImp(nome));
  if(igual) return igual.id;
  const cor=CORES_CLIENTE[(d.team||[]).length%CORES_CLIENTE.length];
  const id='m'+uid();
  d.team.push({id,name:nome,importado:true,role:'Consultor(a)',color:cor,cap:40,capacity:40,email:'',perm:'editor'});
  return id;
}
/* Garante o sprint da quinzena de uma data. */
function garantirSprint(d,iso){
  const q=sprintDaData(iso, iso<isoDate(inicioDoSprint(TODAY)));
  const achado=(d.sprints||[]).find(s=>s.start===q.start);
  if(achado) return {novo:false,id:achado.id};
  d.sprints.push(q);
  return {novo:true,id:q.id};
}
/* Aplica o plano: cria o que falta e grava as tarefas. */
function aplicarImportacao(d,plano,cfg){
  const r={tarefas:0,repetidas:0,puladas:0,clientes:0,pessoas:0,sprints:0,semPrazo:0,
    /* o que ESTA importação criou — é o que o "desfazer" remove */
    ids:{tarefas:[],clientes:[],pessoas:[],sprints:[]}};
  const destino={};   // chave do cliente -> id do projeto (ou null = geral)
  const quemDe={};    // chave da pessoa  -> ids
  const coletivos=['ambos','todos','todas','equipe','dupla','a dois'];
  /* Cliente e pessoa só nascem quando uma tarefa escolhida precisa deles —
     importar uma aba não pode criar a carteira inteira da planilha. */
  const destinoDe=(k)=>{
    if(destino[k]!==undefined) return destino[k];
    const c=plano.clientes[k]||{nome:k};
    const esc={...c,...((cfg.clientes||{})[k]||{})};
    if(esc.acao==='ignorar') return (destino[k]='#ignorar');
    if(esc.acao==='geral') return (destino[k]=null);
    if(esc.acao==='existente'&&esc.id) return (destino[k]=esc.id);
    const antes=(d.projects||[]).length;
    destino[k]=clienteDaImportacao(d,c.nome||k);
    if((d.projects||[]).length>antes){ r.clientes++; r.ids.clientes.push(destino[k]); }
    return destino[k];
  };
  const idsDe=(k)=>{
    if(quemDe[k]!==undefined) return quemDe[k];
    const p=plano.pessoas[k]||{nome:k};
    const esc={...p,...((cfg.pessoas||{})[k]||{})};
    if(esc.acao==='novo'){
      const antes=(d.team||[]).length;
      quemDe[k]=[pessoaDaImportacao(d,p.nome||k)];
      if((d.team||[]).length>antes){ r.pessoas++; r.ids.pessoas.push(quemDe[k][0]); }
      return quemDe[k];
    }
    return (quemDe[k]=(esc.ids||[]).slice());
  };
  /* "Ambos" / "Todos" é o time daquela planilha: a soma de quem assina as
     outras linhas. Só vale quando ninguém escolheu outra coisa. */
  const uniao=()=>{ const u=[];
    Object.entries(quemDe).forEach(([k,ids])=>{ if(coletivos.indexOf(k)>=0) return;
      ids.forEach(id=>{ if(u.indexOf(id)<0) u.push(id); }); });
    return u; };
  /* o que já existe na base, para não duplicar */
  const jaTem={};
  allTasks(d).forEach(t=>{ jaTem[chaveImp(t.name)+'|'+(t.projectId||'')+'|'+(t.date||'')]=1; });

  (plano.lotes||[]).forEach(l=>{
    if(cfg.abas&&cfg.abas.indexOf(l.aba)<0) return;
    /* quem aparece nominalmente nesta aba — é o que "Ambos" quer dizer aqui */
    const equipeDaAba=[];
    l.itens.forEach(it=>it.quem.forEach(q=>{ const kq=chaveImp(q);
      if(coletivos.indexOf(kq)>=0) return;
      idsDe(kq).forEach(id=>{ if(equipeDaAba.indexOf(id)<0) equipeDaAba.push(id); }); }));
    l.itens.forEach(it=>{
      const col=IMP_STATUS[chaveImp(it.status)]||'backlog';
      if(!cfg.incluirFeitas&&(col==='concluido'||col==='cancelado')){ r.puladas++; return; }
      const pid=it.cliente? destinoDe(chaveImp(it.cliente)) : null;
      if(pid==='#ignorar'){ r.puladas++; return; }
      /* linha sem prazo: o fim do período da aba é a data honesta,
         porque é o prazo daquele sprint */
      const prazo=it.prazo||((cfg.prazoDoPeriodo!==false&&l.doNome)? l.fim : '');
      const chave=chaveImp(it.nome)+'|'+(pid||'')+'|'+(prazo||'');
      if(cfg.pularRepetidas!==false&&jaTem[chave]){ r.repetidas++; return; }
      jaTem[chave]=1;
      const quem=[];
      it.quem.forEach(q=>{ const kq=chaveImp(q);
        let ids=idsDe(kq);
        if(coletivos.indexOf(kq)>=0&&!ids.length) ids=(equipeDaAba.length>1)? equipeDaAba : uniao();
        ids.forEach(id=>{ if(quem.indexOf(id)<0) quem.push(id); }); });
      if(!prazo) r.semPrazo++;
      const t={id:uid(),projectId:pid||null,name:it.nome,
        type:tipoPeloNome(it.nome),
        assignees:quem,assignee:quem[0]||'',
        prio:IMP_PRIO[chaveImp(it.prio)]||'Média',
        column:col,sprintId:null,
        date:prazo||'',hora:'',durMin:0,
        buildStart:'',buildEnd:'',sessoes:{},
        estHoras:+it.horas||0,obs:it.obs||'',notes:'',
        peId:null,faseId:null,iniciativaId:null,deliverableId:'',
        cronoId:null,cronoFase:'',importadoDe:l.aba,criadaEm:hojeISO()};
      if(cfg.janelaDoPrazo&&prazo){ t.buildStart=prazo; t.buildEnd=prazo; }
      addTaskTo(d,t);
      r.ids.tarefas.push(t.id);
      if(prazo){ const g=garantirSprint(d,prazo); if(g.novo){ r.sprints++; r.ids.sprints.push(g.id); } }
      r.tarefas++;
    });
  });
  d.sprints.sort((a,b)=>a.start<b.start?-1:1);
  return r;
}

/* ------------------------------------------------------------
   EMPURRAR PARA O PRÓXIMO SPRINT
   Toda tarefa pode ser mandada para a quinzena seguinte — uma a uma,
   de qualquer tela. A tarefa ganha a janela do sprint de destino, perde
   os horários que ficaram para trás e guarda de onde veio: é a marca
   de "repassada", com a conta de quantas vezes já foi adiada.
   ------------------------------------------------------------ */
function sprintSeguinte(d,sp){
  const base=sp? dLocal(sp.start) : inicioDoSprint(TODAY);
  const prox=sprintDaData(addDays(base,SPRINT_DIAS));
  const achado=(d.sprints||[]).find(x=>x.start===prox.start);
  if(achado) return achado;
  d.sprints.push(prox);
  d.sprints.sort((a,b)=>a.start<b.start?-1:1);
  return prox;
}
/* Sprint em que a tarefa está hoje (ou o atual, se ela não tem janela). */
function sprintDaTarefaOuAtual(d,t){
  const sid=sprintDaTarefa(d,t);
  return (sid&&(d.sprints||[]).find(x=>x.id===sid))
    || (d.sprints||[]).find(x=>x.id===d.currentSprint)
    || sprintDaData(TODAY);
}
function empurrarTarefa(d,id){
  const t=allTasks(d).find(x=>x.id===id);
  if(!t) return null;
  /* "próximo" é sempre para a frente: tarefa atrasada, presa num sprint
     que já passou, pula direto para a quinzena seguinte à de hoje. */
  let base=sprintDaTarefaOuAtual(d,t);
  const atualDb=(d.sprints||[]).find(x=>x.id===d.currentSprint)||sprintDaData(TODAY);
  if(base.start<atualDb.start) base=atualDb;
  const atual=base;
  const destino=sprintSeguinte(d,atual);
  mutateTask(d,id,a=>{
    a.buildStart=destino.start; a.buildEnd=destino.end;
    if(!a.date||a.date<destino.start) a.date=destino.end;
    podaSessoes(a);
    if(a.column==='concluido'||a.column==='cancelado') a.column='andamento';
    a.carriedFrom=rotuloSprint(atual);
    a.carriedN=(+a.carriedN||0)+1;
  });
  return destino;
}
/* Botão pequeno, igual em toda tela que lista tarefa. */
function BtnProximo({t,compacto}){
  const {update,flash}=useDB();
  const vai=(e)=>{
    e.stopPropagation();
    let dest=null;
    update(d=>{ dest=empurrarTarefa(d,t.id); return d; });
    setTimeout(()=>flash(dest? ('"'+t.name.slice(0,28)+'" → sprint '+rotuloSprint(dest)) : 'Não consegui mover'),60);
  };
  return (<button className={"btn-prox"+(compacto?' cp':'')} onClick={vai}
    title={'Enviar para o próximo sprint'+((+t.carriedN||0)? ' · já repassada '+t.carriedN+'×' : '')}>↪</button>);
}
/* Etiqueta de quem veio empurrada do sprint anterior. */
function TagRepassada({t,mini}){
  if(!t.carriedFrom) return null;
  const n=+t.carriedN||1;
  return (<span className="tag-soft tag-rep" title={'Repassada do sprint '+t.carriedFrom+(n>1? ' · '+n+' vezes no total':'')}>
    ↩ {mini? '' : 'de '}{t.carriedFrom}{n>1&&<b> ·{n}×</b>}</span>);
}

/* ------------------------------------------------------------
   LIMPAR O QUE VEIO DA PLANILHA
   Toda tarefa importada guarda de qual aba veio (`importadoDe`), e o
   cliente ou a pessoa criados na hora ficam marcados com `importado`.
   Com isso dá para desfazer: ou uma importação específica (passando os
   ids que ela criou), ou tudo o que já entrou por planilha.
   O que a equipe mexeu depois é preservado — cliente que ganhou plano
   ou pessoa que já tem outra tarefa continuam na base.
   ------------------------------------------------------------ */
function contaImportados(db){
  const t=allTasks(db).filter(x=>x.importadoDe).length;
  const c=(db.projects||[]).filter(x=>x.importado).length;
  const m=(db.team||[]).filter(x=>x.importado).length;
  return {tarefas:t,clientes:c,pessoas:m,total:t+c+m};
}
function limparImportados(d,alvo){
  const r={tarefas:0,clientes:0,pessoas:0,sprints:0,mantidos:0};
  const saiTarefa=(t)=>!!t.importadoDe&&(!alvo||alvo.tarefas.indexOf(t.id)>=0);
  (d.projects||[]).forEach(p=>{
    const antes=(p.activities||[]).length;
    p.activities=(p.activities||[]).filter(t=>!saiTarefa(t));
    r.tarefas+=antes-p.activities.length;
  });
  const antesT=(d.tasks||[]).length;
  d.tasks=(d.tasks||[]).filter(t=>!saiTarefa(t));
  r.tarefas+=antesT-d.tasks.length;

  /* cliente criado pela importação só sai se não sobrou nada dele */
  d.projects=(d.projects||[]).filter(p=>{
    if(!p.importado) return true;
    if(alvo&&alvo.clientes.indexOf(p.id)<0) return true;
    const vazio=!(p.activities||[]).length&&!(p.deliverables||[]).length
      &&!(p.matriz&&Object.keys(p.matriz.marcados||{}).length)&&!(p.cronoDoc&&(p.cronoDoc.tasks||[]).length);
    if(vazio){ r.clientes++; return false; }
    delete p.importado;                 // sobreviveu porque tem conteúdo próprio: agora é da casa
    r.mantidos++; return true;
  });

  /* pessoa criada pela importação só sai se não aparece em mais nada */
  const usados={};
  allTasks(d).forEach(t=>respsDe(t).forEach(w=>{ usados[w]=1; }));
  (d.projects||[]).forEach(p=>{ if(p.coordinator) usados[p.coordinator]=1;
    if(p.manager) usados[p.manager]=1; (p.consultants||[]).forEach(c=>{ usados[c]=1; }); });
  d.team=(d.team||[]).filter(m=>{
    if(!m.importado) return true;
    if(alvo&&alvo.pessoas.indexOf(m.id)<0) return true;
    if(usados[m.id]){ delete m.importado; r.mantidos++; return true; }
    r.pessoas++; return false;
  });

  /* quinzena que ficou sem tarefa nenhuma vai junto — menos a atual */
  const restantes=allTasks(d);
  d.sprints=(d.sprints||[]).filter(sp=>{
    if(sp.id===d.currentSprint) return true;
    if(alvo&&alvo.sprints.indexOf(sp.id)<0) return true;
    if(restantes.some(t=>taskEmSprint(t,sp))) return true;
    r.sprints++; return false;
  });
  if(!d.sprints.length) d.sprints=[sprintDaData(TODAY)];
  if(!d.sprints.some(x=>x.id===d.currentSprint)) d.currentSprint=d.sprints[d.sprints.length-1].id;
  return r;
}

/* ------------------------------------------------------------
   IMPORTAR SPRINT · a tela
   Três passos: escolher o arquivo, conferir o que vai entrar e importar.
   A conferência é o coração: a planilha fala "AÇAÍ" e "Ambos", e aqui se
   decide o que isso quer dizer na base — qual cliente, quais pessoas.
   ------------------------------------------------------------ */
function ImportarSprintModal({close}){
  const {db,update,flash,go}=useDB();
  const [passo,setPasso]=useState('arquivo');
  const [lendo,setLendo]=useState(false);
  const [erro,setErro]=useState('');
  const [arquivo,setArquivo]=useState('');
  const [plano,setPlano]=useState(null);
  const [abas,setAbas]=useState([]);
  const [cliCfg,setCliCfg]=useState({});
  const [pesCfg,setPesCfg]=useState({});
  const [op,setOp]=useState({incluirFeitas:true,pularRepetidas:true,prazoDoPeriodo:true});
  const [res,setRes]=useState(null);
  const inputRef=useRef(null);
  const [sobre,setSobre]=useState(false);

  const projs=useMemo(()=>(db.projects||[]).filter(p=>!p.archived),[db.projects]);

  const ler=async(f)=>{
    if(!f) return;
    setErro(''); setLendo(true); setArquivo(f.name);
    try{
      const buf=await f.arrayBuffer();
      const folhas=await lerXlsx(buf);
      const pl=planoDeImportacao(folhas,db);
      if(!pl.lotes.length){ setErro('Não achei nenhuma tabela de sprint aqui. A planilha precisa ter uma linha de cabeçalho com Cliente e Atividade.'); setLendo(false); return; }
      /* vêm marcadas as abas que tocam os últimos dois meses e o que vem pela frente */
      const piso=isoDate(addDays(TODAY,-60)), teto=isoDate(addDays(TODAY,120));
      let marcadas=pl.lotes.filter(l=>l.fim&&l.fim>=piso&&l.ini<=teto).map(l=>l.aba);
      if(!marcadas.length) marcadas=pl.lotes.slice(-3).map(l=>l.aba);
      setPlano(pl); setAbas(marcadas);
      setCliCfg({}); setPesCfg({}); setPasso('conferir');
    }catch(e){ setErro(e&&e.message||'Não consegui ler este arquivo.'); }
    setLendo(false);
  };

  const cliDe=(k)=>({...(plano.clientes[k]||{}),...(cliCfg[k]||{})});
  const pesDe=(k)=>({...(plano.pessoas[k]||{}),...(pesCfg[k]||{})});
  const setCli=(k,v)=>setCliCfg(x=>({...x,[k]:{...(x[k]||{}),...v}}));
  const setPes=(k,v)=>setPesCfg(x=>({...x,[k]:{...(x[k]||{}),...v}}));

  /* quanto vai entrar, pela conta de agora */
  const previsao=useMemo(()=>{
    if(!plano) return {n:0,horas:0};
    let n=0,horas=0;
    plano.lotes.forEach(l=>{ if(abas.indexOf(l.aba)<0) return;
      l.itens.forEach(it=>{
        const col=IMP_STATUS[chaveImp(it.status)]||'backlog';
        if(!op.incluirFeitas&&(col==='concluido'||col==='cancelado')) return;
        const c=it.cliente? cliDe(chaveImp(it.cliente)) : null;
        if(c&&c.acao==='ignorar') return;
        n++; horas+=+it.horas||0;
      });
    });
    return {n,horas};
  },[plano,abas,op,cliCfg]);

  const novosClientes=useMemo(()=>!plano?0:
    Object.keys(plano.clientes).filter(k=>cliDe(k).acao==='novo').length,[plano,cliCfg]);
  const novasPessoas=useMemo(()=>!plano?0:
    Object.keys(plano.pessoas).filter(k=>pesDe(k).acao==='novo').length,[plano,pesCfg]);

  const importar=()=>{
    const cfg={abas,clientes:{},pessoas:{},...op};
    Object.keys(plano.clientes).forEach(k=>cfg.clientes[k]=cliDe(k));
    Object.keys(plano.pessoas).forEach(k=>cfg.pessoas[k]=pesDe(k));
    const saida={};
    update(d=>{ Object.assign(saida,aplicarImportacao(d,plano,cfg)); return d; });
