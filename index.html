   MÓDULO 7 — CALENDÁRIO
   ============================================================ */
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function CalendarPage(){
  const {db,go,update,flash}=useDB();
  const [vista,setVista]=useState('mes');          // mes | semana | dia
  const [cursor,setCursor]=useState(new Date(TODAY.getFullYear(),TODAY.getMonth(),1));
  const [selDay,setSelDay]=useState(isoDate(TODAY));
  const [agenda,setAgenda]=useState('');
  const [verTudo,setVerTudo]=useState(false);   // expande o bloco "sem horário" da visão Dia
  /* Filtros do calendário: quem, de qual cliente e que tipo de compromisso.
     Valem para todas as visões e para o painel do dia. */
  const [filtro,setFiltro]=useState({resp:'Todos',cli:'Todos',tipo:'Todos'});
  /* A cor pode contar duas histórias: de quem é o trabalho (cliente) ou
     quem vai fazer (pessoa). A escolha fica lembrada para a próxima visita. */
  const [corPor,setCorPor]=useState(()=>{ try{return localStorage.getItem(LS_KEY+':calcor')||'cliente';}catch(e){return 'cliente';} });
  useEffect(()=>{ try{localStorage.setItem(LS_KEY+':calcor',corPor);}catch(e){} },[corPor]);
  const corDaPessoa=(id)=>(member(db,id)||{}).color||'#4a5a5c';
  const fSet=(k,v)=>setFiltro(x=>({...x,[k]:v}));
  const filtroAtivo=filtro.resp!=='Todos'||filtro.cli!=='Todos'||filtro.tipo!=='Todos';
  const passaFiltro=(x)=>{
    /* a tarefa de duas pessoas aparece na agenda das duas */
    if(filtro.resp!=='Todos' && (x.whos||(x.who?[x.who]:[])).indexOf(filtro.resp)<0) return false;
    if(filtro.cli==='Gerais'){ if(x.pid) return false; }
    else if(filtro.cli!=='Todos' && x.pid!==filtro.cli) return false;
    return true;
  };
  const [novaTarefa,setNovaTarefa]=useState(null);
  /* Formulário em branco: o botão do cabeçalho não amarra nenhuma data.
     Quando vem de um dia ou de uma faixa de horário, aí sim já chega preenchido. */
  const abrirNova=(iso,hora)=>setNovaTarefa({
    name:'',type:hora?'Reunião':'Outro',assignee:(db.team[0]||{}).id||'',
    projectId:'',peId:'',faseId:'',deliverableId:'',
    date:iso||'', buildStart:iso||'', buildEnd:iso||'',
    hora:hora||'', durMin:60, estHoras:1, obs:'',
    prio:'Média', notes:'', column:'backlog', sprintId:null, sessoes:{}});
  const criarTarefa=(nova)=>{ update(d=>{addTaskTo(d,nova);return d;});
    flash('"'+nova.name+'" adicionada'+(nova.date?' em '+fmtBR(nova.date):'')); setNovaTarefa(null); };

  /* Clicar num compromisso abre a própria tarefa para edição. */
  const abrirTarefa=(id)=>{
    const t=allTasks(db).find(x=>x.id===id); if(!t) return;
    const {proj,origem,...limpo}=t;
    setNovaTarefa({...limpo,projectId:t.projectId||'',peId:t.peId||'',faseId:t.faseId||''});
  };
  const salvarTarefa=(t)=>{
    const existe=allTasks(db).some(x=>x.id===t.id);
    if(!existe) return criarTarefa(t);
    update(d=>{ mutateTask(d,t.id,alvo=>{ Object.keys(t).forEach(k=>{ if(k!=='id') alvo[k]=t[k]; }); }); return d; });
    flash('"'+t.name+'" atualizada'); setNovaTarefa(null);
  };
  // painel lateral de detalhes: recolhível, com a preferência guardada
  const [painel,setPainel]=useState(()=>{ try{return localStorage.getItem(LS_KEY+':calpainel')!=='0';}catch(e){return true;} });
  useEffect(()=>{ try{localStorage.setItem(LS_KEY+':calpainel',painel?'1':'0');}catch(e){} },[painel]);
  const [arrasto,setArrasto]=useState(null);    // tarefa sendo arrastada
  const [alvo,setAlvo]=useState('');            // dia/faixa sob o cursor

  /* ---------- EVENTOS: entregas, reuniões e marcos ---------- */
  const events=useMemo(()=>{const ev=[];
    // Toda tarefa com PRAZO DE ENTREGA vira um evento vermelho no calendário.
    (db.tasks||[]).forEach(t=>{ if(t.date) ev.push({id:t.id,tid:t.id,date:t.date,kind:'entrega',title:t.name,proj:'Tarefa geral',pid:null,
      cor:CINZA_GERAL,who:t.assignee,whos:respsDe(t),feito:t.column==='concluido',hora:t.hora||'',durMin:+t.durMin||0}); });
    // Horários reservados dentro da janela de construção viram compromissos azuis.
    allTasks(db).forEach(t=>{
      Object.entries(t.sessoes||{}).forEach(([iso,se])=>{ if(!se||!se.hora) return;
        ev.push({id:t.id+'@'+iso,tid:t.id,sess:iso,date:iso,kind:'trabalho',title:t.name,
          cor:t.proj?corDoCliente(t.proj):CINZA_GERAL,
          proj:t.proj?t.proj.name:'Tarefa geral',pid:t.proj?t.proj.id:null,
          who:t.assignee,whos:respsDe(t),feito:t.column==='concluido',hora:se.hora,durMin:+se.durMin||0}); });
    });
    ativos(db).forEach(p=>{
      (p.activities||[]).forEach(a=>ev.push({id:a.id,tid:a.id,date:a.date,kind:a.type==='Reunião'?'reuniao':'entrega',title:a.name,proj:p.name,pid:p.id,
        cor:corDoCliente(p),who:a.assignee,whos:respsDe(a),feito:a.column==='concluido',hora:a.hora||'',durMin:+a.durMin||0}));
      const mk=getMarcos(p);
      [1,2,3,4].forEach(m=>ev.push({id:p.id+'m'+m,tid:null,date:mk[m],kind:'marco',title:'Marco '+m+' · '+p.name,proj:p.name,pid:p.id,cor:corDoCliente(p),hora:'',durMin:0}));
    });return ev;},[db.projects,db.tasks]);

  /* ---------- PRAZOS DE CONSTRUÇÃO (faixas azuis) ---------- */
  const obras=useMemo(()=>allTasks(db).map(t=>{
    const w=taskWindow(t);
    if(!w.ini||!w.fim||!t.buildStart) return null;
    return {id:t.id,nome:t.name,ini:w.ini,fim:w.fim,who:t.assignee,whos:respsDe(t),ses:t.sessoes||{},
            cor:t.proj?corDoCliente(t.proj):CINZA_GERAL,
            proj:t.proj?t.proj.name:'Tarefa geral',pid:t.proj?t.proj.id:null,feito:t.column==='concluido'};
  }).filter(Boolean),[db]);
  /* Uma janela de construção é um compromisso do tipo "construção";
     por isso ela some quando o filtro pede só reuniões, por exemplo. */
  const obrasDoDia=(iso)=>obras.filter(o=>o.ini<=iso&&o.fim>=iso)
    .filter(o=>passaFiltro(o)&&(filtro.tipo==='Todos'||filtro.tipo==='construcao'));
  const evOfISO=(iso)=>events.filter(e=>e.date===iso)
    .filter(e=>passaFiltro(e)&&(filtro.tipo==='Todos'||filtro.tipo===e.kind
      /* "prazo de construção" é a barra E as horas reservadas nela */
      ||(filtro.tipo==='construcao'&&e.kind==='trabalho')));
  // ordena por horário; quem não tem hora vai para o fim
  const porHora=(a,b)=>{const x=minDaHora(a.hora), y=minDaHora(b.hora);
    if(x===null&&y===null) return 0; if(x===null) return 1; if(y===null) return -1; return x-y;};

  /* ------------------------------------------------------------
     ARRASTAR PARA REAGENDAR
     Só compromissos ligados a uma tarefa podem ser movidos (marcos de
     projeto não). Ao soltar em outro dia, a tarefa anda o mesmo número
     de dias: prazo de entrega e janela de construção se deslocam juntos,
     preservando a duração original.
     ------------------------------------------------------------ */
  const podeArrastar=(e)=> e.kind!=='marco' && !!(e.tid||e.id);
  const diasEntre=(a,b)=>Math.round((dLocal(b)-dLocal(a))/86400000);
  // desloca a tarefa inteira (entrega + janela) pelo número de dias entre origem e destino
  const soltarNoDiaDe=(a,iso)=>{
    if(!a||!iso||iso===a.date) return;
    if(a.sess){   // horário de trabalho só se move dentro da própria janela
      const tarefa=allTasks(db).find(x=>x.id===a.id);
      if(!tarefa || diasDaJanela(tarefa).indexOf(iso)<0){
        flash('Esse dia está fora do prazo de construção de "'+a.title+'"'); return; }
      update(d=>{ mutateTask(d,a.id,t=>{
        t.sessoes=t.sessoes||{}; t.sessoes[iso]=t.sessoes[a.sess]; delete t.sessoes[a.sess];
      }); return d; });
      flash('Trabalho em "'+a.title+'" movido para '+fmtBR(iso));
      return;
    }
    const delta=diasEntre(a.date,iso);
    update(d=>{ mutateTask(d,a.id,t=>{
      const mv=(v)=> v? isoDate(addDays(dLocal(v),delta)) : v;
      if(a.obra){ t.buildStart=mv(t.buildStart); t.buildEnd=mv(t.buildEnd); t.date=mv(t.date); }
      else { t.date=iso; t.buildStart=mv(t.buildStart); t.buildEnd=mv(t.buildEnd); }
    }); return d; });
    flash('"'+a.title+'" '+(a.obra?'reprogramada · janela deslocada '+(delta>0?'+':'')+delta+(Math.abs(delta)===1?' dia':' dias'):'movida para '+fmtBR(iso)));
  };
  const soltarNoDia=(iso)=>{
    setAlvo('');
    const a=arrasto; setArrasto(null);
    soltarNoDiaDe(a,iso);
  };
  /* Arrastar dentro da grade da semana: muda o dia E a hora de uma vez. */
  const soltarNoDiaHora=(iso,h)=>{
    setAlvo('');
    const a=arrasto; setArrasto(null);
    if(!a) return;
    if(a.obra){ soltarNoDiaDe(a,iso); return; }
    const nova=String(h).padStart(2,'0')+':00';
    if(a.sess){
      const tarefa=allTasks(db).find(x=>x.id===a.id);
      if(!tarefa || diasDaJanela(tarefa).indexOf(iso)<0){
        flash('Esse dia está fora do prazo de construção de "'+a.title+'"'); return; }
      update(d=>{ mutateTask(d,a.id,t=>{ t.sessoes=t.sessoes||{};
        const antiga=t.sessoes[a.sess]||{durMin:60};
        delete t.sessoes[a.sess]; t.sessoes[iso]={hora:nova,durMin:antiga.durMin||60}; }); return d; });
      flash('Trabalho em "'+a.title+'" movido para '+fmtBR(iso)+' às '+nova); return;
    }
    update(d=>{ mutateTask(d,a.id,t=>{ t.date=iso; t.hora=nova; if(!t.durMin) t.durMin=60; }); return d; });
    flash('"'+a.title+'" movida para '+fmtBR(iso)+' às '+nova);
  };
  const soltarNaHora=(h)=>{
    setAlvo('');
    const a=arrasto; setArrasto(null);
    if(!a) return;
    if(a.obra){ soltarNoDiaDe(a,selDay); return; }   // faixa de construção não recebe horário
    const nova=String(h).padStart(2,'0')+':00';
    if(a.sess){   // é um horário de trabalho: muda só a hora daquele dia
      update(d=>{ mutateTask(d,a.id,t=>{ t.sessoes=t.sessoes||{};
        t.sessoes[a.sess]={hora:nova,durMin:(t.sessoes[a.sess]&&t.sessoes[a.sess].durMin)||60}; }); return d; });
      flash('Trabalho em "'+a.title+'" movido para '+nova); return;
    }
    update(d=>{ mutateTask(d,a.id,t=>{ t.date=selDay; t.hora=nova; if(!t.durMin) t.durMin=60; }); return d; });
    flash('"'+a.title+'" movida para '+nova);
  };
  /* Faixa de construção: arrasta a JANELA inteira. O dia em que o usuário
     pegou a barra é a referência, então a janela desliza preservando a duração. */
  const propsArrasteObra=(o,isoPego)=>({
    draggable:true,
    onDragStart:(ev)=>{ ev.stopPropagation(); setArrasto({id:o.id,title:o.nome,date:isoPego,obra:true});
      try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',o.id);}catch(x){} },
    onDragEnd:()=>{ setArrasto(null); setAlvo(''); },
    className:(arrasto&&arrasto.id===o.id&&arrasto.obra)?'arrastando':''
  });
  const propsArraste=(e)=> podeArrastar(e)? {
    draggable:true,
    onDragStart:(ev)=>{ ev.stopPropagation(); setArrasto({...e,id:e.tid||e.id}); try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',e.id);}catch(x){} },
    onDragEnd:()=>{ setArrasto(null); setAlvo(''); },
    className:(arrasto&&arrasto.id===e.id)?'arrastando':''
  } : {};
  const propsAlvo=(chave,aoSoltar)=>({
    onDragOver:(ev)=>{ if(!arrasto) return; ev.preventDefault(); if(alvo!==chave) setAlvo(chave); },
    onDragLeave:()=>{ if(alvo===chave) setAlvo(''); },
    onDrop:(ev)=>{ ev.preventDefault(); ev.stopPropagation(); aoSoltar(); }
  });

  const KIND_C={reuniao:'#0F4245',atividade:'#3F598C',marco:'#B33A3A',geral:'#2F8F6E',entrega:'#B33A3A',trabalho:'#3F598C'};
  // A cor é do CLIENTE; a forma continua dizendo o tipo do compromisso.
  /* Quem aparece: com um responsável filtrado, é ele que dá a cor. */
  const quemEv=(x)=>{ const l=x.whos||(x.who?[x.who]:[]);
    if(filtro.resp!=='Todos' && l.indexOf(filtro.resp)>=0) return filtro.resp;
    return l[0]||x.who; };
  const nomesEv=(x)=>(x.whos||(x.who?[x.who]:[])).map(w=>member(db,w).name).join(' + ');
  const corEv=(e)=> corPor==='pessoa'? corDaPessoa(quemEv(e)) : (e.cor || KIND_C[e.kind] || '#4a5a5c');
  const corObra=(o)=> corPor==='pessoa'? corDaPessoa(quemEv(o)) : o.cor;
  /* Choques de agenda do dia: dois compromissos da mesma pessoa no mesmo horário. */
  const conflitosCache=useMemo(()=>({}),[db]);
  const conflitos=(iso)=>{ if(!conflitosCache[iso]) conflitosCache[iso]=conflitosDoDia(db,iso); return conflitosCache[iso]; };
  const emConflito=(e)=>{ const c=conflitos(e.date); return c.has(e.sess? e.tid+'@'+e.sess : e.id); };
  const KIND_L={reuniao:'Reunião',marco:'Marco',entrega:'Entrega',atividade:'Atividade',geral:'Tarefa',trabalho:'Trabalho'};
  const ehUtilISO=(iso)=>{const d=dLocal(iso); return ((d.getDay()+6)%7)<5;};

  /* ---------- navegação: o passo muda conforme a visão ---------- */
  const y=cursor.getFullYear(),mo=cursor.getMonth();
  const semanaDias=useMemo(()=>{const seg=mondayOf(dLocal(selDay)); return [0,1,2,3,4].map(i=>isoDate(addDays(seg,i)));},[selDay]);
  const andar=(n)=>{
    if(vista==='mes'){ setCursor(new Date(y,mo+n,1)); return; }
    const passo=vista==='semana'?7:1;
    let d=dLocal(selDay);
    do{ d=addDays(d,passo*(n>0?1:-1)); }while(vista==='dia'&&!ehUtilISO(isoDate(d)));   // no modo dia, pula o fim de semana
    setSelDay(isoDate(d)); setCursor(new Date(d.getFullYear(),d.getMonth(),1));
  };
  const hojeBtn=()=>{ setSelDay(isoDate(TODAY)); setCursor(new Date(TODAY.getFullYear(),TODAY.getMonth(),1)); };
  const titulo=vista==='mes'? (MES[mo]+' '+y)
    : vista==='semana'? (fmtBR(semanaDias[0])+' — '+fmtBR(semanaDias[4]))
    : fmtBR(selDay);

  /* ---------- grade do mês (só dias úteis) ---------- */
  const days=new Date(y,mo+1,0).getDate();
  const ehUtil=(d)=>((new Date(y,mo,d).getDay()+6)%7)<5;
  const cells=[];
  let d1=1; while(d1<=days && !ehUtil(d1)) d1++;
  const col1=(new Date(y,mo,d1).getDay()+6)%7;
  for(let i=0;i<col1;i++) cells.push(null);
  for(let d=d1;d<=days;d++) if(ehUtil(d)) cells.push(d);

  /* ---------- cartão de evento reutilizado nas visões ---------- */
  const EvCard=({e,mini})=>{ const ar=propsArraste(e); return (
    <div {...ar} className={"ag-ev "+(ar.className||'')} style={{borderLeftColor:corEv(e)}}
      onClick={()=>{ if(e.tid) abrirTarefa(e.tid); else if(e.pid) go('projects',e.pid); }}
      title={podeArrastar(e)?'Clique para editar · arraste para reagendar':undefined}>
      <div className="row" style={{gap:6,alignItems:'baseline'}}>
        {e.hora&&<span className="mono" style={{fontSize:'.7rem',fontWeight:700,color:corEv(e)}}>{e.hora}</span>}
        <span style={{fontSize:mini?'.74rem':'.82rem',fontWeight:600,textDecoration:e.feito?'line-through':'none',flex:1}}>{e.title}</span>
      </div>
      <div className="muted" style={{fontSize:'.7rem'}}>
        {KIND_L[e.kind]}{e.durMin?' · '+fmtDur(e.durMin):''}{e.hora&&e.durMin?' (até '+horaDeMin(minDaHora(e.hora)+e.durMin)+')':''} · {e.proj}
        {nomesEv(e)?' · '+nomesEv(e):''}</div>
    </div>);};

  /* ---------- VISÃO MÊS ---------- */
  const vistaMes=(
    <div className="cal-grid">{['Seg','Ter','Qua','Qui','Sex'].map(d=><div key={d} className="cal-dow">{d}</div>)}
      {cells.map((d,i)=>{if(!d)return <div key={i} className="cal-cell empty"></div>;
        const iso=isoDate(new Date(y,mo,d));const evs=evOfISO(iso).slice().sort(porHora);const isToday=iso===isoDate(TODAY);
        const ents=evs.filter(e=>e.kind==='entrega');
        const outros=evs.filter(e=>e.kind!=='entrega');
        const bars=obrasDoDia(iso);
        return(<div key={i} {...propsAlvo(iso,()=>soltarNoDia(iso))}
          className={"cal-cell "+(selDay===iso?'sel':'')+(isToday?' today':'')+(ents.length?' tem-entrega':'')+(alvo===iso?' alvo':'')}
          onClick={()=>setSelDay(iso)} onDoubleClick={()=>{setSelDay(iso);abrirNova(iso,'');}}>
          <span className="cal-d">{d}</span>
          <div className="cal-bars">
            {bars.slice(0,3).map(o=>{
              const i0=o.ini===iso, f0=o.fim===iso;
              const cls=(i0&&f0)?'solo':(i0?'ini':(f0?'fim':'meio'));
              const ar=propsArrasteObra(o,iso);
              return <div key={o.id} {...ar} className={"cal-bar "+cls+(o.feito?' done':'')+(ar.className?' '+ar.className:'')}
                style={{background:o.feito?'#9fb8ad':corObra(o)}}
                onClick={(ev)=>{ev.stopPropagation(); abrirTarefa(o.id);}}
                title={o.proj+' · '+o.nome+' · construção '+fmtBR(o.ini)+' → '+fmtBR(o.fim)+' — clique para editar'}>{i0?o.nome:'\u00a0'}</div>;})}
            {bars.length>3&&<span className="cal-bar-mais">+{bars.length-3} em construção</span>}
          </div>
          {ents.slice(0,2).map((e,j)=>{const ar=propsArraste(e); const c=corEv(e); return (
            <span key={'e'+j} {...ar} className={"cal-entrega "+(ar.className||'')}
              style={{color:c,background:c+'14'}} onClick={(ev)=>{ev.stopPropagation(); e.tid&&abrirTarefa(e.tid);}}
              title={e.proj+' · Entrega: '+e.title+' — clique para editar'}>▲ {e.hora?e.hora+' ':''}{e.title}</span>);})}
          {ents.length>2&&<span className="cal-bar-mais" style={{color:'var(--red)'}}>+{ents.length-2} entregas</span>}
          <div className="cal-evs">{outros.slice(0,3).map((e,j)=>{const ar=propsArraste(e); return (
            <span key={j} {...ar} className={"cal-ev "+(ar.className||'')} style={{background:corEv(e)}}
              onClick={(ev)=>{ev.stopPropagation(); e.tid?abrirTarefa(e.tid):(e.pid&&go('projects',e.pid));}}
              title={e.proj+' · '+e.title+(e.tid?' — clique para editar':'')}></span>);})}{outros.length>3&&<span className="cal-more">+{outros.length-3}</span>}</div>
        </div>);})}
    </div>);

  /* ---------- VISÃO SEMANA: grade de horários, no modelo de agenda ----------
     Cinco colunas de dias úteis sobre uma régua de horas. Compromissos com
     horário ficam posicionados pelo relógio; o que não tem hora (janelas de
     construção, entregas do dia inteiro) fica na faixa de cima. */
  const PX_SEM=44;
  const vistaSemana=(()=>{
    const horasS=[]; for(let h=H_INI;h<=H_FIM;h++) horasS.push(h);
    return (<div className="wk">
      {/* cabeçalho dos dias */}
      <div className="wk-cab">
        <div className="wk-gutter"></div>
        {semanaDias.map(iso=>{ const dt=dLocal(iso), hoje=iso===isoDate(TODAY);
          return (<div key={iso} className={"wk-dia"+(hoje?' hoje':'')+(selDay===iso?' sel':'')}
            onClick={()=>setSelDay(iso)}>
            <span className="wk-dow">{['Seg','Ter','Qua','Qui','Sex'][(dt.getDay()+6)%7]}</span>
            <span className="wk-num">{fmtBR(iso).slice(0,2)}</span>
          </div>);})}
      </div>

      {/* faixa do dia inteiro: janelas de construção e itens sem horário */}
      <div className="wk-allday">
        <div className="wk-gutter"><span className="wk-gl">dia<br/>todo</span></div>
        {semanaDias.map(iso=>{
          /* Se a tarefa já tem horas reservadas em algum dia, quem representa a
             construção são os blocos na grade — a barra de "dia todo" só aparece
             para janelas que ainda não ganharam horário nenhum. */
          const bars=obrasDoDia(iso).filter(o=>!(o.ses||{})[iso] && !Object.keys(o.ses||{}).length);
          /* Se a tarefa já tem bloco de trabalho neste dia, não repetimos o
             marcador de entrega na faixa de cima — seria o mesmo item duas vezes. */
          const doDiaIso=evOfISO(iso);
          const comBloco=new Set(doDiaIso.filter(e=>e.hora&&e.tid).map(e=>e.tid));
          const semH=doDiaIso.filter(e=>!e.hora&&!(e.tid&&comBloco.has(e.tid)));
          return (<div key={iso} {...propsAlvo(iso,()=>soltarNoDia(iso))}
            className={"wk-ad"+(alvo===iso?' alvo':'')} onClick={()=>setSelDay(iso)}>
            {bars.map(o=>{const ar=propsArrasteObra(o,iso); return (
              <div key={o.id} {...ar} className={"wk-barra"+(ar.className?' '+ar.className:'')}
                style={{background:o.feito?'#9fb8ad':corObra(o)}}
                onClick={(ev)=>{ev.stopPropagation(); abrirTarefa(o.id);}}
                title={o.nome+' · construção '+fmtBR(o.ini)+' → '+fmtBR(o.fim)+' — clique para editar'}>{o.nome}</div>);})}
            {semH.slice(0,3).map(e=>{const ar=propsArraste(e), c=corEv(e); return (
              <div key={e.id} {...ar} className={"wk-item"+(ar.className?' '+ar.className:'')}
                style={{borderLeftColor:c,background:c+'14',color:c}}
                onClick={(ev)=>{ev.stopPropagation(); e.tid?abrirTarefa(e.tid):(e.pid&&go('projects',e.pid));}}
                title={e.title+' · '+e.proj}>{e.kind==='entrega'&&'▲ '}{e.kind==='marco'&&'◆ '}{e.title}</div>);})}
            {semH.length>3&&<div className="wk-mais" onClick={(ev)=>{ev.stopPropagation();setSelDay(iso);setVista('dia');}}>+{semH.length-3}</div>}
          </div>);})}
      </div>

      {/* grade de horas */}
      <div className="wk-corpo" style={{height:horasS.length*PX_SEM}}>
        <div className="wk-gutter wk-horas">
          {horasS.map(h=>(<div key={h} className="wk-hora" style={{height:PX_SEM}}>
            <span className="mono">{String(h).padStart(2,'0')}:00</span></div>))}
        </div>
        {semanaDias.map(iso=>{
          const evs=evOfISO(iso);
          const blocos=layoutBlocos(evs);
          const hoje=iso===isoDate(TODAY);
          return (<div key={iso} className={"wk-col"+(hoje?' hoje':'')+(selDay===iso?' sel':'')}>
            {horasS.map(h=>(<div key={h} {...propsAlvo(iso+'h'+h,()=>soltarNoDiaHora(iso,h))}
              className={"wk-cel"+(alvo===iso+'h'+h?' alvo':'')}
              style={{top:(h-H_INI)*PX_SEM,height:PX_SEM}}
              title={'Agendar '+fmtBR(iso).slice(0,5)+' às '+String(h).padStart(2,'0')+':00'}
              onClick={()=>{setSelDay(iso); abrirNova(iso,String(h).padStart(2,'0')+':00');}}></div>))}
            {hoje&&(()=>{ const m=TODAY.getHours()*60+TODAY.getMinutes();
              if(m<H_INI*60||m>(H_FIM+1)*60) return null;
              return <div className="dia-agora" style={{top:(m-H_INI*60)/60*PX_SEM}}><i/></div>; })()}
            {blocos.map(({e,col,cols})=>{
              const iniM=minDaHora(e.hora), dur=Math.max(+e.durMin||30,20);
              const top=(iniM-H_INI*60)/60*PX_SEM, alt=Math.max(dur/60*PX_SEM-2,17);
              const ar=propsArraste(e), c=corEv(e);
              const larg=100/cols, esq=col*larg;
              const chq=emConflito(e);
              return (<div key={e.id} {...ar}
                className={"wk-bloco "+(ar.className||'')+(e.feito?' feito':'')+(chq?' conflito':'')}
                style={{top,height:alt,left:'calc('+esq+'% + 1px)',width:'calc('+larg+'% - 2px)',
                  background:c+'1f',borderLeftColor:c}}
                title={(chq?'⚠ Choque de agenda de '+nomesEv(e)+' — ':'')+e.title+' · '+rotuloHora(e)+' · '+e.proj+' — clique para editar'}
                onClick={(ev)=>{ev.stopPropagation(); e.tid?abrirTarefa(e.tid):(e.pid&&go('projects',e.pid));}}>
                <div className="wk-bloco-h mono" style={{color:c}}>{e.hora}</div>
                <div className="wk-bloco-t">{e.kind==='entrega'&&'▲ '}{e.title}</div>
              </div>);})}
          </div>);})}
      </div>
    </div>);
  })();


  /* ---------- VISÃO DIA: linha do tempo por hora ---------- */
  const HORAS=[]; for(let h=H_INI;h<=H_FIM;h++) HORAS.push(h);
  const PX_HORA=58;                       // altura de uma hora na linha do tempo
  const doDia=evOfISO(selDay).slice().sort(porHora);
  const semHora=doDia.filter(e=>!e.hora);
  const blocosDoDia=useMemo(()=>layoutBlocos(doDia),[doDia]);
  const vistaDia=(
    <div>
      {obrasDoDia(selDay).filter(o=>!Object.keys(o.ses||{}).length).length>0&&<div style={{marginBottom:12}}>
        <div className="ag-tit">Em construção neste dia · sem horário reservado</div>
        {obrasDoDia(selDay).filter(o=>!Object.keys(o.ses||{}).length).map(o=>(<div key={o.id} className="ag-ev" style={{borderLeftColor:o.feito?'var(--green)':corObra(o),cursor:'pointer'}} onClick={()=>abrirTarefa(o.id)}>
          <div style={{fontSize:'.83rem',fontWeight:600}}>{o.nome}</div>
          <div className="muted" style={{fontSize:'.72rem'}}>{o.proj} · {fmtBR(o.ini)} → {fmtBR(o.fim)}{nomesEv(o)?' · '+nomesEv(o):''}</div></div>))}
      </div>}
      {semHora.length>0&&<div style={{marginBottom:12}}>
        <div className="ag-tit">Sem horário definido</div>
        {semHora.slice(0,verTudo?semHora.length:10).map(e=><EvCard key={e.id} e={e}/>)}
        {semHora.length>10&&!verTudo&&<button className="btn btn-ghost btn-sm" onClick={()=>setVerTudo(true)}>Mostrar as outras {semHora.length-10}</button>}
      </div>}
      {/* Linha do tempo proporcional: um bloco de 2h ocupa 2h de altura.
          Compromissos que se sobrepõem dividem a largura entre si. */}
      <div className="dia-tl">
        <div className="dia-tl-horas">
          {HORAS.map(h=>(<div key={h} className="dia-tl-h" style={{height:PX_HORA}}>
            <span className="mono">{String(h).padStart(2,'0')}:00</span></div>))}
        </div>
        <div className="dia-tl-corpo" style={{height:HORAS.length*PX_HORA}}>
          {/* faixas de hora: também são o alvo do arraste */}
          {HORAS.map(h=>(<div key={h} {...propsAlvo('h'+h,()=>soltarNaHora(h))}
            className={"dia-tl-faixa"+(alvo==='h'+h?' alvo':'')}
            style={{top:(h-H_INI)*PX_HORA,height:PX_HORA}}
            title={'Clique para agendar às '+String(h).padStart(2,'0')+':00'}
            onClick={()=>abrirNova(selDay,String(h).padStart(2,'0')+':00')}></div>))}
          {/* agora é aqui */}
          {selDay===isoDate(TODAY)&&(()=>{ const m=TODAY.getHours()*60+TODAY.getMinutes();
            if(m<H_INI*60||m>(H_FIM+1)*60) return null;
            return <div className="dia-agora" style={{top:(m-H_INI*60)/60*PX_HORA}}><i/></div>; })()}
          {/* os compromissos */}
          {blocosDoDia.map(({e,col,cols})=>{
            const ini=minDaHora(e.hora), dur=Math.max(+e.durMin||30,20);
            const top=(ini-H_INI*60)/60*PX_HORA, alt=Math.max(dur/60*PX_HORA-2,20);
            const ar=propsArraste(e), c=corEv(e);
            const larg=100/cols, esq=col*larg;
            return (<div key={e.id} {...ar}
              className={"dia-bloco "+(ar.className||'')+(e.feito?' feito':'')+(emConflito(e)?' conflito':'')}
              style={{top,height:alt,left:'calc('+esq+'% + 2px)',width:'calc('+larg+'% - 4px)',
                background:c+'1c',borderLeftColor:c}}
              title={(emConflito(e)?'⚠ Choque de agenda de '+nomesEv(e)+' — ':'')+e.title+' · '+rotuloHora(e)+' · '+e.proj+' — clique para editar'}
              onClick={()=>{ if(e.tid) abrirTarefa(e.tid); else if(e.pid) go('projects',e.pid); }}>
              <div className="dia-bloco-h mono" style={{color:c}}>{e.hora}{e.durMin?'–'+horaDeMin(ini+ +e.durMin):''}</div>
              <div className="dia-bloco-t">{e.kind==='entrega'&&'▲ '}{e.title}</div>
              {alt>52&&<div className="dia-bloco-s">{KIND_L[e.kind]} · {e.proj}</div>}
            </div>);})}
        </div>
      </div>
    </div>);

  const dayEvents=evOfISO(selDay).slice().sort(porHora);
  return (<div style={{display:'grid',gridTemplateColumns:painel?'1fr 320px':'1fr',gap:16,alignItems:'start'}}>
    <div className="card card-pad">
      <div className="between" style={{marginBottom:14,flexWrap:'wrap',gap:10}}>
        <div className="row"><button className="icon-btn" onClick={()=>andar(-1)}>◀</button>
          <h3 style={{fontSize:'1.05rem',minWidth:190,textAlign:'center'}}>{titulo}</h3>
          <button className="icon-btn" onClick={()=>andar(1)}>▶</button>
          <button className="btn btn-ghost btn-sm" style={{marginLeft:6}} onClick={hojeBtn}>Hoje</button>
          <button className="btn btn-primary btn-sm" style={{marginLeft:8}} onClick={()=>abrirNova('','')}
            title="Nova tarefa ou reunião — as datas você escolhe no formulário">{I.plus} Nova tarefa</button></div>
        <div className="row" style={{gap:10}}>
          <div className="seg-ctrl">
            <button className={vista==='mes'?'on':''} onClick={()=>setVista('mes')}>Mês</button>
            <button className={vista==='semana'?'on':''} onClick={()=>setVista('semana')}>Semana</button>
            <button className={vista==='dia'?'on':''} onClick={()=>setVista('dia')}>Dia</button>
          </div>
          <button className={"btn btn-sm "+(painel?'btn-ghost':'btn-primary')} onClick={()=>setPainel(v=>!v)}
            title={painel?'Ocultar o painel de detalhes':'Mostrar o painel de detalhes'}>
            {painel?'Ocultar detalhes ›':'‹ Detalhes'}</button>
        </div>
      </div>
      <div className="row" style={{gap:12,flexWrap:'wrap',marginBottom:6}}>
        <span className="chip"><i style={{width:14,height:8,borderRadius:4,background:'#8b93b5',display:'inline-block'}}></i>barra = prazo de construção</span>
        <span className="chip" style={{fontWeight:700}}>▲ = prazo de entrega</span>
        <span className="chip"><i style={{width:8,height:8,borderRadius:'50%',background:'#8b93b5',display:'inline-block'}}></i>ponto = reunião ou marco</span>
        <span className="muted" style={{fontSize:'.72rem'}}>a cor identifica {corPor==='pessoa'?'quem executa':'o cliente'}</span>
      </div>
      <div className="row" style={{gap:8,flexWrap:'wrap',marginBottom:10,alignItems:'center'}}>
        <span className="muted" style={{fontSize:'.72rem'}}>filtrar por</span>
        <select className="mini-sel" style={{width:170}} value={filtro.cli} onChange={e=>fSet('cli',e.target.value)}>
          <option value="Todos">Todos os clientes</option>
          <option value="Gerais">Tarefas gerais</option>
          {ativos(db).map(x=><option key={x.id} value={x.id}>{x.name}</option>)}</select>
        <select className="mini-sel" style={{width:150}} value={filtro.resp} onChange={e=>fSet('resp',e.target.value)}>
          <option value="Todos">Todos da equipe</option>
          {db.team.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}</select>
        <select className="mini-sel" style={{width:170}} value={filtro.tipo} onChange={e=>fSet('tipo',e.target.value)}>
          <option value="Todos">Tudo</option>
          <option value="construcao">Só construção (janelas e horas)</option>
          <option value="reuniao">Só reuniões</option>
          <option value="entrega">Só entregas</option>
          <option value="marco">Só marcos</option></select>
        {filtroAtivo&&<button className="btn btn-ghost btn-sm" onClick={()=>setFiltro({resp:'Todos',cli:'Todos',tipo:'Todos'})}>limpar filtro</button>}
      </div>
      <div className="row" style={{gap:10,flexWrap:'wrap',marginBottom:12,alignItems:'center'}}>
        <div className="seg-ctrl" style={{marginRight:4}}>
          <button className={corPor==='cliente'?'on':''} onClick={()=>setCorPor('cliente')}>cor por cliente</button>
          <button className={corPor==='pessoa'?'on':''} onClick={()=>setCorPor('pessoa')}>cor por pessoa</button>
        </div>
        {corPor==='cliente'
          ? <>{ativos(db).filter(x=>(x.activities||[]).length).map(x=>(
              <span key={x.id} className={"chip"+(filtro.cli===x.id?' on':'')} style={{cursor:'pointer',
                  borderColor:filtro.cli===x.id?corDoCliente(x):undefined,
                  background:filtro.cli===x.id?corDoCliente(x)+'1c':undefined}}
                title={filtro.cli===x.id?'Mostrando só este cliente — clique para limpar':'Clique para ver só este cliente'}
                onClick={()=>fSet('cli',filtro.cli===x.id?'Todos':x.id)}>
                <i style={{width:9,height:9,borderRadius:'50%',background:corDoCliente(x),display:'inline-block'}}></i>{x.name}</span>))}
            {(db.tasks||[]).length>0&&<span className={"chip"+(filtro.cli==='Gerais'?' on':'')} style={{cursor:'pointer'}}
              onClick={()=>fSet('cli',filtro.cli==='Gerais'?'Todos':'Gerais')}>
              <i style={{width:9,height:9,borderRadius:'50%',background:CINZA_GERAL,display:'inline-block'}}></i>Tarefas gerais</span>}</>
          : <>{db.team.map(m=>(
              <span key={m.id} className={"chip"+(filtro.resp===m.id?' on':'')} style={{cursor:'pointer',
                  borderColor:filtro.resp===m.id?corDaPessoa(m.id):undefined,
                  background:filtro.resp===m.id?corDaPessoa(m.id)+'1c':undefined}}
                title={filtro.resp===m.id?'Mostrando só a agenda de '+m.name+' — clique para limpar':'Clique para ver só a agenda de '+m.name}
                onClick={()=>fSet('resp',filtro.resp===m.id?'Todos':m.id)}>
                <i style={{width:9,height:9,borderRadius:'50%',background:corDaPessoa(m.id),display:'inline-block'}}></i>{m.name}</span>))}</>}
      </div>
      {(()=>{ const dias=vista==='semana'?semanaDias:(vista==='dia'?[selDay]:[]);
        const n=dias.reduce((a,iso)=>a+conflitos(iso).size,0);
        return n? (<div style={{fontSize:'.75rem',marginBottom:8,padding:'7px 11px',background:'#fdecea',
          border:'1px solid #f5b7b1',borderRadius:8,color:'#a5352a'}}>
          <b>⚠ {n} compromissos em choque de agenda.</b> São blocos da mesma pessoa no mesmo horário — o contorno vermelho marca cada um.
        </div>) : null; })()}
      {filtroAtivo&&<div className="muted" style={{fontSize:'.73rem',marginBottom:8,padding:'6px 10px',
        background:'var(--lavender-soft)',borderRadius:8}}>
        Mostrando apenas
        {filtro.cli!=='Todos'&&<b> {filtro.cli==='Gerais'?'tarefas gerais':(db.projects.find(x=>x.id===filtro.cli)||{}).name}</b>}
        {filtro.resp!=='Todos'&&<b> · {member(db,filtro.resp).name}</b>}
        {filtro.tipo!=='Todos'&&<b> · {({construcao:'prazos de construção',trabalho:'horários de trabalho',reuniao:'reuniões',entrega:'entregas',marco:'marcos'})[filtro.tipo]}</b>}
        . O restante segue no calendário, apenas oculto.
      </div>}
      {vista==='mes'?vistaMes:vista==='semana'?vistaSemana:vistaDia}
      <div className="muted" style={{fontSize:'.72rem',marginTop:10}}>
        {vista==='mes'&&'Clique num dia para ver os detalhes ao lado; clique duas vezes para agendar nele. '}
        {vista==='dia'?'Clique numa faixa de horário livre para agendar ali. Arraste um compromisso para outra faixa para reagendá-lo.'
          :'Arraste um compromisso para outro dia para remarcá-lo. As faixas azuis também arrastam: a janela de construção inteira desliza, mantendo a duração.'}
      </div>
    </div>

    {painel&&<div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div className="card card-pad">
        <div className="between"><h3 style={{fontSize:'1rem'}}>{fmtBR(selDay)}</h3>
          <button className="icon-btn" style={{width:24,height:24,color:'var(--text-3)'}} onClick={()=>setPainel(false)} title="Ocultar painel">{I.x}</button></div>
        {obrasDoDia(selDay).length>0&&<div style={{marginBottom:12}}>
          <div className="ag-tit">Em construção</div>
          {obrasDoDia(selDay).map(o=>(<div key={o.id} className="row" style={{gap:8,padding:'6px 0',cursor:'pointer'}} onClick={()=>abrirTarefa(o.id)}>
            <span style={{width:4,alignSelf:'stretch',borderRadius:3,background:o.feito?'var(--green)':corObra(o)}}></span>
            <div style={{flex:1}}><div style={{fontSize:'.83rem',fontWeight:600}}>{o.nome}</div>
              <div className="muted" style={{fontSize:'.73rem'}}>{o.proj} · {fmtBR(o.ini)} → {fmtBR(o.fim)}{nomesEv(o)?' · '+nomesEv(o):''}</div></div></div>))}
        </div>}
        {dayEvents.length?dayEvents.map((e,i)=>(<div key={i} className="row" style={{padding:'9px 0',borderBottom:'1px solid #f0f1f7',gap:10,cursor:'pointer'}} onClick={()=>{ if(e.tid) abrirTarefa(e.tid); else if(e.pid) go('projects',e.pid); }}>
          <span style={{width:4,alignSelf:'stretch',borderRadius:3,background:corEv(e)}}></span>
          <div style={{flex:1}}><div style={{fontSize:'.84rem',fontWeight:600,textDecoration:e.feito?'line-through':'none'}}>
            {e.kind==='entrega'&&<span style={{color:'var(--red)'}}>▲ </span>}{e.hora&&<span className="mono" style={{fontSize:'.74rem',color:'var(--text-2)'}}>{rotuloHora(e)} · </span>}{e.title}</div>
            <div className="muted" style={{fontSize:'.74rem'}}>{KIND_L[e.kind]} · {e.proj}{nomesEv(e)?' · '+nomesEv(e):''}</div></div></div>)):(!obrasDoDia(selDay).length&&<div className="muted" style={{fontSize:'.82rem'}}>Nada agendado neste dia.</div>)}
      </div>

      <div className="card card-pad">
        <QuickAddTask titulo={'Adicionar tarefa em '+fmtBR(selDay)}
          dica={'Prazo de entrega e construção em '+fmtBR(selDay)+'. Depois é só ajustar a janela na aba Tarefas.'}
          date={selDay} buildStart={selDay} buildEnd={selDay} compacto/>
      </div>

      <div className="card card-pad"><div className="card-h"><h3>Próximos marcos</h3></div>
        {events.filter(e=>e.kind==='marco'&&e.date>=isoDate(TODAY)).sort((a,b)=>a.date<b.date?-1:1).slice(0,6).map((e,i)=>(<div key={i} className="between" style={{padding:'7px 0',borderBottom:'1px solid #f0f1f7',cursor:'pointer'}} onClick={()=>go('projects',e.pid)}><span style={{fontSize:'.8rem'}}>{e.title}</span><span className="mono muted" style={{fontSize:'.74rem'}}>{fmtBR(e.date)}</span></div>))}
      </div>
      <div className="card card-pad"><div className="card-h"><h3>Google Agenda</h3></div>
        <input className="inp" placeholder="Colar link de incorporação (embed) da agenda da equipe" value={agenda} onChange={e=>setAgenda(e.target.value)}/>
        <div className="muted" style={{fontSize:'.74rem',marginTop:8}}>A sincronização em tempo real com o Google Agenda (atas e transcrições) será feita na integração de back-end.</div>
      </div>
    </div>}

    {/* fora do painel lateral: o formulário abre mesmo com os detalhes ocultos */}
    {novaTarefa&&<TaskModal db={db} init={novaTarefa} close={()=>setNovaTarefa(null)} onSave={salvarTarefa}/>}
  </div>);
}

/* ============================================================
   ABA ESTRATÉGIA — painel, mapa e roadmap
   ============================================================ */
function TabEstrategia({p,mutate}){
  const {db,flash,go}=useDB();
  const [vis,setVis]=useState('painel');
  const [modalObj,setModalObj]=useState(null);
  const [modalInd,setModalInd]=useState(null);   // {objId, ind}
  const [modalIni,setModalIni]=useState(null);   // {objId, ini}
  const [abertoObj,setAbertoObj]=useState(null);   // objetivo expandido (um por vez)
  const [medirInd,setMedirInd]=useState(null);     // indicador com o campo de medição aberto
  const [detalheFrente,setDetalheFrente]=useState(null);
  const [abertaIni,setAbertaIni]=useState(null);   // (legado) iniciativa expandida

  const objs=todosObjetivos(p);
  /* Agrupamento: por FRENTE (planos encadeados por dependência) ou pelas
     quatro PERSPECTIVAS do BSC. A frente vence quando o plano tem frentes. */
  const frentes=(p.bsc&&p.bsc.frentes)||[];
  const usaFrente=frentes.length>0 && (p.bsc.agrupar||'frente')==='frente';
  const grupos=usaFrente
    ? frentes.map(f=>({k:f.id,label:(f.num?'Projeto '+f.num+' · ':'')+f.nome,cor:f.cor||'#0F4245',desc:f.sub,frente:f}))
    : PERSPECTIVAS.map(([k,l,c,d])=>({k,label:l,cor:c,desc:d,frente:null}));
  const objsDo=(g)=> usaFrente? objs.filter(o=>o.frenteId===g.k) : objs.filter(o=>o.persp===g.k);
  const novoObjDe=(g)=> usaFrente? {id:'',persp:'proc',frenteId:g.k,nome:'',desc:'',custo:'',codigo:''}
                                 : {id:'',persp:g.k,frenteId:null,nome:'',desc:'',custo:'',codigo:''};
  const ativar=()=>{ mutate(pr=>{pr.bsc=bscVazio();feedLog(pr,'Planejamento estratégico ativado');}); flash('Planejamento estratégico ativado'); };

  if(!temBSC(p)) return (<div className="card card-pad">
    <div className="empty" style={{padding:44}}>
      <div className="ic">{I.star}</div>
      Este projeto ainda não tem planejamento estratégico.
      <div className="muted" style={{fontSize:'.84rem',marginTop:10,maxWidth:520,marginLeft:'auto',marginRight:'auto',lineHeight:1.6}}>
        Ative para montar o Balanced Scorecard do cliente: objetivos nas quatro perspectivas,
        indicadores com meta e prazo, e iniciativas com tarefas próprias — que continuam
        aparecendo no sprint e no calendário da equipe.
      </div>
      <button className="btn btn-primary" style={{marginTop:16}} onClick={ativar}>{I.plus} Ativar planejamento estratégico</button>
    </div>
  </div>);

  /* ---------- ações ---------- */
  const salvarObj=(o)=>{ if(!(o.nome||'').trim()){flash('Dê um nome ao objetivo');return;}
    mutate(pr=>{ pr.bsc.objetivos=pr.bsc.objetivos||[];
      const i=pr.bsc.objetivos.findIndex(x=>x.id===o.id);
      if(i>=0) pr.bsc.objetivos[i]={...pr.bsc.objetivos[i],...o};
      else pr.bsc.objetivos.push({...o,id:uid(),indicadores:[],iniciativas:[]});
    }); setModalObj(null); flash('Objetivo salvo'); };
  const excluirObj=(o)=>{ if(!confirm('Excluir o objetivo "'+o.nome+'" com seus indicadores e iniciativas?')) return;
    mutate(pr=>{ pr.bsc.objetivos=pr.bsc.objetivos.filter(x=>x.id!==o.id); }); flash('Objetivo excluído'); };

  const salvarInd=(objId,ind)=>{ if(!(ind.nome||'').trim()){flash('Dê um nome ao indicador');return;}
    mutate(pr=>{ const o=pr.bsc.objetivos.find(x=>x.id===objId); if(!o) return;
      o.indicadores=o.indicadores||[];
      const i=o.indicadores.findIndex(x=>x.id===ind.id);
      if(i>=0) o.indicadores[i]={...o.indicadores[i],...ind};
      else o.indicadores.push({...ind,id:uid(),medicoes:[]});
    }); setModalInd(null); flash('Indicador salvo'); };
  const excluirInd=(objId,ind)=>{ if(!confirm('Excluir o indicador "'+ind.nome+'"?')) return;
    mutate(pr=>{ const o=pr.bsc.objetivos.find(x=>x.id===objId); if(o) o.indicadores=o.indicadores.filter(x=>x.id!==ind.id); }); };
  const medir=(objId,indId,data,valor)=>{
    mutate(pr=>{ const o=pr.bsc.objetivos.find(x=>x.id===objId); const ind=o&&o.indicadores.find(x=>x.id===indId); if(!ind) return;
      ind.medicoes=ind.medicoes||[];
      const j=ind.medicoes.findIndex(m=>m.data===data);
      if(j>=0) ind.medicoes[j].valor=+valor; else ind.medicoes.push({data,valor:+valor});
      ind.medicoes.sort((a,b)=>a.data<b.data?-1:1);
    }); flash('Medição registrada'); };

  const salvarIni=(objId,ini)=>{ if(!(ini.nome||'').trim()){flash('Dê um nome à iniciativa');return;}
    mutate(pr=>{ const o=pr.bsc.objetivos.find(x=>x.id===objId); if(!o) return;
      o.iniciativas=o.iniciativas||[];
      const i=o.iniciativas.findIndex(x=>x.id===ini.id);
      if(i>=0) o.iniciativas[i]={...o.iniciativas[i],...ini};
      else o.iniciativas.push({...ini,id:uid()});
    }); setModalIni(null); flash('Iniciativa salva'); };
  const excluirIni=(objId,ini)=>{
    const n=(p.activities||[]).filter(a=>a.iniciativaId===ini.id).length;
    if(!confirm('Excluir a iniciativa "'+ini.nome+'"?'+(n?'\n\nAs '+n+' tarefas dela continuam no projeto, apenas sem vínculo.':''))) return;
    mutate(pr=>{ const o=pr.bsc.objetivos.find(x=>x.id===objId); if(o) o.iniciativas=o.iniciativas.filter(x=>x.id!==ini.id);
      (pr.activities||[]).forEach(a=>{ if(a.iniciativaId===ini.id) a.iniciativaId=null; }); }); };

  /* tarefa criada dentro da iniciativa: vai para o pool do projeto, marcada */
  const novaTarefaIni=(ini,nome,resp,ini_,fim)=>{
    if(!nome.trim()){flash('Dê um nome à tarefa');return;}
    mutate(pr=>{ pr.activities.unshift({id:uid(),projectId:pr.id,iniciativaId:ini.id,name:nome.trim(),
      type:'Outro',deliverableId:'',assignee:resp,date:fim||ini.fim||'',buildStart:ini_||'',buildEnd:fim||'',
      hora:'',durMin:0,sessoes:{},column:'backlog',sprintId:null,prio:'Média',notes:'',
      criadaEm:hojeISO()}); });
    flash('Tarefa criada na iniciativa'); };

  /* ---------- VISÃO PAINEL ---------- */
  /* ---------- VISÃO PAINEL — lista compacta, detalhe sob demanda ----------
     Uma linha por objetivo: farol, código, nome, meta e projeto responsável.
     O resto (custo de não fazer, indicadores, medições) só abre quando pedido,
     para a leitura de cima ser rápida. */
  const painel=(<div style={{display:'flex',flexDirection:'column',gap:14}}>
    {grupos.map(g=>{
      const {k,label,cor,desc,frente:fr}=g;
      const doGrupo=objsDo(g);
      return (<div key={k} className="card">
        <div className="between" style={{padding:'14px 16px 10px',alignItems:'flex-start',gap:12}}>
          <div style={{flex:1}}>
            <h3 style={{fontSize:'.98rem',color:cor}}>{label}</h3>
            <div className="muted" style={{fontSize:'.74rem'}}>{fr? (fr.periodo||desc) : desc}</div>
          </div>
          <div className="row" style={{gap:8,alignItems:'center'}}>
            <span className="muted" style={{fontSize:'.74rem'}}>{doGrupo.length} objetivo{doGrupo.length===1?'':'s'}</span>
            <button className="btn btn-ghost btn-sm" onClick={()=>setModalObj(novoObjDe(g))}>{I.plus}</button>
          </div>
        </div>

        {fr&&(fr.entrega||fr.resultado)&&<div style={{padding:'0 16px 10px'}}>
          <button className="btn btn-ghost btn-sm" style={{padding:'2px 8px',fontSize:'.72rem'}}
            onClick={()=>setDetalheFrente(detalheFrente===k?null:k)}>
            {detalheFrente===k?'▾':'▸'} o que este bloco entrega
          </button>
          {detalheFrente===k&&<div className="muted" style={{fontSize:'.78rem',marginTop:8,lineHeight:1.6}}>
            {fr.entrega&&<div><b>Entrega:</b> {fr.entrega}</div>}
            {fr.resultado&&<div style={{color:cor,marginTop:2}}><b>Resultado esperado:</b> {fr.resultado}</div>}
            {fr.dono&&<div style={{marginTop:2}}><b>Dono:</b> {fr.dono}</div>}
            {fr.passamExistir&&<div style={{marginTop:6}}><b>Passam a existir:</b> {fr.passamExistir}</div>}
          </div>}
        </div>}

        {!doGrupo.length
          ? <div className="muted" style={{fontSize:'.78rem',padding:'0 16px 14px'}}>Nenhum objetivo aqui ainda.</div>
          : <div className="obj-lista">
          {doGrupo.map(o=>{
            const f=farolObjetivo(o), ab=abertoObj===o.id;
            const inds=o.indicadores||[];
            const metaResumo=(inds[0]&&(inds[0].metaTexto||(inds[0].meta!==undefined?('meta '+inds[0].meta+(inds[0].unidade||'')):'')))||'';
            const ps=pesDoObjetivo(p,o.id);
            return (<div key={o.id} className={"obj-linha"+(ab?' aberta':'')}>
              {/* --- cabeçalho: uma linha só, escaneável --- */}
              <div className="obj-cab" onClick={()=>setAbertoObj(ab?null:o.id)}>
                <span className="farol" style={{background:f.cor}} title={f.txt}></span>
                {o.codigo&&<span className="obj-cod">{o.codigo}</span>}
                <span className="obj-nome">{o.nome}</span>
                {metaResumo&&<span className="obj-meta">{metaResumo}</span>}
                {ps.map(pe=><span key={pe.id} className="obj-pe" title={pe.nome}>{pe.cod}</span>)}
                <span className="obj-ind">{inds.length? inds.length+' ind.' : 'sem indicador'}</span>
                <span className="obj-seta">{ab?'▾':'▸'}</span>
              </div>

              {/* --- detalhe --- */}
              {ab&&<div className="obj-det">
                {o.custo&&<div className="custo-box" style={{marginTop:0}}><b>Custo de não fazer:</b> {o.custo}</div>}
                {o.desc&&<div className="muted" style={{fontSize:'.78rem',marginTop:8}}>{o.desc}</div>}
                {ps.length>0&&<div className="row" style={{gap:6,marginTop:8,flexWrap:'wrap'}}>
                  <span className="muted" style={{fontSize:'.73rem'}}>Executado por:</span>
                  {ps.map(pe=><span key={pe.id} className="tag-soft" style={{fontSize:'.68rem',background:'#0F424518',color:'#0F4245',fontWeight:700}}>{pe.cod} · {pe.nome}</span>)}
                </div>}

                <div className="between" style={{margin:'14px 0 6px'}}>
                  <span className="ag-tit" style={{margin:0}}>Indicadores</span>
                  <button className="btn btn-ghost btn-sm" style={{padding:'2px 8px'}}
                    onClick={()=>setModalInd({objId:o.id,ind:{id:'',nome:'',unidade:'',tipo:'result',baseline:0,meta:0,inicio:hojeISO(),prazo:'',metaTexto:'',baseNota:''}})}>+ indicador</button>
                </div>
                {!inds.length? <div className="muted" style={{fontSize:'.76rem'}}>Sem indicador — o objetivo ainda não é mensurável.</div>
                : inds.map(ind=>{ const f2=farolIndicador(ind), u=ultimaMedicao(ind), medindo=medirInd===ind.id;
                  return (<div key={ind.id} className="ind-linha">
                    <div className="row" style={{gap:8,alignItems:'baseline',flexWrap:'wrap'}}>
                      <span className="farol" style={{background:f2.cor}}></span>
                      <span style={{fontWeight:600,fontSize:'.82rem',flex:1,minWidth:180}}>{ind.nome}</span>
                      <span className="tag-soft" style={{fontSize:'.62rem'}}>{ind.tipo==='tend'?'tendência':'resultado'}</span>
                      <span className="mono" style={{fontSize:'.76rem'}}>{u? u.valor : '—'}</span>
                      <span className="mono muted" style={{fontSize:'.72rem'}}>{ind.metaTexto||(ind.baseline+' → '+ind.meta+' '+(ind.unidade||''))}</span>

                      <button className="icon-btn" style={{width:22,height:22,color:'var(--text-3)'}} onClick={()=>excluirInd(o.id,ind)}>{I.x}</button>

                  </div>);})}

                <div className="row" style={{gap:6,marginTop:12}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setModalObj(o)}>Editar objetivo</button>
                  <button className="btn btn-ghost btn-sm" onClick={()=>excluirObj(o)}>Excluir</button>
                </div>
              </div>}
            </div>);})}
        </div>}
      </div>);})}
  </div>);

  /* ---------- VISÃO MAPA ---------- */
  const mapa=(<div className="card card-pad">
    <div className="muted" style={{fontSize:'.76rem',marginBottom:12}}>
      Leitura de baixo para cima: o que sustenta o quê. Cada cartão é pintado pelo farol dos seus indicadores.

    {PERSPECTIVAS.map(([k,label,cor,desc])=>{

        <div className="mapa-lbl" style={{background:cor}}>{label}</div>

          {doGrupo.length? doGrupo.map(o=>{ const f=farolObjetivo(o), inis=(o.iniciativas||[]).length;

              <div className="row" style={{gap:6,marginBottom:4}}><span className="farol" style={{background:f.cor}}></span>

              <div className="muted" style={{fontSize:'.7rem'}}>
                {(o.indicadores||[]).length} indicador(es) · {inis} iniciativa(s)</div>
            </div>);})
          : <div className="muted" style={{fontSize:'.75rem',padding:'10px 2px'}}>—</div>}
        </div>

    <div className="muted" style={{fontSize:'.73rem',marginTop:10}}>
      As perspectivas de baixo (pessoas e processos) são as causas; as de cima (clientes e resultado) são os efeitos.

  </div>);

  /* ---------- VISÃO ROADMAP ---------- */
  const todas=todasIniciativas(p);
  const roadmap=(<div className="kanban" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
    {HORIZONTES.map(([h,label])=>{ const its=todas.filter(i=>(i.horizonte||'agora')===h);

            <div className="row" style={{gap:6,alignItems:'center'}}>

              <span className="mono" style={{fontSize:'.7rem',fontWeight:700}}>{pg.done}/{pg.total}</span></div>
            {i.fim&&<div className="muted mono" style={{fontSize:'.7rem',marginTop:5}}>até {fmtBR(i.fim)}</div>}
          </div>);})}
        {!its.length&&<div className="kb-empty">—</div>}
      </div>);})}
  </div>);

  /* ---------- VISÃO ROTINA (fóruns de gestão + decisões pendentes) ---------- */
  const rits=(p.bsc&&p.bsc.rituais)||[]; const decs=(p.bsc&&p.bsc.decisoes)||[];

          <thead><tr><th>Fórum</th><th>Cadência</th><th>O que se discute</th><th>O que não entra</th></tr></thead>
          <tbody>{rits.map((r,i)=>(<tr key={i}>
            <td style={{fontWeight:700,fontSize:'.84rem'}}>{r.nome}</td>

}

function TarefasDaIniciativa({p,ini,db,onNova,mutate,go}){

      <select className="mini-sel" value={resp} onChange={e=>setResp(e.target.value)}>

/* ============================================================
   PROJETO ANSATA — carga única do Painel Estratégico (Nortmont)
   Roda uma vez: se já existe um projeto chamado "Ansata", não faz nada.
   O plano é traduzido para a estrutura do sistema:
     alvo → frentes → objetivos (com custo de não fazer) →
     indicador/meta → iniciativa → tarefas (as ações)
   ============================================================ */
function objAns(cod,frenteId,persp,nome,custo,ind,metaTexto,baseNota,acoes,jan,fev){
  const iniId=uid();
  return {
    id:uid(),codigo:cod,frenteId,persp,nome,desc:'',custo,
    indicadores:[{id:uid(),nome:ind,unidade:'',tipo:'result',baseline:0,meta:100,
      inicio:jan,prazo:fev,metaTexto,baseNota,medicoes:[]}],
    iniciativas:[{id:iniId,nome:'Ações · '+cod,desc:'Bloco de ações que produz o objetivo '+cod+'.',
      resp:'',inicio:jan,fim:fev,status:'nao',horizonte:(jan<='2026-12-31'?'agora':'proximo')}],
    __acoes:{iniId,acoes,jan,fev}
  };
}

function semearAnsata(d){
  // A Ansata já está na carteira: neste caso o plano é ANEXADO ao projeto
  // existente, em vez de criar um duplicado. Se já tiver bsc, não mexe.
  const existente=(d.projects||[]).find(p=>(p.name||'').toLowerCase()==='ansata');
  if(existente){
    if(existente.bsc) return false;
    const r=montarAnsata();
    r.activities.forEach(a=>{ a.projectId=existente.id;
      if(!a.assignee) a.assignee=existente.coordinator||((d.team&&d.team[0])?d.team[0].id:'lara'); });
    existente.activities=(existente.activities||[]).concat(r.activities);
    existente.perfil=existente.perfil||'Ansata Country · 2026–2027';
    existente.endDate='2027-06-30';
    existente.bsc=planoAnsata(r.frentes,r.objetivos);
    anexarPEs(existente);
    return true;
  }
  const {frentes,objetivos,activities}=montarAnsata();
  const pid='p'+uid();
  activities.forEach(a=>a.projectId=pid);
  const coord=(d.team&&d.team[0])? d.team[0].id : 'lara';
  activities.forEach(a=>{ if(!a.assignee) a.assignee=coord; });
  const ini='2026-09-01', fim='2027-06-30';
  d.projects.unshift({
    id:pid,num:Date.now()%10000,name:'Ansata',coordinator:coord,manager:coord,phase:PHASES[0],
    tier:'Tier 1',tipo:'Consultoria',setor:'Varejo',owner:'',phone:'',perfil:'Ansata Country · 2026–2027',
    consultants:[coord],status:'Em andamento',startDate:ini,endDate:fim,duracaoMeses:10,
    marcos:marcoDates(ini,fim),deliverables:[],activities,actSeeded:true,
    archived:false,archivedAt:'',pauses:[],marcosReais:{1:'',2:'',3:'',4:''},realEnd:'',
    feed:[{id:uid(),type:'sistema',title:'Projeto criado',description:'Painel Estratégico da Nortmont importado.',author:coord,date:fmtBR(hojeISO()),links:[],attachments:[]}],
    links:{drive:'',agenda:'',juridico:'',apresentacao:'',manuais:'',outros:''},notes:'',
    bsc:planoAnsata(frentes,objetivos)
  });
  anexarPEs(d.projects[0]);
  return true;
}

/* Anexa os PEs ao plano e liga as ações já existentes ao seu projeto.
   A ação fica no PE (peId) e ainda sem fase (faseId null) — é o balde
   "a distribuir", que a equipe arrasta para a fase certa. */
function anexarPEs(proj){
  if(!proj.bsc) return 0;
  if((proj.bsc.projetos||[]).length) return 0;      // já anexado
  const pes=pesAnsata();
  const porCod={}; (proj.bsc.objetivos||[]).forEach(o=>{ if(o.codigo) porCod[o.codigo]=o; });
  pes.forEach(pe=>{
    pe.objetivos=(pe.codigosObj||[]).map(c=>porCod[c]&&porCod[c].id).filter(Boolean);
    delete pe.codigosObj;
  });
  proj.bsc.projetos=pes;
  // cada objetivo aponta para o PE responsável; as ações do objetivo herdam esse PE
  const peDoObj={}; pes.forEach(pe=>(pe.objetivos||[]).forEach(oid=>{ peDoObj[oid]=pe.id; }));
  let ligadas=0;
  (proj.bsc.objetivos||[]).forEach(o=>{
    const peId=peDoObj[o.id]; if(!peId) return;
    (o.iniciativas||[]).forEach(ini=>{
      (proj.activities||[]).forEach(a=>{ if(a.iniciativaId===ini.id && !a.peId){ a.peId=peId; ligadas++; } });
    });
  });
  return ligadas;
}

function distribuirAcoes(proj){
  if(!proj.bsc||!(proj.bsc.projetos||[]).length) return 0;
  const porCod={}; (proj.bsc.projetos||[]).forEach(pe=>{ porCod[pe.cod]=pe; });
  let n=0;
  MAPA_ACOES.forEach(([trecho,cod,num])=>{
    const pe=porCod[cod]; if(!pe) return;
    const fase=(pe.fases||[])[num-1]; if(!fase) return;
    (proj.activities||[]).forEach(a=>{
      if(a.faseId) return;                       // já distribuída: não mexe
      if((a.name||'').indexOf(trecho)<0) return;
      a.peId=pe.id; a.faseId=fase.id; n++;
    });
  });
  return n;
}

/* Ações de uma fase: as tarefas de verdade */
function AcoesDaFase({p,pe,fase,db,onNova,alterna,mutate}){
  const ts=acoesDaFase(p,fase.id);
  const campo=(id,k,v)=>mutate(pr=>{const a=pr.activities.find(x=>x.id===id); if(a) a[k]=v;});
  const campoResps=(id,lista)=>mutate(pr=>{const a=pr.activities.find(x=>x.id===id); if(a) setResps(a,lista);});
  return (<div>
    {ts.length? <div className="tbl-wrap"><table className="tbl">
        <thead><tr><th style={{width:30}}></th><th>Ação</th><th>Quem faz</th><th>Prazo de entrega</th><th>Construção</th><th>Prior.</th></tr></thead>
        <tbody>{ts.map(t=>{ const atras=taskAtrasada(t);
          return (<tr key={t.id}>
            <td><button className={"chk sm "+(t.column==='concluido'?'on':'')} onClick={()=>alterna(t.id)}>{t.column==='concluido'&&I.check}</button></td>
            <td><span style={{fontSize:'.82rem',fontWeight:600,textDecoration:t.column==='concluido'?'line-through':'none',opacity:t.column==='concluido'?.6:1}}>{t.name}</span>
              {atras&&<span className="badge" style={{background:'#fdecea',color:'#B33A3A',marginLeft:6}}>atrasada</span>}
              {!t.date&&!t.buildStart&&<span className="muted" style={{fontSize:'.68rem',marginLeft:6}}>sem prazo</span>}</td>
            <td><CelResps db={db} t={t} onChange={(l)=>campoResps(t.id,l)}/></td>
            <td><input type="date" className="mini-sel" style={atras?{color:'#B33A3A',fontWeight:700}:null} value={t.date||''} onChange={e=>campo(t.id,'date',e.target.value)}/></td>
            <td><div className="row" style={{gap:4}}>
              <input type="date" className="mini-sel" value={t.buildStart||''} onChange={e=>campo(t.id,'buildStart',e.target.value)} title="Início da construção"/>
              <span className="muted" style={{fontSize:'.7rem'}}>→</span>
              <input type="date" className="mini-sel" value={t.buildEnd||''} onChange={e=>campo(t.id,'buildEnd',e.target.value)} title="Fim da construção"/>
            </div></td>
            <td><select className="mini-sel" style={{color:PRIO_C[t.prio||'Média'].fg,fontWeight:700}} value={t.prio||'Média'} onChange={e=>campo(t.id,'prio',e.target.value)}>
              {PRIOS.map(x=><option key={x}>{x}</option>)}</select></td>
          </tr>);})}</tbody></table></div>
    : <div className="muted" style={{fontSize:'.78rem',marginBottom:6}}>Nenhuma ação prevista ainda nesta fase.</div>}

      A ação é uma tarefa: aparece na aba Tarefas e, com prazo de construção, entra sozinha no sprint e no calendário.
    </div>
  </div>);
}

/* Sorteio previsível: a mesma simulação toda vez, para poder comparar. */
function simRnd(seed){ let x=seed; return ()=>{ x=(x*1103515245+12345)&0x7fffffff; return x/0x7fffffff; }; }

/* Contratos fictícios para a simulação: ticket, horas, reajustes, datas,
   dois clientes que já saíram e algumas sinaleiras — para a Análise
   Comercial aparecer cheia. Só é usado em modo simulação. */
function contratosFicticios(d){
  const R=simRnd(20261015);
  const TK=[3200,4500,5800,7500,9800,12500,4200,6400];
  const HP=[16,20,24,30,40,20,24,30];
  const mesesAtras=(m,dia)=>isoDate(new Date(TODAY.getFullYear(),TODAY.getMonth()-m,dia||10));
  const mesesFrente=(m,dia)=>isoDate(new Date(TODAY.getFullYear(),TODAY.getMonth()+m,dia||20));
  (d.projects||[]).filter(p=>!p.archived).forEach((p,i)=>{
    const tk0=TK[i%TK.length], idade=[26,19,14,9,6,3,22,11][i%8];
    p.ctInicio=mesesAtras(idade,5+(i*3)%20);
    p.ctFim=mesesFrente([1,4,7,10,2,13,6,9][i%8],8+(i*5)%18);
    p.formaPag=['Boleto','Pix','Boleto','Transferência'][i%4]; p.diaVenc=[5,10,15,10][i%4];
    p.horasPlan=HP[i%HP.length];
    const hist=[{id:uid(),data:p.ctInicio,valor:tk0,motivo:'Contrato inicial'}];
    let tk=tk0;
    if(idade>=12){ tk=Math.round(tk0*(1.06+R()*0.06)/50)*50; hist.push({id:uid(),data:mesesAtras(idade-12,1),valor:tk,motivo:'Reajuste anual (IPCA)'}); }
    if(i===2){ tk=Math.round(tk*1.35/50)*50; hist.push({id:uid(),data:mesesAtras(2,1),valor:tk,motivo:'Ampliação de escopo'}); }
    if(i===4){ tk=Math.round(tk*0.8/50)*50; hist.push({id:uid(),data:mesesAtras(4,1),valor:tk,motivo:'Redução de escopo'}); }
    p.ticketHist=hist; p.ticket=tk;
    if(i===1) p.sinais={...(p.sinais||{}),fin:{cor:'vermelho',em:hojeISO(),por:''},rel:{cor:'amarelo',em:hojeISO(),por:''}};
    if(i===3) p.sinais={...(p.sinais||{}),rel:{cor:'vermelho',em:hojeISO(),por:''}};
    if(i===0) p.sinais={...(p.sinais||{}),rel:{cor:'verde',em:hojeISO(),por:''},fin:{cor:'verde',em:hojeISO(),por:''},met:{cor:'amarelo',em:hojeISO(),por:''}};
  });
  if(!(d.projects||[]).some(p=>p.simSaiu)){
    [['Padaria Trigo Bom',3800,'#8a6d3b',15,5],['Clínica Vida Plena',5200,'#5b6c8f',20,8]].forEach(([nome,tk,cor,ini,fim],k)=>{
      d.projects.push({id:'simsaiu'+k,simSaiu:true,name:nome,tier:'Essencial',tipo:'Serviço',setor:k?'Saúde':'Alimentação',cor,
        coordinator:(d.team[0]||{}).id||'',manager:'',consultants:[],phase:'',status:'Cancelado',
        startDate:mesesAtras(ini),endDate:mesesAtras(fim-1),realEnd:'',archived:true,archivedAt:mesesAtras(fim,12),
        ctInicio:mesesAtras(ini),ctFim:mesesAtras(fim-1),ctEncerradoEm:mesesAtras(fim,12),ctMotivo:k?'Cancelamento pelo cliente':'Fim do prazo, sem renovação',
        marcos:{},marcosReais:{},pauses:[],deliverables:[],activities:[],feed:[],links:{},notes:'',
        ticket:tk,horasPlan:20,ticketHist:[{id:uid(),data:mesesAtras(ini),valor:tk,motivo:'Contrato inicial'}]});
    });
  }
  return d;
}
function gerarSimulacao(base){
  const R=simRnd(20260825);
  const pick=(arr)=>arr[Math.floor(R()*arr.length)];
  const d=deepClone(base);
  const seg=mondayOf(TODAY);

  /* equipe fictícia */
  d.team=SIM_EQUIPE.map((m,i)=>({id:'sim'+i,name:m.nome,role:i===0?'Coordenação':'Consultoria',color:m.cor,
    initials:m.nome.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase(),cap:i<2?30:25,capacity:i<2?30:25}));
  const ids=d.team.map(m=>m.id);

  d.projects=[]; d.tasks=[]; d.internal=[];
  d.messages={general:[],sprint:[],urgent:[]}; d.notes=[];

  SIM_CLIENTES.forEach((cli,ci)=>{
    const inicio=isoDate(addDays(seg,-(30+ci*15))), fim=isoDate(addDays(seg,120+ci*20));
    const proj={id:'simp'+ci,name:cli.nome,tier:pick(base.tiers||['Completo']),tipo:'Serviço',setor:cli.setor,
      perfil:cli.perfil,cor:cli.cor,owner:'Contato '+cli.nome,phone:'(51) 9'+(8000+ci*111)+'-0000',
      coordinator:ids[ci%2],manager:ids[(ci+1)%ids.length],consultants:[ids[ci%ids.length],ids[(ci+2)%ids.length]],
      phase:DLV_FASES[ci%DLV_FASES.length],status:ci===5?'Pausado':'Em andamento',
      startDate:inicio,endDate:fim,marcos:marcoDates(inicio,fim),marcosReais:{1:'',2:'',3:'',4:''},
      realEnd:'',archived:false,archivedAt:'',pauses:[],deliverables:[],activities:[],
      feed:[{id:uid(),type:'sistema',title:'Projeto criado',description:'Cliente de simulação.',
        author:ids[0],date:fmtBR(inicio),links:[],attachments:[]}],
      links:{drive:'',agenda:'',juridico:'',apresentacao:'',manuais:'',outros:''},notes:'',actSeeded:true,bsc:null};

    /* Os quatro primeiros clientes têm planejamento estratégico. */
    if(ci<4){
      const objs=SIM_OBJ.slice(0,3+(ci%3)).map(([cod,nome,custo,ind,un,b,meta],oi)=>({
        id:'simo'+ci+oi,codigo:cod,nome,custo,persp:['fin','cli','proc','apr'][oi%4],frenteId:null,desc:'',
        indicadores:[{id:'simi'+ci+oi,nome:ind,unidade:un,tipo:oi%2?'tend':'result',baseline:b,meta,
          inicio:inicio,prazo:isoDate(addDays(seg,90+oi*20)),metaTexto:'',baseNota:'hoje: '+b+un,
          medicoes:[{data:isoDate(addDays(seg,-40)),valor:b},
                    {data:isoDate(addDays(seg,-12)),valor:Math.round(b+(meta-b)*(0.2+R()*0.5))}]}],
        iniciativas:[]}));
      const pes=SIM_PES.slice(0,2+(ci%2)).map(([cod,nome,sub,fases],pi)=>({
        id:'simpe'+ci+pi,cod,nome,sub,
        periodo:['set/26 – fev/27','out/26 – mai/27','nov/26 – jun/27'][pi],
        dono:d.team[(ci+pi)%d.team.length].name,deps:pi?('PE-0'+pi+' concluído'):'Nenhuma. É o projeto de partida.',
        objetivos:objs.filter((_,k)=>k%2===pi%2).map(o=>o.id),
        fases:fases.map(([fn,dur,desc,entrega])=>({id:uid(),nome:fn,dur,desc,entrega,status:'nao'}))}));
      proj.bsc={ativo:true,visao:'',alvo:null,frentes:[],agrupar:'perspectiva',objetivos:objs,projetos:pes,
        rituais:[],decisoes:[],criadoEm:inicio};

      /* ações distribuídas nas fases, com prazos encadeados e alguma coisa já feita */
      pes.forEach((pe,pi)=>{
        const jan=janelaDasFases(pe);
        pe.fases.forEach((f,fi)=>{
          const n=2+Math.floor(R()*3);
          for(let k=0;k<n;k++){
            const j=jan[fi]||{ini:'',fim:''};
            const feito=(pi===0&&fi<2)||(R()<0.18);
            const resp=proj.consultants[k%proj.consultants.length];
            /* A ação não ocupa a fase inteira: ela acontece em 1 ou 2 dias úteis
               dentro dela, com horário reservado — nada fica "o dia todo". */
            let ini3=j.ini? dLocal(j.ini) : addDays(seg,k);
            const total=j.ini&&j.fim? Math.max(1,Math.round((dLocal(j.fim)-dLocal(j.ini))/86400000)) : 5;
            ini3=addDays(ini3,Math.floor(R()*Math.max(1,total-2)));
            while(ehFimDeSemana(isoDate(ini3))) ini3=addDays(ini3,1);
            const dur=1+Math.floor(R()*2);
            let fim3=ini3; const ses3={};
            for(let dd=0;dd<dur;dd++){
              while(ehFimDeSemana(isoDate(fim3))) fim3=addDays(fim3,1);
              ses3[isoDate(fim3)]={hora:pick(['08:00','09:00','10:00','14:00','15:00','16:00']),durMin:pick([60,90,120])};
              if(dd<dur-1) fim3=addDays(fim3,1);
            }
            proj.activities.push({id:uid(),projectId:proj.id,peId:pe.id,faseId:f.id,iniciativaId:null,
              name:pick(SIM_ACOES)+' — '+f.nome.toLowerCase(),type:pick(['Documento','Análise','Reunião','Fechamento','Outro']),
              deliverableId:'',assignee:resp,date:isoDate(fim3),buildStart:isoDate(ini3),buildEnd:isoDate(fim3),
              hora:'',durMin:0,sessoes:ses3,column:feito?'concluido':(fi===2?'andamento':'backlog'),
              sprintId:null,prio:pick(PRIOS),estHoras:1+Math.floor(R()*5),
              obs:R()<0.15?'Depende de retorno do cliente':'',notes:''});
          }
        });
      });
    }

    /* trabalho da semana: reuniões com hora e sessões de construção */
    for(let k=0;k<4+Math.floor(R()*3);k++){
      const dia=isoDate(addDays(seg,Math.floor(R()*5)));
      const h=8+Math.floor(R()*9);
      /* Reunião tem hora e não tem janela de construção — senão viraria
         uma barra de "dia todo" no calendário. */
      proj.activities.push({id:uid(),projectId:proj.id,peId:null,faseId:null,iniciativaId:null,
        name:pick(SIM_REUNIOES)+' · '+cli.nome,type:'Reunião',deliverableId:'',
        assignee:pick(proj.consultants),date:dia,buildStart:'',buildEnd:'',

/* ============================================================
   MÓDULO 10 — ANÁLISE
   Cruza o que está agendado (horas de construção + reuniões) com o
   ticket de cada contrato. Responde duas perguntas: quanto cada cliente
   custa em horas do time, e como o tempo de cada pessoa se reparte.
   ============================================================ */
const PERIODOS_AN=[
  ['semana','Esta semana'],['mes','Este mês'],['mes_prox','Próximo mês'],
  ['trim','Próximos 3 meses'],['tudo','Tudo'],
];
/* ============================================================
   PAINEL COMERCIAL
   A carteira pelo lado do contrato: quanto cada cliente paga, há quanto
   tempo, quantas horas compra e como o ticket evoluiu desde a entrada.
   ============================================================ */
/* ============================================================
   ANÁLISE COMERCIAL — números de carteira recorrente
   Tudo sai de quatro campos de cada cliente: ticket (e o histórico de
   reajustes), horas/mês do contrato, data de entrada e data de fim.
   · Vigente num mês = entrou até o fim do mês e não saiu antes dele
     (saída = término real ou arquivamento).
   · Movimento do mês, cliente a cliente: entrou (novo), saiu
     (cancelado), subiu (reajuste +) ou desceu (redução).
   ============================================================ */
const COR_COM={base:'#0F4245',sobe:'#2E7FA8',desce:'#C9782A',barra:'#2A6F6B',trilho:'#eef2f1',grade:'#e8eceb',eixo:'#8b9a99'};
/* valor do histórico que vale numa data (reajuste com data futura só vale a partir dela) */
function valorHistEm(hist,iso){
  const h=(hist||[]).filter(x=>x&&x.data).slice().sort((a,b)=>a.data<b.data?-1:1);
  if(!h.length) return null;
  const ant=h.filter(x=>x.data<=iso);
  return +((ant.length? ant[ant.length-1] : h[0]).valor)||0;
}
function ticketVigente(p,iso){
  const v=valorHistEm(p.ticketHist,iso);
  if(v===null) return +p.ticket||0;
  /* ticket trocado fora do histórico (ex.: no cadastro do cliente) vale de hoje em diante */
  const h=(p.ticketHist||[]).filter(x=>x&&x.data).slice().sort((a,b)=>a.data<b.data?-1:1), ult=h[h.length-1], hj=hojeISO();
  if(iso>=hj&&ult.data<=hj&&+p.ticket&&+p.ticket!==+ult.valor) return +p.ticket;
  return v;
}
/* próximo valor já registrado para o futuro (renovação ou reajuste agendado) */
const ticketFuturo=(p)=>{ const hj=hojeISO(); const f=(p.ticketHist||[]).filter(x=>x&&x.data>hj).sort((a,b)=>a.data<b.data?-1:1); return f[0]||null; };
function vigenteEm(p,iso){
  /* contratos anteriores do mesmo cliente (antes de uma renovação) contam no período deles */
  if((p.ctAnteriores||[]).some(c=>c.inicio&&c.inicio<=iso&&(!c.encerradoEm||c.encerradoEm>iso))) return true;
  const ini=ctIni(p);
  if(ini&&ini>iso) return false;
  const saida=p.ctEncerradoEm||(p.archived? (p.archivedAt||'0000-00-00') : '');
  if(saida&&saida<=iso) return false;     // encerrado no dia: já não conta
  return true;
}
const recEm=(p,iso)=> vigenteEm(p,iso)? ticketVigente(p,iso) : 0;
function leituraComercial(todos,nMeses){
  const hoje=hojeISO(), Y=TODAY.getFullYear(), M=TODAY.getMonth();
  const fimMes=(k)=>{ const d=new Date(Y,M-k+1,0); return k===0? hoje : isoDate(d); };
  const rotMes=(k)=>{ const d=new Date(Y,M-k,1); return MES[d.getMonth()].slice(0,3).toLowerCase()+'/'+String(d.getFullYear()).slice(2); };
  const serie=[];
  for(let k=nMeses-1;k>=0;k--){
    const iso=fimMes(k), isoAnt=fimMes(k+1);
    const m={iso,rot:rotMes(k),mrr:0,n:0,novo:0,sobe:0,desce:0,saiu:0,nomes:{novo:[],saiu:[]}};
    todos.forEach(p=>{
      const a=recEm(p,isoAnt), c=recEm(p,iso);
      m.mrr+=c; if(c>0) m.n++;
      if(!a&&c){ m.novo+=c; m.nomes.novo.push(p.name); }
      else if(a&&!c){ m.saiu+=a; m.nomes.saiu.push(p.name); }
      else if(c>a) m.sobe+=c-a;
      else if(c<a) m.desce+=a-c;
    });
    serie.push(m);
  }
  const isoIni=fimMes(nMeses);
  const mrrIni=todos.reduce((a,p)=>a+recEm(p,isoIni),0);
  const ativosHoje=todos.filter(p=>recEm(p,hoje)>0);
  const mrr=ativosHoje.reduce((a,p)=>a+recEm(p,hoje),0);
  /* retenção: só quem já pagava no início da janela */
  const coorte=todos.filter(p=>recEm(p,isoIni)>0);
  const baseCoorte=coorte.reduce((a,p)=>a+recEm(p,isoIni),0);
  const nrr=baseCoorte? coorte.reduce((a,p)=>a+recEm(p,hoje),0)/baseCoorte : null;
  const grr=baseCoorte? coorte.reduce((a,p)=>a+Math.min(recEm(p,hoje),recEm(p,isoIni)),0)/baseCoorte : null;
  const perdidos=todos.filter(p=>serie.some(m=>m.nomes.saiu.indexOf(p.name)>=0)&&!recEm(p,hoje));
  const soma=(k)=>serie.reduce((a,x)=>a+x[k],0);
  return {serie,mrrIni,mrr,ativosHoje,nrr,grr,perdidos,coorte,
    mov:{novo:soma('novo'),sobe:soma('sobe'),desce:soma('desce'),saiu:soma('saiu')}};
}
const fmtK=(v)=>{ const a=Math.abs(v||0), sn=v<0?'−':'';
  if(a>=1e6) return sn+'R$ '+(a/1e6).toFixed(1).replace('.',',')+' mi';
  if(a>=1e4) return sn+'R$ '+Math.round(a/1e3)+' mil';
  if(a>=1e3) return sn+'R$ '+(a/1e3).toFixed(1).replace('.',',')+' mil';
  return sn+'R$ '+Math.round(a); };
const fmtPct=(x,dig)=> (x==null||!isFinite(x))? '—' : (Math.round(x*100*(dig?10:1))/(dig?10:1)).toString().replace('.',',')+'%';
function escalaBonita(max,partes){
  if(!(max>0)) return {max:1,ticks:[0,1]};
  const bruto=max/(partes||4), pot=Math.pow(10,Math.floor(Math.log10(bruto)));
  const passo=[1,2,2.5,5,10].map(m=>m*pot).find(v=>v>=bruto)||10*pot;
  const topo=Math.ceil(max/passo)*passo, ticks=[];
  for(let v=0;v<=topo+1e-9;v+=passo) ticks.push(v);
  return {max:topo,ticks};
}
/* dica flutuante: um só balão por gráfico, perto do cursor */
function useDica(){
  const ref=useRef(null); const [d,setD]=useState(null);
  const mostrar=(e,conteudo)=>{ const r=ref.current&&ref.current.getBoundingClientRect(); if(!r) return;
    setD({x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,c:conteudo}); };
  const esconder=()=>setD(null);
  const Balao=()=> d? (<div className="ch-dica" style={{left:Math.min(d.x+14,d.w-230),top:d.y+14}}>{d.c}</div>) : null;
  return {ref,mostrar,esconder,Balao};
}
const LinhaDica=({cor,rot,val,forte})=>(<div className="ch-dl">{cor&&<i style={{background:cor}}></i>}<span>{rot}</span><b style={{fontWeight:forte?800:600}}>{val}</b></div>);

/* ---------- 1. Evolução da receita recorrente (linha + área) ---------- */
function GraficoMRR({serie}){
  const W=560,H=230,L=58,R=18,T=18,B=30, iw=W-L-R, ih=H-T-B;
  const esc=escalaBonita(Math.max(...serie.map(x=>x.mrr)));
  const X=(i)=>L+(serie.length<2? iw/2 : i*iw/(serie.length-1)), Y=(v)=>T+ih-(v/esc.max)*ih;
  const pts=serie.map((x,i)=>[X(i),Y(x.mrr)]);
  const linha=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=linha+' L'+X(serie.length-1)+' '+(T+ih)+' L'+X(0)+' '+(T+ih)+' Z';
  const [foco,setFoco]=useState(null);
  const dica=useDica();
  const ult=serie[serie.length-1];
  return (<div className="ch-wrap" ref={dica.ref} onMouseLeave={()=>{setFoco(null);dica.esconder();}}>
    <svg viewBox={'0 0 '+W+' '+H} className="ch-svg" role="img" aria-label="Receita recorrente mensal nos últimos 12 meses">
      {esc.ticks.map(t=>(<g key={t}><line x1={L} x2={W-R} y1={Y(t)} y2={Y(t)} stroke={COR_COM.grade}/>
        <text x={L-8} y={Y(t)+3.5} textAnchor="end" className="ch-eixo">{fmtK(t)}</text></g>))}
      {serie.map((x,i)=>(<text key={x.iso} x={X(i)} y={H-10} textAnchor="middle" className="ch-eixo">{x.rot}</text>))}
      <path d={area} fill={COR_COM.base} fillOpacity=".09"/>
      <path d={linha} fill="none" stroke={COR_COM.base} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
      {foco!==null&&<line x1={X(foco)} x2={X(foco)} y1={T} y2={T+ih} stroke={COR_COM.eixo} strokeWidth="1"/>}
      {foco!==null&&<circle cx={X(foco)} cy={Y(serie[foco].mrr)} r="4.5" fill={COR_COM.base} stroke="#fff" strokeWidth="2"/>}
      <circle cx={X(serie.length-1)} cy={Y(ult.mrr)} r="4.5" fill={COR_COM.base} stroke="#fff" strokeWidth="2"/>
      <text x={X(serie.length-1)-6} y={Y(ult.mrr)-10} textAnchor="end" className="ch-rot-forte">{fmtK(ult.mrr)}</text>
      {serie.map((x,i)=>(<rect key={'h'+i} x={X(i)-iw/(serie.length-1||1)/2} y={T} width={iw/(serie.length-1||1)} height={ih+B}
        fill="transparent" onMouseMove={(e)=>{ setFoco(i); dica.mostrar(e,<>
          <div className="ch-dt">{x.rot}</div>
          <LinhaDica rot="Receita recorrente" val={fmtRS(x.mrr)} forte/>
          <LinhaDica rot="Contratos vigentes" val={x.n}/>
          {x.novo>0&&<LinhaDica cor={COR_COM.sobe} rot={'Novos · '+x.nomes.novo.join(', ')} val={'+'+fmtRS(x.novo)}/>}
          {x.sobe>0&&<LinhaDica cor={COR_COM.sobe} rot="Reajustes para cima" val={'+'+fmtRS(x.sobe)}/>}
          {x.desce>0&&<LinhaDica cor={COR_COM.desce} rot="Reduções" val={'−'+fmtRS(x.desce)}/>}
          {x.saiu>0&&<LinhaDica cor={COR_COM.desce} rot={'Saíram · '+x.nomes.saiu.join(', ')} val={'−'+fmtRS(x.saiu)}/>}
        </>); }}/>))}
    </svg>
    <dica.Balao/>
  </div>);
}

/* ---------- 2. Ponte da receita: de onde veio a variação ---------- */
function PonteMRR({ini,mov,fim}){
  const W=560,H=230,L=12,R=12,T=26,B=40, iw=W-L-R, ih=H-T-B;
  const passos=[
    {k:'ini',rot:'Há 12 meses',v:ini,tot:true},
    {k:'novo',rot:'Novos clientes',v:mov.novo},
    {k:'sobe',rot:'Reajustes +',v:mov.sobe},
    {k:'desce',rot:'Reduções',v:-mov.desce},
    {k:'saiu',rot:'Cancelados',v:-mov.saiu},
    {k:'fim',rot:'Hoje',v:fim,tot:true},
  ];
  let acc=0; const barras=passos.map(p=>{ let a,b;
    if(p.tot){ a=0; b=p.v; acc=p.v; } else { a=acc; b=acc+p.v; acc=b; }
    return {...p,a,b}; });
  const esc=escalaBonita(Math.max(1,...barras.map(x=>Math.max(x.a,x.b))));
  const slot=iw/barras.length, bw=Math.min(46,slot*.56);
  const Y=(v)=>T+ih-(v/esc.max)*ih;
  const dica=useDica();
  return (<div className="ch-wrap" ref={dica.ref} onMouseLeave={dica.esconder}>
    <svg viewBox={'0 0 '+W+' '+H} className="ch-svg" role="img" aria-label="Ponte da receita recorrente">
      <line x1={L} x2={W-R} y1={Y(0)} y2={Y(0)} stroke={COR_COM.eixo}/>
      {barras.map((x,i)=>{ const cx=L+slot*i+slot/2, y0=Y(Math.max(x.a,x.b)), y1=Y(Math.min(x.a,x.b));
        const cor=x.tot? COR_COM.base : (x.v>=0? COR_COM.sobe : COR_COM.desce);
        const h=Math.max(x.v?2:0,y1-y0);
        return (<g key={x.k} onMouseMove={(e)=>dica.mostrar(e,<><div className="ch-dt">{x.rot}</div>
            <LinhaDica cor={cor} rot={x.tot?'Receita recorrente':'Variação em 12 meses'} val={(x.tot?'':(x.v>=0?'+':'−'))+fmtRS(Math.abs(x.v))} forte/></>)}>
          {i<barras.length-1&&<line x1={cx+bw/2} x2={cx+slot-bw/2} y1={Y(x.b)} y2={Y(x.b)} stroke={COR_COM.eixo} strokeWidth="1"/>}
          <rect x={cx-bw/2} y={y0} width={bw} height={h} rx="3" fill={cor}/>
          <text x={cx} y={y0-7} textAnchor="middle" className={x.tot?'ch-rot-forte':'ch-rot'}>{x.tot? fmtK(x.v) : (x.v? (x.v>0?'+':'')+fmtK(x.v) : '0')}</text>
          <text x={cx} y={H-22} textAnchor="middle" className="ch-eixo">{x.rot.split(' ')[0]}</text>
          {x.rot.split(' ')[1]&&<text x={cx} y={H-10} textAnchor="middle" className="ch-eixo">{x.rot.split(' ').slice(1).join(' ')}</text>}
          <rect x={cx-slot/2} y={T-20} width={slot} height={ih+20} fill="transparent"/>
        </g>);})}
    </svg>
    <dica.Balao/>
  </div>);
}

/* ---------- 5. Vencimentos: receita que chega ao fim do contrato, mês a mês ---------- */
function GraficoVenc({meses}){
